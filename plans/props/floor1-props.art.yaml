id: floor1-props
title: Floor 1 Props & Decorations
summary: >
  Art breakdown for ambient scene-dressing props placed by placePropsForFloor
  across Floor 1 (BASIC_UNDERGROUND biome). These are non-interactive objects
  that add visual richness: litter, bracket lamps, and cave vines. All props
  use biomeTag "dungeon" and are filtered by the floor manifest allowedCategories.
assets:
  - id: prop-junk-pile-a
    type: item
    label: Junk Pile A
    brief: >
      Paper cups, food wrappers, and scattered trash — reality-show dungeon
      litter that reads as rubbish at a glance. 16×16 px. Fits anywhere on
      stone or cave floors. Warm desaturated tones (beige/brown).
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.junk-pile-a

  - id: prop-junk-pile-b
    type: item
    label: Junk Pile B
    brief: >
      Broken glass, crushed cans, and torn packaging — a denser trash heap
      variant. 16×16 px. Warm desaturated palette with a glint on the glass.
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.junk-pile-b

  - id: prop-empty-can
    type: item
    label: Empty Can
    brief: >
      Crushed aluminium can — small footprint scatter prop. 8×8 px.
      Silvery grey with a hint of a coloured label band.
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.empty-can

  - id: prop-wall-sconce
    type: item
    label: Wall Sconce
    brief: >
      Iron bracket lamp mounted on a dungeon wall, holding a small flickering
      flame or chemical light. 16×24 px, 3-frame flicker animation.
      Warm amber/orange glow. Designed for wall-adjacent tiles.
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.wall-sconce

  - id: prop-cave-vine
    type: item
    label: Cave Vine
    brief: >
      Drooping cave vine with small bioluminescent nodules. 16×24 px.
      Dark olive-green with pale blue-green glow dots. Cave-only placement.
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.cave-vine

  - id: prop-floor-lantern
    type: item
    label: Floor Lantern
    brief: >
      Standing lantern — a small caged flame on a short metal post. 12×16 px,
      2-frame flicker. Warm amber light. Placed near walls (wall-adjacent zone).
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.floor-lantern
