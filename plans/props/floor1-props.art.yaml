id: floor1-props
title: Floor 1 Props & Decorations
summary: >
  Art tracking for the ambient scene-dressing props that ACTUALLY spawn on
  Floor 1. Ground truth: src/shared/data/floors/floor1.manifest.json declares
  props.biomeTag "dungeon" with allowedCategories ["rubbish", "light-source"],
  so propPlacer only ever spawns the four dungeon props below. Ids and the real
  spriteIds mirror src/shared/decorationDefs.ts so this plan stays in sync with
  runtime. Structural props (stone-pillar, barrel, chain) and every cave/organic/
  tech/void prop are filtered out on Floor 1 and were removed from this plan.
assets:
  - id: torch
    type: prop
    label: Torch
    brief: >
      Wall-mounted flaming torch on a black iron bracket, 4-frame flicker,
      warm amber glow. Placed on wall-adjacent tiles. category: light-source.
      Shipped sprite: prop-torch-v1-var-10.
    placeholderInUse: false
    integration:
      kind: sprite-registry
      id: prop.torch

  - id: wall-sconce
    type: prop
    label: Wall Sconce
    brief: >
      Iron bracket lamp mounted on a dungeon wall holding a small flickering
      flame, 3-frame flicker, warm amber light emission. Wall-adjacent tiles.
      category: light-source. Shipped sprite: prop-wall-sconce-v1-var-1.
    placeholderInUse: false
    integration:
      kind: sprite-registry
      id: prop.wall-sconce

  - id: junk-pile
    type: prop
    label: Junk Pile
    brief: >
      Reality-show dungeon litter — cups, wrappers, and scattered trash that
      reads as rubbish at a glance. Warm desaturated beige/brown. Placed
      anywhere. category: rubbish. Shipped sprite: prop-junk-pile-v1-var-0.
    placeholderInUse: false
    integration:
      kind: sprite-registry
      id: prop.junk-pile

  - id: rubble
    type: prop
    label: Rubble Pile
    brief: >
      A low heap of broken stone chunks, grit, and dust — collapsed-masonry
      debris that reads as rubble at a glance. Warm desaturated grey/brown,
      combat-readable low silhouette. Placed anywhere. category: rubbish.
      GAP: the only Floor 1 prop still on a placeholder — decorationDefs maps
      it to spriteId "deco-rubble", which is NOT in the sprite manifest, so it
      renders a colored fallback rectangle. Canary generation target
      (asset-request "prop-rubble-pile"); wire the generated sprite over
      deco-rubble once approved.
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: prop.rubble
