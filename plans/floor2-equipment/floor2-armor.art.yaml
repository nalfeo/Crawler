id: floor2-armor
title: 'Floor 2 Equipment — Armor and Accessories'
summary: 'Production-wave art backlog for all 20 stable Floor 2 non-weapon equipment base keys: 4 head, 4 torso, 3 hands, 3 feet, and 6 accessory slots. Each entry is backed by a deterministic procedural placeholder (sourceRun: placeholder) and needs real authored pixel art generated via the sprite pipeline. All entries are non-overlapping with the Floor 1 gear art plan.'
assets:
  # ── Head (4) ───────────────────────────────────────────────────────────────
  - id: head-iron-visor
    type: item
    label: 'Iron Visor'
    brief: 'Iron Visor — a centered small object icon on a transparent background. A heavy iron helm with a full face visor, shown face-on with the visor closed and eye slits visible.'
    placeholderInUse: true

  - id: head-quartermaster-cap
    type: item
    label: 'Quartermaster Cap'
    brief: 'Quartermaster Cap — a centered small object icon on a transparent background. A peaked cap with a supply corps insignia badge, shown in a three-quarter side view with the badge visible.'
    placeholderInUse: true

  - id: head-batfolk-hood
    type: item
    label: 'Batfolk Hood'
    brief: 'Batfolk Hood — a centered small object icon on a transparent background. A dark hood with ear-shaped fins on top, shown in a slight front-angle view with the ear shapes clear.'
    placeholderInUse: true

  - id: head-alchemist-goggles
    type: item
    label: 'Alchemist Goggles'
    brief: 'Alchemist Goggles — a centered small object icon on a transparent background. Round leather-framed magnifying goggles with tinted lenses, shown face-on with both lenses visible.'
    placeholderInUse: true

