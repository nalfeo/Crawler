id: rat-themed-dungeon-floor
title: Rat Themed Dungeon Floor
summary: >
  Art tracking for the rat/sewer theme that ACTUALLY appears on Floor 1. The
  Floor 1 enemy roster that renders in-game is rat, slime, baby-slime, and the
  rat-slime floor boss — all of which already ship real sprites and are tracked
  in the bestiary plan. This plan tracks the two remaining Floor-1 rat-theme art
  items: the sewer-grate accent floor tile (art already generated, needs wiring)
  and the slime-rat mid-boss (the only Floor-1 enemy still on a placeholder
  sprite). Removed as F1-impossible: fictional rat enemies (junk critters,
  bruiser, man-mage, rat king) and speculative prop clusters (rat-nest,
  slime-pool) — none of them appear in enemies.floor1.json or decorationDefs.ts.
assets:
  - id: sewer-grate-floor-tile
    type: tile
    label: Sewer Grate Floor Tile
    brief: >
      Grimy stone floor tile variant with a rusted iron grate inset and damp
      stains for the sewer theme. Keep contrast combat-friendly. Accent tile
      layered on the base stone floor. Generated art already exists (sewer-grate
      brief) — needs wiring, not regeneration.
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: tile.sewer-grate-floor

  - id: slime-rat
    type: enemy
    label: Slime Rat (mid-boss)
    brief: >
      Floor 1 mid-boss — a bloated rat fused with a translucent slime coat,
      dripping ooze, oversized and sprawling. WIDE silhouette (2:1 aspect,
      sizeVariant "wide"). The only Floor-1 enemy still on a placeholder: its
      mobDef spriteId is "mob-placeholder", so it renders the generic
      enemy_boss until dedicated wide art is generated and wired
      (enemy_boss_slimerat renderKind).
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: enemy.slime-rat
