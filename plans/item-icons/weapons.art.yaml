    type: weapon
    label: 'Throwing Knife'
    brief: 'Throwing Knife — a single centered weapon icon with a clear, readable silhouette on a transparent background. Show it in a clean side or three-quarter profile so the weapon type reads at a glance. Balanced for a clean throw and a cleaner escape.'
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: throwing-knife

