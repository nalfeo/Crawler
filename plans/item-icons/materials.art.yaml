id: item-icons-materials
title: 'Item Icons — Materials'
summary: 'Backlog of crafting-material inventory icons that currently render procedural placeholder PNGs (manifest sourceRun "placeholder"). Each entry needs real authored pixel art generated via the sprite pipeline when provider access is available.'
assets:
  - id: copper-ore
    type: item
    label: 'Copper Ore'
    brief: 'Copper Ore — a single centered raw crafting material icon with a clear, readable silhouette on a transparent background. Emphasize the material itself (ore, wood, crystal, scale, dust, etc.) with a chunky, readable silhouette. Greenish and crumbly. Better than nothing.'
    placeholderInUse: true
    integration:
      kind: sprite-registry
      id: copper-ore

