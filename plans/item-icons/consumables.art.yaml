id: item-icons-consumables
title: 'Item Icons — Consumables'
summary: 'Backlog of consumable inventory icons that currently render procedural placeholder PNGs (manifest sourceRun "placeholder"). Each entry needs real authored pixel art generated via the sprite pipeline when provider access is available.'
