# Enemy post-processing pipeline template
#
# Enemies include enclosed-region cleanup (for eyes, mouths, etc.).
# A second enclosed-region pass runs after alpha-threshold to fill any
# interior transparency holes that the binarization step introduces from
# semi-transparent interior pixels in the model output.

extends: base.yml
name: enemy-postprocess-pipeline
description: Pipeline for enemies - includes enclosed-region cleanup and post-alpha hole fill

modules:
  post-alpha-enclosed-regions:
    description: Second enclosed-region pass after alpha-threshold fills holes created by binarization.
    type: enclosed-region-cleanup
    enabled: true
    params: {}

pipeline:
  - background-removal
  - enclosed-regions
  - transparent-trim
  - resize
  - background-rekey
  - speckle-cleanup
  - palette-quantize
  - alpha-threshold
  - post-alpha-enclosed-regions
  - trim-and-fit
