# Icon post-processing pipeline template
#
# UI icons (achievement icons, ability icons) are 4×4 sheet batches.
# Each cell is sliced to 128×128 with transparent background.
# No baked-in frames — frames are composited deterministically in the engine.
#
# Inherits the base pipeline unchanged; background removal and resize are
# correct for transparent-bg symbol art. Palette quantize is intentionally
# kept OFF (icons may use a wider palette for readability).

extends: base.yml
name: icon-postprocess-pipeline
description: Pipeline for UI icon sprites (achievement / ability icons)

modules:
  # Icons should not be palette-quantized — they need clean gradients
  # and anti-aliasing for readability at 128px.
  palette-quantize:
    enabled: false
