# Tile post-processing pipeline template
#
# Tiles must end edge-to-edge at their requested frame size:
# - No background removal
# - Slice away transparent sheet/cell buffer with zero margin
# - Stretch-resize exactly to brief.size
#
# Inherits from base.yml but disables background-specific steps.

extends: base.yml
name: tile-postprocess-pipeline
description: Pipeline for tiles - slice and exact edge-to-edge resize without background removal

modules:
  background-removal:
    enabled: false

  enclosed-regions:
    enabled: false

  transparent-trim:
    enabled: true
    params:
      marginFraction: 0
      minMarginPx: 0

  resize:
    enabled: true

  background-rekey:
    enabled: false
