# ASPECT NOTE (Asset Forge, 2026-07-26): 1 map tile = 4 ft. This is a FLOOR
# DECAL seen straight down, so there is NO 3/4 projection and no receding side
# face: the canvas aspect is the literal floorplan footprint. Intended real size
# is 4 ft wide x 12 ft long => 1:3. The physically meaningful dimension is the
# 12 ft LENGTH, so height is declared (192) and width is DERIVED from the 1:3
# aspect (192 / 3 = 64). 192 >= 2*64, so resizeSpriteStrategy() returns 'height':
# the height is locked at 192 and the shipped width follows the DRAWN subject's
# aspect, which means no letterboxing and no `fit` Math.min surprise.
#
# `sizeVariant: tall` is deliberately NOT used (see the 2026-07-27 living-area
# handoff): the model ignores portrait cells, the slicer then cuts on the
# declared tall grid and every "variant" becomes a column of stacked objects that
# can pass all sensors AND the judge. Default square cells slice reliably; the
# 1:3 proportion is driven in PROSE inside the square cell instead.
type: prop
name: welcome-room-floor-runner
description: |
  A long, narrow, WORN FLOOR RUNNER CARPET lying flat on a cool grey stone floor,
  leading from the room's entrance toward the welcome desk. Viewed DIRECTLY FROM
  ABOVE (top-down), completely flat on the ground. This is a FLOOR DECAL, not an
  object with a front face: there is NO perspective, NO thickness, NO side
  elevation, NO vertical height and NO shadow under it. Modern high-quality pixel
  art, readable at game scale.

  ROUND 3 WENT BACKWARDS ON BOTH AXES: 0.59-0.63 : 1 and a muddy dark brown slab
  with one big pale blotch in the middle that read as a crate lid. Both the width
  and the colour must come back.

  THE COLOUR IS NOW LOCKED BY THE PIPELINE. Every opaque pixel will be snapped to
  the palette in data/palettes/welcome-room-faded-runner.json — a deliberately
  desaturated, chalky, greyed-off faded-maroon ramp. Do not try to paint brick
  red, rust, terracotta or brown: those hues will be snapped to the faded ramp
  anyway. Just draw a threadbare dusty rose-grey carpet and let the lock hold it.

  MEASURE IT IN CELL PIXELS. The cell is 256 x 256 source pixels. The runner's
  drawn bounding box inside that cell must be approximately 78 PIXELS WIDE and
  236 PIXELS TALL.

  ROUND 2 GOT THE WIDTH EXACTLY RIGHT (78 px) BUT DREW IT FAR TOO SHORT — only
  172 px tall, leaving a big empty band above and below. KEEP THE WIDTH AT 78 PX
  AND MAKE IT MUCH LONGER: the top end of the runner must start within about 10
  pixels of the TOP edge of the cell and the bottom end must finish within about
  10 pixels of the BOTTOM edge. It runs almost the entire height of the cell.
  Do NOT centre a short stubby strip in the middle of the cell.

  Round 1 had also come back at 0.55 : 1 with a big PALE TAN PANEL filling the
  middle and a decorative border frame around it — an ornate area rug, the exact
  "steals the eye" failure this brief exists to fix. Do not reintroduce that.

  REAL-WORLD SIZE / PROPORTIONS.
  The runner is approximately 4 FEET WIDE x 12 FEET LONG. Its bounding box must
  be THREE TIMES AS LONG AS IT IS WIDE (width : length = 1 : 3) — a long narrow
  strip running vertically up the cell. Compose it inside the square cell like
  this:
  - The runner runs VERTICALLY, from the TOP margin of the cell all the way DOWN
    to the BOTTOM margin, leaving only the small standard margin at top and
    bottom.
  - HORIZONTALLY IT IS NARROW. It occupies only the MIDDLE THIRD of the cell's
    width. The left third and the right third of the cell are completely EMPTY
    transparent background.
  - If it looks like a rug, a mat, a square carpet, or a blanket, it is WRONG. If
    it looks almost too long and too thin, it is RIGHT.
  - EXACTLY ONE RUNNER PER CELL. Never stack two or three runners end to end and
    never place a second strip beside the first.

  WHAT IT IS — a cheap corridor runner that thousands of contestants have walked
  down, kept in service far past its life:
  - A plain rectangular strip of carpet with slightly IRREGULAR, FRAYED long
    edges — loose threads and nibbled bites out of the border, not a clean ruled
    rectangle.
  - A single thin woven PINSTRIPE running down each long edge, one or two pixels
    wide, faded almost into the field colour. It is a hairline, NOT a wide
    decorative border band, and it does NOT enclose a separate inner panel.
  - WORN BALD PATCHES down the CENTRE LINE, where the pile has been walked flat
    and through to the backing. These are IRREGULAR, BROKEN, PATCHY and only
    slightly lighter than the surrounding carpet — a scatter of blotches that
    comes and goes down the length, never a clean stripe, never a solid pale
    panel, never edge-to-edge. The bald track must cover well under half the
    strip's width and must read as WEAR, not as a design element. If the middle
    of the runner looks like a distinct lighter rectangle, it is WRONG.
  - Scattered dark scuffs, one flattened dirty patch, one small dull stain, and a
    slight ripple/rucked kink along one edge where it has been kicked out of
    line.
  - The short ends are frayed into a stubby, uneven, half-lost fringe.

  IT IS NOT: a fresh red carpet, an ornate persian rug, a square area rug, a
  towel, a bath mat, a plank, a table, a banner, a scroll, a ladder, or a strip of
  tape. It is one long, tired, threadbare corridor runner.

  COLOUR — MUTED AND DESATURATED. THIS IS THE MOST IMPORTANT COLOUR NOTE IN THE
  BRIEF, AND ROUND 2 FAILED IT: it came back a strong warm BRICK RED, which is
  still a saturated slab that steals the eye. The existing rug in this room has
  exactly that problem and this replacement exists to fix it. Knock the colour
  WAY back toward grey: think SUN-BLEACHED HOTEL CORRIDOR RUNNER left in a window
  for twenty years — a dusty greyed-off maroon / oxblood gone brown-pink and
  chalky, closer to a dull mushroom-mauve than to red, with the bald track a pale
  grey-tan and the shadows a deep desaturated plum-brown. If a colour looks like
  fresh brick, terracotta, rust or scarlet, it is TOO SATURATED — desaturate it
  further. Every colour is knocked back toward grey. It sits on cool grey stone
  (tile-stone-floor-v2-var-2) and must read as quiet background dressing that the
  eye passes over on the way to the NPCs. BANNED: saturated red, bright red,
  brick red, terracotta, scarlet, crimson, pure white, pure black, gold, orange,
  neon, magenta, purple, cyan, blue, green, and any glossy or velvet sheen.

  IT MUST READ AS TEXTILE, NOT AS A PLANK. Round 2 over-corrected into a flat
  featureless slab that read as a door panel. Visible woven pile texture dithered
  across the whole field, frayed nibbled long edges, a stubby uneven fringe at
  both short ends, irregular blotchy wear. Carpet, not wood, not stone, not metal.

  LIGHTING: light comes from the UPPER LEFT, consistently, but the runner is FLAT
  ON THE GROUND, so lighting shows only as a very slight overall gradient of wear
  and grime — no cast shadow, no rim light, no drop shadow, no glow.

  RENDERING: this is a flat decal, so it has NO hard object outline running around
  it like a prop would; instead the edges are defined by the frayed pile itself,
  with a slightly darker edge tone. 3-5 tone stops in the wool, restrained
  dithering for pile texture and grime — no mushy gradients, no airbrush.

  NO TEXT of any kind: no letters, words, numbers, digits, logos, labels,
  captions, watermarks or signatures anywhere on the carpet.

  BACKGROUND: fully transparent. Draw ONLY the carpet strip. Do NOT paint the
  stone floor under or around it, a floor slab, a rectangular backing panel, a
  frame, a border, a vignette, or any cast/contact/drop shadow — the stone floor
  is already drawn underneath this art in the game. Every pixel outside the
  carpet's own silhouette must be fully transparent.

  SHEET BACKGROUND: every cell must sit on ONE single flat uniform background
  colour, identical in all cells, clearly distinct from the carpet's colours so it
  can be keyed out cleanly. No per-cell background variation, no borders, no
  dividers.
size:
  width: 64
  height: 192
palette:
  id: welcome-room-faded-runner
postprocessing:
  # ROUND 4: three rounds of prose failed to pull the colour off warm brick red
  # (judge agreed — most variants were rejected on brief_match). Same failure and
  # same fix as welcome-room-floor-scuff round 1: snap every opaque pixel to a
  # locked, deliberately desaturated faded-maroon ramp so a saturated slab is
  # physically impossible in the output. This constrains the OUTPUT, it does not
  # loosen any sensor or the judge bar.
  paletteMode: strict
anchor:
  x: 32
  y: 96
sensors:
  # A carpet strip is a deliberately near-rectangular flat decal, so it fills far
  # more of its own bounding box than the `prop` default range [0.10, 0.65],
  # which is tuned for irregular grounded props with open silhouettes. Same
  # reasoning and precedent as welcome-room-show-poster / welcome-room-exit-sign
  # (0.88 cap): a genuine background-removal failure still lands at ~0.95-1.0 and
  # is caught. Bound set BEFORE generating from the subject's geometry, not
  # widened afterwards to rescue a failing variant.
  opaqueRatio:
    min: 0.40
    max: 0.90
  # A floor decal has no grounded base and no grip point — centre-of-mass is the
  # correct (and still fully enforced) anchor semantics, as on
  # welcome-room-floor-scuff and welcome-room-chore-rota.
  anchor:
    mode: center-of-mass
tags:
  - welcome-room
  - reality-show
  - pixel-dungeon
  - scene-dressing
  - floor
  - decal
judge:
  enabled: true
  maxVariants: 8
minVariations: 0
