type: prop
name: welcome-room-floor-scuff
description: |
  A transparent floor decal showing a faint scuff / worn-path mark on a cool
  grey stone floor. Pixel art, viewed directly from above (top-down). The mark
  overlays on the floor tiles of the welcome room in a dungeon reality show.

  ROUND 1 FAILED: all 16 variants were too bold and warm-toned, reading as
  distinct objects instead of subtle floor wear. The post-processor will now
  PALETTE-LOCK every opaque pixel to grey tones only (see palette field below).
  Warm tones, browns, reds, and saturated colours are physically impossible in
  the output — so DO NOT try to paint them; they will be snapped to grey anyway.

  WHAT TO DRAW:
  A vertical column of scattered grey scuff specks, running from the top edge
  to the bottom edge of the tile. Centre-aligned, with the mark occupying the
  middle ~40% of the tile width. The left ~30% and right ~30% are empty (fully
  transparent). The mark is NOT a shape — it has no outline, no fill, no body.
  It is a field of loose individual pixels:
  - Draw isolated single pixels and occasional 2–3 pixel flecks. Nothing larger.
  - Use the DARKEST grey in the palette (entries 5 and 6: approximately
    rgb(65-80, 70-90, 78-90)) for the denser specks near the centre line.
  - Use lighter grey entries (3 and 4: rgb(95-110, 100-115, 105-120)) for the
    looser specks near the edges of the mark.
  - DO NOT draw any solid filled run longer than ~3 pixels in any direction.
  - THE MARK MUST REACH THE TOP EDGE AND BOTTOM EDGE of the tile (specks in
    the very top and very bottom rows). This is required so tiles placed
    end-to-end read as one continuous path.
  - Most of the canvas (including most of the centre track) is transparent.

  THE PALETTE LOCK ENFORCES COLOUR (NO NEED TO SPECIFY HEX VALUES):
  Every opaque pixel will be snapped to the palette in data/palettes/stone-floor-grey.json.
  Just draw grey. Do not try to use warm browns, reds, or dark tones — they
  will be mapped to the nearest grey in the palette automatically.

  ABSOLUTELY NO:
  - Outline, rim, border, or contour around the mark
  - Solid filled rectangle, stripe, slab, or object shape
  - Warm tones (palette lock prevents them, but try anyway)
  - Background other than the keyout colour

  BACKGROUND: one single flat colour across the whole sheet — use bright
  magenta (#ff00ff) or electric cyan (#00ffff) — clearly distinct from grey.

  TARGET: the mark should be barely noticeable at game scale (16px). If it
  reads as a distinct object, err toward less density, not more.

palette:
  id: stone-floor-grey
postprocessing:
  paletteMode: strict

tags:
  - welcome-room
  - floor
  - decal
  - reality-show
  - pixel-dungeon

sensors:
  anchor:
    mode: center-of-mass
  opaqueRatio:
    # ROUND 2 FAILURE: model generated 0.5% opaque ratio (20px). The original
    # 4% minimum was overly aggressive for an "almost invisible" floor effect.
    # Lowering to 0.5% (still >0 to reject blank tiles) since the judge passed
    # var-1 (3/4/3/4) and var-4 (4/4/5/3) at 0.5%. The judge quality gate is
    # unchanged — this corrects a sensor I set incorrectly for this use case.
    min: 0.005
    max: 0.20
  interiorHoles:
    maxPixels: 512
  edge:
    allowMainTouch: true
    allowDetachedEdgeComponents: false
    maxDetachedEdgePixels: 0

judge:
  enabled: true
  maxVariants: 8

minVariations: 0

variations:
  - scuff pattern concentrated on left-of-centre with a slight lean, suggesting
    repeated foot placement from one direction
  - very sparse pepper-grain scuffing, barely there, maximum subtlety
