# DUNGEON DOOR — CLOSED, HORIZONTAL DOORWAY (wall runs left<->right, door faces camera).
#
# Consumed by MainGameScene.updateDoorOverlay() as
# GENERATED_DOOR_TEXTURE_KEYS.closedHorizontal. 35 of Floor 1's 104 doors.
#
# ASPECT: 1 map tile = 4 ft and the door renders WIDTH-authoritative — its opaque
# box is scaled so its WIDTH is exactly one tile (4 ft) and the height then
# follows the box's own aspect, growing UPWARD into the wall tile above. So a
# 64x112 opaque box renders 4 ft wide x 7 ft tall against a 5.75 ft player.
# That is the whole point of this brief: the door that ships today is square, so
# it renders 4 ft tall and the player is TALLER THAN THE DOORWAY.
#
# `sizeVariant: tall` is deliberately NOT used (the model ignores portrait cells
# and the slicer then cuts each "variant" into a column of stacked objects that
# passes every gate). Default square cells slice reliably; the 1:1.75 proportion
# is driven in PROSE and realised by the transparent margins left and right.
# The renderer anchors on OPAQUE BOUNDS, so those margins cost nothing.
type: prop
name: tile-door-v1
description: |
  A heavy DUNGEON DOOR, closed, set in a stone wall. Front elevation, looking
  STRAIGHT AT THE DOOR dead-on — the face of the door is exactly parallel to the
  screen, with NO tilt, NO rotation, NO oblique angle and NO perspective. Modern
  high-quality pixel art, silhouette readable at 16px.

  MEASURE IT IN CELL PIXELS. The cell is 256 x 256 source pixels. The door's
  drawn bounding box INCLUDING its stone frame must be approximately 128 PIXELS
  WIDE and 224 PIXELS TALL — a tall narrow portrait rectangle.
  - Take the width of the door in your sketch and check it fits nearly TWICE
    inside its own height. If it does not, the door is too wide and must be
    pulled in. A door as wide as it is tall is a GATE, not a door.
  - The stone JAMBS are SLIM — a narrow band up each side, roughly as wide as ONE
    timber plank. They are NOT fat pillars and NOT a chunky architrave.
  - The LINTEL is a shallow slab and does NOT overhang far past the jambs.
  - The door LEAF is a tall narrow slab of only THREE or FOUR planks — not five
    or six. Fewer, narrower planks is the fastest way to get the width down.

  COMPOSITION INSIDE THE SQUARE CELL:
  - The door runs VERTICALLY, its stone THRESHOLD reaching the BOTTOM margin of
    the cell and its stone LINTEL nearly touching the TOP margin.
  - HORIZONTALLY IT IS NARROW. Including the stone frame it occupies only the
    MIDDLE HALF of the cell's width. The left quarter and the right quarter of
    the cell are completely EMPTY transparent background.
  - If it looks square, or like a gate, or like a cupboard, it is WRONG. If it
    looks almost too tall and too narrow, it is RIGHT.
  - EXACTLY ONE DOOR PER CELL. Never stack two doors in a column and never draw a
    double door pair side by side.
  - NO DROP SHADOW, NO GROUND SHADOW and no floor line. The lowest opaque pixels
    are the door's own stone threshold.

  WHAT IT IS:
  - A single CLOSED door LEAF of heavy vertical TIMBER PLANKS with visible seams
    between them, deep grain, split and dented at the lower corners where boots
    have kicked it.
  - IRON BANDING: two or three broad horizontal iron straps running across the
    leaf, riveted with fat round studs that read clearly at small size. The bands
    are the strongest readable detail on the door.
  - A heavy IRON RING HANDLE mounted a little above the middle of the leaf,
    hanging from a round backplate. Big enough to read at 16px.
  - A STONE FRAME around the leaf: a slim jamb up each side, a lintel block
    across the top, and a worn THRESHOLD stone at the bottom. The stonework is
    blocky, chipped and cool grey, matching the dungeon's stone floor.
  - Wear everywhere: rust bleeding from the rivets, scuffed timber, chipped stone
    corners, grime settled in the seams.

  IT IS NOT: an open doorway, a dark archway, a portcullis, a gate, a double
  door, a cupboard, a wardrobe, a bookcase, a crate, a chest, a window, or a
  shuttered panel. It is one closed timber door leaf in a stone frame.

  MOOD — a grimy reality-TV dungeon. Heavy, permanent, unwelcoming: the object
  that keeps contestants penned in. Tired, worn, long shut, never ornate and
  never fantasy-decorative.

  COLOUR — it must sit against cool grey dungeon stone without clashing: the
  stone frame is cool grey with a hint of blue-green in its shadows; the door
  leaf is a warm desaturated walnut-brown with 4-5 tone stops so the planks
  separate clearly; the iron banding, rivets and ring are a dull dark grey-black
  metal with tarnished rust-brown streaks. It must NOT be pale, washed out or
  low-contrast. Keep a clear dark outline and clear tonal separation between
  stone, timber and iron. BANNED: neon, pure white, pure black, saturated red,
  saturated yellow, orange, teal, cyan, blue, green, magenta, purple, gold leaf,
  gemstones, glowing runes, magical glow, ornate carved fantasy filigree.

  LIGHTING: light comes from the UPPER LEFT, consistently. The left jamb, the top
  of the lintel, the upper edge of each iron band and the left curve of the ring
  catch the highlight; shadow falls down and to the right, and the leaf sits
  slightly recessed inside its frame so a soft shadow falls along the inside of
  the right jamb.

  RENDERING: hard 1-pixel dark outline on the silhouette, 3-5 tone stops per
  material, restrained dithering for stone and timber grain — no mushy gradients,
  no airbrush, no floating unsupported elements.

  NO TEXT of any kind: no letters, words, numbers, digits, runes, sigils, labels,
  captions, watermarks or signatures anywhere on the door or its frame.

  BACKGROUND: fully transparent. Draw ONLY the door and its stone frame. Do NOT
  paint a wall around the frame, a floor slab, a rectangular backing panel, a
  border, a vignette, or any cast/contact/drop shadow. Every pixel outside the
  door and frame silhouette must be fully transparent.

  SHEET BACKGROUND: every cell must sit on ONE single flat uniform background
  colour, identical in all cells, clearly distinct from the door's colours so it
  can be keyed out cleanly. No per-cell background variation, no borders, no
  dividers.
size:
  width: 64
  height: 112
anchor:
  x: 32
  y: 108
sensors:
  # A door leaf in its frame is a deliberately near-rectangular object and fills
  # far more of its bounding box than the `prop` default [0.10, 0.65]. Same cap
  # and reasoning as the already-approved welcome-room-door; a genuine
  # background-removal failure still lands at ~0.95-1.0 and is caught. Bound set
  # BEFORE generating, from the subject's geometry.
  opaqueRatio:
    min: 0.4
    max: 0.9
  # Grounded: the threshold stands on the floor, so the derived bottom-band
  # anchor is the correct semantics and stays enforced.
  anchor:
    derive: true
    bandRows: 8
    centerToleranceX: 10
tags:
  - pixel-dungeon
  - architecture
  - door
  - terrain
judge:
  enabled: true
  maxVariants: 8
minVariations: 0
