# ORIENTATION + ASPECT NOTE (Set Piece Designer, 2026-07-28)
#
# ROUND 1 FAILED 0/16 ON `anchor-derivable` ("no opaque pixel in bottom 8 rows,
# first opaque row y=91"). Two independent causes, both fixed here:
#
# 1. MECHANICAL. Round 1 declared 64x112. `resizeSpriteStrategy()` picks 'height'
#    only when height >= 2*width; 112 < 128, so it fell through to 'fit', which
#    LETTERBOXES the subject inside the frame and left 20 transparent rows under
#    the door. Declaring 128 selects 'height': the height is locked and the width
#    follows the DRAWN subject's aspect, so the art is aspect-true by
#    construction, always reaches the bottom edge, and needs no hand-typed second
#    dimension. Same mechanism the shipped welcome-room-door relies on.
#
# 2. SUBJECT. Every round-1 variant drew a chunky STONE FRAME around the leaf.
#    That is correct for welcome-room-door (a free-standing set-piece prop) and
#    WRONG here. This is a dungeon TILE door: the renderer scales the sprite so
#    its opaque box WIDTH exactly equals the 4 ft doorway
#    (`scale = tileSize / box.width`, MainGameScene.updateDoorOverlay). If the
#    frame is baked into the sprite, the FRAME fills the doorway and the actual
#    leaf renders far narrower than the opening it is supposed to block. The
#    mapgen already draws the wall tiles either side, so a baked frame also
#    double-draws masonry. Draw the LEAF ONLY.
#
# WHY THIS EXISTS: `tile-door-v1-var-0` currently ships as a full-bleed 256x256
# square, which renders 4 ft x 4 ft -- SHORTER than the 5.75 ft player walking
# through it. Width is pinned by the doorway, so the fix is vertical: a leaf
# drawn 1 : 1.75 renders 4 ft wide x 7 ft tall and grows upward into the wall
# tile above.
#
# `sizeVariant: tall` is deliberately NOT used (2026-07-27 living-area handoff:
# the model ignores portrait cells, the slicer cuts on the declared tall grid and
# each "variant" becomes a column of stacked objects that passes every gate).
# Default square cells slice reliably; the 1 : 1.75 proportion is driven in PROSE.
type: prop
name: tile-door-v1
description: |
  A heavy CLOSED DUNGEON DOOR LEAF, front elevation, looking STRAIGHT AT THE DOOR
  dead-on -- the face of the door is exactly parallel to the screen, with NO tilt,
  NO rotation, NO oblique angle and NO perspective. Modern high-quality pixel art,
  silhouette readable at 16px.

  DRAW THE DOOR LEAF ONLY -- NO STONE FRAME. This is the single most important
  instruction and round 1 got it wrong on all 16 variants. Do NOT draw stone
  jambs up the sides. Do NOT draw a lintel block across the top. Do NOT draw a
  threshold stone at the bottom. Do NOT draw masonry, brick, wall or floor
  anywhere. The dungeon wall is ALREADY DRAWN underneath and beside this art by
  the game -- anything you add there is drawn twice and pushes the real door out
  of its own doorway. The silhouette that reaches the edge of the drawn subject
  must be TIMBER AND IRON, never stone.

  MEASURE IT IN CELL PIXELS. The cell is 256 x 256 source pixels. The door leaf's
  drawn bounding box must be approximately 146 PIXELS WIDE and 256 PIXELS TALL --
  it runs the FULL HEIGHT of the cell, top margin to bottom margin, but only a
  little over HALF its width.
  - Check the width fits nearly TWICE inside the height. If it fits only once or
    1.2 times, the leaf is far too wide and must be pulled in hard.
  - The left ~21% and the right ~21% of the cell are completely EMPTY transparent
    background. Only the middle ~57% carries the door.
  - If it looks square, or like a gate, or like a cupboard door, it is WRONG. If
    it looks almost too tall and too narrow, it is RIGHT.
  - EXACTLY ONE DOOR PER CELL. Never stack two doors in a column and never draw a
    double door pair side by side.

  REAL-WORLD SIZE. The leaf is 4 FEET WIDE x 7 FEET TALL. A person is 5.75 ft
  tall, so this door is noticeably TALLER than the person walking through it --
  that headroom is the whole point of the art and must read at a glance.

  WHAT IT IS:
  - A single closed door LEAF of heavy vertical TIMBER PLANKS -- THREE or FOUR
    planks only, with deep seams between them, visible grain, and splits and
    dents at the lower corners where boots have kicked it. Fewer, narrower planks
    is the fastest way to keep the width down.
  - The top of the leaf is gently ARCHED -- a shallow round-headed top, so the
    upper corners fall away and the silhouette is not a bare rectangle.
  - IRON BANDING: two or three broad HORIZONTAL iron straps running all the way
    across the leaf, riveted with fat round studs that read clearly at small
    size. The bands are the strongest readable detail on the door.
  - A heavy IRON RING HANDLE a little above the middle of the leaf, hanging from
    a round backplate. Big enough to read at 16px.
  - Wear everywhere: rust bleeding down from the rivets, scuffed timber, grime
    settled in the seams.

  IT IS NOT: an open doorway, a dark archway, a portcullis, a gate, a double
  door, a cupboard, a wardrobe, a bookcase, a crate, a chest, a window, a
  shuttered panel, or a door set in a stone surround. It is ONE closed timber
  leaf, alone, floating on transparency.

  MOOD -- a grimy reality-TV dungeon. Heavy, permanent and unwelcoming: the
  object that keeps the contestants in. Tired, worn, long shut, never ornate and
  never fantasy-decorative.

  COLOUR -- the leaf is a warm desaturated walnut-brown with 4-5 tone stops so
  the planks separate clearly; the iron banding, rivets and ring are a dull dark
  grey-black metal with tarnished rust-brown streaks. It must NOT be pale, washed
  out, or low-contrast. Keep a clear dark outline and clear tonal separation
  between timber and iron. BANNED: neon, pure white, pure black, saturated red,
  saturated yellow, orange, teal, cyan, blue, green, magenta, purple, gold leaf,
  gemstones, glowing runes, magical glow, and any ornate carved fantasy filigree.

  LIGHTING: light comes from the UPPER LEFT, consistently. The upper edge of each
  iron band and the left curve of the ring catch the highlight; shadow falls down
  and to the right.

  RENDERING: hard 1-pixel dark outline on the silhouette, 3-5 tone stops per
  material, restrained dithering for the timber grain -- no mushy gradients, no
  airbrush, no floating unsupported elements.

  NO TEXT of any kind: no letters, words, numbers, digits, runes, sigils, labels,
  captions, watermarks or signatures anywhere on the door.

  BACKGROUND: fully transparent. Draw ONLY the door leaf. Do NOT paint a wall, a
  stone frame, a floor slab, a rectangular backing panel, a border, a vignette,
  or any cast/contact/drop shadow. Every pixel outside the leaf's own silhouette
  must be fully transparent.

  SHEET BACKGROUND: every cell must sit on ONE single flat uniform background
  colour, identical in all cells, clearly distinct from the door's colours so it
  can be keyed out cleanly. No per-cell background variation, no borders, no
  dividers.
size:
  width: 64
  height: 128
anchor:
  x: 32
  y: 126
sensors:
  # A bare plank leaf is a deliberately near-rectangular object and fills far
  # more of its bounding box than the `prop` default [0.10, 0.65], which is tuned
  # for irregular open-silhouette props. The floor is loose because the 'height'
  # resize strategy makes the shipped width follow the drawn subject, so the
  # frame hugs the leaf. The 0.96 cap is derived from the ARCHED top: a shallow
  # round head removes roughly 4-8% of the bounding box at the upper corners, so
  # a genuine background-removal failure (which lands at ~0.99-1.0, perfectly
  # rectangular) is still caught. Bounds set BEFORE generating, from the
  # subject's geometry.
  opaqueRatio:
    min: 0.55
    max: 0.96
  # Grounded: the bottom of the leaf stands on the floor of the doorway, so the
  # derived bottom-band anchor is the correct semantics and stays enforced. This
  # is the sensor that caught the round-1 letterboxing.
  anchor:
    derive: true
    bandRows: 8
    centerToleranceX: 10
tags:
  - pixel-dungeon
  - dungeon
  - door
  - architecture
  - tile
judge:
  enabled: true
  maxVariants: 8
minVariations: 0
