type: prop
name: welcome-room-wall-shelf
sizeVariant: wide
description: |
  A short plank shelf on iron brackets carrying a leaning row of ledgers and a stub candle, dust on the top edge. Warm desaturated dungeon palette with faded showbiz red and tarnished gold accents. Lit from the top wall; soft one-pixel contact shadow down and to the right. Worn by decades of syndication — dusty, threadbare, slightly grimy. 3/4 top-down pixel art, silhouette readable at 16px.

  Rendered in the game at approximately 3 x 1.5 feet (1 tile = 16px = 2 feet). The art must read believably at that size — keep detail count low enough to survive at 16px and do not over-detail.

  This prop must sit beside the already-approved welcome-room art without clashing: welcome-room-desk, welcome-room-bookcase, welcome-room-shop-table, welcome-room-rug, welcome-room-velvet-rope, welcome-sign-left-v1 and prop-wall-sconce-v1 — deep maroon and dark walnut wood, tarnished brass hardware, hard dark outline, muted and dusty, never bright or saturated.
  This shelf is WALL-MOUNTED: it hangs on the stone wall on iron brackets and
  does not rest on the floor.
sensors:
  # A wall shelf's lowest opaque pixels are its iron brackets, which sit at the
  # ENDS of the plank by construction, never under its middle — so the
  # bottom-center "grip" anchor that `prop` defaults to is the wrong anchor
  # semantics here (every variant derived a grip at x=30 or x=105 on a 128-wide
  # frame). Center-of-mass is the correct anchor for a wall-hung prop and is
  # still a real, enforced anchor sensor.
  anchor:
    mode: center-of-mass
tags:
  - welcome-room
  - reality-show
  - pixel-dungeon
  - scene-dressing
judge:
  enabled: true
  maxVariants: 8
minVariations: 0
