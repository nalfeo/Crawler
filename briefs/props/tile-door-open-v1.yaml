# DUNGEON DOOR — OPEN, HORIZONTAL DOORWAY (wall runs left<->right, faces camera).
#
# Consumed as GENERATED_DOOR_TEXTURE_KEYS.openHorizontal. There is currently NO
# generated open-door art at all, so every open door in the game falls back to a
# 16px Kenney frame upscaled 4x — the single ugliest door state in the build.
#
# Same width-authoritative render contract as tile-door-v1: the opaque box is
# scaled so its WIDTH is one tile (4 ft), height follows the box aspect and grows
# upward into the wall above. 64x112 => 4 ft x 7 ft.
type: prop
name: tile-door-open-v1
description: |
  A heavy DUNGEON DOOR standing OPEN in a stone wall, seen in front elevation —
  looking STRAIGHT AT THE DOORWAY dead-on, the wall exactly parallel to the
  screen, NO tilt, NO rotation, NO oblique angle, NO perspective. Modern
  high-quality pixel art, silhouette readable at 16px.

  THE SUBJECT IS THE OPENING. The single most important thing to read at a glance
  is that this doorway is PASSABLE — a player must instantly tell it apart from
  the closed door. The centre of the shape is a DARK EMPTY OPENING you can walk
  through, not a timber leaf.

  MEASURE IT IN CELL PIXELS. The cell is 256 x 256 source pixels. The whole
  drawn bounding box INCLUDING the stone frame and the swung leaf must be about
  128 PIXELS WIDE and 224 PIXELS TALL — a tall narrow portrait rectangle. Check
  the width fits nearly TWICE inside the height. If it looks square or like a
  gate it is WRONG.

  COMPOSITION INSIDE THE SQUARE CELL:
  - The doorway runs VERTICALLY, its stone THRESHOLD reaching the BOTTOM margin
    of the cell and its stone LINTEL nearly touching the TOP margin.
  - It occupies only the MIDDLE HALF of the cell's width. The left quarter and
    the right quarter of the cell are completely EMPTY transparent background.
  - EXACTLY ONE DOORWAY PER CELL. Never stack two and never draw a pair.
  - NO DROP SHADOW, NO GROUND SHADOW, no floor line outside the threshold.

  WHAT IT IS:
  - A stone door FRAME — slim jamb up each side, a shallow lintel across the top,
    a worn THRESHOLD stone at the bottom. Blocky, chipped, cool grey.
  - Inside the frame, the OPENING: deep shadow, nearly black at the top and
    centre, lifting very slightly toward the threshold so it reads as depth
    rather than a flat black hole. No visible room, no furniture, no distant
    scenery, no light shaft, no fog, no stars — just dark dungeon interior.
  - The DOOR LEAF itself is swung INWARD and away, so it is seen edge-on and
    FORESHORTENED: a narrow vertical strip of banded timber pressed against the
    INSIDE of the LEFT jamb, only about one fifth as wide as the opening. Its
    iron banding and one rivet row are still just readable on the strip. The leaf
    must NOT cover the opening and must NOT stick out beyond the frame.
  - The same wear as the closed door: rust streaks, scuffed timber, chipped stone
    corners, grime in the seams.

  IT IS NOT: a closed door, a doorway with the leaf still filling it, a
  portcullis, a gate, an archway with no frame, a window, a mirror, a portal, or
  a glowing magical rift. It is an open timber door in a stone frame.

  MOOD — a grimy reality-TV dungeon. The opening should feel like an invitation
  into somewhere worse. Tired, worn, heavy; never ornate, never fantasy-decorative.

  COLOUR — the stone frame is cool grey with a hint of blue-green in its shadows;
  the foreshortened leaf is a warm desaturated walnut-brown; the iron banding and
  rivets are dull dark grey-black metal with tarnished rust-brown streaks; the
  opening is a very dark cool grey-black, NOT pure black. Keep a clear dark
  outline and clear tonal separation between stone, timber, iron and the void.
  BANNED: neon, pure white, saturated red, saturated yellow, orange, teal, cyan,
  blue, green, magenta, purple, gold leaf, gemstones, glowing runes, magical
  glow, torchlight beams, ornate carved fantasy filigree.

  LIGHTING: light comes from the UPPER LEFT, consistently. The left jamb and the
  top of the lintel catch the highlight; shadow falls down and to the right and
  deepens into the opening.

  RENDERING: hard 1-pixel dark outline on the silhouette, 3-5 tone stops per
  material, restrained dithering for stone and timber grain — no mushy gradients,
  no airbrush, no floating unsupported elements.

  NO TEXT of any kind: no letters, words, numbers, digits, runes, sigils, labels,
  captions, watermarks or signatures.

  BACKGROUND: fully transparent OUTSIDE the stone frame. Draw ONLY the frame, the
  dark opening inside it, and the foreshortened leaf. Do NOT paint a wall around
  the frame, a floor slab, a rectangular backing panel, a border, a vignette, or
  any cast/contact/drop shadow. The dark opening INSIDE the frame is opaque dark
  pixels, NOT transparency — the floor is drawn underneath this art and must not
  show through the doorway.

  SHEET BACKGROUND: every cell must sit on ONE single flat uniform background
  colour, identical in all cells, clearly distinct from the art so it can be
  keyed out cleanly. No per-cell background variation, no borders, no dividers.
size:
  width: 64
  height: 112
anchor:
  x: 32
  y: 108
sensors:
  # Same near-rectangular geometry as the closed leaf: frame + filled dark
  # opening fills most of its bounding box, far above the `prop` default 0.65.
  # Bound set BEFORE generating, from the subject's geometry.
  opaqueRatio:
    min: 0.4
    max: 0.9
  anchor:
    derive: true
    bandRows: 8
    centerToleranceX: 10
tags:
  - pixel-dungeon
  - architecture
  - door
  - terrain
judge:
  enabled: true
  maxVariants: 8
minVariations: 0
