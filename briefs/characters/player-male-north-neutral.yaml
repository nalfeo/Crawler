  belt, trousers, boots, palette, outline, and proportions. Do not redesign him.

  Rotate the reference character precisely 180 degrees toward NORTH: show his
  back in a balanced, directly rear-facing neutral stance. Preserve the defining
  hair silhouette, tunic, satchel strap and bag placement from behind. Follow
  the supplied north skeleton guide for the head, spine, shoulders, arm
  placement, hip, and legs. Keep a neutral planted stance with no stride, lean,
  action, weapon, or gesture. Both soles must share one stable floor line and
  the whole figure must fit with transparent margins. The torso, sleeves, belt,
  and legs must remain one continuous opaque figure: no cut-outs, transparent
  gaps, or holes inside the silhouette.

  Pixel art only: flat cel shading, clean dark outline, 2–3 tones per material,
  no gradients, painterly texture, dithering, cast shadow, text, border, floor,
  background, second character, or second pose.
