# Canonical eight-direction male contestant atlas.
# South frame 0 is the immutable accepted crawler-male-south-neutral variant 8.
# The remaining directional anchors retain their accepted generated provenance,
# then normalize deterministically to the South baseline's visible height,
# center pivot, floor line, and pixel scale. Walking frames are derived from
# each direction's neutral anchor so identity and facing cannot drift.
type: character
name: player-walk-cycle-male
description: |
  A complete eight-direction walk atlas for the exact male Crawler contestant
  established by crawler-male-south-neutral variant 8: cropped brown hair,
  square head and jaw, warm tan skin, navy hooded sweatshirt with two
  drawstrings, dark waistband, blue distressed jeans, gray sneakers, and
  bobblehead proportions.

  Canonical row order is NORTH, NORTH-EAST, EAST, SOUTH-EAST, SOUTH,
  SOUTH-WEST, WEST, NORTH-WEST. Each row contains four frames:
  neutral/contact, passing, neutral/opposite-contact, opposite passing.
  Frame 0 of every row is the exact directional neutral/resting pose.

  Every frame keeps the same 256x390 canvas, visible height, center pivot,
  planted floor line, palette, transparency, and direction. Walking uses a
  compact two-step sway and body bob suitable for game-scale rendering; it
  never asks a generator to redraw the accepted identity between frames.
size:
  width: 256
  height: 390
anchor:
  x: 128
  y: 255
palette:
  id: kenney-roguelike
frameSequence:
  enabled: true
  frameCount: 32
  frameRate: 8
  loop: true
generation:
  sheet:
    rows: 8
    cols: 4
    emptyCells: []
    nativeCanvas: 1024
postprocessing:
  trimAndFit: false
  paletteMode: strict
sensors:
  anchor:
    mode: center-of-mass
judge:
  enabled: false
minVariations: 0
tags: [player, contestant, male, walk-cycle, eight-direction, directional-rig]
