# PLAYER WALK CYCLE — FEMALE variant v2 (reference-frame generation).
#
# Identical to player-walk-cycle-female.yaml except for `name` and the
# `seedFrames` entry added below.  The seed frame is the approved frame 0
# (contact-left pose) extracted from the existing approved 4-frame strip.
# Providing it as a reference image locks the model onto the character's
# identity and palette from the very first token, addressing the row-0 vs
# row-1 lighting/outfit-angle inconsistency observed in the original 2×2
# generations.
#
# See build-prompt.ts `seedFrameBlock` / `cartoonFigureRules` for how the
# seed is injected into the prompt and `generate-one.ts` for how the PNG
# bytes are prepended to the provider's reference-image list.
type: character
name: player-walk-cycle-female-v2
description: |
  THE PLAYER CHARACTER — a scrappy dungeon-crawling CONTESTANT on a televised
  reality-show dungeon crawl. Determined, a little scruffy, clearly the
  underdog hero rather than a staff member or monster.

  ART STYLE IS THE FIRST PRIORITY. Draw in the style of EARTHBOUND, CHRONO
  TRIGGER, UNDERTALE and ZELDA: A LINK TO THE PAST. Charming, cartoonish,
  chunky pixel art. NOT gritty, NOT painterly, NOT semi-realistic, NOT dark
  fantasy.

  PROPORTIONS ARE BOBBLEHEAD: about THREE AND A HALF HEADS TALL total, with a
  large rounded head (roughly one third of total height) on a short, chunky
  body. Stubby arms and legs, simple block feet, mitten-shaped hands with no
  individual fingers. Simple readable face: two dot/bean eyes, small nose,
  a determined closed-mouth or slight grin. No realistic facial detail.

  GENDER CUE (the ONLY thing that should differ from this character's other
  two gender variants): shoulder-length hair worn back in a simple ponytail
  or two short braids, and slightly longer eyelashes suggested with a single
  thin line above each eye. Everything else — head size, body proportions,
  height, silhouette width, outfit, and stance — must be IDENTICAL to the
  character's male and androgynous variants. Do NOT draw a dress, skirt, or
  any outfit piece different from the shared OUTFIT description below.

  RENDERING IS FLAT AND CLEAN: flat colour fills with hard-edged cel shading,
  two or three tonal stops per material, no gradients, no dithering or grain
  texture. A clean, consistent dark outline around the figure.

  OUTFIT: a simple worn adventurer's tunic (belted at the waist) over plain
  trousers, sturdy boots, and a small satchel/pack strapped across the back.
  No helmet — bare head with simple hair per the GENDER CUE above. The
  contestant carries NO visible weapon or shield in hand; equipment is
  layered on separately by the game, so the base body must read clearly with
  empty hands.

  VALUE STRUCTURE: a light-to-mid tunic as the largest, brightest mass (torso
  and arms), clearly separating from darker trousers and boots below and from
  a mid-tone floor. Three distinct value bands top to bottom: head, tunic/arms,
  legs/boots — never one flat blob.

  COLOUR: warm, desaturated adventurer palette — a muted green or brown tunic,
  tan/leather belt and satchel, dark brown trousers and boots, warm tan skin
  (never orange, amber, or gold), simple brown or dark-blond hair. Flat fills,
  clean dark outline, never candy-glossy.

  HARD NEGATIVES:
   - Do NOT draw a weapon, shield, staff, or any held item in either hand.
   - Do NOT draw armor plating, a cape, a hood, or a helmet.
   - Do NOT draw realistic, lanky, seven-heads-tall, or adult-proportioned
     anatomy. A small head is a FAILURE in this brief.
   - Do NOT draw a dress, skirt, or any outfit silhouette different from the
     shared tunic/trousers/boots OUTFIT description.
   - Do NOT change the body build, height, or proportions from the shared
     description — only the hair/eyelash gender cue may differ.
   - Do NOT use heavy dithering, noise, or grain anywhere.
   - Do NOT draw a drop shadow, cast shadow, or dark ellipse under the figure.
   - Do NOT leave any fully enclosed pocket of background inside the figure.
   - The satchel strap must lie FLUSH against the torso/shoulder with no
     visible sliver or pocket of background colour showing between the strap
     and the body. Keep each arm close against the torso (a relaxed walking
     swing, not held away from the body) so no background-colour gap opens
     up between an upper arm and the torso.
   - CRITICAL SHEET LAYOUT: all 4 poses sit in a 2×2 grid, read in row-major
     order — top-left, top-right, bottom-left, bottom-right — mapping
     directly to contact-left, passing-left, contact-right, passing-right.
     Each of the 4 cells is a separate, self-contained pose; do NOT draw one
     continuous scene spanning multiple cells, and do NOT treat the top row
     and bottom row as two different camera heights or moments — they are
     simply the next two frames in the SAME walk cycle, at the SAME scale and
     SAME floor-line height as the top row.
   - CRITICAL FACING DIRECTION: the character faces the SAME way — a
     right-facing side profile — in ALL 4 cells, with no exceptions. The
     labels "contact-right" and "passing-right" name WHICH FOOT is forward/in
     contact with the ground during the stride, NOT a change in which
     direction the character is facing or turning toward the viewer. Do NOT
     mirror, flip, or turn the character to face left (or face the viewer) in
     the bottom-left ("contact-right") or any other cell. In every cell the
     face/nose points the same way, and the satchel strap sits on the SAME
     shoulder/side of the back in every cell — a strap or face flipping to
     the opposite side between cells is always a FAILURE, exactly like a
     bled or cut-off limb.
   - CRITICAL DETAIL PARITY: render at the SAME fine pixel-art detail level,
     line weight, and shading complexity as this character's other two gender
     variants (player-walk-cycle-male.yaml / player-walk-cycle-other.yaml) —
     crisp individual strands/tufts suggested in the hair, the belt/strap
     hardware and multi-tone shading on the tunic and boots clearly rendered.
     A visibly flatter, blockier, or lower-detail pass than the sibling
     variants is a FAILURE even if every other rule above is satisfied —
     regenerate rather than accept a softer/simpler render.

  SIZE ON THE SHEET: the standing figure spans roughly 80-90% of its cell's
  narrower axis, centered, feet on a common invisible floor line at the SAME
  relative height within every cell — the floor line must be at the EXACT
  SAME relative pixel height in all 4 cells so the walk cycle doesn't bob
  vertically once the 4 frames are extracted and played back in sequence.

  CELL CONTAINMENT: each cell is a 512×512 square. The ENTIRE pose for that
  frame — including any forward-reaching leg, swinging arm, or trailing hand
  from the walk stride, not just the resting torso width — must fit
  COMPLETELY inside its own cell. Leave a generous, clearly visible margin of
  plain background colour around every side of the figure within its cell
  (do not let the figure crowd or touch the cell's edge), and keep a uniform
  flat background gutter between all 4 cells — the full width between the
  left and right columns, and the full height between the top and bottom
  rows — so no two cells touch and no figure content bleeds from one cell
  into its neighbor. If a stride pose would be too wide or too tall to leave
  a clean margin on every side, draw a shorter, narrower stride instead — a
  smaller stride is always correct; any bleed, ghosting, or cut-off limb is
  always a FAILURE regardless of how small.

  Rendered in the game at roughly 5.5 feet tall (1 tile = 4 feet). Keep detail
  count low enough that the outfit and silhouette both survive when the
  character is only about 40 pixels tall on screen.

  SHEET BACKGROUND: every cell sits on ONE single flat uniform background
  colour, identical in all cells, clearly distinct from the figure's colours.
  Do not alternate cell backgrounds and do not draw any panel, border, or
  frame behind the subject.
size:
  width: 256
  height: 256
anchor:
  x: 128
  y: 252
# Seed frame: the approved frame 0 (contact-left pose) from the existing
# generation.  Providing it as the first reference image tells the model to
# match this character's identity EXACTLY across all four cells, preventing
# the row-0-vs-row-1 lighting/outfit-angle drift seen in the original brief.
seedFrames:
  - path: briefs/characters/seeds/player-walk-cycle-female-frame0.png
    note: 'Frame 0 (contact-left pose) — approved reference for identity and palette consistency across all 4 frames'
frameSequence:
  enabled: true
  frameCount: 4
  frameRate: 8
  loop: true
generation:
  sheet:
    rows: 2
    cols: 2
    emptyCells: []
    nativeCanvas: 1024
sensors:
  anchor:
    mode: center-of-mass
  interiorHoles:
    maxPixels: 64
judge:
  enabled: false
minVariations: 0
tags:
  - player
  - contestant
  - walk-cycle
  - animation
  - gender-female
