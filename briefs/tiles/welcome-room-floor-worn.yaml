type: tile
name: welcome-room-floor-worn
description: |
  A carpet tile worn down to the backing along a traffic line, nap flattened and colour faded. Warm desaturated dungeon palette with faded showbiz red and tarnished gold accents. Lit from the top wall; soft one-pixel contact shadow down and to the right. Worn by decades of syndication — dusty, threadbare, slightly grimy. 3/4 top-down pixel art, silhouette readable at 16px.

  Rendered in the game at approximately 2 x 2 feet (1 tile = 16px = 2 feet). The art must read believably at that size — keep detail count low enough to survive at 16px and do not over-detail.

  This prop must sit beside the already-approved welcome-room art without clashing: welcome-room-desk, welcome-room-bookcase, welcome-room-shop-table, welcome-room-rug, welcome-room-velvet-rope, welcome-sign-left-v1 and prop-wall-sconce-v1 — deep maroon and dark walnut wood, tarnished brass hardware, hard dark outline, muted and dusty, never bright or saturated.

  CRITICAL: this is a WARM ORANGE CARPET tile, not stone, not cave rock, not sewer tile. COLOUR TARGET (measured from the actual rendered room floor): the carpet base must be a PALE, LIGHT, SANDY WARM ORANGE around #eaa56c — roughly the colour of terracotta sand in daylight. Previous rounds came back far too dark and too saturated (#933c1a, #a76521, a dark brick red) and rendered as obvious dark patches punched into the light orange floor, which is exactly the failure these tiles were commissioned to remove. Lighten and desaturate substantially: the average pixel of the tile must sit close to #eaa56c, with weave noise only a shade or two either side of it, and any stain/wear/seam detail kept as a LOCAL accent rather than darkening the whole tile. Do NOT match the deep maroon welcome-room-rug — the rug sits ON TOP of this carpet and is deliberately much darker. It must tile edge-to-edge seamlessly at 16px with no border, no frame, no vignette and no transparent margin — the pattern must run right off all four edges so a grid of these reads as one continuous carpet.
  REJECTION FEEDBACK FROM THE PREVIOUS ROUND — the first attempt was rejected
  by the judge (2/2/2/2) for two specific faults. Fix BOTH:
  (1) It drew a bright tarnished-gold BORDER framing every tile. There must be
      NO border, NO frame, NO outline and NO inset panel edge of any kind. The
      carpet surface must run flat and uninterrupted right off all four edges.
  (2) The worn traffic line never appeared — every tile was flat, uniform
      brown. The WEAR IS THE SUBJECT: a clearly visible diagonal band of
      flattened, faded nap sweeping across the tile where boots have walked it
      down, going lighter and greyer toward the middle of the band and thinning
      to bare pale backing threads at its most walked-out point. The
      surrounding untouched carpet stays a richer warm orange-red.

  Match the surface treatment of the approved welcome-room-floor-tape tile
  exactly: a finely speckled woven orange-red carpet nap, dark and muted, with
  per-pixel colour noise — the same fabric, just walked out along the traffic
  line instead of taped.

  SECOND-ROUND CRITIQUE — round two removed the border correctly but overshot
  on the wear band. It rendered as a bright, high-contrast pale GOLD stripe
  slashing corner to corner, reading as painted gold rather than as worn
  fabric, and far more saturated and brighter than the room's palette allows.
  Fix: the wear band must be LOW CONTRAST and DESATURATED — the same orange-red
  carpet, merely dustier, greyer and a little lighter where the nap is crushed,
  no more than a couple of shades off the surrounding carpet. Absolutely no
  gold, no yellow, no cream, no bright highlight. Its edges must be soft and
  ragged and blend into the surrounding nap rather than forming a clean-edged
  stripe, and it should occupy a modest part of the tile, not bisect it.
