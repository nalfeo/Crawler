# ORIENTATION NOTE (Set Piece Designer, 2026-07-28) -- CONTRACT CHANGED IN ROUND 4
#
# Sibling of tile-door-side-v1 (same wall, same slot, OPEN instead of closed), and
# it takes the same contract change: DRAW IT FACE-ON. The RENDERER applies the
# quarter turn (`resolveDoorRenderMode` -> `quarterTurnsCcw: 1`, drawn as
# `setAngle(-90)`), so a pre-turned sprite would be turned twice.
#
# Why: rounds 1-3 asked for the quarter-turn in escalating, falsifiable prose and
# got face-on art every time. Sensors scored 7/7 and the VLM judge scored
# brief_match 5/5 on that art, because NEITHER GATE CAN SEE WHICH WAY THE OPENING
# RUNS. The turn moved to the renderer, where it is exact and free.
#
# This matches the packs' own convention: their vertical door tile IS their
# horizontal tile rotated 90 degrees counter-clockwise -- byte-identical on the
# shared edge (mean per-channel diff 0.0 on both shipped packs, versus 20.8 for
# the identity mapping).
#
# From that rotation (dst(x,y) = src(w-1-y, x)) two things follow, and the prose
# below encodes both:
#   - The source's LEFT and RIGHT edges become the rendered BOTTOM and TOP edges,
#     so the wall stone belongs on the two SIDE edges here.
#   - The source's UPPER-RIGHT corner becomes the rendered UPPER-LEFT, so this art
#     is lit from the UPPER RIGHT in order to read as upper-left in game.
#
# FAMILY MATCH IS A HARD REQUIREMENT: measured at the true 32 px game scale, the
# previous side art read cold and grey next to the approved horizontal doors. 69
# of 104 Floor 1 doors are vertical, so this is the majority look.
#
# THE OPENING MUST BE OPAQUE, NOT TRANSPARENT -- the dark gap is the room beyond,
# painted solid. `type: tile` makes the whole cell opaque anyway, but the dark
# must read as depth rather than a punched hole.
type: tile
name: tile-door-open-side-v1
description: |
  An OPEN DUNGEON DOORWAY seen FACE-ON, filling a square cell. Modern
  high-quality pixel art. The cell is 256 x 256 source pixels and the artwork
  FILLS IT EDGE TO EDGE -- there is no transparency anywhere.

  Draw it UPRIGHT and FACE-ON, exactly as you would draw any front-facing open
  doorway: an upright opening with the door swung back against one side. Do NOT
  rotate, tilt or turn it -- the game engine turns this sprite a quarter turn
  itself, so a pre-turned image would come out turned twice.

  IT MUST LOOK LIKE THE SAME DOORWAY as the arched open doorway already in the
  game -- same stonework, same timber, same age. Keep it readable: the dark
  opening should clearly dominate, with the stone a slim surround.

  LAYOUT, left to right:
  - The LEFT ~12% of the cell is dungeon WALL -- cool grey blocky stone, the wall
    carrying on past the doorway.
  - Immediately inside it, the SWUNG DOOR LEAF: an UPRIGHT bar of heavy timber
    running top-to-bottom, about ONE FIFTH of the width of the opening, pushed
    back flat against the left jamb. It is DARKER than a lit door because it lies
    in the shadow of the opening. One or two iron straps and the plank seams are
    still just readable on it.
  - The MIDDLE, and most of the cell, is the OPENING: a tall band of OPAQUE
    near-black shadow -- the unlit space beyond. Every pixel of it is painted. Let
    the dark lift very slightly toward its lower edge so it reads as depth rather
    than a flat hole.
  - The RIGHT ~12% of the cell is dungeon WALL again, matching the left.

  IT IS NOT: a closed door, a portcullis, a gate, a window, a hatch, a cave
  mouth, a mine shaft, or a bridge. It is one open doorway filling a square gap
  in a stone wall.

  MOOD -- a grimy reality-TV dungeon. The way through is open and it is not
  reassuring: the dark beyond is flat and unlit.

  COLOUR -- the opening is a very dark desaturated blue-black, near-black but not
  pure black, lifting faintly toward its lower edge; the swung leaf is a warm
  desaturated walnut-brown pushed several tone stops DARKER than a lit door; iron
  straps and rivets are dull dark grey-black metal with tarnished rust-brown
  streaks; the wall stone is cool grey with a hint of blue-green in its shadows.
  BANNED: neon, pure white, pure black, saturated red, saturated yellow, orange,
  teal, cyan, blue, green, magenta, purple, gold leaf, gemstones, glowing runes,
  magical glow, torchlight glare, visible fire, and any ornate carved fantasy
  filigree.

  LIGHTING: light comes from the UPPER RIGHT. This is deliberate and it is the
  opposite of the usual rule -- the engine turns this sprite a quarter turn
  counter-clockwise, which carries the upper-right corner around to the
  upper-left, so lighting it from the upper right here is what makes it lit from
  the upper left on screen. Highlights sit on the upper-RIGHT side of every stone,
  strap and plank; shadow falls down and to the LEFT.

  RENDERING: hard dark outlines where materials meet, 3-5 tone stops per
  material, restrained dithering for stone and timber grain -- no mushy
  gradients, no airbrush.

  NO TEXT of any kind: no letters, words, numbers, digits, runes, sigils, labels,
  captions, watermarks or signatures anywhere.

  BACKGROUND: none. This is an opaque tile that fills its whole cell edge to
  edge. No transparency, no drop shadow, no vignette, no border, no frame around
  the cell.

  SHEET BACKGROUND: every cell is fully painted; cells butt directly against each
  other with no dividers, borders or gutters between them.
size:
  width: 64
  height: 64
anchor:
  x: 32
  y: 63
sensors:
  # Full-bleed opaque tile: occupancy is 1.0 by definition, so the ratio sensor
  # has nothing to say and is disabled rather than given a meaningless bound.
  opaqueRatio:
    disabled: true
  # The artwork intentionally runs to all four edges.
  edge:
    allowMainTouch: true
tags:
  - pixel-dungeon
  - dungeon
  - door
  - architecture
  - tile
judge:
  enabled: true
  maxVariants: 8
minVariations: 2
