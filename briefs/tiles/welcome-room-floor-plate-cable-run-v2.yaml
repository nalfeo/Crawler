# welcome-room-floor-plate-cable-run-v2 — Asset Forge, 2026-07-27.
# Sibling of `welcome-room-floor-plate-clean-v2`. See that brief's header for the
# full v1-rejection evidence, the crop reframe rationale, the numeric accept
# criterion, and the `type: tile` / geometry / palette-lock reasoning — it all
# applies verbatim.
#
# TWO CORRECTIONS ON TOP OF THE FRAME FIX:
# 1. v1 `cable-run-var-4` shipped a ~10px near-black rim (edge luma 25 vs
#    interior 76, -68%). Same fix as the family: the subject is a crop, not a
#    tile. This variant has the easiest time proving it, because a cable run
#    genuinely continues past the crop.
# 2. THE CABLE MUST BE EDGE-CONTINUOUS IN THE USEFUL SENSE. v1's cable entered
#    and exited at points that will not line up with a neighbouring copy. v2
#    pins the crossing to the VERTICAL MIDPOINT of the left and right edges, so
#    two copies placed side by side connect. If that proves unreliable across a
#    wave it gets reported, and the maintainer places this as a single isolated
#    accent instead — the fallback is a placement decision, not a licence to
#    approve a mismatched variant.
