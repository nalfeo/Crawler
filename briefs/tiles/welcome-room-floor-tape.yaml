type: tile
name: welcome-room-floor-tape
description: |
  A carpet tile marked with a stage-crew gaffer-tape cross, the tape lifting at one edge. Warm desaturated dungeon palette with faded showbiz red and tarnished gold accents. Lit from the top wall; soft one-pixel contact shadow down and to the right. Worn by decades of syndication — dusty, threadbare, slightly grimy. 3/4 top-down pixel art, silhouette readable at 16px.

  Rendered in the game at approximately 2 x 2 feet (1 tile = 16px = 2 feet). The art must read believably at that size — keep detail count low enough to survive at 16px and do not over-detail.

  This prop must sit beside the already-approved welcome-room art without clashing: welcome-room-desk, welcome-room-bookcase, welcome-room-shop-table, welcome-room-rug, welcome-room-velvet-rope, welcome-sign-left-v1 and prop-wall-sconce-v1 — deep maroon and dark walnut wood, tarnished brass hardware, hard dark outline, muted and dusty, never bright or saturated.

  CRITICAL: this is a WARM ORANGE CARPET tile, not stone, not cave rock, not sewer tile. Woven carpet nap texture in the room's warm orange-to-maroon range, matching and sitting seamlessly beside welcome-room-rug. It must tile edge-to-edge seamlessly at 16px with no border, no frame, no vignette and no transparent margin — the pattern must run right off all four edges so a grid of these reads as one continuous carpet.
