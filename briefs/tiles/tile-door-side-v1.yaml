# ORIENTATION NOTE (Set Piece Designer, 2026-07-28)
#
# ROUND 1 FAILED THE EYEBALL 8/8 ON ORIENTATION. Every variant came back as a
# normal face-on door with VERTICAL plank seams -- i.e. exactly the horizontal
# door again. Sensors scored 7/7 and the VLM judge scored brief_match 5/5 on all
# of them, because neither gate can see which way the planks run. This is the
# reason the prose below is written as a falsifiable self-check rather than a
# description.
#
# WHY THIS ONE IS NOT TALL, unlike tile-door-v1: this door sits in a wall that
# runs UP-DOWN the screen. Measured against the shipped terrain packs, the pack's
# `door-closed-vertical.png` is its `door-closed-horizontal.png` rotated 90
# degrees counter-clockwise -- confirmed to the pixel: the horizontal tile's TOP
# edge row is byte-identical to the vertical tile's LEFT edge column reversed
# (mean per-channel diff 0.0 for both industrial-cave and caeles-fixture; the
# identity mapping differs by 20.8). The interiors differ by 22% because the
# packs hand-retouch the SHADING so the light does not rotate with the art.
#
# Consequences, all of which follow from that measured rotation:
#   - wall context sits on the TOP and BOTTOM rows (not the sides);
#   - the plank seams run LEFT-TO-RIGHT (not top-to-bottom);
#   - the iron straps run TOP-TO-BOTTOM (not left-to-right);
#   - the light still comes from the UPPER LEFT -- it does NOT rotate.
#
# There is no door FACE presented to the camera in this orientation, so there is
# no 7 ft height to draw. It stays a tile-filling 4 ft x 4 ft square, matching the
# pack convention. Mixed door heights between the two orientations is CORRECT in
# this projection, not a bug.
#
# `type: tile` selects the 'stretch' resize strategy: exact 64x64, edge to edge,
# no transparent gutters. That is why this brief needs no aspect prose.
type: tile
name: tile-door-side-v1
description: |
  A heavy CLOSED DUNGEON DOOR seen in a wall that runs UP AND DOWN the screen.
  Modern high-quality pixel art. The cell is 256 x 256 source pixels and the
  artwork FILLS IT EDGE TO EDGE -- there is no transparency anywhere.

  THIS IS THE ORDINARY DOOR ROTATED A QUARTER TURN. Picture the normal front-on
  plank door -- upright, planks running top to bottom, iron straps running across
  it. Now turn that whole picture 90 degrees counter-clockwise and draw THAT.
  Everything that ran vertically now runs horizontally, and everything that ran
  horizontally now runs vertically.

  SELF-CHECK BEFORE YOU COMMIT THE IMAGE -- round 1 failed all 16 variants here:
  - The PLANK SEAMS must be HORIZONTAL lines running LEFT TO RIGHT across the
    cell. If you can see vertical plank seams, you have drawn the wrong
    orientation and must start over.
  - The IRON STRAPS must be VERTICAL bars running TOP TO BOTTOM. If your straps
    run left-to-right, the image is wrong.
  - The stonework must appear along the TOP EDGE and the BOTTOM EDGE of the cell.
    If your stone is up the LEFT and RIGHT sides, the image is wrong.

  LAYOUT, top to bottom:
  - The TOP ~15% of the cell is dungeon WALL -- cool grey blocky stone, the wall
    carrying on past the doorway.
  - The MIDDLE ~70% is the DOOR: heavy timber, with THREE or FOUR plank seams
    running left-to-right, deep grain, and TWO or THREE broad VERTICAL iron
    straps running from the top of the door down to the bottom of it, riveted
    with fat round studs.
  - The BOTTOM ~15% of the cell is dungeon WALL again, matching the top.
  - A heavy IRON RING HANDLE on a round backplate sits on the door a little LEFT
    of centre. Big enough to read at 16px.

  IT IS NOT: an upright front-facing door, an open doorway, a dark archway, a
  portcullis, a gate, a double door, a hatch, a crate lid, a wooden bridge, a
  raft, a ladder, or a bookshelf lying down. It is one closed timber door filling
  a gap in a wall that runs up and down the screen.

  MOOD -- a grimy reality-TV dungeon. Heavy, permanent and unwelcoming. Tired,
  worn, long shut, never ornate and never fantasy-decorative.

  COLOUR -- the timber is a warm desaturated walnut-brown with 4-5 tone stops so
  the planks separate clearly; the iron straps, rivets and ring are dull dark
  grey-black metal with tarnished rust-brown streaks; the wall stone is cool grey
  with a hint of blue-green in its shadows. Clear tonal separation between stone,
  timber and iron. BANNED: neon, pure white, pure black, saturated red, saturated
  yellow, orange, teal, cyan, blue, green, magenta, purple, gold leaf, gemstones,
  glowing runes, magical glow, and any ornate carved fantasy filigree.

  LIGHTING: light comes from the UPPER LEFT, consistently, and it does NOT rotate
  with the door. Even though the door is turned a quarter turn, the highlights
  still sit on the upper-left side of every plank, strap, rivet and stone, and
  shadow still falls down and to the right. This is the one thing that must NOT
  be rotated.

  RENDERING: hard dark outlines where materials meet, 3-5 tone stops per
  material, restrained dithering for stone and timber grain -- no mushy
  gradients, no airbrush.

  NO TEXT of any kind: no letters, words, numbers, digits, runes, sigils, labels,
  captions, watermarks or signatures anywhere.

  BACKGROUND: none. This is an opaque tile that fills its whole cell edge to
  edge. No transparency, no drop shadow, no vignette, no border, no frame around
  the cell.

  SHEET BACKGROUND: every cell is fully painted; cells butt directly against each
  other with no dividers, borders or gutters between them.
size:
  width: 64
  height: 64
anchor:
  x: 32
  y: 63
sensors:
  # Full-bleed opaque tile: occupancy is 1.0 by definition, so the ratio sensor
  # has nothing to say and is disabled rather than given a meaningless bound.
  opaqueRatio: false
  # The artwork intentionally runs to all four edges.
  edge:
    allowMainTouch: true
tags:
  - pixel-dungeon
  - dungeon
  - door
  - architecture
  - tile
judge:
  enabled: true
  maxVariants: 8
minVariations: 2
