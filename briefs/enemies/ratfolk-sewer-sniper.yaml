  - wiry ratfolk sniper body angled low in a shooting brace, patchy canvas vest, pipe-and-fitting rifle with a cloth-wrapped grip, beady eye at scope
  - ratfolk sewer-sniper silhouette: elongated rifle dominating the horizontal, crouched wiry body, prominent snout, grimy urban palette of brown and sewer green
  - ratfolk ranged specialist in a tight low stance, rubber waders and tool belt, hand-made scoped rifle with threaded metal fittings, rust and dark-gray accents
