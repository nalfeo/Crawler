  - crabfolk elite capo wide tank silhouette, extra shell plating with gold elite accent, thick chains across chest, both claws armored and prominent
  - crabfolk elite capo in cold authority pose, blue-gray chitin with gold-trim boss shell, riveted claw armor, stalked eyes radiating menace
  - crabfolk elite capo low-center-of-gravity crustacean boss mass, pinstriped shell dome, raised warning claw with lit cigar, dark cartel presence

