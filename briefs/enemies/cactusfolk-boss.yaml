type: enemy
name: cactusfolk-boss
mobRole: boss
floor: 2
sizeVariant: large

description: |
  Abuela Saguaro, a towering saguaro cartel matriarch who reads unmistakably as
  an elderly grandmother. Stooped, hunched-forward posture — the body mass leans
  slightly forward rather than standing upright. Deeply wrinkled and weathered
  green cactus flesh with a lived-in, aged texture. Small wire-rimmed spectacles
  perched on the face. A faded floral rebozo or shawl draped over one shoulder,
  its pattern worn and sun-bleached.

  Salvage-armor layering coordinates with — never buries — her grandmotherly
  age cues: think cracked leather straps over the shawl, a few small salvage
  pauldron pieces, devotional charms and trinkets hanging from the rebozo fringe,
  and sun-faded cartel finery (dulled gold stitching, a worn sash). The
  grandmother silhouette is primary; the crime-boss armor is secondary dressing.

  Preserve ONE unmistakable saguaro landmark per variant: the thick central
  column torso with paired arm-columns in a classic Y-shape. Keep arms and
  spines firmly connected — no isolated thorns, no fragile protrusions. Spines
  are part of the connected body mass.

  Color palette: weathered deep greens (aged cactus flesh), sun-faded florals
  (rebozo), dusty ochre and rust (salvage armor), tarnished brass accent on
  charms and finery. Avoid bright or saturated colors that clash with the
  grandmother-in-decline mood.

  Expression: calm, knowing authority — a grandmother who does not need to
  raise her voice. Front-facing toward the viewer, both eyes visible through
  wire-rimmed spectacles.

  Silhouette-first: the hunched saguaro shape with a visible shawl draping one
  shoulder must still read as a large cactus elder even when painted black.

sensors:
  enemy:
    toleranceDeg: 20
    # Abuela Saguaro is authored front-facing toward the viewer.
    facing: front
  edge:
    # Large boss — allow silhouette to touch the frame edge.
    allowMainTouch: true
    allowDetachedEdgeComponents: false

judge:
  enabled: true
  # Boss brief — cap judge calls at 4 variants maximum.
  maxVariants: 4

variations:
  - 'Abuela Saguaro: stooped saguaro Y-silhouette, wire-rimmed spectacles, faded floral rebozo over left shoulder, one devotional charm hanging from fringe, calm grandmother expression, front-facing'
  - 'Abuela Saguaro with salvage pauldron on right shoulder over the rebozo, worn gold-stitched sash around the torso, small trinkets clipped to the chest strap, half-lidded knowing expression'
  - 'Abuela Saguaro sun-faded variant: bleached-out floral rebozo in dusty rose and cream, cracked-leather shoulder strap, tarnished brass charm bracelet across the wrist-column, deep wrinkle lines on face'
  - 'Abuela Saguaro heavy-silhouette variant: maximum hunched mass, thick central column, rebozo draping both sides of the body, charms and trinkets clustered at the shawl fringe, wide stable stance'

minVariations: 2
