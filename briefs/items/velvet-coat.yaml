type: item
name: velvet-coat
floor: 2
description: |
  A single torso-wear equipment icon: a centered velvet coat with a strong
  body-armor silhouette, shown front-facing on a transparent background.
  The coat reads instantly as protective upper-body gear at small size:
  high collar, broad shoulders, long front panels, and a reinforced chest
  structure under the velvet outer layer. Rich dark burgundy velvet is broken
  up by darker seams, worn trim, and a few practical salvaged armor
  reinforcements so it feels like Floor 2 dungeon gear rather than formal
  clothing. Keep it to one subject only, fully inside frame, with a crisp
  readable outline and clear separation between collar, shoulders, torso,
  and hem. No mannequin, no body, no background props, no text, no
  floating extra accessories.
