type: equipment
name: surveyor-map
description: |
  A battered paper surveyor's map, folded and refolded into a thick compact square,
  held flat with the cover side facing out. The cover shows a grid of dungeon passages
  and room outlines sketched in brown ink on yellowed parchment, with some sections
  marked by hand in hasty red ticks and underlines. The edges of the map are worn and fraying,
  and the fold lines are dark with grime. One corner has a wax seal — cracked and
  peeling — stamped with a cartographer's compass-rose symbol. A short leather strap
  keeps it folded shut. Clearly a working tool, not decorative: dog-eared, stained,
  and essential. The silhouette of the folded rectangle with the strap loop must read
  clearly as a document accessory at a glance. No readable text or characters visible on the cover — just
  the ink grid pattern suggesting a map.
variations:
  - yellowed parchment cover with brown ink grid and red annotation marks, cracked wax compass-rose seal
  - dark worn leather cover with embossed floor-plan grid, brass corner pins, worn leather strap
  - aged blue-grey cloth-bound map folder with silver cartographer's clasp and visible folded edge stitch
minVariations: 3
sensors:
  edge:
    allowMainTouch: true
