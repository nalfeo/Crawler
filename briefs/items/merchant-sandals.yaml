type: item
name: merchant-sandals
description: |
  A single matched pair of merchant's sandals shown as one centered footwear
  subject, resting flat and fully inside the frame. The sandals are sturdy,
  open-toed dungeon footwear with thick worn leather soles and broad crossing
  straps over the top, plus an ankle strap with a small brass buckle. Surfaces
  are scuffed and travel-worn, with subtle stitched edges and a few brighter
  brass accents that suggest practical trade gear rather than noble finery. The
  shape must read instantly as protective sandals at a glance, with a clear
  paired-footwear silhouette and no extra props or background elements.
variations:
  - dark brown straps with warm brass buckles and heavier sole stitching for a rugged caravan look
  - reddish leather straps with a small dangling coin charm near one ankle buckle, still readable as footwear first
  - dust-grey soles with patched tan straps and a more reinforced toe strap for a scrappier market-traveler build
minVariations: 5
