type: weapon
name: bone-chakram
description: |
  A thrown ring-blade weapon fashioned from a large bone — the classic
  chakram silhouette: a thin circular torus with a sharpened outer edge.
  The ring is carved from bleached bone: ivory-cream main body, warm cream
  highlight catching the light on the upper arc, cool grey-blue shadow on
  the underside. The inner void of the ring is fully transparent. Surface
  detail: hairline fractures running across the ring, worn scratched edges,
  faint grooves cut along the outer cutting arc. The sharpened outer rim
  should be visibly thinner and more defined than the inner structural body
  of the ring. The bone texture must read clearly at output size: rough
  but smooth-polished on the flat faces. No glow, no blood, no chains,
  no ornamentation beyond the bone itself. The silhouette must read as
  a circular ring weapon — not a wheel, not a shield — at a glance.
  Slight foreshortening or tilt (ring face roughly toward the viewer,
  turned maybe 15-30 degrees from flat-on) to suggest it is about to be
  thrown. Single subject, centered.
# Bone chakram is a thrown disc weapon — circular, like compact-disk.
# Diagonal orientation matches compact-disk (the only other thrown ring
# weapon in the registry). The ring has no strong principal axis so we
# open the tolerance window to 10° to avoid false rejections from the
# orientation sensor.
#
# Anchor at center of the ring body rather than the bottom-center grip
# default for vertical weapons. The brief targets 64×64 output from a
# 256×256 source cell (4 source px = 1 output px). The ring center sits
# at 32×40 in 64px space: horizontal center (32/64) and slightly above
# the vertical center (40/64 ≈ 62%) to account for the slight tilt that
# makes the ring read as a thrown weapon rather than a flat wheel. The
# standard weapon grip anchor {x:32, y:56} places the attach-point at
# the bottom of the frame — correct for a vertical hilt but wrong for
# a centered ring that has no grip.
anchor: { x: 32, y: 40 } # ring center — not grip; see comment above
sensors:
  weapon:
    orientation: diagonal
    diagonalToleranceDeg: 10
variations:
  - cracked and partially repaired ring with bone-splint wrappings
  - engraved spiral grooves running around the outer cutting face
minVariations: 6
