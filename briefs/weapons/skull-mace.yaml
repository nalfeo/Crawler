type: weapon
name: skull-mace
size: { width: 16, height: 16 }
palette: { id: kenney-roguelike }
anchor: { x: 8, y: 14 }
tags: [weapon, mace, blunt, skull, bone, dark, uncommon]
prompt: |
  A grim one-handed mace held vertically, head at the top, haft straight
  down. The head is a small bleached skull mounted on top of a short
  straight haft — eye sockets and nasal cavity read as two dark dots and
  a slit even at 16x16. Wrapped grip with a simple band or pommel at the
  base. Bone-white skull with cool grey shadow on the underside; dark
  brown wrapped haft; muted grey/iron pommel and band. Single thin
  highlight along the top of the skull and one edge of the haft. No
  glow, no flames, no blood, no chains, no enchantment. The silhouette
  must read as "skull on a stick" at a glance and clearly not be a sword.
references:
  # Spritesheet references from the same Kenney roguelike packs the
  # iron-sword brief uses, so the model anchors on the existing weapon
  # palette and brush style. The post-processor still quantises every
  # variant back to the kenney-roguelike palette regardless.
  - path: public/assets/kenney/roguelike-rpg-pack/spritesheet.png
    note: roguelike RPG weapon sheet for silhouette + palette anchoring
  - path: public/assets/kenney/tiny-battle/spritesheet.png
    note: secondary palette/style anchor with hand-weapon shapes
