type: weapon
name: skull-mace
description: |
  A grim one-handed mace held vertically, head at the top, haft straight
  down. The head is a small bleached skull mounted on top of a short
  straight haft — eye sockets and nasal cavity read as two dark dots and
  a slit even at 16x16. Wrapped grip with a simple band or pommel at the
  base. Bone-white skull with cool grey shadow on the underside; dark
  brown wrapped haft; muted grey/iron pommel and band. Single thin
  highlight along the top of the skull and one edge of the haft. No
  glow, no flames, no blood, no chains, no enchantment. The silhouette
  must read as "skull on a stick" at a glance and clearly not be a sword.
# Vertical orientation, 4x4 sheet, palette, references, anchor — all
# inherited from data/sprite-types/weapon.json. This brief only contains
# the bits that make a skull mace specifically a skull mace.
#
# Variations are discrete on-theme embellishments the model rotates
# through cells (one per cell, never combined). Keep entries short and
# evocative; do NOT redescribe the canonical subject here.
variations:
  - spiked iron pommel at the base of the haft
  - wolf or ram skull replacing the human skull
  - small chain wrapping the haft below the skull
  - battle-damaged skull with a chipped tooth or cracked cranium
  - twin small skulls stacked on top of the haft instead of one large skull
  - rune-etched iron band beneath the skull
  - elongated jaw extending past the bottom of the skull
