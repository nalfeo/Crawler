type: weapon
name: baseball-bat-v1
floor: 2
description: |
  A single centered baseball bat held perfectly vertical, knob at the bottom
  and the rounded striking barrel at the top. Thick wooden bludgeon silhouette
  with a short dark tape wrap near the grip, worn varnished wood through the
  body, and a slightly heavier barrel so it reads clearly as a bat rather than
  a club or staff. Floor 2 salvage-fighter finish: scuffed wood, a few nicks,
  and one small industrial reinforcement detail such as a taped seam or narrow
  metal band. No nails, no spikes, no blood, no glow, no text, no logo, no
  extra props. Transparent background, fully inside frame, silhouette-readable
  at a glance as a baseball bat.
