type: weapon
name: iron-sword
description: |
  A simple iron sword in side-profile, blade angled up-and-right at
  roughly 45 degrees. Straight double-edged blade with a small crossguard
  and a short wrapped grip. Cool grey steel blade with a thin highlight
  along one edge; dark brown wrap on the hilt; small gold pommel. No
  glow, no enchantment, no engraving, no scabbard. Silhouette must read
  as a sword at a glance.
# Iron-sword is intentionally side-profile / diagonal, so we override the
# weapon-default vertical orientation. A 45-degree blade pointing up-and-right
# puts the grip in the bottom-left quadrant rather than bottom-center, so we
# also have to override the default (32, 56) anchor. Everything else (64x64,
# palette, references, 4x4 sheet) is inherited from data/sprite-types/weapon.json.
anchor: { x: 20, y: 48 }
sensors:
  weapon:
    orientation: diagonal
    diagonalToleranceDeg: 3
# Iron-sword is the canonical sword — we want all 16 cells to depict the
# same straight, unembellished blade, so we opt out of LLM variation
# expansion entirely. `minVariations: 0` keeps the (empty) seed list
# intact regardless of whether a chat deployment is configured.
minVariations: 0
