type: weapon
name: butcher-hook
description: |
  A single one-handed butcher hook axe weapon centered in frame on a transparent
  background. The silhouette reads immediately at gameplay scale: broad chopped
  axe head with a forward-curving meat hook beak, short reinforced spine, and a
  wrapped grip with a small pommel at the bottom. Keep orientation vertical with
  the grip at the bottom and the blade/hook at the top. Floor 2 tone: rough
  salvaged iron, scarred steel edge, dried grime, and greasy wear on the handle.
  Use bold color separation, one-pixel dark outline, and chunky readable shading
  with no anti-aliasing. No extra props, no hands, no glow, no blood spray, no
  text, no decorative background.
judge:
  enabled: true
variations:
  - meat-hook beak dominates the top silhouette with a smaller rear spike
  - broader axe blade profile with a shorter, heavier hook nose
  - elongated hook curves nearly 180° with a minimal flat axe poll
  - twin-hook silhouette with a forward beak and a mirrored rear counter-hook
  - heavy cleaver blade with a compact underslung hook near the base of the head
  - triangular axe head with a sharp downward hook tip replacing the traditional toe
  - narrow spine and exaggerated hook beak with a long deeply wrapped grip
  - balanced hook-to-axe proportions with a square poll and medium-length handle
minVariations: 8
