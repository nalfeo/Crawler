type: weapon
name: sawblade-launcher
floor: 2
description: |
  A hand-held mechanical launcher designed to fire spinning sawblades, held
  vertically — grip and trigger assembly at the bottom, thick squat launch
  barrel pointing straight up. The barrel is a wide iron cylinder with a
  circular muzzle opening just wide enough to accept a sawblade; a large
  serrated disc sawblade is visibly slotted or partially loaded at the muzzle,
  teeth fanning outward around the rim. A boxy side-mounted disc magazine
  attaches at the mid-frame, housing stacked blades; bolt-and-rivet fasteners
  hold it in place. The grip is a short squared handle with a chunky trigger
  guard. Worn cast-iron frame: dark gunmetal, rust patches on the barrel seams,
  scratched paint exposing darker steel, and a few exposed hex-head bolts along
  the housing. Interior shading in 3–4 stops: deep shadow inside the muzzle
  cavity, mid grey for the main frame body, and a single bright-edge highlight
  along one side. The sawblade itself is dark steel with visible serrated teeth
  and a small central hub. Silhouette must read unambiguously as a disc-launcher
  with a circular blade, not a pistol or a can. No glow, no sparks, no blood,
  no background.
# Vertical orientation (grip at bottom, barrel/muzzle pointing up) and all
# other defaults (64x64, kenney-roguelike palette, anchor at 32,56, 4x4 sheet,
# VLM judge enabled) are inherited from data/sprite-types/weapon.json.
variations:
  - iron cage guards the muzzle sawblade; two curved bars bracket the loaded disc on both sides
  - side viewing window on the magazine reveals the stacked disc silhouettes inside
  - bolt-action charging handle extends from the side of the receiver above the magazine
  - worn leather wrist strap hangs from the base of the grip below the trigger guard
  - extra rows of hex-bolts run the full length of the barrel seam on both sides
  - flip-up iron sight mounted on top of the barrel near the muzzle
  - rust streaks spread heavily from the barrel-magazine joint across the mid-frame
  - short blade-guide rail protrudes from the face of the magazine with a loading track
minVariations: 6
