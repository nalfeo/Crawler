type: weapon
name: chain-flail
description: |
  A heavy one-handed flail held vertically, haft at the bottom, spiked ball
  at the top. The short dark-wood or wrapped-iron haft fills the lower third
  of the canvas, ending in a small iron pommel. Two to three large oval iron
  chain links connect the haft tip to the ball — the links must read clearly
  as chain, not rope or cord. The ball is a solid dark-iron sphere studded
  with four to six blunt conical spikes radiating outward; spikes should be
  thick and readable at native size. Floor 2 palette: cool near-black iron
  for the ball and chain, dark muted brown for the haft, dull pewter
  highlight along one edge of each chain link and one side of the ball.
  Single thin reflected-light highlight on the topmost spike. No glow, no
  flames, no blood, no enchantment, no wrapped chain coil. The silhouette
  must read as "spiked ball on a chain on a stick" at a glance and must not
  be mistaken for a morning star (rigid pole) — the chain gap between haft
  and ball is the key differentiator.
# Vertical orientation, 4×4 sheet, kenney-roguelike palette, anchor (32,56),
# and VLM judge — all inherited from data/sprite-types/weapon.json.
# Chain flail hangs vertically (haft bottom → chain → ball top), so the
# default vertical sensor is correct; no orientation override needed.
variations:
  - ball replaced by a barbed pear-shaped iron weight instead of a round sphere
  - double-link chain (two side-by-side chains) connecting haft to ball
minVariations: 6
