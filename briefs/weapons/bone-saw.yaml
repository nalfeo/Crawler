type: weapon
name: bone-saw
description: |
  A one-handed bone saw held perfectly vertical, blade at the top and grip at the
  bottom. The silhouette should read immediately as a jagged surgical saw rather
  than a sword: a narrow rusted steel blade with large, brutal saw teeth on both
  edges, mounted to a bleached vertebrae-like bone handle wrapped at the grip.
  Bone-white handle, rust-red and iron-grey blade, dark near-black outline, and a
  few crisp metal highlights. Keep it centered, single-subject, readable at 16px,
  with no gore, no glow, no blood, no extra props, and no decorative background.
