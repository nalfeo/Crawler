type: weapon
name: boarding-axe
description: |
  A boarding axe held vertically, head at the top, haft pointing straight
  down. The head has a wide, crescent-curved blade — broad at the cutting
  edge and tapering back toward the eye/socket. The back spine of the head
  is a short blunt poll. Short-to-medium wooden haft, not a polearm —
  roughly the length of a hand axe to a hatchet. The cutting edge faces
  left, blade curving outward so the silhouette clearly reads "axe" at
  native size. Iron or steel head with 3–5 tonal stops: mid-grey base,
  cool blue-grey highlight along the cutting edge bevel, darker shadow at
  the socket joint, rust-brown pitting or salt weathering on the flat.
  Dark brown wooden haft; optional rope or leather wrap at the collar just
  below the head. Simple pommel cap or butt-spike at the grip end. No
  glow, no enchantment, no blood, no decorative runes.
  The silhouette must read as "axe" — not a sword, not a hammer — at a
  glance when the whole sprite is rendered as a solid silhouette.
# Vertical orientation, 4×4 sheet, palette, anchor, judge — all inherited
# from data/sprite-types/weapon.json. This brief only captures what makes a
# boarding axe specifically a boarding axe.
#
# Variations seed: strong cues we want guaranteed in the sheet. minVariations:8
# tells the runner to top these up to 8 total via Azure chat completions.
variations:
  - double-bit blade (matching blade on both sides of the eye)
  - rope-wrapped haft with a lanyard loop at the butt
  - barnacle-encrusted blade edge with heavy salt pitting
minVariations: 8
