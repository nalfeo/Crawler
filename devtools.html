<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawler DevTools</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #111827;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
          'Courier New', monospace;
      }
      #devtools-root {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .panel {
        width: min(720px, 100%);
        background: #0f172a;
        border: 1px solid rgba(229, 231, 235, 0.2);
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main id="devtools-root"></main>
    <script type="module" src="/src/devtools-main.ts"></script>
  </body>
</html>
