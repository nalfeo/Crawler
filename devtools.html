<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawler DevTools</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #111827;
        color: #e5e7eb;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
          monospace;
        height: 100svh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #app-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px 8px;
        background: rgba(8, 12, 24, 0.82);
        border-bottom: 1px solid rgba(148, 163, 184, 0.24);
      }
      #app-header-title {
        font-size: 12px;
        color: #cbd5e1;
        letter-spacing: 0.04em;
      }
      #app-switcher {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .app-switch-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: #cbd5e1;
        text-decoration: none;
        font-size: 12px;
        line-height: 1;
      }
      .app-switch-link--active {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(126, 224, 255, 0.5);
        color: #7ee0ff;
      }
      .hide-debug-header #app-header {
        display: none;
      }
      #devtools-root {
        flex: 1;
        min-height: 0;
        display: block;
        padding: 24px;
        overflow: auto;
      }
      .panel {
        width: min(1400px, 100%);
        background: #0f172a;
        border: 1px solid rgba(229, 231, 235, 0.2);
        border-radius: 12px;
        padding: 20px;
      }
      .devtools-shell {
        margin: 0 auto;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        line-height: 1.5;
      }
      .asset-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .asset-table th,
      .asset-table td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(229, 231, 235, 0.1);
        vertical-align: top;
      }
      .asset-table thead th {
        position: sticky;
        top: 0;
        background: #111827;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <header id="app-header">
      <div id="app-header-title">Crawler Workspace</div>
      <nav id="app-switcher" aria-label="Workspace switcher">
        <a class="app-switch-link" href="lab.html">Labs</a>
        <a class="app-switch-link app-switch-link--active" href="devtools.html">DevTools</a>
        <a class="app-switch-link" href="index.html">Game</a>
      </nav>
    </header>
    <main id="devtools-root"></main>
    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        const isLocalHost = host === 'localhost' || host === '127.0.0.1' || host === '::1';
        const isBetaHost = host.includes('beta');
        if (!isLocalHost && !isBetaHost) {
          document.documentElement.classList.add('hide-debug-header');
        }
      })();
    </script>
    <script type="module" src="/src/devtools-main.ts"></script>
  </body>
</html>
