apiVersion: goobers.dev/v1alpha1
kind: Goober
metadata:
  name: producer
spec:
  gaggle: crawler
  role: producer
  displayName: Crawler Producer
  instructions: instructions.md
  harness: codex
  model: auto
  harnessOptions:
    auth: ambient-chatgpt
    allowFileBackedCredentials: true
  capabilities:
    - agent:model
    - repo:read
  skills:
    - producer
  tools: []
  scaleFactor: 1
  workflows:
    - crawler-feature-pr
