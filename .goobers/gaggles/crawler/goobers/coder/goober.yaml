apiVersion: goobers.dev/v1alpha1
kind: Goober
metadata:
  name: coder
spec:
  gaggle: crawler
  role: implementer
  displayName: Crawler Implementer
  instructions: instructions.md
  harness: codex
  model: auto
  harnessOptions:
    auth: ambient-chatgpt
    allowFileBackedCredentials: true
  capabilities:
    - repo:push
    - agent:model
  skills:
    - implement
    - run-tests
  tools: []
  scaleFactor: 1
  workflows:
    - crawler-feature-pr
    - crawler-pr-remediation
