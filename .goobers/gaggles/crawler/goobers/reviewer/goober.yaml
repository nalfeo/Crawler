apiVersion: goobers.dev/v1alpha1
kind: Goober
metadata:
  name: reviewer
spec:
  gaggle: crawler
  role: reviewer
  displayName: Crawler Reviewer
  instructions: instructions.md
  harness: copilot
  model: gpt-5.6-luna
  harnessOptions: {}
  capabilities:
    - agent:model
  skills:
    - reviewer
  tools:
    - shell
  scaleFactor: 1
  workflows:
    - crawler-feature-pr
