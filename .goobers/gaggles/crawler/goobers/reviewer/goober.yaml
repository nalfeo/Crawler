apiVersion: goobers.dev/v1alpha1
kind: Goober
metadata:
  name: reviewer
spec:
  gaggle: crawler
  role: reviewer
  displayName: Crawler Reviewer
  instructions: instructions.md
  harness: codex
  model: auto
  harnessOptions:
    auth: ambient-chatgpt
    allowFileBackedCredentials: true
    # Trusted local Goobers uses WSL; remediation checks may run repository validation tools.
    sandbox: danger-full-access
  capabilities:
    - agent:model
  skills:
    - reviewer
  tools: []
  scaleFactor: 1
  workflows:
    - crawler-feature-pr
    - crawler-pr-remediation
