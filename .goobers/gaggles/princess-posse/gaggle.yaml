apiVersion: goobers.dev/v1alpha1
kind: Gaggle
metadata:
  name: princess-posse
spec:
  displayName: Princess Posse
  project:
    provider: github
    owner: nalfeo
    name: Crawler
    branch: main
    connectionRef: repo-token
  backlog:
    provider: github
    project: nalfeo/Crawler
    labels:
      - goobers:approved
    connectionRef: repo-token
  isolation:
    namespace: gaggle-princess-posse
  branchNamespace: 'goobers/princess-posse/'
  ciCommand: ['npm', 'run', 'verify:fast']
