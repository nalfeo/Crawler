<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawler Labs</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: monospace;
      }
      #lab-container {
        width: 100vw;
        height: 100svh;
        display: flex;
        position: relative;
        overflow: hidden;
      }
      #lab-stage {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        overflow: auto;
        background: #1a1a2e;
      }
      #lab-canvas {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #lab-toolbar {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #viewport-toggle[hidden] {
        display: none;
      }
      #devtools-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(126, 224, 255, 0.3);
        background: rgba(8, 12, 24, 0.82);
        color: #7ee0ff;
        text-decoration: none;
        font-size: 12px;
        line-height: 1;
        touch-action: manipulation;
      }

      #lab-controls {
        width: 300px;
        flex-shrink: 0;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        transition:
          width 0.25s ease,
          padding 0.25s ease;
      }
      #lab-controls.collapsed {
        width: 0;
        padding: 0;
        overflow: hidden;
      }

      #controls-toggle {
        position: absolute;
        right: 300px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        background: #16213e;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-right: none;
        color: #e0e0e0;
        cursor: pointer;
        width: 24px;
        min-height: 64px;
        border-radius: 6px 0 0 6px;
        font-size: 16px;
        line-height: 1;
        transition: right 0.25s ease;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #controls-toggle.collapsed {
        right: 0;
      }

      body.lab-shell--iphone-landscape #lab-stage {
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(126, 224, 255, 0.12), transparent 35%),
          linear-gradient(180deg, #141423 0%, #090912 100%);
      }
      body.lab-shell--iphone-landscape #lab-canvas {
        flex: none;
        width: min(844px, 100%);
        height: min(390px, 100%);
        max-width: 844px;
        max-height: 390px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow:
          0 24px 64px rgba(0, 0, 0, 0.45),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        overflow: hidden;
        background: #05050a;
      }
      body.lab-shell--iphone-landscape #lab-canvas > * {
        width: 100%;
        height: 100%;
      }

      @media (pointer: coarse), (max-width: 900px) {
        #viewport-toggle {
          display: none;
        }
      }

      /* On narrow screens in portrait, stack canvas above controls */
      @media (max-width: 600px) and (orientation: portrait) {
        #lab-container {
          flex-direction: column;
        }
        #lab-stage {
          flex: 1;
        }
        #lab-controls {
          width: 100%;
          max-height: 40vh;
          transition:
            max-height 0.25s ease,
            padding 0.25s ease;
        }
        #lab-controls.collapsed {
          width: 100%;
          max-height: 0;
          padding: 0;
        }
        #controls-toggle {
          right: unset;
          left: 50%;
          top: unset;
          bottom: 40vh;
          transform: translateX(-50%);
          width: 64px;
          min-height: 24px;
          border-radius: 6px 6px 0 0;
          border-right: 1px solid rgba(255, 255, 255, 0.2);
          border-bottom: none;
          transition: bottom 0.25s ease;
        }
        #controls-toggle.collapsed {
          right: unset;
          bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="lab-container">
      <div id="lab-stage">
        <div id="lab-toolbar">
          <a id="devtools-link" href="/devtools.html">Open DevTools</a>
        </div>
        <div id="lab-canvas"></div>
      </div>
      <!-- viewport-toggle is kept here (hidden) so lab-shell.ts can find it on init;
           lab-runner.ts moves it into the sidebar "Global Controls" section. -->
      <button id="viewport-toggle" hidden aria-label="Switch viewport"></button>
      <button id="controls-toggle" aria-label="Collapse config panel" aria-expanded="true">
        ›
      </button>
      <div id="lab-controls"></div>
    </div>
    <script type="module" src="/src/lab-main.ts"></script>
  </body>
</html>
