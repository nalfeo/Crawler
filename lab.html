<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    />
    <title>Crawler Labs</title>
    <style>
      /* See index.html — the engine reads these (src/engine/safe-area.ts), and
         labs must resolve them identically so lab-driven e2e geometry matches
         the shipped game. */
      :root {
        --crawler-safe-area-inset-top: env(safe-area-inset-top, 0px);
        --crawler-safe-area-inset-right: env(safe-area-inset-right, 0px);
        --crawler-safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --crawler-safe-area-inset-left: env(safe-area-inset-left, 0px);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: monospace;
        height: 100svh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #app-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px 8px;
        background: rgba(8, 12, 24, 0.82);
        border-bottom: 1px solid rgba(148, 163, 184, 0.24);
      }
      #app-header-title {
        font-size: 12px;
        color: #cbd5e1;
        letter-spacing: 0.04em;
      }
      #app-switcher {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .app-switch-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: #cbd5e1;
        text-decoration: none;
        font-size: 12px;
        line-height: 1;
        background: transparent;
        touch-action: manipulation;
      }
      .app-switch-link--active {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(126, 224, 255, 0.5);
        color: #7ee0ff;
      }
      .hide-debug-header #app-header {
        display: none;
      }
      #lab-container {
        width: 100%;
        height: auto;
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
        overflow: hidden;
      }
      #lab-stage {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        overflow: auto;
        background: #1a1a2e;
      }
      #lab-canvas {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #lab-controls {
        width: 300px;
        flex-shrink: 0;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        transition:
          width 0.25s ease,
          padding 0.25s ease;
      }
      #lab-controls.collapsed {
        width: 0;
        padding: 0;
        overflow: hidden;
      }

      #controls-toggle {
        position: absolute;
        right: 300px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        background: #16213e;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-right: none;
        color: #e0e0e0;
        cursor: pointer;
        width: 24px;
        min-height: 64px;
        border-radius: 6px 0 0 6px;
        font-size: 16px;
        line-height: 1;
        transition: right 0.25s ease;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #controls-toggle.collapsed {
        right: 0;
      }

      /* On narrow screens in portrait, stack canvas above controls */
      @media (max-width: 600px) and (orientation: portrait) {
        #lab-container {
          flex-direction: column;
        }
        #lab-stage {
          flex: 1;
        }
        #lab-controls {
          width: 100%;
          max-height: 40vh;
          transition:
            max-height 0.25s ease,
            padding 0.25s ease;
        }
        #lab-controls.collapsed {
          width: 100%;
          max-height: 0;
          padding: 0;
        }
        #controls-toggle {
          right: unset;
          left: 50%;
          top: unset;
          bottom: 40vh;
          transform: translateX(-50%);
          width: 64px;
          min-height: 24px;
          border-radius: 6px 6px 0 0;
          border-right: 1px solid rgba(255, 255, 255, 0.2);
          border-bottom: none;
          transition: bottom 0.25s ease;
        }
        #controls-toggle.collapsed {
          right: unset;
          bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <header id="app-header">
      <div id="app-header-title">Crawler Workspace</div>
      <nav id="app-switcher" aria-label="Workspace switcher">
        <a class="app-switch-link app-switch-link--active" href="/lab.html">Labs</a>
        <a class="app-switch-link" href="/devtools.html">DevTools</a>
        <a class="app-switch-link" href="/">Game</a>
      </nav>
    </header>
    <div id="lab-container">
      <div id="lab-stage">
        <div id="lab-canvas"></div>
      </div>
      <button id="controls-toggle" aria-label="Collapse config panel" aria-expanded="true">
        ›
      </button>
      <div id="lab-controls"></div>
    </div>
    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        const isLocalHost = host === 'localhost' || host === '127.0.0.1' || host === '::1';
        const isBetaHost = host.includes('beta');
        if (!isLocalHost && !isBetaHost) {
          document.documentElement.classList.add('hide-debug-header');
        }
      })();
    </script>
    <script type="module" src="/src/lab-main.ts"></script>
  </body>
</html>
