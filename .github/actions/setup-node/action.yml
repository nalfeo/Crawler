name: 'Setup Node with verified dependencies'
description: 'Install Node and run npm ci for every job.'

inputs:
  node-version:
    description: 'Node.js version to install'
    default: '22'
  install-playwright:
    description: >
      Whether to install Playwright system dependencies and the Chromium browser.
      Only the e2e job needs this; all other jobs skip it to reduce runner cost.
    default: 'false'
  install-dependencies:
    description: 'Whether to run npm ci after setting up Node.'
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      # Never download browsers from the root postinstall. The postinstall
      # delegates to scripts/agent/install-playwright-browser.mjs, which honours
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD (the `playwright install` CLI itself
      # does not), so no job pulls ~290 MB of Chromium/FFmpeg it never uses and
      # the e2e job does not download it once before the browser cache is even
      # restored. Playwright jobs install the browser in the cache-aware steps
      # below.
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: npm ci
      shell: bash

    - uses: actions/cache@v4
      id: pw-cache
      if: ${{ inputs.install-playwright == 'true' }}
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    # Best-effort, NOT a gate. `install-deps` is an apt operation against the
    # Ubuntu mirrors, and a transient mirror outage (e.g. azure.archive.ubuntu.com
    # refusing connections) makes apt retry until it times out. Treating that as
    # a hard failure took all of main CI down — and with it every deploy, since
    # the deploy release gate requires a successful CI conclusion — even though
    # the runner image already ships Chromium's system libraries and the browser
    # was perfectly launchable. The authoritative check is the launch smoke test
    # below: it verifies the requirement we actually have (Chromium starts)
    # rather than the proxy (apt succeeded).
    - name: Install Playwright system dependencies (best-effort)
      if: ${{ inputs.install-playwright == 'true' }}
      run: |
        set +e
        timeout --kill-after=30s 5m npx playwright install-deps chromium
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          echo "::warning::playwright install-deps exited ${status}; continuing. \
        The Chromium launch smoke test below is authoritative."
        fi
      shell: bash

    - name: Install Playwright browser
      if: ${{ inputs.install-playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true' }}
      run: npx playwright install chromium
      shell: bash

    # Authoritative gate: if Chromium cannot launch, fail loudly here. This is
    # what every Playwright-dependent job actually requires, and unlike the apt
    # step it does not depend on Ubuntu mirror availability.
    - name: Verify Chromium launches
      if: ${{ inputs.install-playwright == 'true' }}
      run: node scripts/agent/verify-chromium-launch.mjs
      shell: bash
