name: 'Setup Node with verified dependencies'
description: 'Install Node and run npm ci for every job.'

inputs:
  node-version:
    description: 'Node.js version to install'
    default: '22'
  install-playwright:
    description: >
      Whether to install Playwright system dependencies and the Chromium browser.
      Only the e2e job needs this; all other jobs skip it to reduce runner cost.
    default: 'false'
  install-dependencies:
    description: 'Whether to run npm ci after setting up Node.'
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      # Never download browsers from the root postinstall. The postinstall
      # delegates to scripts/agent/install-playwright-browser.mjs, which honours
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD (the `playwright install` CLI itself
      # does not), so no job pulls ~290 MB of Chromium/FFmpeg it never uses and
      # the e2e job does not download it once before the browser cache is even
      # restored. Playwright jobs install the browser in the cache-aware steps
      # below.
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: npm ci
      shell: bash

    - uses: actions/cache@v4
      id: pw-cache
      if: ${{ inputs.install-playwright == 'true' }}
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright system dependencies
      if: ${{ inputs.install-playwright == 'true' }}
      run: |
        set +e
        timeout --kill-after=30s 10m npx playwright install-deps chromium
        status=$?
        set -e
        if [ "$status" -eq 124 ]; then
          echo "Playwright system dependency installation exceeded 10 minutes."
        fi
        exit "$status"
      shell: bash

    - name: Install Playwright browser
      if: ${{ inputs.install-playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true' }}
      run: npx playwright install chromium
      shell: bash
