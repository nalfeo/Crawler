name: Asset request
description: Request a new sprite through the automated asset pipeline.
title: 'Asset request: <name>'
labels: ['asset-request']
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Lowercase kebab-case sprite id (for example `bone-dagger`).
      placeholder: bone-dagger
    validations:
      required: true
  - type: textarea
    id: brief
    attributes:
      label: Brief
      description: One sentence describing the requested sprite.
      placeholder: A chipped bone dagger with twine-wrapped handle and faint green runes.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type (optional)
      description: Sprite category. Leave blank to auto-detect from the name.
      options:
        - ''
        - weapon
        - enemy
        - item
        - tile
        - vfx
        - character
    validations:
      required: false
