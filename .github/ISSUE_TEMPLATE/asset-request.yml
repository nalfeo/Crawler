name: Asset request
description: Request a new sprite through the automated asset pipeline.
title: 'Asset request: <name>'
labels: ['asset-request']
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Lowercase kebab-case sprite id (for example `bone-dagger`).
      placeholder: bone-dagger
    validations:
      required: true
  - type: textarea
    id: brief
    attributes:
      label: Brief
      description: A short brief — one or more sentences — describing the requested sprite.
      placeholder: A chipped bone dagger with twine-wrapped handle and faint green runes. Reads clearly at gameplay scale and stays distinct from nearby loot.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type (optional)
      description: Sprite category. Leave blank to auto-detect from the name.
      options:
        - ''
        - weapon
        - enemy
        - item
        - tile
        - vfx
        - character
    validations:
      required: false
  - type: input
    id: floor
    attributes:
      label: Floor (optional)
      description: Dungeon floor intensity from 1 through 20. Defaults to 1.
      placeholder: '1'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority (optional)
      description: Queue priority. Defaults to normal; high does not imply an SLA.
      options:
        - ''
        - normal
        - high
    validations:
      required: false
  - type: input
    id: requester
    attributes:
      label: Requester (optional)
      description: Requester identity for service or delegated requests. GitHub author identity remains authoritative when available.
      placeholder: agent/session-or-github-login
    validations:
      required: false
  - type: dropdown
    id: floor-id
    attributes:
      label: Floor ID (optional)
      description: Selectable floors are derived from the registered game floor manifests. This freezes the manifest source in the request.
      options:
        - ''
        - floor1
        - floor2
        - floor3
    validations:
      required: false
  - type: input
    id: family-id
    attributes:
      label: Family ID (optional)
      description: Floor-bound enemy family id (for example `goblins`). Must exist in the selected floor's enemy pack.
    validations:
      required: false
  - type: dropdown
    id: mob-role
    attributes:
      label: Mob Role (optional)
      description: Family role derived from the selected enemy pack.
      options:
        - ''
        - normal
        - elite
        - boss
    validations:
      required: false
  - type: textarea
    id: floor-injection-override
    attributes:
      label: Floor Injection Override (optional)
      description: Viewable request-local replacement for the canonical floor design language. Does not modify game data.
    validations:
      required: false
  - type: textarea
    id: family-injection-override
    attributes:
      label: Family Injection Override (optional)
      description: Viewable request-local replacement for the canonical family design language. Does not modify game data.
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: Size (optional)
      description: 'Output footprint. When omitted, defaults to large if Type is omitted/enemy and Name ends in -boss, or if Type is enemy and Brief mentions boss, godfather, or godmother. Otherwise defaults to default.'
      options:
        - ''
        - default
        - large
        - wide
        - tall
    validations:
      required: false
