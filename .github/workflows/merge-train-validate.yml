name: Merge Train Validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable candidate commit to validate
        required: true
        type: string
      fingerprint:
        description: Queue generation fingerprint
        required: true
        type: string
      pr_numbers:
        description: Ordered comma-separated PR numbers
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Fast integration verification
        run: npm run verify:fast
      - name: Combined-candidate security verification
        run: npm run security:check

  publish:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: read
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Publish immutable candidate result
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINGERPRINT: ${{ inputs.fingerprint }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // `needs.verify.result` is one of: success, failure, cancelled, skipped
            // (a timed-out job also surfaces here as `cancelled`, per GitHub Actions).
            // Only an executed `failure` reflects a real candidate defect. Everything
            // else -- the job being cancelled, skipped (e.g. a superseding push
            // cancelled this run's concurrency group), or timing out -- is an
            // infrastructure/scheduling outcome, not proof the candidate's code is
            // broken. Publish those as `cancelled` (mirroring the dispatch-failure
            // path in reconcile.mjs) so trainCheckState() treats them as retryable
            // ("missing") instead of bisecting the train as if the code failed CI.
            const verifyResult = process.env.VERIFY_RESULT;
            const conclusion = verifyResult === 'success' ? 'success'
              : verifyResult === 'failure' ? 'failure'
              : 'cancelled';
            const title = conclusion === 'success'
              ? 'Merge-train candidate passed'
              : conclusion === 'failure'
                ? 'Merge-train candidate failed'
                : `Merge-train candidate validation was not completed (verify result: ${verifyResult})`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'merge-train-candidate',
              head_sha: process.env.CANDIDATE_SHA,
              status: 'completed',
              conclusion,
              external_id: process.env.FINGERPRINT,
              output: {
                title,
                summary: `PR order: ${process.env.PR_NUMBERS}\nFingerprint: ${process.env.FINGERPRINT}`,
              },
            });

      - name: Dispatch Merge Train
        # `merge-train.yml`'s `workflow_run` trigger on this workflow has never
        # fired in production (zero observed runs after real successful
        # validations), and its `*/5` schedule arrives ~hourly in practice, so
        # neither is a reliable post-validation completion signal on its own.
        # Explicitly dispatch the trusted reconcile workflow here instead, so
        # `reconcile` promptly consumes/retries/bisects off the just-published
        # `merge-train-candidate` check for every publish outcome
        # (success/failure/cancelled) -- `if: always()` so this fires even when
        # the publish step above failed or `verify` did not succeed.
        #
        # IMPORTANT: use the built-in `GITHUB_TOKEN`, not the repository App
        # token from the step above. `.github/scripts/merge-train/reconcile-lib.mjs`
        # (`buildDispatchBindings`) documents that the App token returns 403 on
        # Actions `workflow_dispatch` endpoints in this repository; both
        # existing dispatch call sites (`ci-recovery.yml`, this workflow's own
        # trigger from `reconcile.mjs`) already had to move off the App token
        # for the same reason (PR #1144). `workflow_run`/`schedule` remain in
        # `merge-train.yml` as defense-in-depth; this step is the primary,
        # reliable trigger.
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'merge-train.yml',
              ref: context.payload.repository.default_branch,
            });
