name: Merge Train Validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable candidate commit to validate
        required: true
        type: string
      fingerprint:
        description: Queue generation fingerprint
        required: true
        type: string
      pr_numbers:
        description: Ordered comma-separated PR numbers
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Fast integration verification
        run: npm run verify:fast
      - name: Combined-candidate security verification
        run: npm run security:check

  publish:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      actions: write
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Publish immutable candidate result
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINGERPRINT: ${{ inputs.fingerprint }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // `needs.verify.result` is one of: success, failure, cancelled, skipped
            // (a timed-out job also surfaces here as `cancelled`, per GitHub Actions).
            // Only an executed `failure` reflects a real candidate defect. Everything
            // else -- the job being cancelled, skipped (e.g. a superseding push
            // cancelled this run's concurrency group), or timing out -- is an
            // infrastructure/scheduling outcome, not proof the candidate's code is
            // broken. Publish those as `cancelled` (mirroring the dispatch-failure
            // path in reconcile.mjs) so trainCheckState() treats them as retryable
            // ("missing") instead of bisecting the train as if the code failed CI.
            const verifyResult = process.env.VERIFY_RESULT;
            const conclusion = verifyResult === 'success' ? 'success'
              : verifyResult === 'failure' ? 'failure'
              : 'cancelled';
            const title = conclusion === 'success'
              ? 'Merge-train candidate passed'
              : conclusion === 'failure'
                ? 'Merge-train candidate failed'
                : `Merge-train candidate validation was not completed (verify result: ${verifyResult})`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'merge-train-candidate',
              head_sha: process.env.CANDIDATE_SHA,
              status: 'completed',
              conclusion,
              external_id: process.env.FINGERPRINT,
              output: {
                title,
                summary: `PR order: ${process.env.PR_NUMBERS}\nFingerprint: ${process.env.FINGERPRINT}`,
              },
            });

      # If "Publish immutable candidate result" itself failed (e.g. a transient
      # checks.create API error after the app token was successfully minted),
      # the fingerprinted check is still whatever `dispatchValidation()`
      # (reconcile.mjs) originally posted: `in_progress`. trainCheckState()
      # (state.mjs) only demotes a stuck in_progress check to retryable
      # ("missing") after CANDIDATE_VALIDATION_STALE_MS (40 minutes) --
      # otherwise it reports `pending`, which planPrefixPromotion() (state.mjs)
      # maps to the `wait` action. So without this step, the "Wake merge-train
      # reconciliation" dispatch below would immediately wake reconcile.mjs
      # only to have it see `pending` and do nothing -- the wake would be
      # ineffective for exactly the failure case it exists to cover. Post a
      # `cancelled` conclusion here -- mirroring reconcile.mjs's own
      # dispatchValidation catch block -- so trainCheckState() sees "missing"
      # immediately and the woken reconciliation redispatches validation right
      # away.
      #
      # Mint a SEPARATE recovery token instead of reusing
      # `steps.app-token.outputs.token`: if "Generate repository app token"
      # itself is what failed (e.g. a transient GitHub Apps auth error), that
      # output is empty, and `checks.create` requires a token from the
      # trusted App identity -- trainCheckState() filters check runs by
      # `app.id`, so a `GITHUB_TOKEN`-authored check would never be seen. This
      # covers the app-token-mint-failure case too (not just post-mint publish
      # failures): `if: failure()` still runs this step even though the
      # original mint step is what failed, so a fresh mint attempt gets a real
      # chance to succeed. Because of this independent recovery mint, the
      # retryable-check step below does NOT need to be gated on
      # `steps.app-token.outcome == 'success'` -- it has its own token
      # regardless of whether the original mint succeeded.
      - name: Generate recovery app token
        id: recovery-app-token
        if: failure()
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Mark candidate check retryable if publishing failed
        if: failure()
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        with:
          github-token: ${{ steps.recovery-app-token.outputs.token }}
          script: |
            let lastError;
            for (const delayMs of [0, 1000, 2000]) {
              if (delayMs > 0) {
                await new Promise((resolve) => setTimeout(resolve, delayMs));
              }
              try {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'merge-train-candidate',
                  head_sha: process.env.CANDIDATE_SHA,
                  status: 'completed',
                  conclusion: 'cancelled',
                  external_id: process.env.FINGERPRINT,
                  output: {
                    title: 'Merge-train candidate validation was not completed (publish step failed)',
                    summary:
                      'The "Publish immutable candidate result" step failed before it could post a terminal check. Marked cancelled so the next reconciliation retries validation immediately instead of waiting for the stale in_progress check to expire.',
                  },
                });
                return;
              } catch (error) {
                lastError = error;
              }
            }
            throw lastError;

      # `workflow_run` delivery is best-effort; wake reconciliation after the
      # immutable result is durable. Must use GITHUB_TOKEN, not the App token:
      # the App token receives 403 on workflow_dispatch endpoints
      # (reconcile-lib.mjs buildDispatchBindings uses GITHUB_TOKEN for the same reason).
      #
      # `if: always()` so this fires even when the "Publish immutable candidate
      # result" step (and the retryable-check fallback above) failed --
      # without it, this step's implicit default condition (success()) skips it
      # whenever a previous step fails, leaving reconcile un-woken with no
      # published check to act on until the unreliable workflow_run/schedule
      # fallback triggers eventually fire.
      - name: Wake merge-train reconciliation
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'merge-train.yml',
              ref: context.payload.repository.default_branch,
            });
