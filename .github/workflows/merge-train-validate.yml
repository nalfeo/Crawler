name: Merge Train Validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable candidate commit to validate
        required: true
        type: string
      fingerprint:
        description: Queue generation fingerprint
        required: true
        type: string
      pr_numbers:
        description: Ordered comma-separated PR numbers
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Fast integration verification
        run: npm run verify:fast
      - name: Combined-candidate security verification
        run: npm run security:check

  publish:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Publish immutable candidate result
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINGERPRINT: ${{ inputs.fingerprint }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          PASSED: ${{ needs.verify.result == 'success' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const passed = process.env.PASSED === 'true';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'merge-train-candidate',
              head_sha: process.env.CANDIDATE_SHA,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              external_id: process.env.FINGERPRINT,
              output: {
                title: passed ? 'Merge-train candidate passed' : 'Merge-train candidate failed',
                summary: `PR order: ${process.env.PR_NUMBERS}\nFingerprint: ${process.env.FINGERPRINT}`,
              },
            });
