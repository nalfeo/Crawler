# One-shot workflow: create the 70 Floor-2 equipment asset-request issues for G2-B.
# Triggered on push to the g2-b session branch. Has a deduplication guard:
# if any g2b-tagged asset-request issues already exist, the create step is skipped.
# Delete this file once all issues are created and the pipeline is drained.

name: G2-B Seed Asset-Request Issues

on:
  push:
    branches:
      - 'copilot/g2-b-produce-floor-2-equipment-sprite-waves'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  seed:
    name: Create 70 Floor-2 equipment asset-request issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for existing g2b issues
        id: check
        env:
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list \
            --repo nalfeo/Crawler \
            --label asset-request \
            --state open \
            --limit 100 \
            --json number \
            --jq 'length')
          echo "existing_count=$count" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${count:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Skipping: $count asset-request issues already exist" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "### Creating 70 asset-request issues for G2-B" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Wave 1 – blade weapons
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          create_issue() {
            local slug="$1" name="$2" type="$3" brief="$4"
            gh issue create \
              --repo nalfeo/Crawler \
              --title "Asset request: ${slug}" \
              --label "asset-request" \
              --body "$(printf '### Name\n%s\n\n### Brief\n%s\n\n### Type (optional)\n%s\n\n### Floor (optional)\n2' "${slug}" "${brief}" "${type}")"
            sleep 1
          }
          create_issue "iron-cleaver" "Iron Cleaver" "weapon" "Iron Cleaver Floor 2 equipment icon for stable runtime key equipment/weapon/iron-cleaver. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
          create_issue "bone-saw" "Bone Saw" "weapon" "Bone Saw Floor 2 equipment icon for stable runtime key equipment/weapon/bone-saw. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
          create_issue "dueling-saber" "Dueling Saber" "weapon" "Dueling Saber Floor 2 equipment icon for stable runtime key equipment/weapon/dueling-saber. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
          create_issue "venom-dirk" "Venom Dirk" "weapon" "Venom Dirk Floor 2 equipment icon for stable runtime key equipment/weapon/venom-dirk. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
