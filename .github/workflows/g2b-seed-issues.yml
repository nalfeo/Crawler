# One-shot workflow: create or label the 70 Floor-2 equipment asset-request issues for G2-B.
# Manual-only on the reviewed default branch because the downstream asset-request
# workflow must be triggered by a real token, not the ephemeral GITHUB_TOKEN.

name: G2-B Seed Asset-Request Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: g2b-seed-issues
  cancel-in-progress: false

jobs:
  seed:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Create/label 70 Floor-2 equipment asset-request issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted workflow script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Seed G2-B asset-request issues from pinned definitions
        env:
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT }}
        run: npx tsx .github/scripts/g2b-seed-issues/run.ts
