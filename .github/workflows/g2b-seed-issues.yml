# One-shot workflow: create the 70 Floor-2 equipment asset-request issues for G2-B.
# Also adds the asset-request label to any existing issues that lack it.
# Triggered on push to the g2-b session branch.
# Delete this file once all issues are created and the pipeline is drained.

name: G2-B Seed Asset-Request Issues

on:
  push:
    branches:
      - 'copilot/g2-b-produce-floor-2-equipment-sprite-waves'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# Cancel older queued/in-progress runs when a new push arrives.
# This prevents stale workflow versions (with dedup bugs) from creating duplicates.
concurrency:
  group: g2b-seed-issues
  cancel-in-progress: true

jobs:
  seed:
    name: Create/label 70 Floor-2 equipment asset-request issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ensure asset-request label on all 70 known issues
        env:
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Add asset-request label to all 70 known G2-B issue numbers.
          # gh issue edit is idempotent: if label already present, no-op.
          ISSUES="1306 1307 1308 1309 1310 1311 1312 1313 1314 1315 1317 1318 1319 1320 1321 1322 1323 1324 1325 1326 1329 1330 1331 1332 1333 1334 1335 1336 1337 1338 1340 1341 1342 1343 1344 1345 1346 1347 1348 1349 1354 1355 1356 1357 1358 1359 1360 1361 1362 1363 1368 1369 1370 1371 1372 1373 1374 1375 1376 1377 1380 1381 1382 1383 1384 1385 1386 1387 1388 1389"
          for num in $ISSUES; do
            echo "Labeling #${num}..."
            gh issue edit "${num}" \
              --repo nalfeo/Crawler \
              --add-label "asset-request" 2>/dev/null || echo "WARN: could not label #${num}"
            sleep 0.5
          done
          echo "Label pass complete."

      - name: Create Wave 1 – blade weapons (skips if already exists)
        env:
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          create_issue_if_missing() {
            local slug="$1" type="$2" brief="$3"
            local title="Asset request: ${slug}"
            existing=$(gh issue list \
              --repo nalfeo/Crawler \
              --state open \
              --limit 200 \
              --search "in:title ${title}" \
              --json title,number \
              --jq ".[] | select(.title == \"${title}\")" 2>/dev/null || true)
            if [ -n "${existing}" ]; then
              num=$(echo "${existing}" | python3 -c "import json,sys; print(json.loads(sys.stdin.read().strip()).get('number',''))" 2>/dev/null || true)
              echo "ENSURE LABEL (exists as #${num}): ${title}"
              [ -n "${num}" ] && gh issue edit "${num}" --repo nalfeo/Crawler --add-label "asset-request" 2>/dev/null || true
              return
            fi
            echo "CREATE: ${title}"
            gh issue create \
              --repo nalfeo/Crawler \
              --title "${title}" \
              --label "asset-request" \
              --body "$(printf '### Name\n%s\n\n### Brief\n%s\n\n### Type (optional)\n%s\n\n### Floor (optional)\n2' "${slug}" "${brief}" "${type}")"
            sleep 2
          }
          create_issue_if_missing "iron-cleaver" "weapon" "Iron Cleaver Floor 2 equipment icon for stable runtime key equipment/weapon/iron-cleaver. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
          create_issue_if_missing "bone-saw" "weapon" "Bone Saw Floor 2 equipment icon for stable runtime key equipment/weapon/bone-saw. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
          create_issue_if_missing "dueling-saber" "weapon" "Dueling Saber Floor 2 equipment icon for stable runtime key equipment/weapon/dueling-saber. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
          create_issue_if_missing "venom-dirk" "weapon" "Venom Dirk Floor 2 equipment icon for stable runtime key equipment/weapon/venom-dirk. Create one centered, silhouette-readable blade weapon on a transparent background; preserve the runtime key exactly."
