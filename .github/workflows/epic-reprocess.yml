name: Epic Reprocess

on:
  workflow_run:
    workflows: ['Epic Create']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: epic-reprocess
  cancel-in-progress: false

jobs:
  reprocess:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted epic reprocessor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assign managed epic nodes
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
        run: node .github/scripts/epics/epic-reprocess.mjs
