name: Epic Reprocess

on:
  workflow_run:
    workflows: ['Epic Create']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: epic-reprocess
  cancel-in-progress: false

jobs:
  reprocess:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted epic reprocessor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assign managed epic nodes
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          # Epic reprocessing assigns Cloud Copilot to unassigned epic nodes,
          # which are in the Goobers intake cohort. Without this selector the
          # shared eligibility library sees an unset lane owner, concludes
          # legacy still owns intake, and reassigns an issue Goobers is
          # concurrently claiming — a dual writer. Already-assigned stale
          # sessions still restart here in every era.
          LIFECYCLE_MUTATION_OWNER: ${{ vars.LIFECYCLE_MUTATION_OWNER }}
        run: node .github/scripts/epics/epic-reprocess.mjs
