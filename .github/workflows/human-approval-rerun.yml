name: Human Approval CI Rerun

on:
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    if: >-
      github.event.issue.pull_request
      && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Rerun CI after exact owner approval
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.comment.body.trim() !== 'APPROVED FOR CHECK-IN') {
              core.info('Comment is not the exact human-approval phrase');
              return;
            }

            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            for (let attempt = 1; attempt <= 40; attempt += 1) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: pull.data.head.sha,
                event: 'pull_request',
                per_page: 100,
              });
              const latestCi = runs
                .filter(run => run.name === 'CI')
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
              if (!latestCi || latestCi.conclusion === 'success') {
                core.info('No failed CI run needs rerunning');
                return;
              }
              if (latestCi.status === 'completed') {
                await github.rest.actions.reRunWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: latestCi.id,
                });
                core.info(`Rerunning CI workflow ${latestCi.id} for approved PR #${context.issue.number}`);
                return;
              }
              core.info(`CI workflow ${latestCi.id} is ${latestCi.status}; waiting before approval rerun`);
              await new Promise(resolve => setTimeout(resolve, 30_000));
            }
            core.setFailed('Timed out waiting for the current CI run to finish before approval rerun');
