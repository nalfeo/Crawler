name: Human Approval CI Rerun

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.actor == github.repository_owner)
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == github.repository_owner)
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Rerun CI when human-approval state and CI result diverge
        uses: actions/github-script@v7
        with:
          script: |
            const HUMAN_APPROVAL_LABEL = 'human-approval-required';
            const HUMAN_APPROVAL_PHRASE = 'APPROVED FOR CHECK-IN';
            const HUMAN_APPROVAL_PHRASE_VARIANT = 'APPROVED FOR CHECKIN';
            // Broad prefix covers legacy ('copilot/balance-telemetry-driven-improvement-sweep')
            // and current ('copilot/balance-telemetry-improvement-sweep') naming conventions.
            const NIGHTLY_BALANCE_BRANCH_PREFIX = 'copilot/balance-telemetry';

            function hasLabel(labels, wanted) {
              const entries = Array.isArray(labels) ? labels : labels?.nodes || [];
              return entries.some((label) => String(label.name || '') === wanted);
            }

            async function listClosingIssues(pullNumber) {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          labels(first: 50) { nodes { name } }
                        }
                      }
                    }
                  }
                }`;
              const issues = [];
              let cursor = null;
              do {
                const result = await github.graphql(query, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pullNumber,
                  cursor,
                });
                const page = result.repository?.pullRequest?.closingIssuesReferences;
                issues.push(...(page?.nodes || []));
                cursor = page?.pageInfo?.hasNextPage ? page.pageInfo.endCursor : null;
              } while (cursor);
              return issues;
            }

            function requiresHumanApproval(pullRequest, closingIssues) {
              if (hasLabel(pullRequest?.labels, HUMAN_APPROVAL_LABEL)) return true;
              if (
                String(pullRequest?.head?.ref || '').startsWith(NIGHTLY_BALANCE_BRANCH_PREFIX)
              ) {
                return true;
              }
              return (closingIssues || []).some((issue) =>
                hasLabel(issue.labels?.nodes, HUMAN_APPROVAL_LABEL),
              );
            }

            function hasOwnerApprovalComment(comments) {
              const owner = String(context.repo.owner || '').toLowerCase();
              const acceptedPhrases = new Set([
                HUMAN_APPROVAL_PHRASE,
                HUMAN_APPROVAL_PHRASE_VARIANT,
              ]);
              return (comments || []).some(
                (comment) =>
                  String(comment.user?.login || '').toLowerCase() === owner &&
                  acceptedPhrases.has(String(comment.body || '').trim()),
              );
            }

            // Mirrors hasOwnerApprovalReview() in
            // .github/scripts/merge-train/human-approval.mjs: only the owner's
            // latest decisive review counts, so a later CHANGES_REQUESTED or
            // DISMISSED review revokes an earlier approval.
            function hasOwnerApprovalReview(reviews) {
              const owner = String(context.repo.owner || '').toLowerCase();
              const decisive = (reviews || []).filter((review) => {
                if (String(review.user?.login || '').toLowerCase() !== owner) return false;
                const state = String(review.state || '').toUpperCase();
                return state === 'APPROVED' || state === 'CHANGES_REQUESTED' || state === 'DISMISSED';
              });
              if (decisive.length === 0) return false;
              const latest = decisive
                .map((review, index) => ({ review, index }))
                .reduce((best, candidate) => {
                  const bestTime = Date.parse(best.review.submitted_at || '');
                  const candidateTime = Date.parse(candidate.review.submitted_at || '');
                  if (
                    Number.isFinite(bestTime) &&
                    Number.isFinite(candidateTime) &&
                    bestTime !== candidateTime
                  ) {
                    return candidateTime > bestTime ? candidate : best;
                  }
                  return candidate.index > best.index ? candidate : best;
                }).review;
              return String(latest.state || '').toUpperCase() === 'APPROVED';
            }

            function hasOwnerApproval(comments, reviews) {
              return hasOwnerApprovalReview(reviews) || hasOwnerApprovalComment(comments);
            }

            async function latestCiRunForHead(headSha) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                event: 'pull_request',
                per_page: 100,
              });
              return runs
                .filter(run => String(run.name || '') === 'CI')
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
            }

            async function humanApprovalJobConclusion(runId) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              const lightweightJob = (response.data.jobs || []).find((job) => job.name === 'Lightweight Checks');
              if (!lightweightJob) return null;
              // Use the step-level conclusion for the "Human approval" step rather
              // than the overall job conclusion. This prevents the rerun automation
              // from looping indefinitely when an unrelated blocking step (e.g.
              // lint, format) fails while human approval is already granted:
              //   'success'  → approval present and gate passed
              //   'failure'  → approval gate failed (approval not yet present)
              //   'skipped'  → an earlier step failed before the approval step ran;
              //                this is not an approval issue, so no rerun is needed
              const approvalStep = (lightweightJob.steps || []).find(
                (step) => step.name === 'Human approval',
              );
              return approvalStep?.conclusion || null;
            }

            function needsRerun(approvalPresent, humanStepConclusion) {
              // A skipped step means an earlier blocking step failed before the
              // approval gate was reached. Do not rerun — the developer must fix
              // the upstream failure. A null conclusion means no step data is
              // available (e.g. the Lightweight Checks job was skipped entirely on
              // a docs-only PR); no rerun is appropriate in that case either.
              if (humanStepConclusion === 'skipped' || humanStepConclusion === null) return false;
              return (
                (approvalPresent && humanStepConclusion !== 'success') ||
                (!approvalPresent && humanStepConclusion === 'success')
              );
            }

            async function maybeRerunForPr(prNumber, workflowRun = null) {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (pull.data.state !== 'open') {
                core.info(`PR #${prNumber} is not open`);
                return;
              }

              const [comments, reviews, closingIssues] = await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100,
                }),
                listClosingIssues(prNumber),
              ]);
              if (!requiresHumanApproval(pull.data, closingIssues)) {
                core.info(`PR #${prNumber} does not require human approval`);
                return;
              }
              const approvalPresent = hasOwnerApproval(comments, reviews);

              const latestCi =
                workflowRun &&
                String(workflowRun.head_sha || '') === String(pull.data.head.sha || '')
                  ? workflowRun
                  : await latestCiRunForHead(pull.data.head.sha);
              if (!latestCi) {
                core.info(`PR #${prNumber} has no CI run for head ${pull.data.head.sha}`);
                return;
              }

              if (latestCi.status !== 'completed') {
                core.info(
                  `PR #${prNumber}: CI run ${latestCi.id} is ${latestCi.status}; waiting for workflow_run completion`,
                );
                return;
              }

              const humanJobConclusion = await humanApprovalJobConclusion(latestCi.id);
              if (!needsRerun(approvalPresent, humanJobConclusion)) {
                core.info(
                  `PR #${prNumber}: approval=${approvalPresent} and Human approval job=${humanJobConclusion}; no rerun`,
                );
                return;
              }

              await github.rest.actions.reRunWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: latestCi.id,
              });
              core.info(
                `Rerunning CI workflow ${latestCi.id} for PR #${prNumber} (approval=${approvalPresent}, humanJob=${humanJobConclusion})`,
              );
            }

            if (context.eventName === 'issue_comment') {
              await maybeRerunForPr(context.issue.number);
              return;
            }

            if (context.eventName === 'pull_request_review') {
              await maybeRerunForPr(context.payload.pull_request.number);
              return;
            }

            if (context.eventName === 'workflow_run') {
              const linkedPrs = (context.payload.workflow_run?.pull_requests || [])
                .map((entry) => Number(entry.number))
                .filter((number) => Number.isInteger(number) && number > 0);
              if (linkedPrs.length === 0) {
                core.info('No pull requests linked to this workflow_run');
                return;
              }
              for (const prNumber of linkedPrs) {
                await maybeRerunForPr(prNumber, {
                  id: context.payload.workflow_run.id,
                  status: context.payload.workflow_run.status,
                  conclusion: context.payload.workflow_run.conclusion,
                  head_sha: context.payload.workflow_run.head_sha,
                });
              }
            }
