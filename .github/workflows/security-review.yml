name: Security Review Loop

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  issues: write

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      train_promoted: ${{ steps.scope.outputs.train_promoted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: detect
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/agent/ci/detect-art-only.sh

      - name: Normalize docs-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only='${{ steps.detect.outputs.docs_only }}'
          train_promoted='false'
          if [ '${{ github.event_name }}' != 'pull_request' ]; then
            docs_only='false'
          else
            # Only trust promotion provenance while the merge train is
            # actually enabled, so rollback (MERGE_TRAIN_ENABLED=false)
            # restores full security checks even if a leftover "merge-train"
            # check-run is still present on the head.
            if [ "${{ vars.MERGE_TRAIN_ENABLED }}" = "true" ]; then
              check_runs_stderr="$(mktemp)"
              if ! check_runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100" 2>"$check_runs_stderr")"; then
                check_runs_error="$(cat "$check_runs_stderr")"
                echo "Could not fetch check-runs for ${PR_HEAD_SHA}: ${check_runs_error}" >&2
                check_runs_json=''
              fi
              rm -f "$check_runs_stderr"
              if [ -n "$check_runs_json" ]; then
                promotion_checks="$(
                  printf '%s' "$check_runs_json" |
                    jq --arg app_id "$MERGE_TRAIN_APP_ID" \
                      '($app_id | tonumber?) as $trusted_id |
                        ([.check_runs[] | select(.name == "merge-train")] | sort_by(.id) | last) as $check |
                        if ($check != null and
                            $check.status == "completed" and
                            $check.conclusion == "success" and
                            $trusted_id != null and
                            $check.app.id == $trusted_id and
                            ($check.external_id | type == "string" and test("^[0-9a-f]{64}$")))
                        then 1 else 0 end' \
                      2>/dev/null || true
                )"
                if [[ "$promotion_checks" =~ ^[0-9]+$ ]] && [ "$promotion_checks" -gt 0 ]; then
                  docs_only='true'
                  train_promoted='true'
                  echo "Train-promoted head has an attested successful merge-train check."
                elif [ -z "$promotion_checks" ]; then
                  echo "Could not parse check-runs JSON for ${PR_HEAD_SHA}; leaving train_promoted=false." >&2
                fi
              else
                echo "Could not fetch check-runs for ${PR_HEAD_SHA}; leaving train_promoted=false." >&2
              fi
            fi
          fi
          echo "docs_only=${docs_only}" >>"$GITHUB_OUTPUT"
          echo "train_promoted=${train_promoted}" >>"$GITHUB_OUTPUT"

  # All six security checks consolidated into one job to reduce runner-slot
  # consumption (previously each check spun up its own runner and paid full
  # setup overhead). Each step is independent; continue-on-error per-step
  # ensures a single failure doesn't skip later checks.
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    steps:
      - name: Docs-only no-op
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only PR change; skipping src-scoped security checks."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.train_promoted != 'true'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node
        if: needs.changes.outputs.train_promoted != 'true'

      - name: npm audit
        if: ${{ needs.changes.outputs.docs_only != 'true' && !cancelled() }}
        run: npx tsx scripts/agent/shared/wrap-step.ts --name security-npm-audit -- npm audit --audit-level=high
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Scan for committed secrets
        if: ${{ needs.changes.outputs.train_promoted != 'true' && !cancelled() }}
        run: npx tsx scripts/agent/shared/wrap-step.ts --name security-scan-secrets -- bash scripts/agent/security/scan-secrets.sh
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: CODEOWNERS coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' && !cancelled() }}
        run: npx tsx scripts/agent/security/check-codeowners.ts
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Dependency allowlist
        if: ${{ needs.changes.outputs.docs_only != 'true' && !cancelled() }}
        run: npx tsx scripts/agent/security/check-deps.ts
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Dynamic-execution patterns
        if: ${{ needs.changes.outputs.docs_only != 'true' && !cancelled() }}
        run: npx tsx scripts/agent/shared/wrap-step.ts --name security-dynamic-patterns -- bash scripts/agent/security/check-dynamic-patterns.sh
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: AI prompt-injection scan
        if: ${{ needs.changes.outputs.docs_only != 'true' && !cancelled() }}
        run: npx tsx scripts/agent/security/check-ai-prompts.ts
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  # Aggregation job (scheduled runs only — PRs don't file issues)
  aggregate-results:
    name: Aggregate & file issues
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    needs: [security-checks]
    timeout-minutes: 10
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'security-review: scheduled report'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      - name: Aggregate report
        id: aggregate
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: steps.aggregate.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels='automation'
          if gh api "repos/${{ github.repository }}/labels/security" >/dev/null 2>&1; then
            labels='automation,security'
          fi
          gh issue create \
            --title "security-review: $(date -u +%Y-%m-%d) findings" \
            --label "$labels" \
            --body-file report.md
