name: Security Review Loop

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Parallel security checks (independent, can all run at once)
  check-npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npx tsx scripts/agent/shared/wrap-step.ts --name security-npm-audit -- npm audit --audit-level=high
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  check-secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npx tsx scripts/agent/shared/wrap-step.ts --name security-scan-secrets -- bash scripts/agent/security/scan-secrets.sh
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  check-codeowners:
    name: CODEOWNERS coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CODEOWNERS coverage
        run: npx tsx scripts/agent/security/check-codeowners.ts
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  check-deps:
    name: Dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency allowlist
        run: npx tsx scripts/agent/security/check-deps.ts
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  check-dynamic-patterns:
    name: Dynamic patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dynamic-execution patterns
        run: npx tsx scripts/agent/shared/wrap-step.ts --name security-dynamic-patterns -- bash scripts/agent/security/check-dynamic-patterns.sh
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  check-ai-prompts:
    name: AI prompt injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: AI prompt-injection scan
        run: npx tsx scripts/agent/security/check-ai-prompts.ts
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  # Aggregation job depends on all checks
  aggregate-results:
    name: Aggregate & file issues
    runs-on: ubuntu-latest
    if: always()
    needs: [check-npm-audit, check-secrets, check-codeowners, check-deps, check-dynamic-patterns, check-ai-prompts]
    timeout-minutes: 10
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'security-review: scheduled report'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      - name: Aggregate report
        id: aggregate
        if: github.event_name != 'pull_request'
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: github.event_name != 'pull_request' && steps.aggregate.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "security-review: $(date -u +%Y-%m-%d) findings" \
            --label automation,security \
            --body-file report.md
