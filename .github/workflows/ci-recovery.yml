name: CI Recovery
run-name: CI Recovery (${{ inputs.operation }}) for PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile or manage a shepherd lease
        required: true
        default: reconcile
        type: choice
        options:
          - reconcile
          - lease-acquire
          - lease-heartbeat
          - lease-release
      pr_number:
        description: Pull request number
        required: true
        type: string
      trigger:
        description: Reconciliation trigger
        required: false
        default: workflow_dispatch
        type: string
      expected_head_sha:
        description: >-
          Optional PR head SHA this dispatch was validated against. When set,
          recovery fails closed (skips without mutating) if the live PR metadata
          no longer matches. Empty preserves normal manual/router behavior.
        required: false
        default: ''
        type: string
      expected_base_ref:
        description: >-
          Optional default-branch base ref the trusted dispatch was validated
          against. Required when expected_head_sha is set; recovery fails closed
          if it is missing or if the live PR base ref no longer matches.
        required: false
        default: ''
        type: string
      lease_id:
        description: Non-secret shepherd ownership identifier
        required: false
        default: ''
        type: string

concurrency:
  group: crawler-ci-pr-${{ inputs.pr_number }}
  queue: max

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    name: CI recovery for PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted recovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Read traffic runs on the GitHub App installation token, which has its own
      # rate-limit bucket. CRAWLER_CI_PAT is a classic user PAT: every classic PAT
      # for the same user shares ONE 5,000 req/hour core bucket, and this workflow
      # is dispatched per PR, per CI completion, and by the 10-minute liveness
      # sweep. Reading through the PAT exhausted that shared bucket and 403'd every
      # other owner-scoped automation (thread reconciliation, update-branch, train
      # admission), which deadlocked the merge train for hours. Owner-scoped
      # mutations still use CRAWLER_CI_PAT; only reads move.
      - name: Generate repository app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Observe legacy CI recovery without mutation
        if: vars.LIFECYCLE_OWNER_CI_RECOVERY == 'goobers' || vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED != 'true'
        run: |
          echo "Legacy CI recovery is observe-only. LIFECYCLE_OWNER_CI_RECOVERY=${{ vars.LIFECYCLE_OWNER_CI_RECOVERY || 'legacy' }}; bridge=${{ vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED || 'false' }}; no direct PR mutation is permitted."

      - name: Reconcile PR or update shepherd lease
        id: legacy-reconcile
        if: vars.LIFECYCLE_OWNER_CI_RECOVERY != 'goobers' && vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED == 'true'
        env:
          LEGACY_CI_MUTATION_BRIDGE_ENABLED: ${{ vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED || 'false' }}
          LIFECYCLE_MUTATION_OWNER: ${{ vars.LIFECYCLE_MUTATION_OWNER }}
          LIFECYCLE_OWNER_REVIEW_THREADS: ${{ vars.LIFECYCLE_OWNER_REVIEW_THREADS || 'legacy' }}
          CI_RECOVERY_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RECOVERY_MODE: ${{ vars.CI_RECOVERY_MODE || 'dry-run' }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
          COPILOT_REVIEWER_LOGIN: copilot-pull-request-reviewer
          PR_NUMBER: ${{ inputs.pr_number }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_TRIGGER: ${{ inputs.trigger }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_REF: ${{ inputs.expected_base_ref }}
          LEASE_ID: ${{ inputs.lease_id }}
        run: |
          set -o pipefail
          mkdir -p .legacy-lifecycle
          node .github/scripts/ci-recovery/reconcile.mjs | tee .legacy-lifecycle/reconcile.log

      - name: Capture immutable CI Recovery decision
        id: capture-legacy-decision
        if: always() && vars.LIFECYCLE_OWNER_CI_RECOVERY != 'goobers' && vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          READ_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RECOVERY_TRIGGER: ${{ inputs.trigger }}
          LEGACY_OUTCOME: ${{ steps.legacy-reconcile.outcome }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const capture = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/capture-legacy-lifecycle.mjs',
            )));
            const count = await capture.captureCiRecovery({
              github,
              token: process.env.READ_TOKEN,
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber: Number(process.env.PR_NUMBER),
              runId: context.runId,
              trigger: process.env.RECOVERY_TRIGGER,
              outcome: process.env.LEGACY_OUTCOME,
              logPath: path.join(process.env.GITHUB_WORKSPACE, '.legacy-lifecycle/reconcile.log'),
              outputPath: path.join(process.env.GITHUB_WORKSPACE, '.legacy-lifecycle/records.json'),
            });
            core.setOutput('record-count', String(count));

      - name: Upload immutable CI Recovery decision
        if: always() && steps.capture-legacy-decision.outcome == 'success' && steps.capture-legacy-decision.outputs.record-count != '0'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: legacy-lifecycle-${{ github.run_id }}
          path: .legacy-lifecycle/records.json
          if-no-files-found: error
          retention-days: 14
