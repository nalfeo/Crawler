name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Also rebuild prod from production tag'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Admin check (manual triggers only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          if [ "$PERM" != "admin" ]; then
            echo "::error::Only admins may trigger manual deploys (you have: $PERM)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Build Dev (includes labs) ---
      - name: Build dev
        run: npm run build
        env:
          DEPLOY_ENV: dev
          BUILD_OUTDIR: staging/dev

      - name: Guard - dev must include lab.html
        run: |
          if [ ! -f staging/dev/lab.html ]; then
            echo "::error::Dev build missing lab.html"
            exit 1
          fi

      - name: Guard - dev must NOT include devtools.html
        run: |
          if [ -f staging/dev/devtools.html ]; then
            echo "::error::Dev build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Beta (no labs) ---
      - name: Build beta
        run: npm run build
        env:
          DEPLOY_ENV: beta
          BUILD_OUTDIR: staging/beta

      - name: Guard - beta must NOT include lab.html or devtools.html
        run: |
          if [ -f staging/beta/lab.html ]; then
            echo "::error::Beta build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/beta/devtools.html ]; then
            echo "::error::Beta build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Prod (from production tag, if exists) ---
      - name: Check for production tag
        id: prod-tag
        run: |
          if git rev-parse production >/dev/null 2>&1; then
            SHA=$(git rev-parse production)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production ref for prod build
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ steps.prod-tag.outputs.sha }} -- .

      - name: Build prod
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          npm ci
          npm run build
        env:
          DEPLOY_ENV: prod
          BUILD_OUTDIR: staging/prod

      - name: Restore main branch
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ github.sha }} -- .

      - name: Guard - prod must NOT include lab.html or devtools.html
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          if [ -f staging/prod/lab.html ]; then
            echo "::error::Prod build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/prod/devtools.html ]; then
            echo "::error::Prod build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Assemble final site ---
      - name: Assemble site
        run: |
          mkdir -p site/dev site/beta

          # Dev tier
          cp -r staging/dev/* site/dev/

          # Beta tier
          cp -r staging/beta/* site/beta/

          # Prod tier (or placeholder)
          if [ -d staging/prod ]; then
            cp -r staging/prod/* site/
          else
            echo '<!DOCTYPE html><html><body><h1>Crawler</h1><p>No production release yet. Visit <a href="beta/">beta</a> or <a href="dev/">dev</a>.</p></body></html>' > site/index.html
          fi

      # --- Write version markers ---
      - name: Write version.json files
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HEAD_SHA=${{ github.sha }}
          PROD_SHA=${{ steps.prod-tag.outputs.sha || 'none' }}

          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"dev\",\"builtAt\":\"$NOW\"}" > site/dev/version.json
          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"beta\",\"builtAt\":\"$NOW\"}" > site/beta/version.json

          if [ -d staging/prod ]; then
            echo "{\"commit\":\"$PROD_SHA\",\"env\":\"prod\",\"builtAt\":\"$NOW\"}" > site/version.json
          fi

      - name: Deploy to gh-pages branch
        id: deploy-gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PAGES_BASE="https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/$(basename "$GITHUB_REPOSITORY")"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --depth=1 --branch=gh-pages "$REPO_URL" /tmp/gh-pages 2>/dev/null; then
            echo "Cloned existing gh-pages branch"
          else
            echo "Creating new gh-pages branch"
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
          fi

          cd /tmp/gh-pages

          # Remove everything except .git and pr-* subdirectories (preserves active PR previews)
          for item in * .[^.]*; do
            case "$item" in
              pr-*|.git|.nojekyll) continue ;;
              *) [ -e "$item" ] && rm -rf "$item" ;;
            esac
          done

          # Copy new site content
          cp -r "$GITHUB_WORKSPACE/site/." .
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore: deploy to GitHub Pages [${GITHUB_SHA:0:7}]"

            MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              if git push origin HEAD:gh-pages; then
                echo "Deployed to ${PAGES_BASE}/"
                break
              fi
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "Push failed (attempt $attempt), rebasing..."
                git fetch origin gh-pages
                git rebase origin/gh-pages
              else
                echo "::error::Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
            done
          fi

          echo "PAGES_URL=${PAGES_BASE}/" >> "$GITHUB_ENV"

      - name: Ensure GitHub Pages source is set to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"source":{"branch":"gh-pages","path":"/"}}' | \
            gh api repos/${{ github.repository }}/pages \
              --method PUT \
              --input - \
            2>/dev/null && echo "Pages source: branch=gh-pages path=/" || \
            echo "::notice::Pages source could not be updated automatically (may already be correct)"

      - name: Label and comment on released PRs
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: ${{ env.PAGES_URL }}
        run: |
          # Ensure the "released" label exists
          if ! gh label create "released" --repo "${{ github.repository }}" \
            --color "0E8A16" --description "Changes deployed to GitHub Pages" 2>/dev/null; then
            echo "::notice::Label 'released' already exists or could not be created"
          fi

          # Find merged PRs targeting main that don't have the "released" label yet
          PR_NUMBERS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state merged \
            --base main \
            --json number,labels \
            --jq '[.[] | select(.labels | map(.name) | index("released") | not)] | .[].number')

          for PR in $PR_NUMBERS; do
            echo "Marking PR #$PR as released"
            if ! gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "released"; then
              echo "::warning::Failed to label PR #$PR"
            fi
            if ! gh pr comment "$PR" --repo "${{ github.repository }}" \
              --body "🚀 Released in [deploy #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) → [${PAGES_URL}dev/](${PAGES_URL}dev/)"; then
              echo "::warning::Failed to comment on PR #$PR"
            fi
          done

      - name: Create failure issue for copilot
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release failure: deploy workflow run #${context.runNumber}`;
            const body = [
              'A release workflow failed and needs investigation.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Triggered by: @${context.actor}`,
              '',
              '@copilot please investigate and resolve this release failure.'
            ].join('\n');

            // Ensure the "release" label exists before using it
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'release',
                color: '5319E7',
                description: 'Release-related'
              });
            } catch (e) {
              if (e.status !== 422) {
                core.warning(`Could not create 'release' label: ${e.message}`);
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'release']
            });

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.data.number,
                assignees: ['copilot']
              });
            } catch (error) {
              core.warning(`Could not assign @copilot automatically: ${error.message}`);
            }

            core.info(`Created issue #${issue.data.number}`);
