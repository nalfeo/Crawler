name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Also rebuild prod from production tag'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy-url.outputs.page_url }}
    steps:
      - name: Admin check (manual triggers only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          if [ "$PERM" != "admin" ]; then
            echo "::error::Only admins may trigger manual deploys (you have: $PERM)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Build Dev (includes labs) ---
      - name: Build dev
        run: npm run build
        env:
          DEPLOY_ENV: dev
          BUILD_OUTDIR: staging/dev

      - name: Guard - dev must include lab.html
        run: |
          if [ ! -f staging/dev/lab.html ]; then
            echo "::error::Dev build missing lab.html"
            exit 1
          fi

      - name: Guard - dev must NOT include devtools.html
        run: |
          if [ -f staging/dev/devtools.html ]; then
            echo "::error::Dev build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Beta (no labs) ---
      - name: Build beta
        run: npm run build
        env:
          DEPLOY_ENV: beta
          BUILD_OUTDIR: staging/beta

      - name: Guard - beta must NOT include lab.html or devtools.html
        run: |
          if [ -f staging/beta/lab.html ]; then
            echo "::error::Beta build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/beta/devtools.html ]; then
            echo "::error::Beta build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Prod (from production tag, if exists) ---
      - name: Check for production tag
        id: prod-tag
        run: |
          if git rev-parse production >/dev/null 2>&1; then
            SHA=$(git rev-parse production)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production ref for prod build
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ steps.prod-tag.outputs.sha }} -- .

      - name: Build prod
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          npm ci
          npm run build
        env:
          DEPLOY_ENV: prod
          BUILD_OUTDIR: staging/prod

      - name: Restore main branch
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ github.sha }} -- .

      - name: Guard - prod must NOT include lab.html or devtools.html
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          if [ -f staging/prod/lab.html ]; then
            echo "::error::Prod build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/prod/devtools.html ]; then
            echo "::error::Prod build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Assemble final site ---
      - name: Assemble site
        run: |
          mkdir -p site/dev site/beta

          # Dev tier
          cp -r staging/dev/* site/dev/

          # Beta tier
          cp -r staging/beta/* site/beta/

          # Prod tier (or placeholder)
          if [ -d staging/prod ]; then
            cp -r staging/prod/* site/
          else
            echo '<!DOCTYPE html><html><body><h1>Crawler</h1><p>No production release yet. Visit <a href="beta/">beta</a> or <a href="dev/">dev</a>.</p></body></html>' > site/index.html
          fi

      # --- Write version markers ---
      - name: Write version.json files
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HEAD_SHA=${{ github.sha }}
          PROD_SHA=${{ steps.prod-tag.outputs.sha || 'none' }}

          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"dev\",\"builtAt\":\"$NOW\"}" > site/dev/version.json
          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"beta\",\"builtAt\":\"$NOW\"}" > site/beta/version.json

          if [ -d staging/prod ]; then
            echo "{\"commit\":\"$PROD_SHA\",\"env\":\"prod\",\"builtAt\":\"$NOW\"}" > site/version.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry (transient Pages failure)
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "Deploy attempt 1 failed — waiting 60 s before retry..."
          sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Resolve deployment URL
        id: deploy-url
        if: always()
        run: |
          if [ "${{ steps.deployment-retry.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment-retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Both deployment attempts failed; page_url will be empty."
          fi

      - name: Label and comment on released PRs
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: ${{ steps.deploy-url.outputs.page_url }}
        run: |
          # Ensure the "released" label exists
          if ! gh label create "released" --repo "${{ github.repository }}" \
            --color "0E8A16" --description "Changes deployed to GitHub Pages" 2>/dev/null; then
            echo "::notice::Label 'released' already exists or could not be created"
          fi

          # Find merged PRs targeting main that don't have the "released" label yet
          PR_NUMBERS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state merged \
            --base main \
            --json number,labels \
            --jq '[.[] | select(.labels | map(.name) | index("released") | not)] | .[].number')

          LAB_BASE="${PAGES_URL}dev/lab.html"

          for PR in $PR_NUMBERS; do
            echo "Marking PR #$PR as released"
            if ! gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "released"; then
              echo "::warning::Failed to label PR #$PR"
            fi

            # Detect relevant labs for this PR's changed files
            CHANGED_FILES_JSON=$(gh pr view "$PR" --repo "${{ github.repository }}" \
              --json files --jq '[.files[].path]' 2>/dev/null || echo '[]')
            RELEVANT_LAB_IDS=$(echo "$CHANGED_FILES_JSON" | \
              node scripts/agent/pr-lab-links.mjs 2>/dev/null || echo '[]')

            # Build a "Related labs" line when relevant labs were found
            RELATED_LABS_LINE=$(RELEVANT_LAB_IDS="$RELEVANT_LAB_IDS" LAB_BASE="$LAB_BASE" \
              node -e "
                const ids = JSON.parse(process.env.RELEVANT_LAB_IDS);
                const base = process.env.LAB_BASE;
                if (ids.length > 0) {
                  const links = ids.map(id => '[' + id + '](' + base + '?lab=' + id + ')').join(', ');
                  process.stdout.write('\n\u{1F52C} Related labs: ' + links);
                }
              " 2>/dev/null || true)

            BODY="🚀 Released in [deploy #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) → [${PAGES_URL}dev/](${PAGES_URL}dev/)"$'\n'"🤖 [AI Runner lab](${LAB_BASE}?lab=ai-runner)${RELATED_LABS_LINE}"

            if ! gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"; then
              echo "::warning::Failed to comment on PR #$PR"
            fi
          done

      - name: Close stale release-failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only close issues created more than 120 seconds ago to avoid closing
          # a concurrently created issue from a different failing run.
          # Requires GNU date (standard on ubuntu-latest runners).
          #
          # Scope to *this* workflow's failure issues by title prefix.
          # promote-to-prod.yml also creates "release"-labelled issues titled
          # "Release failure: promote workflow run #N"; a successful deploy must
          # NOT auto-close those, since promote-to-prod is a separate,
          # manually-dispatched pipeline that this deploy did not re-run.
          # (The stale deploy issues all use the "Release failure: deploy
          # workflow" prefix, so they still match.) --limit lifts the default
          # 30-item cap as light hardening against re-accumulation.
          CUTOFF=$(date -u -d '120 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          OPEN=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "release" \
            --limit 100 \
            --json number,title,createdAt \
            | jq -r --arg cutoff "$CUTOFF" '.[] | select(.createdAt < $cutoff) | select(.title | startswith("Release failure: deploy workflow")) | .number')
          for N in $OPEN; do
            gh issue close "$N" \
              --repo "${{ github.repository }}" \
              --comment "✅ Auto-closed: deploy run #${{ github.run_number }} succeeded (commit \`${{ github.sha }}\`). The transient Pages failure that opened this issue has resolved." \
            || echo "::warning::Failed to close issue #$N"
          done

      - name: Create failure issue for copilot
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release failure: deploy workflow run #${context.runNumber}`;
            const body = [
              'A release workflow failed and needs investigation.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Triggered by: @${context.actor}`,
              '',
              '@copilot please investigate and resolve this release failure.'
            ].join('\n');

            // Ensure the "release" label exists before using it
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'release',
                color: '5319E7',
                description: 'Release-related'
              });
            } catch (e) {
              if (e.status !== 422) {
                core.warning(`Could not create 'release' label: ${e.message}`);
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'release']
            });

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.data.number,
                assignees: ['copilot-swe-agent']
              });
            } catch (error) {
              core.warning(`Could not assign @copilot-swe-agent automatically: ${error.message}`);
            }

            core.info(`Created issue #${issue.data.number}`);
