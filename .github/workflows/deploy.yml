name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Also rebuild prod from production tag'
        type: boolean
        default: false

# Least-privilege default: only the baseline-sweep job pushes to the repo, and
# it declares its own job-level write scopes (`contents: write` for the
# baselines-branch push, plus `pull-requests`/`issues: write` to comment the
# win-rate on the released PR). Keep the workflow default at read so the deploy
# job's token is not needlessly broadened.
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    # Avoid allocating a runner for CI completions that can never deploy
    # (scheduled/manual PR-health runs or failed CI). A no-op release-gate runner
    # failure would otherwise make the whole Pages workflow red even though the
    # deploy and baseline jobs are intentionally skipped.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate stale workflow_run releases
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ] || \
             [ "${{ github.event.workflow_run.event }}" != "push" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_SHA="${{ github.event.workflow_run.head_sha }}"
          MAIN_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha' 2>/dev/null || true)
          if [ -z "$MAIN_SHA" ]; then
            echo "::warning::Failed to resolve current main HEAD; skipping deploy and baseline-sweep fail-closed."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RUN_SHA" = "$MAIN_SHA" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale release workflow_run for $RUN_SHA (current main HEAD is $MAIN_SHA)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: release-gate
    # Serialize Pages deploys only. The baseline-sweep job below runs
    # per-release and must not be cancelled if a newer release lands mid-sweep.
    concurrency:
      group: pages
      cancel-in-progress: true
    if: >
      needs.release-gate.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    environment:
      name: github-pages
      url: ${{ steps.deploy-url.outputs.page_url }}
    outputs:
      released_pr_numbers: ${{ steps.released-prs.outputs.pr_numbers }}
      pages_url: ${{ steps.deploy-url.outputs.page_url }}
    steps:
      - name: Admin check (manual triggers only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          if [ "$PERM" != "admin" ]; then
            echo "::error::Only admins may trigger manual deploys (you have: $PERM)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Pin to the released commit (the CI workflow_run head SHA), not the
          # default github.sha -- on a workflow_run event github.sha may resolve
          # to the current main tip if a newer commit landed between CI completing
          # and this deploy job starting. Pinning ensures dev/beta builds and the
          # version.json markers always reflect the exact commit that was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Build Dev (includes labs) ---
      - name: Build dev
        run: npm run build
        env:
          DEPLOY_ENV: dev
          BUILD_OUTDIR: staging/dev
          VITE_RUNS_INGEST_URL: https://crawler-dev-ingest.azurewebsites.net/runs

      - name: Guard - dev must include lab.html
        run: |
          if [ ! -f staging/dev/lab.html ]; then
            echo "::error::Dev build missing lab.html"
            exit 1
          fi

      - name: Guard - dev must NOT include devtools.html
        run: |
          if [ -f staging/dev/devtools.html ]; then
            echo "::error::Dev build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Beta (no labs) ---
      - name: Build beta
        run: npm run build
        env:
          DEPLOY_ENV: beta
          BUILD_OUTDIR: staging/beta

      - name: Guard - beta must NOT include lab.html or devtools.html
        run: |
          if [ -f staging/beta/lab.html ]; then
            echo "::error::Beta build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/beta/devtools.html ]; then
            echo "::error::Beta build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Prod (from production tag, if exists) ---
      - name: Check for production tag
        id: prod-tag
        run: |
          if git rev-parse production >/dev/null 2>&1; then
            SHA=$(git rev-parse production)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production ref for prod build
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ steps.prod-tag.outputs.sha }} -- .

      - name: Build prod
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          npm ci
          npm run build
        env:
          DEPLOY_ENV: prod
          BUILD_OUTDIR: staging/prod

      - name: Restore main branch
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout HEAD -- .

      - name: Guard - prod must NOT include lab.html or devtools.html
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          if [ -f staging/prod/lab.html ]; then
            echo "::error::Prod build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/prod/devtools.html ]; then
            echo "::error::Prod build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Assemble final site ---
      - name: Assemble site
        run: |
          mkdir -p site/dev site/beta

          # Dev tier
          cp -r staging/dev/* site/dev/

          # Beta tier
          cp -r staging/beta/* site/beta/

          # Prod tier (or placeholder)
          if [ -d staging/prod ]; then
            cp -r staging/prod/* site/
          else
            echo '<!DOCTYPE html><html><body><h1>Crawler</h1><p>No production release yet. Visit <a href="beta/">beta</a> or <a href="dev/">dev</a>.</p></body></html>' > site/index.html
          fi

      # --- Write version markers ---
      - name: Write version.json files
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HEAD_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          PROD_SHA=${{ steps.prod-tag.outputs.sha || 'none' }}

          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"dev\",\"builtAt\":\"$NOW\"}" > site/dev/version.json
          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"beta\",\"builtAt\":\"$NOW\"}" > site/beta/version.json

          if [ -d staging/prod ]; then
            echo "{\"commit\":\"$PROD_SHA\",\"env\":\"prod\",\"builtAt\":\"$NOW\"}" > site/version.json
          fi

      - name: Final latest-tip guard
        # Second SHA check immediately before publishing: if another commit
        # landed on main after the release-gate check passed but before we
        # reach this step, abort so B's own run handles the publish. This
        # prevents the residual race where A passes the gate, B lands, A
        # completes its build, and both A and B end up deploying Pages.
        # Skipped for manual workflow_dispatch (operator is intentional).
        id: tip-guard
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_SHA="${{ github.event.workflow_run.head_sha }}"
          MAIN_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$MAIN_SHA" ] && [ "$RUN_SHA" != "$MAIN_SHA" ]; then
            echo "::notice::Aborting publish: $RUN_SHA is no longer main tip (${MAIN_SHA} landed before upload). B's run will handle this release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        if: steps.tip-guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.tip-guard.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry (transient Pages failure)
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "Deploy attempt 1 failed — waiting 60 s before retry..."
          sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Resolve deployment URL
        id: deploy-url
        if: always()
        run: |
          if [ "${{ steps.deployment-retry.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment-retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Both deployment attempts failed; page_url will be empty."
          fi

      - name: Select released PR targets
        id: released-prs
        if: steps.tip-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBERS=""
          if ! PR_NUMBERS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state merged \
            --base main \
            --json number,labels \
            --jq '[.[] | select(.labels | map(.name) | index("released") | not)] | .[].number' 2>/dev/null); then
            echo "::warning::Failed to select unreleased merged PRs for this deploy run; baseline-sweep fallback set will be empty."
            PR_NUMBERS=""
          fi
          {
            echo "pr_numbers<<EOF"
            echo "$PR_NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Label and comment on released PRs
        if: steps.tip-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: ${{ steps.deploy-url.outputs.page_url }}
        run: |
          # Ensure the "released" label exists
          if ! gh label create "released" --repo "${{ github.repository }}" \
            --color "0E8A16" --description "Changes deployed to GitHub Pages" 2>/dev/null; then
            echo "::notice::Label 'released' already exists or could not be created"
          fi

          # Find merged PRs targeting main that don't have the "released" label yet
          # (already selected once in the previous step and shared to baseline-sweep
          # as a deploy job output to avoid cross-run mis-association).
          PR_NUMBERS="${{ steps.released-prs.outputs.pr_numbers }}"

          LAB_BASE="${PAGES_URL}dev/lab.html"

          for PR in $PR_NUMBERS; do
            echo "Marking PR #$PR as released"
            if ! gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "released"; then
              echo "::warning::Failed to label PR #$PR"
            fi

            # Detect relevant labs for this PR's changed files
            CHANGED_FILES_JSON=$(gh pr view "$PR" --repo "${{ github.repository }}" \
              --json files --jq '[.files[].path]' 2>/dev/null || echo '[]')
            RELEVANT_LAB_IDS=$(echo "$CHANGED_FILES_JSON" | \
              node scripts/agent/pr-lab-links.mjs 2>/dev/null || echo '[]')

            # Build a "Related labs" line when relevant labs were found
            RELATED_LABS_LINE=$(RELEVANT_LAB_IDS="$RELEVANT_LAB_IDS" LAB_BASE="$LAB_BASE" \
              node -e "
                const ids = JSON.parse(process.env.RELEVANT_LAB_IDS);
                const base = process.env.LAB_BASE;
                if (ids.length > 0) {
                  const links = ids.map(id => '[' + id + '](' + base + '?lab=' + id + ')').join(', ');
                  process.stdout.write('\n\u{1F52C} Related labs: ' + links);
                }
              " 2>/dev/null || true)

            BODY="🚀 Released in [deploy #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) → [${PAGES_URL}dev/](${PAGES_URL}dev/)"$'\n'"🤖 [AI Runner lab](${LAB_BASE}?lab=ai-runner)${RELATED_LABS_LINE}"

            if ! gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"; then
              echo "::warning::Failed to comment on PR #$PR"
            fi
          done

  release-report-sweep:
    name: Release report leg (${{ matrix.leg }} shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [release-gate, deploy]
    if: >
      needs.release-gate.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { leg: floor2, shard: 0 }
          - { leg: floor2, shard: 1 }
          - { leg: floor2, shard: 2 }
          - { leg: floor2, shard: 3 }
          - { leg: floor2, shard: 4 }
          - { leg: floor2, shard: 5 }
          - { leg: floor2, shard: 6 }
          - { leg: floor2, shard: 7 }
          - { leg: floor2, shard: 8 }
          - { leg: floor2, shard: 9 }
          - { leg: floor2, shard: 10 }
          - { leg: floor2, shard: 11 }
          - { leg: floor2, shard: 12 }
          - { leg: floor2, shard: 13 }
          - { leg: floor2, shard: 14 }
          - { leg: floor1-chain, shard: 0 }
          - { leg: floor1-chain, shard: 1 }
          - { leg: floor1-chain, shard: 2 }
          - { leg: floor1-chain, shard: 3 }
          - { leg: floor1-chain, shard: 4 }
          - { leg: floor1-chain, shard: 5 }
          - { leg: floor1-chain, shard: 6 }
          - { leg: floor1-chain, shard: 7 }
          - { leg: floor1-chain, shard: 8 }
          - { leg: floor1-chain, shard: 9 }
          - { leg: floor1-chain, shard: 10 }
          - { leg: floor1-chain, shard: 11 }
          - { leg: floor1-chain, shard: 12 }
          - { leg: floor1-chain, shard: 13 }
          - { leg: floor1-chain, shard: 14 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run report shard
        continue-on-error: true
        env:
          LEG: ${{ matrix.leg }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p .cache/release-legs
          start=$((SHARD * 10 + 1))
          end=$((start + 9))
          if [ "$end" -gt 150 ]; then end=150; fi
          if [ "$LEG" = "floor2" ]; then
            npm run ai:winrate-sweep -- \
              --floor floor2 --seeds "$start-$end" --no-force-weapon \
              --out ".cache/release-legs/$LEG-$SHARD.json"
          else
            npm run ai:winrate-sweep -- \
              --floor floor1 --seeds "$start-$end" --no-force-weapon --chain \
              --out ".cache/release-legs/$LEG-$SHARD.json"
          fi

      - name: Upload report shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-leg-${{ matrix.leg }}-${{ matrix.shard }}
          path: .cache/release-legs/*.json
          if-no-files-found: ignore

  baseline-sweep:
    name: Baseline multi-floor sweep (600 runs)
    runs-on: ubuntu-latest
    needs: [release-gate, deploy, release-report-sweep]
    concurrency:
      group: baseline-sweep-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    # Only baseline what we actually released to Pages. `needs: deploy` alone
    # is NOT sufficient here: GitHub Actions does not cascade-skip a job with
    # its own explicit `if:` just because a job it `needs` was skipped -- that
    # only happens automatically for the default (`success()`) condition, or
    # if this expression itself checked `needs.deploy.result`. Since the
    # `deploy` job above is skipped (not failed) on scheduled/non-push CI
    # completions, this job's old condition (checking only
    # `workflow_run.conclusion == 'success'`) would still evaluate true and
    # run a real 100-seed sweep every time hourly main-health CI succeeds,
    # even though nothing was deployed. Require the exact same push-only gate
    # as `deploy` so both jobs are skipped identically on non-push
    # invocations.
    if: >
      needs.release-gate.outputs.should_run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    timeout-minutes: 120
    # A job-level permissions block replaces the workflow default entirely, so
    # these are NOT inherited and must be listed explicitly. `gh pr comment` on
    # the released PR (final step) posts via the issue-comments API, so grant
    # both PR and issue write scopes; `contents: write` stays for the
    # baselines-branch push.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the released commit (the CI workflow_run head SHA), not the
          # default github.sha -- on a workflow_run event that defaults to the
          # current main tip, which may be a newer commit than the one CI ran on.
          # This keeps the swept code identical to the commit the baseline is
          # recorded under: the "Resolve baseline commit" step below derives $SHA
          # from the same expression. Full history (fetch-depth: 0) so we can walk
          # main to correlate baselines with branch-off commits later (see
          # scripts/agent/perf/find-baseline.mjs).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve baseline commit
        id: sha
        run: |
          # For workflow_run events, github.sha points at the *deploy* workflow
          # commit, not the CI commit that was actually released. Prefer the
          # triggering workflow_run head SHA when present.
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "Baseline will be tagged with SHA: $SHA"

      # Multi-floor release sweep — 600 runs across three legs (see the
      # canonical matrix in scripts/agent/perf/sweep-legs.ts).
      #
      # Floor 1 alone can no longer answer "is the game completable
      # end-to-end?" now that Floor 2 is implemented E2E with an attainable
      # victory. The legs are:
      #
      #   floor1       50 seeds × 6 weapons = 300 runs  (blocking; this is the
      #                leg the baseline-regression check compares, and the only
      #                one that measures per-weapon balance)
      #   floor2      150 seeds, seed-selected weapon  (report-only)
      #   floor1-chain 150 seeds, chained F1 → F2      (report-only; the ONLY
      #                leg that exercises the floor transition)
      #
      # "Report-only" means a slip never fails this job — but it is NOT
      # unwatched: both report-only legs are held to a 90% win-rate target and a
      # breach files a Copilot-assigned investigation issue below, the same
      # release-time treatment Floor 1's 100% invariant already gets.
      #
      # Total run count is unchanged from the previous Floor-1-only 100-seed ×
      # 6-weapon baseline, so release wall time stays roughly neutral.
      #
      # Resizing the Floor-1 leg (600 → 300 runs) is an intentional sweep
      # resize, so the regression check reports ONE skipped comparison and then
      # resumes at full strength from the next release. See
      # RELEASE_SWEEP_REVISION in scripts/agent/perf/sweep-legs.ts.
      #
      # The Floor-1 leg remains the top-level baseline artifact for continuity:
      # the regression check compares top-level totals against the historical
      # series, and a run-count change would make it refuse to compare. The
      # other legs are attached under `legs` for per-leg diagnostics.
      - name: Run multi-floor release sweep
        id: sweep
        run: |
          set -euo pipefail
          mkdir -p .cache/baseline

          # Blocking Floor-1 balance leg → the top-level baseline artifact.
          npm run ai:winrate-sweep -- \
            --seeds 1-50 \
            --weapons sword,bow,baseball-bat,pistol,throwing-knife,fireball \
            --out .cache/baseline/baseline.json

          # Report-only legs run in the parallel release-report-sweep matrix.
          # Download and merge their shard summaries here so publication remains
          # one atomic baseline operation.
          mkdir -p .cache/release-legs

      - name: Download report shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: release-leg-*
          path: .cache/release-legs
          merge-multiple: true

      - name: Merge report leg metrics
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = '.cache/release-legs';
          const expectedShards = 15;
          const expectedRuns = 150;
          for (const leg of ['floor2', 'floor1-chain']) {
            const shardPattern = new RegExp(`^${leg}-(\\d+)\\.json$`);
            const shardId = (file) => {
              const match = path.basename(file).match(shardPattern);
              if (!match) throw new Error(`unexpected shard filename for ${leg}: ${file}`);
              return Number(match[1]);
            };
            const files = fs.readdirSync(dir)
              .filter((file) => shardPattern.test(file))
              .sort((a, b) => shardId(a) - shardId(b))
              .map((file) => path.join(dir, file));
            if (files.length === 0) {
              console.log(`skipping missing leg ${leg}`);
              continue;
            }
            const shards = files.map(shardId);
            const expectedShardIds = Array.from({ length: expectedShards }, (_, shard) => shard);
            if (files.length !== expectedShards || shards.some((shard, i) => shard !== expectedShardIds[i])) {
              console.log(`::warning::skipping incomplete leg ${leg}: found shards ${shards.join(',')}, expected ${expectedShardIds.join(',')}`);
              continue;
            }
            const totals = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')))
              .reduce((sum, part) => ({
                totalWins: sum.totalWins + part.totalWins,
                totalRuns: sum.totalRuns + part.totalRuns,
                totalSlowVictories: sum.totalSlowVictories + (part.totalSlowVictories ?? 0),
                totalTrueLosses: sum.totalTrueLosses + (part.totalTrueLosses ?? 0),
                runs: [...sum.runs, ...(Array.isArray(part.runs) ? part.runs : [])],
              }), { totalWins: 0, totalRuns: 0, totalSlowVictories: 0, totalTrueLosses: 0, runs: [] });
            if (totals.totalRuns !== expectedRuns) {
              console.log(`::warning::skipping incomplete leg ${leg}: found ${totals.totalRuns} runs, expected ${expectedRuns}`);
              continue;
            }
            fs.writeFileSync(`.cache/baseline/leg-${leg}.json`, JSON.stringify({
              floorId: leg === 'floor2' ? 'floor2' : 'floor1',
              legId: leg,
              ...totals,
              winRate: totals.totalWins / totals.totalRuns,
            }, null, 2));
            console.log(`${leg}: ${files.length} shards, ${totals.totalWins}/${totals.totalRuns}`);
          }
          NODE

      # Fold the report-only legs into the baseline under `legs`, so the
      # per-leg regression comparison has data to work with on the NEXT release
      # while the top-level aggregate stays exactly the Floor-1 leg.
      - name: Attach per-leg metrics
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const base = ".cache/baseline";
            const baseline = JSON.parse(fs.readFileSync(`${base}/baseline.json`, "utf8"));
            const legs = { floor1: pick(baseline) };
            for (const [id, file] of [["floor2", "leg-floor2.json"], ["floor1-chain", "leg-floor1-chain.json"]]) {
              const p = `${base}/${file}`;
              if (!fs.existsSync(p)) { console.log(`skipping missing leg ${id}`); continue; }
              legs[id] = pick(JSON.parse(fs.readFileSync(p, "utf8")), true);
            }
            baseline.legs = legs;
            fs.writeFileSync(`${base}/baseline.json`, JSON.stringify(baseline, null, 2));
            function pick(j, includeRuns = false) {
              return {
                winRate: j.winRate,
                totalWins: j.totalWins,
                totalRuns: j.totalRuns,
                ...(includeRuns && Array.isArray(j.runs) ? { runs: j.runs } : {}),
              };
            }
          '

      - name: Publish report-only leg summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Release sweep legs"
            echo ""
            echo "| Leg | Win rate | Wins | Blocking |"
            echo "| --- | ---: | ---: | :---: |"
            for f in .cache/baseline/baseline.json .cache/baseline/leg-floor2.json .cache/baseline/leg-floor1-chain.json; do
              [ -f "$f" ] || continue
              node -e '
                const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const id = j.legId ?? j.floorId;
                const blocking = id === "floor1" ? "yes" : "no";
                console.log(`| \`${id}\` | ${(j.winRate * 100).toFixed(1)}% | ${j.totalWins}/${j.totalRuns} | ${blocking} |`);
              ' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enrich baseline with commit metadata
        env:
          BASELINE_JSON: ${{ github.workspace }}/.cache/baseline/baseline.json
          SHA: ${{ steps.sha.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(git show -s --format=%cI "$SHA")
          COMMIT_SUBJECT=$(git show -s --format=%s "$SHA")
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          COMMIT_DATE="$COMMIT_DATE" COMMIT_SUBJECT="$COMMIT_SUBJECT" RUN_URL="$RUN_URL" \
            npx tsx scripts/agent/perf/release-baseline.ts

      # Score the deterministic fun evaluation on every available release leg
      # (600 runs when all three legs complete), once `baseline.json` carries `runs` and `meta`
      # (the enrichment step above). This is diagnostic/trendable data, not a
      # release gate: a low fun score must never fail a commit that already
      # shipped, so a scoring failure is downgraded to a warning instead of
      # failing the job. `fun-report.json` is intentionally allowed to be
      # absent downstream (publish/upload/index both tolerate its absence).
      - name: Score fun evaluation
        env:
          BASELINE_JSON: ${{ github.workspace }}/.cache/baseline/baseline.json
          FUN_REPORT_JSON: ${{ github.workspace }}/.cache/baseline/fun-report.json
        run: |
          npx tsx scripts/agent/perf/release-fun-report.ts || \
            echo "::warning::Fun evaluation scoring failed; this release's baseline will publish without a fun-report.json."

      - name: Publish to baselines branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish this release's baseline to the persistent `baselines`
          # branch. index.json is regenerated from every by-sha/*.json file on
          # each publish (never a textual edit of the shared array), and the
          # whole publish is retried against the latest remote tip. Together
          # these make concurrent baseline jobs conflict-free: each job owns a
          # uniquely-named by-sha/<sha>.json and the index is a pure function of
          # those files, so a retry simply re-derives state on top of whatever
          # other jobs pushed. This also resolves the first-run orphan race:
          # a retry resets onto origin/baselines instead of trying to rebase
          # two unrelated orphan histories.
          WORKTREE="$RUNNER_TEMP/baselines-wt"
          SRC="$GITHUB_WORKSPACE/.cache/baseline/baseline.json"
          FUN_REPORT_SRC="$GITHUB_WORKSPACE/.cache/baseline/fun-report.json"
          export WORKTREE

          write_readme() {
            node -e "
              const fs = require('node:fs');
              const path = require('node:path');
              const wt = process.env.WORKTREE;
              fs.writeFileSync(path.join(wt, 'README.md'), [
                '# Baselines branch',
                '',
                'This branch stores baseline win-rate sweeps captured after every',
                'successful GitHub Pages deploy from main. Each release commit gets',
                'one file under by-sha/<commit-sha>.json, and index.json is a',
                'chronological log sorted by commit date (newest first).',
                '',
                'index.json is regenerated from by-sha/*.json on every publish, so',
                'concurrent baseline jobs never conflict on it.',
                '',
                'Use npm run perf:find-baseline to resolve the baseline that was in',
                'effect when a feature branch forked from main. Do not merge this',
                'branch into main; it is history storage only.',
                '',
              ].join('\n'));
            "
          }

          # Build the baselines worktree, add this run's by-sha file, regenerate
          # index.json, commit, and push. Returns non-zero on any failure so the
          # retry loop below can re-run it against the latest remote tip.
          publish() {
            git worktree remove --force "$WORKTREE" 2>/dev/null || true
            rm -rf "$WORKTREE"
            git worktree prune || true

            # Probe for the remote branch, distinguishing "branch absent"
            # (ls-remote rc=2 -> take the first-run orphan path) from a transient
            # ls-remote failure (rc=1/128, e.g. network/auth). The latter must NOT
            # masquerade as absence, or a retry could fork a second orphan history
            # instead of resetting onto the branch a concurrent job just created.
            remote_rc=0
            git ls-remote --exit-code --heads origin baselines >/dev/null 2>&1 || remote_rc=$?
            if [ "$remote_rc" -eq 0 ]; then
              git fetch --force origin '+refs/heads/baselines:refs/remotes/origin/baselines' || return 1
              git worktree add --force -B baselines "$WORKTREE" origin/baselines || return 1
            elif [ "$remote_rc" -eq 2 ]; then
              git worktree add --detach "$WORKTREE" || return 1
              git -C "$WORKTREE" checkout --orphan baselines || return 1
              git -C "$WORKTREE" rm -rf . >/dev/null 2>&1 || true
              write_readme || return 1
            else
              echo "git ls-remote for baselines failed (rc=$remote_rc); retrying."
              return 1
            fi

            # Storage is keyed by commit SHA, so a re-run for the same commit
            # overwrites its by-sha file: this branch holds the latest baseline
            # per release commit. Gameplay fields are deterministic for a given
            # commit; each complete RunStats also preserves nondeterministic
            # wallTimeMs from the runner that captured it.
            mkdir -p "$WORKTREE/by-sha"
            cp "$SRC" "$WORKTREE/by-sha/$SHA.json" || return 1
            # The fun-eval report is diagnostic-only and may legitimately be
            # absent (scoring failure, or a by-sha file published before this
            # feature existed) -- publish it opportunistically, never fail.
            # Delete any stale same-SHA sibling first: a failed/missing score on
            # a rerun must not leave the previous run's report as indexed data.
            rm -f "$WORKTREE/by-sha/$SHA.fun-report.json"
            if [ -f "$FUN_REPORT_SRC" ]; then
              cp "$FUN_REPORT_SRC" "$WORKTREE/by-sha/$SHA.fun-report.json" || return 1
            fi
            [ -f "$WORKTREE/README.md" ] || write_readme || return 1

            # Rebuild index.json from every by-sha/*.json (sorted newest-first by
            # commit date). Because the index is a deterministic derivation of the
            # by-sha files, concurrent jobs never textually merge the shared array.
            # The derivation lives in a unit-tested module so it cannot silently
            # drop a field the regression check reads (per-leg metrics, sweep
            # revision) the way the previous inline script did.
            BASELINES_DIR="$WORKTREE" npx tsx "$GITHUB_WORKSPACE/scripts/agent/perf/baseline-index.ts" || return 1

            git -C "$WORKTREE" add -A || return 1
            if git -C "$WORKTREE" diff --cached --quiet; then
              echo "No baseline changes to commit."
              return 0
            fi
            git -C "$WORKTREE" commit \
              -m "baseline: $SHORT (run #${{ github.run_number }})" \
              -m "Commit: $SHA" \
              -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || return 1
            git -C "$WORKTREE" push origin baselines
          }

          attempt=1
          max_attempts=5
          while true; do
            publish && break
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to publish baseline after $attempt attempts"
              exit 1
            fi
            echo "Publish attempt $attempt failed (likely a concurrent baseline push); retrying..."
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 2))
          done

      - name: File nightly balance issue for release baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
        run: node .github/scripts/nightly-balance-issue/run.mjs

      - name: Detect baseline win-rate regression
        id: baseline-regression
        env:
          BASELINE_JSON: ${{ github.workspace }}/.cache/baseline/baseline.json
          BASELINE_INDEX_JSON: ${{ runner.temp }}/baselines-wt/index.json
          BASELINE_REGRESSION_RESULT: ${{ runner.temp }}/baseline-regression.json
          # Second, independent verdict from the same baseline: the report-only
          # legs (floor2, floor1-chain) held to their 90% win-rate target. Kept
          # separate from the aggregate decision above so a Floor 1 loss — which
          # short-circuits that decision — can never mask a Floor 2 breach in the
          # same release (nalfeo/Crawler#3293).
          LEG_WIN_RATE_FLOOR_RESULT: ${{ runner.temp }}/leg-win-rate-floor.json
        run: npx tsx scripts/agent/perf/baseline-regression-check.ts

      - name: File regression issue and assign Copilot
        if: steps.baseline-regression.outputs.regression == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          BASELINE_REGRESSION_RESULT: ${{ runner.temp }}/baseline-regression.json
        run: node .github/scripts/baseline-regression-issue.mjs

      # Report-only legs never fail the release; they file (or refresh) a single
      # long-lived investigation issue, which is the release-workflow equivalent
      # of the Floor 1 "must be 100%" check above.
      - name: File report-only leg win-rate issue and assign Copilot
        if: steps.baseline-regression.outputs.legWinRateFloorBreach == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          BASELINE_REGRESSION_RESULT: ${{ runner.temp }}/leg-win-rate-floor.json
        run: node .github/scripts/baseline-regression-issue.mjs

      - name: Upload baseline as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ steps.sha.outputs.short }}
          # fun-report.json is optional (see "Score fun evaluation" above), so
          # `if-no-files-found: warn` lets this artifact still upload
          # baseline.json alone when scoring failed for this release.
          path: |
            .cache/baseline/baseline.json
            .cache/baseline/fun-report.json
          if-no-files-found: warn
          retention-days: 90

      # Runs last (after the guaranteed diagnostic artifact upload) so a stalled
      # network call here can never delay that upload. `if: success()` gates it
      # on the publish + upload steps having succeeded.
      - name: Comment baseline win-rate on released PR
        if: success()
        # Best-effort by design: the explicit guards below skip gracefully, and
        # continue-on-error is a final backstop so an unexpected failure can
        # never turn this release-baseline job red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          BASELINE_JSON: ${{ github.workspace }}/.cache/baseline/baseline.json
          BASELINE_INDEX_JSON: ${{ runner.temp }}/baselines-wt/index.json
          FALLBACK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASELINE_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/baselines/by-sha/${{ steps.sha.outputs.sha }}.json
          BASELINES_DIR: ${{ runner.temp }}/baselines-wt
          FUN_REPORT_JSON: ${{ github.workspace }}/.cache/baseline/fun-report.json
          PAGES_URL: ${{ needs.deploy.outputs.pages_url }}
          BASELINE_REPO: ${{ github.repository }}
          DEPLOY_PR_NUMBERS: ${{ needs.deploy.outputs.released_pr_numbers }}
        run: |
          # Post the freshly published baseline win-rate onto the PR whose
          # squash-merge produced this released commit, AND any other recently-
          # released PRs that share the same deployment but whose baseline-sweep
          # was cancelled (batch-merge scenario).
          #
          # Root cause of the batch gap: when the merge train lands multiple PRs
          # in quick succession, the `pages` concurrency group cancels earlier
          # deploy jobs and their dependent baseline-sweeps.  The surviving
          # deploy run already labels ALL batch PRs via "Label and comment on
          # released PRs", so querying for the "released" label here catches
          # every PR in the batch that still needs the comment.

          # 1. Resolve the triggering PR from the swept commit.  Prefer the
          #    durable `Merge-Train-PR` trailer over GitHub's commit-to-PR
          #    inference (the shared resolver does trailer-first, then falls
          #    back to inference).  Non-fatal on failure; the label-based path
          #    below can still cover batch PRs.
          SPECIFIC_PR=$(GITHUB_TOKEN="$GH_TOKEN" node .github/scripts/merge-train/resolve-landed-pr.mjs "$SHA" 2>/dev/null) || {
            echo "::warning::Failed to resolve PR for released commit $SHA; continuing with label-based fallback."
            SPECIFIC_PR=""
          }

          # 2. Use the exact PR set selected by this run's deploy job (plus the
          #    commit-resolved PR) to avoid cross-run overlap with other releases.
          #    The idempotency check below still safely skips already-commented PRs.
          ALL_COMMENT_PRS=$(printf '%s\n%s\n' "$SPECIFIC_PR" "$DEPLOY_PR_NUMBERS" \
            | sort -n -u | grep -v '^[[:space:]]*$' || true)

          if [ -z "$ALL_COMMENT_PRS" ]; then
            echo "::notice::No PRs to comment on for released commit $SHA; skipping."
            exit 0
          fi

          # 4. Build the comment body from the enriched baseline and its
          #    published history. Guard against missing/unreadable data or
          #    invalid win rates.
          BODY=$(npx tsx scripts/agent/perf/format-baseline-comment.ts) || {
            echo "::warning::Could not build baseline comment body; skipping."
            exit 0
          }
          if [ -z "$BODY" ]; then
            echo "::warning::Empty baseline comment body; skipping."
            exit 0
          fi

          # 5. Post the comment on each target PR that doesn't already have one
          #    (idempotency guard for re-runs and overlapping sweeps).
          for PR in $ALL_COMMENT_PRS; do
            HAS=$(gh pr view "$PR" \
              --repo "${{ github.repository }}" \
              --json comments \
              --jq '[.comments[].body | select(contains("📊 Baseline win-rate"))] | length' \
              2>/dev/null || echo 0)
            if [ "${HAS:-0}" -gt 0 ]; then
              echo "::notice::PR #$PR already has a baseline win-rate comment; skipping."
              continue
            fi
            echo "Posting baseline win-rate comment on PR #$PR"
            if ! gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"; then
              echo "::warning::Failed to comment baseline win-rate on PR #$PR"
            fi
          done
