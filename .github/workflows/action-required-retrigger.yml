name: Action Required Retrigger

on:
  workflow_run:
    workflows: ['CI', 'Security Review Loop']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID of the parked action_required/cancelled run to retrigger'
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  retrigger:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && contains(fromJson('[\"action_required\",\"cancelled\"]'), github.event.workflow_run.conclusion)) ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted retrigger implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push human-token empty commit for parked same-repo PR checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PARKED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/ci-recovery/action-required-retrigger.mjs
