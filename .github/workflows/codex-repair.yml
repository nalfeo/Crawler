name: Codex PR Repair Router

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: write

concurrency:
  group: codex-repair-router-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    # Auto-routing is disabled in-repo by default: it only runs when the repo
    # variable CODEX_ROUTER_ENABLED is explicitly set to 'true'. This encodes the
    # "manual testing only, no auto-trigger" posture in code, so re-enabling the
    # workflow in the GitHub UI alone is not enough to start auto-repair.
    if: ${{ github.actor != 'github-actions[bot]' && vars.CODEX_ROUTER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_MAX_AUTO_ATTEMPTS: '5'
      CODEX_MAX_AUTO_FAILURE_STREAK: '2'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout workflow repo files
        uses: actions/checkout@v4

      - name: Parse event and guard conditions
        id: parse
        run: node .github/scripts/codex/event-parse.mjs

      - name: Stop when no repair is needed
        if: steps.parse.outputs.should_run != 'true'
        run: |
          echo "Skipping: ${{ steps.parse.outputs.skip_reason }}"

      - name: Dispatch trusted repair run
        if: steps.parse.outputs.should_run == 'true'
        env:
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          REPAIR_TRIGGER: ${{ steps.parse.outputs.trigger }}
          REPAIR_MODE: ${{ steps.parse.outputs.mode }}
          REPAIR_COMMAND: ${{ steps.parse.outputs.command }}
          IS_EXPLICIT_COMMAND: ${{ steps.parse.outputs.is_explicit_command }}
          DISPATCH_REF: ${{ github.event.repository.default_branch }}
          WORKFLOW_FILE: codex-repair-runner.yml
        run: node .github/scripts/codex/dispatch-repair.mjs
