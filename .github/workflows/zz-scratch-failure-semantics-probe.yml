name: ZZ Scratch Failure Semantics Probe

on:
  push:
    branches: [nalfeo-merge-train-wakeup-gaps]

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on purpose
        run: exit 1

  downstream:
    if: always()
    needs: [upstream]
    runs-on: ubuntu-latest
    steps:
      - name: Implicit-condition step (default success())
        run: echo "implicit step ran"

      - name: Explicit if failure() step
        if: failure()
        run: echo "failure() step ran"

      - name: Explicit if success() step
        if: success()
        run: echo "success() step ran"
