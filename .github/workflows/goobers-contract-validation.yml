name: Goobers Contract Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-recovery*.yml'
      - '.github/workflows/merge-train*.yml'
      - '.github/workflows/goobers-*.yml'
      - '.github/scripts/validate-goobers-contracts*'
      - 'tests/unit/goobers-contracts.test.ts'
  pull_request:
    paths:
      - '.github/workflows/ci-recovery*.yml'
      - '.github/workflows/merge-train*.yml'
      - '.github/workflows/goobers-*.yml'
      - '.github/scripts/validate-goobers-contracts*'
      - 'tests/unit/goobers-contracts.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate Goobers contract schemas (v1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate workflow inputs against invocation schema
        run: |
          set -euo pipefail
          if [ -f ".github/scripts/validate-goobers-contracts.mjs" ]; then
            node .github/scripts/validate-goobers-contracts.mjs
          else
            echo "ℹ️  Contract validation script not yet implemented (Phase 0 in progress)"
            exit 0
          fi

      - name: Run contract unit tests
        run: npx vitest run tests/unit/goobers-contracts.test.ts --reporter=verbose

      - name: Summary
        if: always()
        run: |
          echo "### Goobers Contract Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Contract schemas v1 validated" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Workflow inputs conform to invocation spec" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Output schemas enforce deterministic gates" >> "$GITHUB_STEP_SUMMARY"
