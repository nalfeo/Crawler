name: Goobers Contract Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-recovery*.yml'
      - '.github/workflows/merge-train*.yml'
      - '.github/workflows/goobers-*.yml'
      # Covered by the workflow checkout contract: intake parity wired the
      # shared eligibility library into both legacy intake workflows too.
      - '.github/workflows/issue-copilot-intake.yml'
      - '.github/workflows/epic-reprocess.yml'
      - '.github/scripts/goobers/**'
      - '.github/scripts/ci-recovery/**'
      - '.github/scripts/merge-train/**'
      - '.github/scripts/validate-goobers-contracts*'
      - '.goobers/**'
      - 'tests/unit/goobers-contracts.test.ts'
      - 'tests/unit/goobers-run-workflow.test.ts'
      - 'tests/unit/goobers-run-slot-cleanup.test.ts'
      - 'tests/unit/goobers-workflow-checkout-contract.test.ts'
      - 'scripts/agent/goobers-stage-teardown.sh'
      - 'scripts/agent/goobers-reservation-lease.sh'
  pull_request:
    paths:
      - '.github/workflows/ci-recovery*.yml'
      - '.github/workflows/merge-train*.yml'
      - '.github/workflows/goobers-*.yml'
      # Covered by the workflow checkout contract: intake parity wired the
      # shared eligibility library into both legacy intake workflows too.
      - '.github/workflows/issue-copilot-intake.yml'
      - '.github/workflows/epic-reprocess.yml'
      - '.github/scripts/goobers/**'
      - '.github/scripts/ci-recovery/**'
      - '.github/scripts/merge-train/**'
      - '.github/scripts/validate-goobers-contracts*'
      - '.goobers/**'
      - 'tests/unit/goobers-contracts.test.ts'
      - 'tests/unit/goobers-run-workflow.test.ts'
      - 'tests/unit/goobers-run-slot-cleanup.test.ts'
      - 'tests/unit/goobers-workflow-checkout-contract.test.ts'
      - 'scripts/agent/goobers-stage-teardown.sh'
      - 'scripts/agent/goobers-reservation-lease.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate Goobers contract schemas (v1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          install-playwright: 'false'

      - name: Validate workflow inputs against invocation schema
        run: |
          set -euo pipefail
          node .github/scripts/validate-goobers-contracts.mjs

      - name: Prove the Linux-only executable suites can run here
        # `goobers-run-slot-cleanup.test.ts` gates its executable suites on jq,
        # /proc and setsid so a Windows workstation reports a skip rather than a
        # false failure. That gate must never silently disarm the suite in CI:
        # this step fails loudly if a prerequisite is missing, and
        # GOOBERS_REQUIRE_LINUX_SUITES below makes the suite itself assert that
        # it really ran rather than skipped.
        run: |
          set -euo pipefail
          missing=""
          command -v jq > /dev/null 2>&1 || missing="${missing} jq"
          command -v setsid > /dev/null 2>&1 || missing="${missing} setsid"
          [ -r /proc/self/stat ] || missing="${missing} /proc"
          if [ -n "$missing" ]; then
            echo "::error::This runner is missing${missing}, so the Goobers executable suites (process teardown, rootless cancellation reap, lease receipts) would SKIP instead of running, and the contract they validate would go unchecked. Run this job on ubuntu-latest, or install the missing tool in a preceding step." >&2
            exit 1
          fi
          echo "jq $(jq --version), setsid and /proc are all available; the executable Goobers suites will run."

      - name: Run contract unit tests
        env:
          # Turns every Linux-only skip in the Goobers suites into a failure on
          # this runner, so "the suite passed" cannot mean "the suite skipped".
          GOOBERS_REQUIRE_LINUX_SUITES: '1'
        run: npx vitest run tests/unit/goobers-contracts.test.ts tests/unit/goobers-run-workflow.test.ts tests/unit/goobers-run-slot-cleanup.test.ts tests/unit/goobers-workflow-checkout-contract.test.ts --reporter=verbose

      - name: Summary
        if: success()
        run: |
          echo "### Goobers Contract Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Contract schemas v1 validated" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Workflow inputs conform to invocation spec" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Output schemas enforce deterministic gates" >> "$GITHUB_STEP_SUMMARY"
