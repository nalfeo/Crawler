name: Issue Copilot Intake

on:
  issues:
    types: [opened, reopened, closed]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted intake script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assign Copilot on intake and on dependency unblock
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          ISSUE_OWNER: nalfeo
          # Legacy intake defers to Goobers for the whole transferred intake
          # cohort — approved issues plus the legacy eligibility cohort — only
          # while Goobers owns the implementation-claim lane. On rollback this
          # selector hands that entire cohort back to legacy instead of leaving
          # it ownerless.
          LIFECYCLE_MUTATION_OWNER: ${{ vars.LIFECYCLE_MUTATION_OWNER }}
        run: node .github/scripts/ci-recovery/issue-intake.mjs
