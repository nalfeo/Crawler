name: Asset PR Ingestion

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: asset-pr-ingestion
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: ./.github/actions/setup-node

      - name: Ensure no-copilot label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create no-copilot --description "Skip Copilot intake for this issue" --color "ededed" --force

      - name: Consolidate checked-in art
        env:
          CI: 'true'
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT }}
          SPRITES_ALLOW_CI_ASSET_PR: 'true'
        run: npm run sprites:asset-pr
