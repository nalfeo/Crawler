name: Nightly Velocity Issue

on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-velocity-issue-filer
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  file-issue:
    name: File nightly velocity issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted filer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: File nightly velocity issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
        run: node .github/scripts/nightly-velocity-issue/run.mjs
