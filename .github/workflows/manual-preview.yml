name: Deploy Manual Preview

on:
  workflow_dispatch:
    inputs:
      preview_ref:
        description: 'Branch, tag, ref, or commit SHA to publish into /preview/'
        required: true
        type: string
      pr_number:
        description: 'Optional PR number to comment with preview URL'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Permission gate. NOTE: triggering this workflow at all via
      # workflow_dispatch already requires the actor to have >= write access to
      # the repo — that is a GitHub platform rule the workflow file cannot relax
      # (the top-level `permissions:` block only scopes GITHUB_TOKEN, it does not
      # govern who may dispatch). This step previously hard-required `admin`,
      # which blocked PR authors / maintainers who legitimately have write. We
      # relax it to write-or-higher so anyone allowed to dispatch can proceed.
      - name: Permission check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          # The legacy `.permission` field collapses roles to admin/write/read/none
          # (maintain→write, triage→read), so admin|write covers admin, maintain
          # and write collaborators.
          case "$PERM" in
            admin | write)
              echo "✅ '$PERM' permission is sufficient to trigger a manual preview deploy."
              ;;
            *)
              echo "::error::Manual preview deploys require write access (you have: '$PERM')."
              echo "::error::workflow_dispatch already requires >= write to dispatch, so ask a"
              echo "::error::repo admin to grant you write (or higher) on ${{ github.repository }}."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Build Dev (from main HEAD; includes labs) ---
      - name: Build dev
        run: npm run build
        env:
          DEPLOY_ENV: dev
          BUILD_OUTDIR: staging/dev
          VITE_RUNS_INGEST_URL: https://crawler-dev-ingest.azurewebsites.net/runs

      - name: Guard - dev must include lab.html
        run: |
          if [ ! -f staging/dev/lab.html ]; then
            echo "::error::Dev build missing lab.html"
            exit 1
          fi

      - name: Guard - dev must NOT include devtools.html
        run: |
          if [ -f staging/dev/devtools.html ]; then
            echo "::error::Dev build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Beta (from main HEAD; no labs) ---
      - name: Build beta
        run: npm run build
        env:
          DEPLOY_ENV: beta
          BUILD_OUTDIR: staging/beta

      - name: Guard - beta must NOT include lab.html or devtools.html
        run: |
          if [ -f staging/beta/lab.html ]; then
            echo "::error::Beta build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/beta/devtools.html ]; then
            echo "::error::Beta build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Prod (from production tag, if exists) ---
      - name: Check for production tag
        id: prod-tag
        run: |
          if git rev-parse production >/dev/null 2>&1; then
            SHA=$(git rev-parse production)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production ref for prod build
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ steps.prod-tag.outputs.sha }} -- .

      - name: Build prod
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          npm ci
          npm run build
        env:
          DEPLOY_ENV: prod
          BUILD_OUTDIR: staging/prod

      - name: Restore main branch after prod build
        if: steps.prod-tag.outputs.exists == 'true'
        run: git checkout ${{ github.sha }} -- .

      - name: Guard - prod must NOT include lab.html or devtools.html
        if: steps.prod-tag.outputs.exists == 'true'
        run: |
          if [ -f staging/prod/lab.html ]; then
            echo "::error::Prod build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/prod/devtools.html ]; then
            echo "::error::Prod build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Preview (from requested ref) ---
      - name: Resolve preview target
        id: preview-target
        run: |
          TARGET_INPUT="${{ inputs.preview_ref }}"
          if [ -z "$TARGET_INPUT" ]; then
            echo "::error::preview_ref input is required"
            exit 1
          fi

          if ! git rev-parse --verify --quiet "$TARGET_INPUT^{commit}" >/dev/null; then
            git fetch origin "$TARGET_INPUT" || true
          fi

          if ! git rev-parse --verify --quiet "$TARGET_INPUT^{commit}" >/dev/null; then
            echo "::error::Could not resolve preview_ref '$TARGET_INPUT' to a commit"
            exit 1
          fi

          TARGET_SHA=$(git rev-parse "$TARGET_INPUT^{commit}")
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "input=$TARGET_INPUT" >> "$GITHUB_OUTPUT"

      - name: Save trusted resolver scripts before preview checkout
        # Copy the resolver and its imports from the trusted workflow ref into
        # /tmp before switching to the preview ref. The resolve-landed-pr step
        # below runs from this trusted copy, so a preview branch that modifies
        # the resolver (or github.mjs) cannot execute under GH_TOKEN.
        run: |
          set -e
          mkdir -p /tmp/trusted-resolver/merge-train /tmp/trusted-resolver/ci-recovery
          cp .github/scripts/merge-train/resolve-landed-pr.mjs /tmp/trusted-resolver/merge-train/
          cp .github/scripts/merge-train/state.mjs /tmp/trusted-resolver/merge-train/
          cp .github/scripts/ci-recovery/github.mjs /tmp/trusted-resolver/ci-recovery/
          # Verify all three files are present before proceeding.
          test -f /tmp/trusted-resolver/merge-train/resolve-landed-pr.mjs
          test -f /tmp/trusted-resolver/merge-train/state.mjs
          test -f /tmp/trusted-resolver/ci-recovery/github.mjs

      - name: Checkout preview ref for preview build
        run: git checkout ${{ steps.preview-target.outputs.sha }} -- .

      - name: Reinstall dependencies for preview ref
        run: npm ci

      - name: Build preview
        run: npm run build
        env:
          DEPLOY_ENV: preview
          BUILD_OUTDIR: staging/preview

      - name: Guard - preview must include lab.html and not include devtools.html
        run: |
          if [ ! -f staging/preview/lab.html ]; then
            echo "::error::Preview build missing lab.html"
            exit 1
          fi
          if [ -f staging/preview/devtools.html ]; then
            echo "::error::Preview build contains devtools.html - local-only leakage!"
            exit 1
          fi

      - name: Restore workflow ref
        run: git checkout ${{ github.sha }} -- .

      # --- Assemble final site ---
      - name: Assemble site
        run: |
          mkdir -p site/dev site/beta site/preview
          cp -r staging/dev/* site/dev/
          cp -r staging/beta/* site/beta/
          cp -r staging/preview/* site/preview/

          if [ -d staging/prod ]; then
            cp -r staging/prod/* site/
          else
            echo '<!DOCTYPE html><html><body><h1>Crawler</h1><p>No production release yet. Visit <a href="beta/">beta</a>, <a href="dev/">dev</a>, or <a href="preview/">preview</a>.</p></body></html>' > site/index.html
          fi

      - name: Write version.json files
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MAIN_SHA=${{ github.sha }}
          PROD_SHA=${{ steps.prod-tag.outputs.sha || 'none' }}
          PREVIEW_SHA=${{ steps.preview-target.outputs.sha }}

          echo "{\"commit\":\"$MAIN_SHA\",\"env\":\"dev\",\"builtAt\":\"$NOW\"}" > site/dev/version.json
          echo "{\"commit\":\"$MAIN_SHA\",\"env\":\"beta\",\"builtAt\":\"$NOW\"}" > site/beta/version.json
          echo "{\"commit\":\"$PREVIEW_SHA\",\"env\":\"preview\",\"sourceRef\":\"${{ steps.preview-target.outputs.input }}\",\"builtAt\":\"$NOW\"}" > site/preview/version.json

          if [ -d staging/prod ]; then
            echo "{\"commit\":\"$PROD_SHA\",\"env\":\"prod\",\"builtAt\":\"$NOW\"}" > site/version.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resolve PR for preview comment
        id: preview-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INPUT="${{ inputs.pr_number }}"
          if [ -n "$PR_INPUT" ]; then
            echo "number=$PR_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trailer-first resolution (shared resolver): a train-landed commit
          # maps back to its original PR via the durable Merge-Train-PR trailer,
          # then falls back to GitHub's commit-to-PR inference. No state filter,
          # so a real-merged PR is not missed. The resolver exits non-zero (3) on
          # a GitHub API failure vs empty-exit-0 on a genuine no-match; preserve
          # that distinction by warning on a real failure instead of silently
          # treating an outage as "no PR", then continue best-effort.
          # Run from the trusted copy saved before the preview ref was checked
          # out, so a modified resolver in the preview branch cannot execute here.
          if PR_FROM_SHA=$(node /tmp/trusted-resolver/merge-train/resolve-landed-pr.mjs "${{ steps.preview-target.outputs.sha }}"); then
            echo "number=$PR_FROM_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not resolve the preview PR (resolver API failure); skipping the preview comment."
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL on PR
        if: steps.preview-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}preview/
        run: |
          BODY=$(cat <<EOF
          🧪 Manual preview deployed: [${PREVIEW_URL}](${PREVIEW_URL})

          - Source ref: \`${{ steps.preview-target.outputs.input }}\`
          - Source commit: \`${{ steps.preview-target.outputs.sha }}\`
          - Dev/Beta remain sourced from \`main\`; this preview slot is overwritten on each manual preview deploy.
          - For quick iteration in ephemeral sessions, use the session worktree server URL (temporary) before publishing to \`/preview/\`.
          EOF
          )
          gh pr comment "${{ steps.preview-pr.outputs.number }}" --repo "${{ github.repository }}" --body "$BODY"

      - name: Preview summary
        run: |
          echo "## 🧪 Manual Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URL: ${{ steps.deployment.outputs.page_url }}preview/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview source ref: \`${{ steps.preview-target.outputs.input }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview commit: \`${{ steps.preview-target.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dev/Beta source: \`main\` at \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.preview-pr.outputs.number }}" ]; then
            echo "- PR comment posted on #${{ steps.preview-pr.outputs.number }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- PR comment skipped (no PR resolved)" >> "$GITHUB_STEP_SUMMARY"
          fi
