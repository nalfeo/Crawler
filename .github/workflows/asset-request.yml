# Ingest `asset-request`-labeled GitHub issues into the Azure sprite queue and
# run the sprite worker to drain it. Runs entirely in CI with API-key auth to
# Azure — no `az login` / OIDC federation needed.
#
# ─── Security posture (public repo!) ────────────────────────────────────────
# `nalfeo/Crawler` is a **public** repository and `.github/ISSUE_TEMPLATE/
# asset-request.yml` auto-applies the `asset-request` label. Without a gate,
# any GitHub user could file an asset-request issue and burn Azure OpenAI
# spend. To close that:
#
#   1. Issue-event runs require the ISSUE AUTHOR to be
#      OWNER / MEMBER / COLLABORATOR of the repo (`author_association` gate).
#      Random-drive-by issues sit unprocessed until a maintainer intervenes.
#   2. There is **no `schedule:` trigger** — a cron sweep would re-scan every
#      open `asset-request` issue regardless of author, defeating (1).
#   3. Maintainer escape hatch: `workflow_dispatch` runs after a maintainer
#      re-labels or re-opens the issue as themselves, or a manual
#      `gh workflow run asset-request.yml`. Both paths make the maintainer
#      the acting sender, which is auditable.
#   4. Azure keys are wired at STEP level (only on the two `run:` steps that
#      need them), not job level — so `actions/checkout`, `actions/setup-node`,
#      and the setup action don't inherit high-value credentials. The combined
#      ingest/worker coordinator strips provider secrets from the ingest child.
#   5. Secrets stay scoped to THIS workflow (not `copilot-setup-steps.yml`) so
#      the coding-agent runner env can't exfiltrate them either.
#
# ─── Auth model ─────────────────────────────────────────────────────────────
# The sprite worker/queue/store use **API-key auth** to Azure (endpoint + key),
# NOT Azure identity. That's why we can run this entirely from GitHub-hosted
# runners without OIDC federation.
name: Asset Request Pipeline

on:
  issues:
    # NOTE: intentionally NOT triggering on `opened`. The issue-template
    # (`.github/ISSUE_TEMPLATE/asset-request.yml`) auto-applies the
    # `asset-request` label, which fires `labeled` right after `opened` — so
    # `[opened, labeled]` produces two runs per new issue. Dropping `opened`
    # gives us exactly one run per newly-labeled issue while still covering
    # (a) issues filed via `Issues → New issue` without the template (author
    # applies the label manually → `labeled`), (b) re-opened issues, and
    # (c) issues whose body was edited to fix a validation error.
    types: [labeled, edited, reopened]
  workflow_dispatch:

permissions:
  contents: write
  # Required so `gh issue list` and the worker's failure-comment path can read
  # + comment on asset-request issues.
  issues: write
  pull-requests: write

# Serialize workers so two runs don't race on the same Azure queue message.
# Azure Storage Queue is at-least-once and its visibility timeout keeps things
# safe even if two workers overlap; this just avoids duplicate work + noise.
concurrency:
  group: ${{ github.workflow }}-worker
  cancel-in-progress: false
  queue: single

jobs:
  drain:
    name: Ingest issues + drain queue
    runs-on: ubuntu-latest
    # Two-gate filter for `issues` events:
    #   1. Trusted human authors (repo permission ≥ COLLABORATOR).
    #   2. Trusted bots — Copilot cloud sessions file issues as
    #      `user.login=Copilot` with `user.type=Bot` and
    #      `author_association=CONTRIBUTOR`, so (1) alone would block them.
    #      The extra `user.type=='Bot'` check + explicit login allow-list
    #      keeps the surface tight (a random bot with commenter/contributor
    #      history can't slip in).
    #   3. `workflow_dispatch` (and any future non-issues trigger) always
    #      proceeds — that's the maintainer's explicit opt-in.
    #
    # NOTE: the webhook payload's `user.login` for the Copilot cloud agent is
    # `Copilot` (REST-style), whereas `gh issue list --json author.login`
    # returns `app/copilot-swe-agent` (GraphQL-style). The workflow gate uses
    # the REST form; the ingester's `SPRITES_INGESTER_ALLOWED_AUTHORS` (below)
    # uses the GraphQL form. Both are required for Copilot to work end-to-end.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'issues' &&
        contains(github.event.issue.labels.*.name, 'asset-request') && (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
          (
            github.event.issue.user.type == 'Bot' &&
            contains(fromJSON('["Copilot"]'), github.event.issue.user.login)
          )
        )
      )
    # Hard safety net so a stuck worker (e.g. a hung Azure/provider call that
    # never emits `idle` and doesn't respect SIGTERM) can't burn CI minutes.
    # Drain-mode is the soft exit for the empty-queue common case (~30s).
    timeout-minutes: 25

    steps:
      # Use the owner-scoped token for the generated-art push/PR so those events
      # trigger normal pull_request CI. Events created by GITHUB_TOKEN do not
      # recursively start workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CRAWLER_CI_PAT }}

      - uses: ./.github/actions/setup-node

      # Step 1: start the worker, scan open `asset-request` issues, then publish
      # a durable producer-complete marker after every enqueue/state save resolves.
      # The worker ignores pre-completion empties and confirms queue emptiness
      # with a dequeue begun after the marker, removing the old ~15s idle tail.
      - name: Ingest issues + drain worker
        env:
          # gh CLI auth — used by scripts/sprites/sidecar/asset-request-issue-api.ts
          # (spawns `gh issue list`).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Direct Azure OpenAI generation credentials. The coordinator passes
          # these to the worker but explicitly strips them from the ingest child.
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_IMAGE_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_IMAGE_DEPLOYMENT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_VISION_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_VISION_DEPLOYMENT }}
          AZURE_OPENAI_BRIEF_SELECTOR_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_BRIEF_SELECTOR_DEPLOYMENT }}
          SPRITES_PROVIDER: azure-openai
          SPRITES_TEXT_PROVIDER: azure-openai
          SPRITES_SYNTH_PROVIDER: azure-openai
          SPRITES_VISION_PROVIDER: azure-openai

          # In-CI logs default to warn (see src/shared/logger.ts's
          # `isQuietLoggingEnvironment`). Force info so the ingester's
          # startup + completion lines actually appear in the run log — the
          # JSON status printed to stdout is not enough context on its own.
          LOG_LEVEL: info

          # No FOUNDRY_* here on purpose: ingestion never talks to Foundry.
          # `sprites:ingest-once` (createIssueIngesterController.pollOnce)
          # only lists open issues and enqueues new ones — it never constructs a
          # provider, and createAssetQueue()/createRunStore() read only
          # SPRITES_* + AZURE_STORAGE_*. The brief-selector / image / vision
          # deployments are consumed exclusively by the worker (drain) step below.

          # Azure Storage — the ingester writes to the queue + state blob.
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_QUEUE_NAME: ${{ secrets.AZURE_STORAGE_QUEUE_NAME }}
          AZURE_STORAGE_RUNS_CONTAINER: ${{ secrets.AZURE_STORAGE_RUNS_CONTAINER }}

          # Force Azure backends. The default CLI falls back to `noop`/`local`
          # if unset, which would silently no-op the workflow.
          SPRITES_ASSET_QUEUE: ${{ secrets.SPRITES_ASSET_QUEUE || 'azure-queue' }}
          SPRITES_RUN_STORE: ${{ secrets.SPRITES_RUN_STORE || 'azure-blob' }}

          # Trust boundary: even though the workflow-level `if:` gate blocks
          # untrusted authors from triggering a run, the ingester scans EVERY
          # open `asset-request` issue when it runs — so a legit maintainer
          # trigger would otherwise piggyback-process any drive-by user's
          # issue that happens to be open. Restrict enqueue to the repo
          # owner and the Copilot cloud coding agent (which appears as
          # `app/copilot-swe-agent` via `gh issue list --json author.login`
          # — the GraphQL variant of `Copilot` used in the workflow gate
          # above). Extend with additional trusted logins (comma-separated)
          # if you accept issues from other bots / collaborators.
          SPRITES_INGESTER_ALLOWED_AUTHORS: >-
            ${{ github.repository_owner }},app/copilot-swe-agent

          # Kill the GraphQL search-indexing lag: force-fetch the triggering
          # issue by number (REST-backed, immediately consistent) so a
          # freshly-labeled issue is never missed by the sweep. Empty on
          # `workflow_dispatch` runs — the sweep alone handles that case.
          SPRITES_INGESTER_TARGET_ISSUE: ${{ github.event.issue.number }}

          # Stale-claim recovery: if a prior run enqueued an issue but the
          # worker never wrote a `completed` status doc within this many ms,
          # drop the claim so this poll re-enqueues it. 45 min is chosen to
          # exceed any healthy pipeline run + Azure queue visibility timeout,
          # so a legitimately-in-flight worker won't be steamrolled.
          # Combined with the heartbeat check (see `isClaimStale`) this makes
          # stuck runs self-healing on the next issue event / manual dispatch.
          SPRITES_INGESTER_STALE_CLAIM_TTL_MS: '2700000'

          # Emitted verbatim by the ingester as the "Workflow run" link in
          # its enqueue comment. Downstream automation can follow the link
          # to check whether this specific run actually produced artifacts.
          SPRITES_INGEST_RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Coordinated drain mode. The 3-poll fallback remains unchanged for
          # standalone workers; this workflow exits only after its producer has
          # durably completed and the two worker slots confirm empty.
          SPRITES_WORKER_DRAIN: 'true'
          SPRITES_WORKER_MAX_EMPTY_POLLS: '3'
          SPRITES_WORKER_POLL_MS: '1000'
          SPRITES_WORKER_CONCURRENCY: '2'

          # ADR-0043 bypass for Constitutional §3. The asset-request worker is
          # the ONLY sanctioned CI caller of `synthesizeBrief` and `judgeVariant`.
          # Both of those otherwise refuse to run in CI (non-deterministic, costs
          # Azure credits). See docs/knowledge/adr/0043-ci-asset-request-worker-bypass.md
          # for the rationale + cost/abuse mitigations.
          #
          # DO NOT copy this env var into any other workflow. `checkin.ts` and
          # `asset-pr.ts` (which push commits / open PRs) remain hard-blocked
          # in CI regardless of this flag — the bypass is narrowly scoped to
          # synth + judge, which are the two calls the drain worker needs.
          SPRITES_ALLOW_CI_PIPELINE: 'true'
        run: bash scripts/sprites/asset-request-pipeline.sh

      # Publishing is deliberately sequential and runs even when the current
      # drain observed an unrelated failure. It authoritatively scans every
      # completed checkpoint, stages approvals outside the checkout, CAS-unions
      # them onto assets/queue, and creates or updates the one canonical art PR.
      - name: Publish selected variants
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.CRAWLER_CI_PAT }}
          LOG_LEVEL: info
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_RUNS_CONTAINER: ${{ secrets.AZURE_STORAGE_RUNS_CONTAINER }}
          SPRITES_RUN_STORE: ${{ secrets.SPRITES_RUN_STORE || 'azure-blob' }}
          SPRITES_ALLOW_CI_ASSET_PUBLISH: 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run sprites:publish-selected
