name: CI Recovery Review Wake Bridge

on:
  workflow_run:
    workflows: ['CI Recovery Router']
    types: [completed]

permissions: {}

jobs:
  inspect:
    if: ${{ github.event.workflow_run.conclusion == 'action_required' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.inspect.outputs.pr_number }}
      trigger: ${{ steps.inspect.outputs.trigger }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
    steps:
      - name: Checkout trusted bridge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Inspect parked trusted review wake
        id: inspect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/ci-recovery/review-wake-bridge.mjs

  dispatch:
    needs: inspect
    if: ${{ github.run_attempt == 1 && needs.inspect.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch exact PR recovery
        uses: actions/github-script@v7
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          RECOVERY_TRIGGER: ${{ needs.inspect.outputs.trigger }}
          EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          EXPECTED_BASE_REF: ${{ github.event.repository.default_branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-recovery.yml',
              ref: process.env.DEFAULT_BRANCH,
              inputs: {
                operation: 'reconcile',
                pr_number: process.env.PR_NUMBER,
                trigger: process.env.RECOVERY_TRIGGER,
                expected_head_sha: process.env.EXPECTED_HEAD_SHA,
                expected_base_ref: process.env.EXPECTED_BASE_REF,
                lease_id: '',
              },
            });
