name: Copilot Session Guard

# Posts a GitHub commit status on the `copilot/session-active` context to act
# as a soft merge lock while a Copilot agent session is in progress.
#
# How it works:
#   push to copilot/** → status set to `pending` (merge blocked)
#   PR opened on non-copilot branch → status set to `success` (no lock needed)
#   workflow_dispatch → agent manually sets the final state when done
#
# Branch protection setup (one-time, repo admin required):
#   Settings → Branches → Add rule for `copilot/**`
#   ☑ Require status checks to pass before merging
#   Add status check: copilot/session-active
#
# Agents: run the unlock command at the end of every session (see AGENTS.md).

on:
  push:
    branches:
      - 'copilot/**'
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to update status on'
        required: true
        type: string
      state:
        description: 'Status state'
        required: true
        default: 'success'
        type: choice
        options:
          - pending
          - success
          - failure
          - error
      description:
        description: 'Status description (optional)'
        required: false
        default: ''
        type: string

permissions:
  statuses: write

jobs:
  # Every push to a copilot branch auto-sets the status to pending so that
  # mid-session pushes keep the lock active without any extra agent action.
  # Exception: a commit whose message contains "[session-complete]" posts
  # success instead, unlocking the PR without needing gh workflow run.
  lock-on-push:
    name: Lock — pending on copilot push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Post status (pending or success)
        uses: actions/github-script@v7
        with:
          script: |
            const msg = context.payload.head_commit?.message ?? '';
            const unlocking = msg.includes('[session-complete]');
            const state = unlocking ? 'success' : 'pending';
            const description = unlocking
              ? 'Copilot session complete'
              : 'Copilot session in progress — do not merge';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'copilot/session-active',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Posted ${state} status on ${context.sha}`);

  # Non-agent PRs get an immediate success so branch protection doesn't block
  # them with a "never reported" pending state.
  init-on-pr-open:
    name: Init — success on non-agent PR open
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Post success status (non-agent PR)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'copilot/session-active',
              description: 'No active Copilot session',
            });
            core.info(`Posted success status on ${context.payload.pull_request.head.sha}`);

  # Called by the agent at end of session to unlock the branch.
  # See AGENTS.md for the exact gh CLI command.
  manual-update:
    name: Manual status update
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Post status
        uses: actions/github-script@v7
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_STATE: ${{ inputs.state }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
        with:
          script: |
            const sha = process.env.INPUT_SHA;
            const state = process.env.INPUT_STATE;
            const rawDesc = process.env.INPUT_DESCRIPTION;
            const description = rawDesc || (
              state === 'pending' ? 'Copilot session in progress — do not merge' :
              state === 'success' ? 'Copilot session complete' :
              'Copilot session ended with errors'
            );
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'copilot/session-active',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Posted ${state} status on ${sha}: ${description}`);
