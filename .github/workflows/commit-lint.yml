name: commit-lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '**'

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # PRs squash-merge, so the PR TITLE — not the intermediate commit subjects,
      # which are discarded — becomes the commit subject on main. Linting the
      # commit range therefore blocked merges over WIP messages that never ship.
      # Instead lint the title, via the title-specific config that drops the
      # base `(#n)`/`merge:` history ignores (those would let a malformed
      # user-controlled title bypass the gate). pr-preflight checks this
      # agent-side too; this is the CI-side, non-bypassable enforcement.
      # PR_TITLE is passed via env (never interpolated into the shell) so a
      # crafted title cannot inject commands.
      - name: Validate PR title (squash-merge subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --config commitlint.title.config.cjs --verbose
