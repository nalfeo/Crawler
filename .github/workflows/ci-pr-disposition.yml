name: CI PR Disposition

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  disposition:
    concurrency:
      group: crawler-ci-pr-disposition
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted disposition script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Detect and close provable duplicate PRs
        uses: actions/github-script@v7
        with:
          script: |
            // Duplicate detection — deterministic proof rules only.
            // Auto-closes a PR ONLY when one of the two proof rules fires:
            //   1. linked-issue-closed-by-sibling: a closing issue is CLOSED and a merged sibling closes it
            //   2. empty-diff: the PR's diff is zero (all changes already on main)
            //   3. coordinator-superseded: coordinator marked this PR as a full-tree no-op (legacy, retained)
            // SIBLING_MERGED: merged sibling closes same issue (issue may still be open) — suspicious
            //   but NOT a proof. Routes to quarantine (adds abandon-candidate label for step 2 pickup).
            // Any uncertainty routes to quarantine (step 2), never to auto-close.
            //
            // Scope: ALL open PRs except those already quarantined or abandoned.
            // A PR that can hold a blocking slot must be checked, regardless of labels.
            //
            // Golden fixture: PR #1630 / PR #1575 / issue #1568 — rule 1 fires,
            // closes #1630, cites #1575 as the superseder.

            const { pathToFileURL } = await import('url');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { detectDuplicateProof, detectQuarantineEvidence } = await import(
              pathToFileURL(`${workspace}/.github/scripts/ci-recovery/duplicate-detect.mjs`).href
            );
            const {
              PHASE,
              LIFECYCLE_MARKER,
              PHASE_LABELS,
              applyLifecycleDecision,
              makeDuplicateCloseComment,
              parseLifecycleComment,
            } = await import(
              pathToFileURL(`${workspace}/.github/scripts/ci-recovery/pr-lifecycle.mjs`).href
            );

            const { owner, repo } = context.repo;
            const ABANDON_CANDIDATE_LABEL = 'abandon-candidate';
            const QUARANTINED_LABEL = PHASE_LABELS[PHASE.QUARANTINED]; // 'ci-lifecycle-quarantined'
            const ABANDONED_LABEL = PHASE_LABELS[PHASE.ABANDONED]; // 'ci-lifecycle-abandoned'

            // Coordinator-based superseded detection (legacy proof rule — retained).
            const COORDINATOR_MARKER = '<!-- crawler-ci-conflict-coordinator:v1 -->';
            const COORDINATOR_DATA_PREFIX = '<!-- crawler-ci-conflict-coordinator-data:';
            const COORDINATOR_APP_ID = 990625;

            function isTrustedComment(comment) {
              const appId = comment.performed_via_github_app?.id;
              if (appId && Number(appId) === COORDINATOR_APP_ID) return true;
              const assoc = String(comment.author_association || '').toUpperCase();
              return ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc);
            }

            function parseCoordinatorState(body) {
              if (!String(body || '').trimStart().startsWith(COORDINATOR_MARKER)) return null;
              const escaped = COORDINATOR_DATA_PREFIX.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = String(body).match(new RegExp(`${escaped}([A-Za-z0-9_-]+)\\s*-->`));
              if (!match) return null;
              try { return JSON.parse(Buffer.from(match[1], 'base64url').toString('utf8')); }
              catch { return null; }
            }

            async function upsertLifecycleComment(prNumber, body) {
              const existingComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = existingComments.find((c) => String(c.body || '').includes(LIFECYCLE_MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            async function getClosingIssues(prNumber) {
              try {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        closingIssuesReferences(first: 100) {
                          nodes { number state }
                        }
                      }
                    }
                  }
                `, { owner, repo, number: prNumber });
                return result.repository?.pullRequest?.closingIssuesReferences?.nodes || [];
              } catch (error) {
                core.warning(`getClosingIssues pr=#${prNumber}: ${error.message}`);
                return [];
              }
            }

            // Fetch at least maxMerged recently-merged PRs and their closing issues.
            // Paginates until enough merged PRs are collected (not just closed PRs).
            async function buildMergedSiblingIndex(maxMerged = 60) {
              const siblingsByIssue = new Map();
              let mergedCount = 0;
              for await (const page of github.paginate.iterator(github.rest.pulls.list, {
                owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
              })) {
                for (const pr of page.data) {
                  if (!pr.merged_at) continue; // skip unmerged closed PRs
                  const issues = await getClosingIssues(pr.number);
                  if (!issues.length) { mergedCount++; continue; }
                  const issueNums = issues.map((i) => Number(i.number));
                  const entry = { number: pr.number, merged: true, closingIssueNumbers: issueNums };
                  for (const n of issueNums) {
                    if (!siblingsByIssue.has(n)) siblingsByIssue.set(n, []);
                    siblingsByIssue.get(n).push(entry);
                  }
                  mergedCount++;
                  if (mergedCount >= maxMerged) break;
                }
                if (mergedCount >= maxMerged) break;
              }
              return siblingsByIssue;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            // Scope: ALL open PRs except those already quarantined or abandoned.
            // A PR that holds a blocking cluster/ordering slot must be evaluated
            // regardless of which other labels it carries.
            const inScope = pulls.filter((p) => {
              const labels = (p.labels || []).map((l) => String(l.name || ''));
              return !labels.includes(QUARANTINED_LABEL) && !labels.includes(ABANDONED_LABEL);
            });

            if (!inScope.length) {
              core.info('duplicate-detection: no in-scope PRs, skipping');
              return;
            }

            const siblingsByIssue = await buildMergedSiblingIndex();

            let closedCount = 0;
            let suspiciousCount = 0;
            const closedPrNumbers = [];

            for (const pull of inScope) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number, per_page: 100,
              });

              // Coordinator-based superseded check (legacy proof rule, retained).
              const coordComment = comments.find(
                (c) => String(c.body || '').trimStart().startsWith(COORDINATOR_MARKER) && isTrustedComment(c),
              );
              if (coordComment) {
                const state = parseCoordinatorState(coordComment.body);
                const proofs = Array.isArray(state?.proofs) ? state.proofs : [];
                const prProof = proofs.find((p) => Number(p.number) === Number(pull.number));
                if (prProof?.status === 'superseded') {
                  const representedBy = (prProof.representedBy || []).join(', #') || 'main';
                  const closeBody = makeDuplicateCloseComment(pull.number, {
                    proofRule: 'empty-diff',
                    supersederPr: Number((prProof.representedBy || [])[0]) || null,
                    reason: `coordinator-superseded fingerprint=${String(prProof.fingerprint || '').slice(0, 12)} represented-by=#${representedBy}`,
                  });
                  await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body: closeBody });
                  await applyLifecycleDecision({
                    prNumber: pull.number,
                    currentPhase: null,
                    targetPhase: PHASE.ABANDONED,
                    blockReason: `coordinator-superseded:represented-by-${representedBy}`,
                    headSha: pull.head.sha,
                    mode: 'live',
                    writeComment: (n, body) => upsertLifecycleComment(n, body),
                    addLabel: async (n, label) => { try { await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [label] }); } catch (e) { core.warning(`addLabel pr=#${n} label=${label}: ${e.message}`); } },
                    removeLabel: async (n, label) => { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: label }); } catch (e) { if (e.status !== 404) core.warning(`removeLabel pr=#${n} label=${label}: ${e.message}`); } },
                  });
                  await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
                  closedPrNumbers.push(pull.number);
                  closedCount += 1;
                  core.notice(`closed-duplicate pr=#${pull.number} rule=coordinator-superseded represented-by=#${representedBy}`);
                  continue;
                }
              }

              // New deterministic proof rules (Issue 8).
              const closingIssues = await getClosingIssues(pull.number);
              const ownIssueNums = closingIssues.map((i) => Number(i.number));
              const mergedSiblings = ownIssueNums.flatMap((n) => siblingsByIssue.get(n) || []);
              const dedupedSiblings = [...new Map(mergedSiblings.map((s) => [s.number, s])).values()];

              // Fetch full PR details (needed for additions/deletions — not in list response).
              let fullPr = pull;
              try {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pull.number });
                fullPr = data;
              } catch (e) {
                core.warning(`pulls.get pr=#${pull.number}: ${e.message}`);
              }

              const proof = detectDuplicateProof(
                { number: pull.number, additions: fullPr.additions, deletions: fullPr.deletions },
                { closingIssues, mergedSiblings: dedupedSiblings },
              );

              if (proof.proofRule) {
                const closeBody = makeDuplicateCloseComment(pull.number, proof);
                await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body: closeBody });
                await applyLifecycleDecision({
                  prNumber: pull.number,
                  currentPhase: null,
                  targetPhase: PHASE.ABANDONED,
                  blockReason: `duplicate-${proof.proofRule}`,
                  headSha: pull.head.sha,
                  mode: 'live',
                  writeComment: (n, body) => upsertLifecycleComment(n, body),
                  addLabel: async (n, label) => { try { await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [label] }); } catch (e) { core.warning(`addLabel pr=#${n} label=${label}: ${e.message}`); } },
                  removeLabel: async (n, label) => { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: label }); } catch (e) { if (e.status !== 404) core.warning(`removeLabel pr=#${n} label=${label}: ${e.message}`); } },
                });
                await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
                closedPrNumbers.push(pull.number);
                closedCount += 1;
                core.notice(`closed-duplicate pr=#${pull.number} rule=${proof.proofRule} superseder=${proof.supersederPr ?? 'none'} reason=${proof.reason}`);
                continue;
              }

              // SIBLING_MERGED is quarantine evidence (not a proof): merged sibling closes
              // same issue but issue may still be open. Tag for quarantine in step 2.
              const evidence = detectQuarantineEvidence(
                { number: pull.number },
                { closingIssues, mergedSiblings: dedupedSiblings },
              );
              if (evidence.evidenceRule) {
                const labelNames = (pull.labels || []).map((l) => String(l.name || ''));
                if (!labelNames.includes(ABANDON_CANDIDATE_LABEL)) {
                  try {
                    await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: [ABANDON_CANDIDATE_LABEL] });
                    suspiciousCount += 1;
                    core.notice(`sibling-merged-suspect pr=#${pull.number} evidence=${evidence.evidenceRule} superseder=${evidence.supersederPr ?? 'none'} → tagged abandon-candidate for quarantine`);
                  } catch (e) {
                    core.warning(`addLabel abandon-candidate pr=#${pull.number}: ${e.message}`);
                  }
                }
              }
            }

            core.info(`duplicate-detection complete closed=${closedCount} suspicious-tagged=${suspiciousCount} prs=${closedPrNumbers.join(',')}`);

      - name: Quarantine abandon-candidate PRs (lifecycle FSM, non-blocking)
        uses: actions/github-script@v7
        with:
          script: |
            // Quarantine: PRs that are likely-superfluous but NOT provably so are
            // moved to the lifecycle QUARANTINED phase. This:
            //   - Immediately evicts them from every blocking position (D11 invariant).
            //   - Applies human-approval-required so they can't accidentally merge.
            //   - Posts a human-decision comment with an exact KEEP/ABANDON resolve path.
            //   - Never auto-closes — waits for the owner.
            //
            // Quarantine criteria (any one triggers):
            //   1. ci-recovery-waiting + no owner + idle ≥ ABANDON_THRESHOLD_DAYS
            //      with corroborating evidence (closed linked issue or sibling suspect)
            //   2. abandon-candidate label (explicit human/agent proposal, OR step 1 sibling-suspect)
            //
            // A PR behind a quarantined PR is still admitted and merged (D11).

            const { pathToFileURL } = await import('url');
            const workspace = process.env.GITHUB_WORKSPACE;
            const {
              PHASE,
              LIFECYCLE_MARKER,
              PHASE_LABELS,
              applyLifecycleDecision,
              makeQuarantineComment,
              parseLifecycleComment,
            } = await import(
              pathToFileURL(`${workspace}/.github/scripts/ci-recovery/pr-lifecycle.mjs`).href
            );

            const { owner, repo } = context.repo;
            const WAITING_LABEL = 'ci-recovery-waiting';
            const OWNER_LABEL_PREFIX = 'ci-owner-pr-';
            const ABANDON_THRESHOLD_DAYS = 14;
            const ABANDON_CANDIDATE_LABEL = 'abandon-candidate';
            const QUARANTINED_LABEL = PHASE_LABELS[PHASE.QUARANTINED]; // 'ci-lifecycle-quarantined'
            const ABANDONED_LABEL = PHASE_LABELS[PHASE.ABANDONED];     // 'ci-lifecycle-abandoned'
            const HUMAN_APPROVAL_LABEL = 'human-approval-required';
            const STATE_MARKER = '<!-- crawler-ci-state:v1 -->';

            const now = new Date();
            const thresholdMs = ABANDON_THRESHOLD_DAYS * 24 * 60 * 60 * 1000;

            function parseStateComment(body) {
              const encoded = String(body || '').match(/<!-- crawler-ci-state-data:([A-Za-z0-9_-]+)\s*-->/);
              if (!encoded) return null;
              try { return JSON.parse(Buffer.from(encoded[1], 'base64url').toString('utf8')); }
              catch { return null; }
            }

            async function upsertLifecycleComment(prNumber, body) {
              const existingComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = existingComments.find((c) => String(c.body || '').includes(LIFECYCLE_MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            async function getClosingIssues(prNumber) {
              try {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        closingIssuesReferences(first: 100) {
                          nodes { number state }
                        }
                      }
                    }
                  }
                `, { owner, repo, number: prNumber });
                return result.repository?.pullRequest?.closingIssuesReferences?.nodes || [];
              } catch (error) {
                core.warning(`getClosingIssues pr=#${prNumber}: ${error.message}`);
                return [];
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            let quarantinedCount = 0;
            const quarantinedPrNumbers = [];

            for (const pull of pulls) {
              const labelNames = (pull.labels || []).map((l) => String(l.name || ''));

              // Skip already quarantined/abandoned PRs.
              if (labelNames.includes(QUARANTINED_LABEL)) continue;
              if (labelNames.includes(ABANDONED_LABEL)) continue;

              // Determine why this PR is a quarantine candidate.
              let quarantineReason = null;
              let lastActivityIso = null;

              if (labelNames.includes(ABANDON_CANDIDATE_LABEL)) {
                // Explicit proposal by a human, agent, or step 1 sibling-suspect tagging.
                quarantineReason = 'abandon-candidate-label';
              } else if (labelNames.includes(WAITING_LABEL) && !labelNames.some((n) => n.startsWith(OWNER_LABEL_PREFIX))) {
                // Waiting with no active owner — check if stale WITH corroborating evidence.
                // Require a closed linked issue (not just idleness) to reduce false positives.
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: pull.number, per_page: 100,
                });
                const stateComment = comments.find((c) => String(c.body || '').trimStart().startsWith(STATE_MARKER));
                if (stateComment) {
                  const state = parseStateComment(stateComment.body);
                  if (state && state.owner === 'none') {
                    const lastProgress = Date.parse(state.progressAt || state.updatedAt || '');
                    if (Number.isFinite(lastProgress) && now.getTime() - lastProgress >= thresholdMs) {
                      // Require corroborating evidence: at least one closing issue must be CLOSED.
                      const closingIssues = await getClosingIssues(pull.number);
                      const hasClosedLinkedIssue = closingIssues.some(
                        (i) => String(i?.state ?? '').toUpperCase() === 'CLOSED',
                      );
                      if (hasClosedLinkedIssue) {
                        quarantineReason = `dead-session-${ABANDON_THRESHOLD_DAYS}-days-closed-issue`;
                        lastActivityIso = new Date(lastProgress).toISOString();
                      } else {
                        core.info(`stale-pr pr=#${pull.number} idle>${ABANDON_THRESHOLD_DAYS}d but no closed linked issue — skipping quarantine`);
                      }
                    }
                  }
                }
              }

              if (!quarantineReason) continue;

              // Apply lifecycle QUARANTINED via the authoritative FSM.
              await applyLifecycleDecision({
                prNumber: pull.number,
                currentPhase: null,
                targetPhase: PHASE.QUARANTINED,
                blockReason: `quarantine:${quarantineReason}`,
                headSha: pull.head.sha,
                mode: 'live',
                writeComment: (n, body) => upsertLifecycleComment(n, body),
                addLabel: async (n, label) => { try { await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [label] }); } catch (e) { core.warning(`addLabel pr=#${n} label=${label}: ${e.message}`); } },
                removeLabel: async (n, label) => { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: label }); } catch (e) { if (e.status !== 404) core.warning(`removeLabel pr=#${n} label=${label}: ${e.message}`); } },
              });

              // Apply human-approval-required to block accidental merge while quarantined.
              if (!labelNames.includes(HUMAN_APPROVAL_LABEL)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: [HUMAN_APPROVAL_LABEL] });
              }

              // Post the human-decision comment (KEEP / ABANDON).
              const quarantineBody = makeQuarantineComment(pull.number, {
                reason: quarantineReason,
                lastActivity: lastActivityIso || undefined,
                thresholdDays: quarantineReason.startsWith('dead-session') ? ABANDON_THRESHOLD_DAYS : undefined,
              });
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body: quarantineBody });

              quarantinedPrNumbers.push(pull.number);
              quarantinedCount += 1;
              core.notice(`quarantined pr=#${pull.number} reason=${quarantineReason} last-activity=${lastActivityIso ?? 'n/a'}`);
            }

            core.info(`quarantine complete quarantined=${quarantinedCount} prs=${quarantinedPrNumbers.join(',')}`);

      - name: Handle KEEP/ABANDON human-decision comments (quarantine revival)
        uses: actions/github-script@v7
        with:
          script: |
            // Revival handler: scan quarantined PRs for owner KEEP or ABANDON commands.
            //
            // Rules (acceptance criterion: "human-gated revival is exact-match"):
            //   - Only the PR author/owner's standalone trimmed "KEEP" or "ABANDON" acts.
            //   - Green CI, other authors, quoted text, or substrings do NOT trigger.
            //   - Commands must appear AFTER the most recent quarantine comment — prevents
            //     stale pre-quarantine commands from acting on a newly quarantined PR.
            //   - KEEP → revive to QUEUED (remove quarantine + human-approval-required, add merge-train)
            //   - ABANDON → close the PR permanently
            //
            // A revived PR re-enters the normal lifecycle cleanly with no orphaned fences.

            const { pathToFileURL } = await import('url');
            const workspace = process.env.GITHUB_WORKSPACE;
            const {
              PHASE,
              LIFECYCLE_MARKER,
              PHASE_LABELS,
              applyLifecycleDecision,
              parseLifecycleComment,
            } = await import(
              pathToFileURL(`${workspace}/.github/scripts/ci-recovery/pr-lifecycle.mjs`).href
            );
            const {
              parseDispositionCommand,
              QUARANTINE_COMMENT_MARKER,
            } = await import(
              pathToFileURL(`${workspace}/.github/scripts/ci-recovery/state.mjs`).href
            );

            const { owner, repo } = context.repo;
            const QUARANTINED_LABEL = PHASE_LABELS[PHASE.QUARANTINED]; // 'ci-lifecycle-quarantined'
            const HUMAN_APPROVAL_LABEL = 'human-approval-required';

            async function upsertLifecycleComment(prNumber, body) {
              const existingComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = existingComments.find((c) => String(c.body || '').includes(LIFECYCLE_MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            const quarantinedPulls = pulls.filter((p) =>
              (p.labels || []).some((l) => l.name === QUARANTINED_LABEL),
            );

            if (!quarantinedPulls.length) {
              core.info('revival-handler: no quarantined PRs found');
              return;
            }

            let revivedCount = 0;
            let abandonedCount = 0;

            for (const pull of quarantinedPulls) {
              const prOwnerLogin = String(pull.user?.login || '').toLowerCase();
              if (!prOwnerLogin) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number, per_page: 100,
              });

              // Find the LATEST quarantine comment to anchor KEEP/ABANDON commands.
              // Only commands posted AFTER the quarantine comment are honored; this
              // prevents a stale pre-quarantine KEEP/ABANDON from acting on a newly
              // quarantined PR.
              const quarantineComments = comments.filter(
                (c) => String(c.body || '').includes(QUARANTINE_COMMENT_MARKER),
              );
              if (!quarantineComments.length) {
                core.warning(`quarantined PR #${pull.number} has no quarantine comment — skipping revival check`);
                continue;
              }
              const latestQuarantine = quarantineComments.sort(
                (a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime(),
              )[0];
              const quarantineTime = new Date(latestQuarantine.created_at).getTime();

              // Find the LAST owner command posted after the quarantine comment.
              let command = null;
              for (const comment of comments) {
                // Only consider commands strictly after the quarantine comment.
                if (new Date(comment.created_at).getTime() <= quarantineTime) continue;
                const authorLogin = String(comment.user?.login || '').toLowerCase();
                if (authorLogin !== prOwnerLogin) continue;
                const parsed = parseDispositionCommand(comment.body);
                if (parsed) command = parsed; // last owner command wins
              }

              if (!command) continue;

              if (command === 'KEEP') {
                // Revive: remove quarantine, remove human-approval-required, set QUEUED.
                await applyLifecycleDecision({
                  prNumber: pull.number,
                  currentPhase: PHASE.QUARANTINED,
                  currentHeadSha: pull.head.sha,
                  targetPhase: PHASE.QUEUED,
                  blockReason: null,
                  headSha: pull.head.sha,
                  mode: 'live',
                  writeComment: (n, body) => upsertLifecycleComment(n, body),
                  addLabel: async (n, label) => { try { await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [label] }); } catch (e) { core.warning(`addLabel pr=#${n} label=${label}: ${e.message}`); } },
                  removeLabel: async (n, label) => { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: label }); } catch (e) { if (e.status !== 404) core.warning(`removeLabel pr=#${n} label=${label}: ${e.message}`); } },
                });
                // Also remove human-approval-required if present (quarantine placed it).
                const labelNames = (pull.labels || []).map((l) => l.name);
                if (labelNames.includes(HUMAN_APPROVAL_LABEL)) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: pull.number, name: HUMAN_APPROVAL_LABEL });
                  } catch (e) {
                    if (e.status !== 404) core.warning(`removeLabel human-approval-required pr=#${pull.number}: ${e.message}`);
                  }
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull.number,
                  body: `<!-- crawler-ci-disposition:v1 -->\nPR revived by owner comment \`KEEP\`. Re-entering normal lifecycle as \`queued\`.`,
                });
                revivedCount += 1;
                core.notice(`revived pr=#${pull.number} command=KEEP owner=${prOwnerLogin}`);
              } else if (command === 'ABANDON') {
                // Abandon: update lifecycle to ABANDONED, close the PR.
                await applyLifecycleDecision({
                  prNumber: pull.number,
                  currentPhase: PHASE.QUARANTINED,
                  currentHeadSha: pull.head.sha,
                  targetPhase: PHASE.ABANDONED,
                  blockReason: 'owner-abandon-command',
                  headSha: pull.head.sha,
                  mode: 'live',
                  writeComment: (n, body) => upsertLifecycleComment(n, body),
                  addLabel: async (n, label) => { try { await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [label] }); } catch (e) { core.warning(`addLabel pr=#${n} label=${label}: ${e.message}`); } },
                  removeLabel: async (n, label) => { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: label }); } catch (e) { if (e.status !== 404) core.warning(`removeLabel pr=#${n} label=${label}: ${e.message}`); } },
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull.number,
                  body: `<!-- crawler-ci-disposition:v1 -->\nPR closed by owner comment \`ABANDON\`.`,
                });
                await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
                abandonedCount += 1;
                core.notice(`abandoned pr=#${pull.number} command=ABANDON owner=${prOwnerLogin}`);
              }
            }

            core.info(`revival-handler complete revived=${revivedCount} abandoned=${abandonedCount}`);
