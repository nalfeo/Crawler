name: CI Liveness Sweep

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile-liveness:
    concurrency:
      group: crawler-ci-liveness-sweep
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger CI Recovery router sweep
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-recovery-router.yml',
              ref,
            });
            core.notice(`dispatched ci-recovery-router.yml ref=${ref}`);

      - name: Trigger CI conflict coordinator sweep
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-conflict-coordinator.yml',
              ref,
            });
            core.notice(`dispatched ci-conflict-coordinator.yml ref=${ref}`);

      - name: Scan for parked action_required/cancelled checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            const workflowsToCheck = ['ci.yml', 'security-review.yml'];
            const scanModes = [
              { label: 'action_required', status: 'action_required' },
              { label: 'cancelled', status: 'cancelled' },
            ];
            // Bound per sweep to prevent burst-dispatching when many runs are parked.
            const cap = 3;
            let dispatched = 0;
            for (const workflowId of workflowsToCheck) {
              if (dispatched >= cap) break;
              for (const scanMode of scanModes) {
                if (dispatched >= cap) break;
                let runs;
                try {
                  runs = await github.rest.actions.listWorkflowRuns({
                    owner,
                    repo,
                    workflow_id: workflowId,
                    status: scanMode.status,
                    per_page: 20,
                  });
                } catch (error) {
                  core.notice(`skip ${scanMode.label} scan workflow=${workflowId}: ${error.message}`);
                  continue;
                }
                for (const run of runs.data.workflow_runs) {
                  if (dispatched >= cap) break;
                  const linkedPrNumber = run.pull_requests?.[0]?.number;
                  if (!linkedPrNumber) {
                    core.notice(`skip ${scanMode.label} run=${run.id}: no-linked-pr`);
                    continue;
                  }
                  let pull;
                  try {
                    pull = await github.rest.pulls.get({
                      owner,
                      repo,
                      pull_number: linkedPrNumber,
                    });
                  } catch (error) {
                    core.notice(`skip ${scanMode.label} run=${run.id}: pr-load-failed (${error.message})`);
                    continue;
                  }
                  if (pull.data.state !== 'open' || pull.data.draft) {
                    core.notice(
                      `skip ${scanMode.label} run=${run.id}: pr-not-open-non-draft (#${linkedPrNumber})`,
                    );
                    continue;
                  }
                  try {
                    await github.rest.actions.createWorkflowDispatch({
                      owner,
                      repo,
                      workflow_id: 'action-required-retrigger.yml',
                      ref,
                      inputs: { run_id: String(run.id) },
                    });
                    dispatched += 1;
                    core.notice(
                      `dispatched action-required-retrigger run=${run.id} workflow=${workflowId} mode=${scanMode.label}`,
                    );
                  } catch (error) {
                    core.notice(`skip action-required-retrigger run=${run.id}: ${error.message}`);
                  }
                }
              }
            }
            core.info(`action-required/cancelled backstop sweep complete dispatched=${dispatched} cap=${cap}`);

      - name: Trigger disposition detection
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-pr-disposition.yml',
              ref,
            });
            core.notice(`dispatched ci-pr-disposition.yml ref=${ref}`);

      # Every step above dispatches and forgets. During the 2026-07-30 stoppage
      # they kept firing on schedule for ~7 hours while every dispatched CI
      # Recovery run 403'd on an exhausted owner-PAT budget, so no lease was ever
      # reaped and no `merge-train` label was ever applied. Nothing noticed.
      #
      # This step closes the loop by verifying the harvest actually completes.
      # It deliberately runs on the workflow's own GITHUB_TOKEN: that budget is
      # scoped per repository installation and is independent of the shared
      # owner-PAT bucket, so the alarm survives the exact failure it reports.
      - name: Verify stale-session harvest liveness
        uses: actions/github-script@v7
        env:
          HARVEST_LIVENESS_THRESHOLD_MINUTES: ${{ vars.HARVEST_LIVENESS_THRESHOLD_MINUTES || '60' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const lib = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-recovery/harvest-liveness.mjs`,
              ).href
            );

            const { owner, repo } = context.repo;
            const thresholdMinutes =
              Number.parseInt(process.env.HARVEST_LIVENESS_THRESHOLD_MINUTES, 10) ||
              lib.DEFAULT_HARVEST_THRESHOLD_MINUTES;

            const now = new Date();
            const harvestRuns = await lib.collectRecentReconcileHarvestRuns({
              listWorkflowRuns: (params) => github.rest.actions.listWorkflowRuns(params),
              owner,
              repo,
              workflowId: 'ci-recovery.yml',
              thresholdMinutes,
              now,
            });
            const summary = lib.summarizeHarvestRuns(harvestRuns, now);

            const openPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const backlogCount = openPulls.data.filter((pull) => !pull.draft).length;

            const verdict = lib.evaluateHarvestLiveness({
              summary,
              backlogCount,
              thresholdMinutes,
            });

            core.info(
              `harvest-liveness stalled=${verdict.stalled} reason=${verdict.reason} ` +
                `lastSuccess=${summary.lastSuccessAt ?? 'none'} ` +
                `minutesSinceSuccess=${summary.minutesSinceSuccess ?? 'n/a'} ` +
                `failuresSinceSuccess=${summary.consecutiveFailures} backlog=${backlogCount}`,
            );

            // Adapt octokit to the request/paginate shape the library expects.
            const paginate = async (_token, path) => github.paginate(`GET ${path}`);
            const request = async (_token, path, options = {}) => {
              const response = await github.request(
                `${options.method || 'GET'} ${path}`,
                options.body || {},
              );
              return { data: response.data };
            };

            const result = await lib.reconcileHarvestIncident({
              request,
              paginate,
              token: null,
              owner,
              repo,
              verdict,
              summary,
              backlogCount,
              thresholdMinutes,
              workflowRunUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

            if (verdict.stalled) {
              core.warning(
                `stale-session harvest is STALLED (${verdict.reason}); incident ${result.action}` +
                  (result.issueNumber ? ` #${result.issueNumber}` : ''),
              );
            } else {
              core.notice(`stale-session harvest healthy; incident ${result.action}`);
            }

      # Issue #2453: Detect PRs where auto-merge was silently cleared by an
      # automation-driven head advance (update-branch / conflict-coordinator
      # rebase / merge-train branch update).  These PRs look healthy from the
      # outside (passing checks, no labels) but will never merge because
      # nothing is armed — they are externally indistinguishable from a
      # dormant PR.
      #
      # A clean PR (mergeable_state='clean') with auto_merge=null and no
      # blocking labels SHOULD have auto-merge armed.  Finding it without is
      # a high-signal dormancy indicator.  Dispatching a fresh CI Recovery
      # reconcile run causes the loop to re-arm auto-merge immediately.
      #
      # Cap: at most 5 dispatches per sweep window to stay within the global
      # runner budget.  Additional dormant PRs are picked up in the next sweep.
      - name: Dispatch reconcile for dormant unarmed PRs
        uses: actions/github-script@v7
        env:
          UNARMED_WATCHDOG_DISPATCH_CAP: ${{ vars.UNARMED_WATCHDOG_DISPATCH_CAP || '5' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const lib = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-recovery/unarmed-pr-watchdog.mjs`,
              ).href
            );

            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            const cap = Math.max(
              1,
              Number.parseInt(process.env.UNARMED_WATCHDOG_DISPATCH_CAP, 10) || 5,
            );

            // Fetch all open non-draft PRs (base=main, one page — enough for
            // the signal; the sweep runs every 10 minutes so stragglers are
            // caught on the next pass).
            const pullsResp = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            });

            const dormant = lib.detectUnarmedMergeablePrs(pullsResp.data);

            core.info(
              `unarmed-watchdog found=${dormant.length} of ${pullsResp.data.length} open PRs dormant-unarmed cap=${cap}`,
            );

            const toDispatch = dormant.slice(0, cap);
            let dispatched = 0;
            for (const pull of toDispatch) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'ci-recovery.yml',
                  ref,
                  inputs: {
                    operation: 'reconcile',
                    pr_number: String(pull.number),
                    trigger: 'unarmed-watchdog',
                    lease_id: '',
                  },
                });
                dispatched += 1;
                core.notice(
                  `unarmed-watchdog dispatched reconcile pr=#${pull.number}`,
                );
              } catch (err) {
                core.warning(
                  `unarmed-watchdog dispatch failed pr=#${pull.number}: ${err.message}`,
                );
              }
            }

            if (dormant.length > cap) {
              core.notice(
                `unarmed-watchdog deferred=${dormant.length - cap} prs beyond cap=${cap}; will retry next sweep`,
              );
            }

            core.info(`unarmed-watchdog dispatched=${dispatched} cap=${cap}`);
