name: CI Liveness Sweep

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile-liveness:
    concurrency:
      group: crawler-ci-liveness-sweep
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger CI Recovery router sweep
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-recovery-router.yml',
              ref,
            });
            core.notice(`dispatched ci-recovery-router.yml ref=${ref}`);

      - name: Reclaim closed/merged owner fences
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            const cap = 2;
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const numbers = [...new Set(
              labels
                .map((label) => String(label.name || ''))
                .filter((name) => name.startsWith('ci-owner-pr-'))
                .map((name) => Number.parseInt(name.slice('ci-owner-pr-'.length), 10))
                .filter((number) => Number.isInteger(number) && number > 0),
            )].sort((a, b) => a - b);

            let dispatched = 0;
            for (const number of numbers) {
              if (dispatched >= cap) break;
              let pull;
              try {
                pull = (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: number,
                  })
                ).data;
              } catch (error) {
                const status = error?.status ? `status=${error.status}` : 'status=unknown';
                core.notice(`skip owner-fence #${number}: pull lookup failed (${status})`);
                continue;
              }
              if (String(pull.state || '').toLowerCase() === 'open') continue;
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci-recovery.yml',
                ref,
                inputs: {
                  operation: 'reconcile',
                  pr_number: String(number),
                  trigger: 'liveness-sweep:closed-owner-fence',
                  lease_id: '',
                },
              });
              dispatched += 1;
              core.notice(`reclaim owner-fence pr=#${number} state=${pull.state}`);
            }
            core.info(
              `closed-owner-fence sweep complete candidates=${numbers.length} dispatched=${dispatched} cap=${cap}`,
            );

      - name: Trigger CI conflict coordinator sweep
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-conflict-coordinator.yml',
              ref,
            });
            core.notice(`dispatched ci-conflict-coordinator.yml ref=${ref}`);

      - name: Trigger disposition detection when available
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'main';
            try {
              await github.rest.actions.getWorkflow({
                owner,
                repo,
                workflow_id: 'ci-pr-disposition.yml',
              });
            } catch (error) {
              if (error?.status === 404) {
                core.notice('skip disposition detection: ci-pr-disposition.yml not present');
                return;
              }
              throw error;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-pr-disposition.yml',
              ref,
            });
            core.notice(`dispatched ci-pr-disposition.yml ref=${ref}`);
