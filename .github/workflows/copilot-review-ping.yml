name: Copilot Review Comment Ping

on:
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to scan (defaults to all open PRs)
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ping-copilot-on-review-comments:
    name: File issue for open Copilot review comments
    # Run for Copilot review submissions (bot/app identities) and for PR-target
    # fallback events so we still scan when review-triggered runs are blocked.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request_target' ||
        github.event_name == 'pull_request_review'
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-review-ping-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Collect unresolved threads and file issue
        uses: actions/github-script@v7
        with:
          # Default GITHUB_TOKEN is sufficient: we create an issue and then try to
          # assign it to copilot. Assignment is best-effort because some repositories
          # do not allow that assignee identity, and the tracking issue itself is still
          # useful even when auto-assignment is unavailable.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const copilotReviewAuthors = new Set([
              'copilot-pull-request-reviewer',
              'copilot-pull-request-reviewer[bot]',
              'copilot',
              'copilot-swe-agent',
            ]);
            const issueLabel = 'copilot-review-comments';

            function normalizeLogin(login) {
              return login?.toLowerCase?.().trim?.() ?? '';
            }

            function isCopilotReviewAuthor(login) {
              return copilotReviewAuthors.has(normalizeLogin(login));
            }

            function issueTitleForPr(prNumber) {
              return `Copilot review comments: PR #${prNumber}`;
            }

            async function ensureIssueLabel() {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: issueLabel,
                  color: 'c084fc',
                  description: 'PR has unresolved Copilot code-review comments',
                });
              } catch (_) {
                // Label already exists — ignore.
              }
            }

            async function fetchOpenTrackingIssues() {
              return github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: issueLabel,
                per_page: 100,
              });
            }

            function findOpenTrackingIssue(openIssues, prNumber) {
              return openIssues.find((i) => i.title === issueTitleForPr(prNumber));
            }

            async function closeOpenTrackingIssue(openIssues, prNumber, reason) {
              const existing = findOpenTrackingIssue(openIssues, prNumber);
              if (!existing) return;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
              });
              core.info(`${reason} Closed tracking issue #${existing.number} for PR #${prNumber}.`);
            }

            async function assignCopilotBestEffort(issueNumber) {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: ['copilot'],
                });
              } catch (error) {
                core.warning(`Could not assign @copilot automatically: ${error.message}`);
              }
            }

            async function fetchReviewThreads(prNumber) {
              const allThreads = [];
              let after = null;

              while (true) {
                const query = `
                  query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $after) {
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 10) {
                              nodes {
                                author { login }
                                body
                                url
                                path
                                line
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }
                `;

                const result = await github.graphql(query, { owner, repo, number: prNumber, after });
                const page = result.repository.pullRequest.reviewThreads;
                allThreads.push(...page.nodes);

                if (!page.pageInfo.hasNextPage) break;
                after = page.pageInfo.endCursor;
              }

              return allThreads;
            }

            async function processPullRequest(prNumber, reviewHtmlUrl, openTrackingIssues) {
              core.info(`Processing PR #${prNumber}...`);

              // If the PR is already merged there is nothing left to fix — close any
              // open tracking issue and bail out.
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.data.merged) {
                await closeOpenTrackingIssue(
                  openTrackingIssues,
                  prNumber,
                  `PR #${prNumber} is already merged.`,
                );
                return;
              }

              const threads = await fetchReviewThreads(prNumber);

              // Keep only unresolved, non-outdated threads that contain at least one
              // comment authored by Copilot (the thread need not have been started by Copilot).
              const openThreads = threads.filter((thread) => {
                if (thread.isResolved || thread.isOutdated) return false;
                return thread.comments.nodes.some((comment) =>
                  isCopilotReviewAuthor(comment.author?.login),
                );
              });

              if (openThreads.length === 0) {
                await closeOpenTrackingIssue(
                  openTrackingIssues,
                  prNumber,
                  `No actionable unresolved Copilot review threads remain for PR #${prNumber}.`,
                );
                return;
              }

              const threadLines = openThreads.map((thread) => {
                const copilotComment =
                  thread.comments.nodes.find((comment) => isCopilotReviewAuthor(comment.author?.login)) ??
                  thread.comments.nodes[0];
                const location = copilotComment.path
                  ? `\`${copilotComment.path}\`` + (copilotComment.line ? ` line ${copilotComment.line}` : '')
                  : 'general';
                const excerpt = (copilotComment.body ?? '').split('\n')[0].slice(0, 120);
                return `- [${location}](${copilotComment.url}): ${excerpt}`;
              });

              const effectiveReviewUrl = reviewHtmlUrl ?? pr.data.html_url;
              const issueBody = [
                `PR #${prNumber} has ${openThreads.length} unresolved Copilot review thread(s).`,
                '',
                `Review: ${effectiveReviewUrl}`,
                '',
                'Open threads:',
                ...threadLines,
                '',
                `For each thread, please either address the feedback directly in PR #${prNumber} or reply to the thread explaining why the change will not be made (won't fix).`,
              ].join('\n');

              // Close old issue and create a fresh one so that the new assignment
              // re-triggers the Copilot coding agent (re-assigning an existing issue
              // may not fire the trigger a second time).
              const existing = findOpenTrackingIssue(openTrackingIssues, prNumber);
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                core.info(`Closed stale review issue #${existing.number} for PR #${prNumber}.`);
              }

              const created = await github.rest.issues.create({
                owner,
                repo,
                title: issueTitleForPr(prNumber),
                body: issueBody,
                labels: [issueLabel],
              });

              await assignCopilotBestEffort(created.data.number);
              core.info(`Created review issue #${created.data.number} for PR #${prNumber}.`);
            }

            await ensureIssueLabel();
            const openTrackingIssues = await fetchOpenTrackingIssues();

            let targetPrs = [];
            if (context.payload.pull_request?.number) {
              targetPrs = [context.payload.pull_request.number];
            } else {
              const dispatchPrInput = context.payload.inputs?.pr_number?.trim?.();
              if (dispatchPrInput) {
                const parsedPr = Number.parseInt(dispatchPrInput, 10);
                if (!Number.isInteger(parsedPr) || parsedPr <= 0) {
                  throw new Error(`Invalid workflow_dispatch input pr_number="${dispatchPrInput}"`);
                }
                targetPrs = [parsedPr];
              } else {
                const openPrs = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                });
                targetPrs = openPrs.map((pull) => pull.number);
              }
            }

            if (targetPrs.length === 0) {
              core.info('No PRs to process.');
              return;
            }

            const fallbackReviewUrl =
              context.payload.review?.html_url ?? context.payload.pull_request?.html_url;
            for (const prNumber of targetPrs) {
              await processPullRequest(prNumber, fallbackReviewUrl, openTrackingIssues);
            }
