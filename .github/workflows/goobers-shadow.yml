name: Goobers Shadow

on:
  workflow_dispatch:
    inputs:
      shadow_scope:
        description: 'Comma-separated legacy workflows to replay'
        type: string
        required: true
        default: 'ci-recovery,merge-train'
      report_day:
        description: 'Deterministic report date stamp (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  shadow:
    name: Shadow parity report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOBERS_SHADOW_SCOPE: ${{ inputs.shadow_scope || 'ci-recovery,merge-train' }}
      GOOBERS_SHADOW_REPORT_DAY: ${{ inputs.report_day }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read legacy lifecycle outcomes
        uses: actions/github-script@v7
        with:
          script: |
            const names = new Map([
              ['ci-recovery', 'CI Recovery'],
              ['merge-train', 'Merge Train'],
            ]);
            const requested = process.env.GOOBERS_SHADOW_SCOPE.split(',').map(name => name.trim());
            if (requested.some(name => !names.has(name))) {
              throw new Error(`Unknown shadow scope: ${requested.filter(name => !names.has(name)).join(', ')}`);
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, status: 'completed', per_page: 100,
            });
            const selected = runs
              .filter(run => requested.some(scope => names.get(scope) === run.name))
              .sort((a, b) => a.id - b.id);
            const triggers = [];
            for (const run of selected) {
              for (const pull of run.pull_requests ?? []) {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100) {
                          nodes { isResolved comments(first: 100) { nodes { body } } }
                        }
                      }
                    }
                  }`,
                  { owner: context.repo.owner, repo: context.repo.repo, number: pull.number },
                );
                triggers.push({
                  workflowName: run.name === 'CI Recovery' ? 'ci-recovery' : 'merge-train',
                  runId: String(run.id), prNumber: String(pull.number), trigger: run.event,
                  conclusion: run.conclusion, reviewThreads: result.repository.pullRequest.reviewThreads.nodes
                    .map(thread => ({ isResolved: thread.isResolved, comments: thread.comments.nodes })),
                });
              }
            }
            require('fs').mkdirSync('.goobers-shadow', { recursive: true });
            require('fs').writeFileSync('.goobers-shadow/legacy-triggers.json', JSON.stringify({ triggers }, null, 2) + '\n');
            require('fs').writeFileSync(
              '.goobers-shadow/report-day.txt',
              `${process.env.GOOBERS_SHADOW_REPORT_DAY || context.payload.repository.updated_at.slice(0, 10)}\n`,
            );

      - name: Replay Goobers read-only decisions
        run: >-
          node .github/scripts/goobers-shadow.mjs
          --input .goobers-shadow/legacy-triggers.json
          --scope "$GOOBERS_SHADOW_SCOPE"
          --reportDay "$(cat .goobers-shadow/report-day.txt)"
          --output .goobers-shadow/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: goobers-shadow-${{ env.GOOBERS_SHADOW_REPORT_DAY }}
          path: .goobers-shadow/
          if-no-files-found: error
