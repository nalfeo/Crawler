name: Weapon Sweep

on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: 'Number of sequential seeds to run (1..100)'
        type: string
        default: '100'
      weapons:
        description: 'Comma-separated Floor-1 weapons'
        type: string
        default: 'sword,bow,baseball-bat'
      max_frames:
        description: 'Frame budget per run (positive integer ≤ 600000; default 19800 ≈ 330s at 60fps)'
        type: string
        default: '19800'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      weapon_matrix: ${{ steps.parse.outputs.weapon_matrix }}
      seed_list: ${{ steps.parse.outputs.seed_list }}
    steps:
      - name: Validate inputs and build matrix
        id: parse
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
          WEAPONS: ${{ inputs.weapons }}
          MAX_FRAMES: ${{ inputs.max_frames }}
        run: |
          set -euo pipefail
          if ! [[ "$SEED_COUNT" =~ ^[0-9]+$ ]] || [ "$SEED_COUNT" -lt 1 ] || [ "$SEED_COUNT" -gt 100 ]; then
            echo "::error::seed_count must be an integer in [1,100]"
            exit 1
          fi
          if ! [[ "$MAX_FRAMES" =~ ^[0-9]+$ ]] || [ "$MAX_FRAMES" -lt 1 ] || [ "$MAX_FRAMES" -gt 600000 ]; then
            echo "::error::max_frames must be a positive integer in [1,600000]"
            exit 1
          fi
          weapon_matrix=$(echo "$WEAPONS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF' | jq -R . | jq -sc .)
          # Validate each weapon token: allow only alphanumerics and hyphens
          if echo "$weapon_matrix" | jq -e '.[] | select(test("[^a-zA-Z0-9-]"))' > /dev/null 2>&1; then
            echo "::error::weapons must be alphanumeric (hyphens allowed); no spaces, slashes, or special characters"
            exit 1
          fi
          if [ "$(echo "$weapon_matrix" | jq 'length')" -lt 1 ]; then
            echo "::error::weapons must contain at least one entry"
            exit 1
          fi
          echo "weapon_matrix=$weapon_matrix" >> "$GITHUB_OUTPUT"
          echo "seed_list=$(seq -s, 1 "$SEED_COUNT")" >> "$GITHUB_OUTPUT"

  weapon-sweep:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        weapon: ${{ fromJson(needs.setup.outputs.weapon_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run sweep for ${{ matrix.weapon }}
        env:
          SEEDS: ${{ needs.setup.outputs.seed_list }}
          WEAPON: ${{ matrix.weapon }}
          MAX_FRAMES: ${{ inputs.max_frames }}
        run: |
          set -euo pipefail
          npx tsx scripts/agent/perf/weapon-sweep.ts \
            --seeds "$SEEDS" \
            --weapons "$WEAPON" \
            --max-frames "$MAX_FRAMES" \
            --out "weapon-sweep-${{ matrix.weapon }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: weapon-sweep-${{ matrix.weapon }}
          path: weapon-sweep-${{ matrix.weapon }}.json
          if-no-files-found: error
          retention-days: 30
