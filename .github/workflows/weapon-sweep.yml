name: Weapon Sweep

# Run a 100-seed optional-purchases A/B (example):
#
#   # false arm (control — default loadout, no optional purchases)
#   gh workflow run weapon-sweep.yml \
#     -f seed_count=100 -f default_loadout=true -f optional_purchases=false \
#     -f weapon_personas=false -f max_frames=23760
#
#   # true arm (treatment — default loadout, optional purchases enabled)
#   gh workflow run weapon-sweep.yml \
#     -f seed_count=100 -f default_loadout=true -f optional_purchases=true \
#     -f weapon_personas=false -f max_frames=23760
#
# Download and compare both arms:
#   gh run download <run-id-false> -n weapon-sweep-default-false
#   gh run download <run-id-true>  -n weapon-sweep-default-true
#   npx tsx scripts/agent/health/fun-score.ts \
#     --input weapon-sweep-default-false/weapon-sweep-default-false.json
#   npx tsx scripts/agent/health/fun-score.ts \
#     --input weapon-sweep-default-true/weapon-sweep-default-true.json

on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: 'Number of sequential seeds to run (1..100)'
        type: string
        default: '100'
      weapons:
        description: 'Comma-separated Floor-1 weapons (ignored when default_loadout is true)'
        type: string
        default: 'sword,bow,baseball-bat,pistol,throwing-knife,fireball'
      weapon_personas:
        description: 'Use weapon-specific AI stat/gear personas'
        type: boolean
        default: true
      max_frames:
        description: 'Frame budget per run (positive integer ≤ 600000; default 19800 ≈ 330s at 60fps)'
        type: string
        default: '19800'
      optional_purchases:
        description: 'Enable optional AI purchases (merchant weapon + Spell Broker) — one arm of the A/B'
        type: boolean
        default: false
      default_loadout:
        description: 'Skip forced-weapon selection; run one seed-determined-loadout arm instead of the full weapon matrix. Use with optional_purchases to run a clean A/B without the weapon confound.'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  setup:
    concurrency:
      group: crawler-sweep-slot-0
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      weapon_matrix: ${{ steps.parse.outputs.weapon_matrix }}
      run_matrix: ${{ steps.budget.outputs.matrix }}
      run_max_parallel: ${{ steps.budget.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and build matrix
        id: parse
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
          WEAPONS: ${{ inputs.weapons }}
          WEAPON_PERSONAS: ${{ inputs.weapon_personas }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          DEFAULT_LOADOUT: ${{ inputs.default_loadout }}
        run: |
          set -euo pipefail
          if ! [[ "$SEED_COUNT" =~ ^[0-9]+$ ]] || [ "$SEED_COUNT" -lt 1 ] || [ "$SEED_COUNT" -gt 100 ]; then
            echo "::error::seed_count must be an integer in [1,100]"
            exit 1
          fi
          if ! [[ "$MAX_FRAMES" =~ ^[0-9]+$ ]] || [ "$MAX_FRAMES" -lt 1 ] || [ "$MAX_FRAMES" -gt 600000 ]; then
            echo "::error::max_frames must be a positive integer in [1,600000]"
            exit 1
          fi
          if [ "$WEAPON_PERSONAS" != "true" ] && [ "$WEAPON_PERSONAS" != "false" ]; then
            echo "::error::weapon_personas must be true or false"
            exit 1
          fi

          # default_loadout=true bypasses forced-weapon selection and emits the
          # sentinel weapon ID "default" as the single-arm matrix entry.  The
          # weapons input is ignored in this mode.
          if [ "$DEFAULT_LOADOUT" = "true" ]; then
            weapon_matrix='["default"]'
          else
            weapon_matrix=$(echo "$WEAPONS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF' | jq -R . | jq -sc .)
            # Validate each weapon token: allow only alphanumerics and hyphens
            if echo "$weapon_matrix" | jq -e '.[] | select(test("[^a-zA-Z0-9-]"))' > /dev/null 2>&1; then
              echo "::error::weapons must be alphanumeric (hyphens allowed); no spaces, slashes, or special characters"
              exit 1
            fi
            if [ "$(echo "$weapon_matrix" | jq 'length')" -lt 1 ]; then
              echo "::error::weapons must contain at least one entry"
              exit 1
            fi
            if [ "$(echo "$weapon_matrix" | jq 'length')" -ne "$(echo "$weapon_matrix" | jq '[.[] | ascii_downcase] | unique | length')" ]; then
              echo "::error::weapons must not contain duplicates"
              exit 1
            fi
            if echo "$weapon_matrix" | jq -e '.[] | ascii_downcase | select(. != "sword" and . != "bow" and . != "baseball-bat" and . != "pistol" and . != "throwing-knife" and . != "fireball")' > /dev/null 2>&1; then
              echo "::error::weapons must be a comma-separated subset of: sword,bow,baseball-bat,pistol,throwing-knife,fireball (or use default_loadout=true to skip weapon selection)"
              exit 1
            fi
            weapon_matrix=$(echo "$weapon_matrix" | jq -c '[.[] | ascii_downcase]')
          fi

          echo "weapon_matrix=$weapon_matrix" >> "$GITHUB_OUTPUT"
          run_matrix='[]'
          for weapon in $(echo "$weapon_matrix" | jq -r '.[]'); do
            for shard in 0 1 2 3; do
              seeds=$(seq 1 "$SEED_COUNT" | awk -v shard="$shard" '((NR - 1) % 4) == shard' | paste -sd, -)
              if [ -n "$seeds" ]; then
                run_matrix=$(echo "$run_matrix" | jq -c \
                  --arg weapon "$weapon" --argjson shard "$shard" --arg seeds "$seeds" \
                  '. + [{weapon: $weapon, shard: $shard, seeds: $seeds}]')
              fi
            done
          done
          echo "run_matrix=$run_matrix" >> "$GITHUB_OUTPUT"

      - name: Allocate queue-aware sweep slots
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_JSON: ${{ steps.parse.outputs.run_matrix }}
        run: node .github/scripts/sweep-budget.mjs

  weapon-sweep:
    needs: setup
    concurrency:
      group: crawler-sweep-slot-${{ matrix.sweepSlot }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: ${{ fromJSON(needs.setup.outputs.run_max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.run_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run sweep for ${{ matrix.weapon }} shard ${{ matrix.shard }}
        env:
          SEEDS: ${{ matrix.seeds }}
          WEAPON: ${{ matrix.weapon }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          WEAPON_PERSONAS: ${{ inputs.weapon_personas }}
          OPTIONAL_PURCHASES: ${{ inputs.optional_purchases }}
        run: |
          set -euo pipefail
          persona_flag="--weapon-personas"
          if [ "$WEAPON_PERSONAS" = "false" ]; then
            persona_flag="--no-weapon-personas"
          fi
          optional_purchases_flag="--no-optional-purchases"
          if [ "$OPTIONAL_PURCHASES" = "true" ]; then
            optional_purchases_flag="--optional-purchases"
          fi
          npx tsx scripts/agent/perf/weapon-sweep.ts \
            --seeds "$SEEDS" \
            --weapons "$WEAPON" \
            --max-frames "$MAX_FRAMES" \
            $persona_flag \
            $optional_purchases_flag \
            --out "weapon-sweep-${{ matrix.weapon }}-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: weapon-sweep-shard-${{ matrix.weapon }}-${{ matrix.shard }}
          path: weapon-sweep-${{ matrix.weapon }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate-budget:
    needs: [setup, weapon-sweep]
    concurrency:
      group: crawler-sweep-slot-0
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.budget.outputs.matrix }}
      max_parallel: ${{ steps.budget.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
      - name: Allocate queue-aware sweep slots
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_JSON: ${{ needs.setup.outputs.weapon_matrix }}
          MATRIX_KEY: weapon
        run: node .github/scripts/sweep-budget.mjs

  aggregate:
    needs: [setup, weapon-sweep, aggregate-budget]
    concurrency:
      group: crawler-sweep-slot-${{ matrix.weapon.sweepSlot }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.aggregate-budget.outputs.max_parallel) }}
      matrix:
        weapon: ${{ fromJSON(needs.aggregate-budget.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@v4
        with:
          pattern: weapon-sweep-shard-${{ matrix.weapon.weapon }}-*
          path: shards
          merge-multiple: true

      - name: Aggregate ${{ matrix.weapon.weapon }} shards
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
          OPTIONAL_PURCHASES: ${{ inputs.optional_purchases }}
        run: |
          optional_purchases_flag="--no-optional-purchases"
          if [ "$OPTIONAL_PURCHASES" = "true" ]; then
            optional_purchases_flag="--optional-purchases"
          fi
          npx tsx scripts/agent/perf/merge-weapon-sweep-shards.ts \
            --inputs shards \
            --weapon "${{ matrix.weapon.weapon }}" \
            --seed-count "$SEED_COUNT" \
            --out "weapon-sweep-${{ matrix.weapon.weapon }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: weapon-sweep-${{ matrix.weapon.weapon }}
          path: weapon-sweep-${{ matrix.weapon.weapon }}.json
          if-no-files-found: error
          retention-days: 30
