name: Nightly Balance Improvement Sweep

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-balance-improvement-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  file-balance-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch filer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: File and intake the nightly balance sweep
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
        run: node .github/scripts/nightly-balance-sweep/filer.mjs
