name: Docs Update Loop

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  docs-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'docs-update: scheduled report'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      # Each check writes a JSON summary under $AUTOMATION_REPORT_DIR.
      # `continue-on-error: true` is intentional — we aggregate at the end.
      - name: Check doc paths
        run: npx tsx scripts/agent/docs/check-paths.ts
        continue-on-error: true

      - name: Check ADR consistency
        run: npx tsx scripts/agent/docs/check-adr-consistency.ts
        continue-on-error: true

      - name: Check README vs package.json scripts
        run: npx tsx scripts/agent/docs/check-readme-commands.ts
        continue-on-error: true

      - name: Stale game-design detector
        run: npx tsx scripts/agent/docs/stale-game-design.ts
        continue-on-error: true

      - name: Handoff promotion candidates
        run: npx tsx scripts/agent/docs/promote-handoffs.ts
        continue-on-error: true

      - name: Apple calibration
        run: npx tsx scripts/agent/docs/apple-calibration.ts
        continue-on-error: true

      - name: Guard telemetry
        run: npx tsx scripts/agent/docs/guard-telemetry.ts
        continue-on-error: true

      - name: Archive handoffs older than 30 days
        run: npx tsx scripts/agent/docs/archive-handoffs.ts --apply

      - name: Rebuild handoff system-impact index
        run: npx tsx scripts/agent/docs/build-system-index.ts --apply

      - name: Detect handoff archive changes
        id: archive
        run: |
          if [ -n "$(git status --porcelain docs/knowledge/handoffs/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open handoff archive PR
        if: steps.archive.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/handoff-archive-${{ github.run_id }}
          title: 'chore: archive handoffs older than 30 days'
          commit-message: 'chore: archive handoffs and rebuild system index'
          body: |
            Automated handoff archive + system-index rebuild. Generated by
            `.github/workflows/docs-update.yml`.

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          labels: |
            automation
            docs

      - name: Aggregate report
        id: aggregate
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: steps.aggregate.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "docs-update: $(date -u +%Y-%m-%d) findings" \
            --label automation,docs \
            --body-file report.md
