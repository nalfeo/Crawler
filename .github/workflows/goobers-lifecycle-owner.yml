name: Goobers Lifecycle Owner
run-name: Goobers lifecycle ${{ inputs.operation || (github.event.action == 'closed' && 'release' || 'acquire') }} for PR #${{ inputs.pr_number || github.event.pull_request.number }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Lifecycle lease operation
        required: true
        default: acquire
        type: choice
        options:
          - acquire
          - heartbeat
          - release
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA validated by the caller
        required: true
        type: string
      lease_id:
        description: Existing lease identifier for heartbeat or release
        required: false
        default: ''
        type: string

concurrency:
  group: crawler-pr-lifecycle-${{ inputs.pr_number || github.event.pull_request.number || 'invalid' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOBERS_VERSION: v0.3.3
      GOOBERS_SHA256: 47b09d6bff1578726b52716ca7b8fba0f416171723090663c0b25ae924d36a82
      GOOBERS_INSTANCE: ${{ runner.temp }}/goobers-lifecycle-instance
      LIFECYCLE_LEASE_TTL_SECONDS: ${{ vars.LIFECYCLE_LEASE_TTL_SECONDS || '300' }}
    steps:
      - name: Checkout trusted ownership implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Capture immutable ownership input
        id: ownership-input
        uses: actions/github-script@v7
        env:
          REQUESTED_OPERATION: ${{ inputs.operation || (github.event.action == 'closed' && 'release' || 'acquire') }}
          REQUESTED_PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          REQUESTED_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          REQUESTED_LEASE: ${{ inputs.lease_id }}
          LIFECYCLE_MUTATION_OWNER: ${{ vars.LIFECYCLE_MUTATION_OWNER }}
          LEGACY_CI_MUTATION_BRIDGE_ENABLED: ${{ vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED || 'false' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const ownership = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/lifecycle-ownership.mjs',
            )));
            const prNumber = Number(process.env.REQUESTED_PR);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              throw new Error(`Invalid PR number: ${process.env.REQUESTED_PR}`);
            }
            const pull = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })).data;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const markerComments = comments
              .filter(comment => String(comment.body || '').trimStart().startsWith(
                ownership.LIFECYCLE_LEASE_MARKER,
              ))
              .map(comment => ({ id: comment.id, body: comment.body }));
            const currentLease = markerComments.length === 1
              ? ownership.parseLifecycleLease(markerComments[0].body)
              : null;
            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })).data;
            const operation = process.env.REQUESTED_OPERATION;
            const leaseId = process.env.REQUESTED_LEASE ||
              (operation === 'release' ? currentLease?.leaseId : '') ||
              `goobers:${context.runId}:${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
            const input = {
              owner: process.env.LIFECYCLE_MUTATION_OWNER,
              legacyBridgeEnabled: process.env.LEGACY_CI_MUTATION_BRIDGE_ENABLED,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              headRepository: pull.head.repo?.full_name || '',
              prNumber,
              headSha: process.env.REQUESTED_HEAD,
              leaseId,
              operation,
              now: run.created_at,
              ttlSeconds: process.env.LIFECYCLE_LEASE_TTL_SECONDS,
              markerComments,
            };
            fs.mkdirSync('.goobers-lifecycle', { recursive: true });
            fs.writeFileSync(
              '.goobers-lifecycle/input.json',
              `${JSON.stringify(input, null, 2)}\n`,
            );
            core.setOutput('pr-number', String(prNumber));
            core.setOutput('head-sha', input.headSha);

      - name: Download pinned Goobers release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goobers-lifecycle-bin"
          curl -fsSL -o "$RUNNER_TEMP/goobers-lifecycle.tar.gz" \
            "https://github.com/Agent-Clubhouse/Goobers/releases/download/${GOOBERS_VERSION}/goobers_${GOOBERS_VERSION}_linux_amd64.tar.gz"
          echo "${GOOBERS_SHA256}  $RUNNER_TEMP/goobers-lifecycle.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/goobers-lifecycle.tar.gz" -C "$RUNNER_TEMP/goobers-lifecycle-bin" goobers
          chmod +x "$RUNNER_TEMP/goobers-lifecycle-bin/goobers"
          echo "$RUNNER_TEMP/goobers-lifecycle-bin" >> "$GITHUB_PATH"

      - name: Materialize ownership-only Goobers instance
        run: |
          set -euo pipefail
          mkdir -p "$GOOBERS_INSTANCE"
          cat > "$GOOBERS_INSTANCE/instance.yaml" <<EOF
          apiVersion: goobers.dev/v1alpha1
          kind: Instance
          repos:
            - provider: github
              owner: ${GITHUB_REPOSITORY_OWNER}
              name: ${GITHUB_REPOSITORY#*/}
              token:
                env: GOOBERS_GITHUB_TOKEN
          workflowSource:
            kind: local-dir
            path: ${GITHUB_WORKSPACE}/.goobers
          runner:
            envPassthrough:
              - GOOBERS_LIFECYCLE_INPUT_FILE
          runConditions:
            maxParallelRuns: 1
          EOF
          goobers config materialize "$GOOBERS_INSTANCE"
          goobers validate "$GOOBERS_INSTANCE"

      - name: Run authoritative Goobers ownership decision
        env:
          GOOBERS_GITHUB_TOKEN: ${{ github.token }}
          GOOBERS_LIFECYCLE_INPUT_FILE: ${{ github.workspace }}/.goobers-lifecycle/input.json
        run: goobers run crawler-lifecycle-owner "$GOOBERS_INSTANCE"

      - name: Extract ownership decision
        run: |
          set -euo pipefail
          events_file="$(find "$GOOBERS_INSTANCE/gaggles" -path '*/runs/*/events.jsonl' -type f | sort | tail -n 1)"
          jq -r 'select(.type == "stage.finished" and .stage == "decide-ownership") | .outputs.decision' \
            "$events_file" | tail -n 1 | jq '{ decision: . }' > .goobers-lifecycle/decision.json

      - name: Apply fenced ownership lease
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.ownership-input.outputs.pr-number }}
          EXPECTED_HEAD_SHA: ${{ steps.ownership-input.outputs.head-sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const ownership = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/lifecycle-ownership.mjs',
            )));
            const { decision } = JSON.parse(fs.readFileSync(
              '.goobers-lifecycle/decision.json',
              'utf8',
            ));
            core.info(`LIFECYCLE_OWNERSHIP_DECISION ${JSON.stringify(decision)}`);
            if (decision.writeAction === 'none') return;

            async function variable(name) {
              try {
                return (await github.rest.actions.getRepoVariable({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                })).data.value;
              } catch (error) {
                if (error.status === 404) return '';
                throw error;
              }
            }
            const [selectedOwner, bridgeEnabled] = await Promise.all([
              variable('LIFECYCLE_MUTATION_OWNER'),
              variable('LEGACY_CI_MUTATION_BRIDGE_ENABLED'),
            ]);
            if (!ownership.lifecycleWriterEnabled({
              owner: selectedOwner,
              legacyBridgeEnabled: bridgeEnabled,
            }, 'goobers')) {
              core.warning('Ownership changed before lease write; skipping mutation.');
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            const pull = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })).data;
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (
              String(pull.head.repo?.full_name || '').toLowerCase() !== repository ||
              String(pull.head.sha || '').toLowerCase() !==
                String(process.env.EXPECTED_HEAD_SHA || '').toLowerCase()
            ) {
              core.warning('PR repository or head changed before lease write; skipping mutation.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const markers = comments.filter(comment =>
              String(comment.body || '').trimStart().startsWith(ownership.LIFECYCLE_LEASE_MARKER),
            );
            if (decision.writeAction === 'create') {
              if (markers.length !== 0) {
                core.warning('Lease marker changed after decision; acquisition is contended.');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: ownership.renderLifecycleLease(decision.lease),
              });
              return;
            }
            const current = markers.find(comment => comment.id === decision.expectedCommentId);
            const currentLease = ownership.parseLifecycleLease(current?.body);
            if (
              markers.length !== 1 ||
              !currentLease ||
              currentLease.leaseId !== decision.expectedLeaseId
            ) {
              core.warning('Lease marker changed after decision; refusing stale mutation.');
              return;
            }
            if (decision.writeAction === 'delete') {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: current.id,
              });
            } else {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: current.id,
                body: ownership.renderLifecycleLease(decision.lease),
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goobers-lifecycle-${{ github.run_id }}
          path: .goobers-lifecycle/
          if-no-files-found: error
