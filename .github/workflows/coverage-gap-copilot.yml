name: Coverage Gap Copilot Ping

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ping-copilot-on-coverage-gap:
    name: Ping Copilot on coverage gaps
    if: ${{ github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        # Only mint when the event is from github-actions[bot] — same gate as
        # the script below, so arbitrary commenters can't trigger App-token minting.
        if: github.event.comment.user.login == 'github-actions[bot]'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Detect below-goal coverage and request help
        if: github.event.comment.user.login == 'github-actions[bot]'
        uses: actions/github-script@v7
        with:
          # Use a GH App token so that issue assignment to @copilot is recognised
          # by GitHub and triggers the Copilot coding agent.  The default
          # GITHUB_TOKEN is a bot identity that GitHub silently ignores for this
          # trigger — a user-acting App token is required.
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const comment = context.payload.comment;
            const body = comment.body ?? '';

            if (comment.user?.login !== 'github-actions[bot]') {
              core.info('Skipping: comment is not from github-actions[bot].');
              return;
            }

            if (!body.includes('vitest-coverage-report-marker-root') || !body.includes('Coverage Report')) {
              core.info('Skipping: comment is not a vitest coverage report.');
              return;
            }

            const rowPattern =
              /<tr>\s*<td[^>]*>[\s\S]*?<\/td>\s*<td[^>]*>\s*([^<]+?)\s*<\/td>\s*<td[^>]*>\s*([0-9.]+)%\s*\(🎯\s*([0-9.]+)%\)\s*<\/td>/g;
            const belowGoal = [];
            let match;

            while ((match = rowPattern.exec(body)) !== null) {
              const category = match[1].trim();
              const actual = Number.parseFloat(match[2]);
              const goal = Number.parseFloat(match[3]);

              if (Number.isFinite(actual) && Number.isFinite(goal) && actual < goal) {
                belowGoal.push({ category, actual, goal });
              }
            }

            if (belowGoal.length === 0) {
              core.info('Coverage is at/above configured goals.');
              return;
            }

            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // If the PR is already merged there is nothing left to fix — close any
            // open tracking issue and bail out.
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: issueNumber });
            if (pr.data.merged) {
              core.info(`PR #${issueNumber} is already merged. Cleaning up any open coverage issue.`);
              const issueLabel = 'coverage-gap';
              const issueTitle = `Coverage gaps: PR #${issueNumber}`;
              const staleIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo,
                state: 'open',
                labels: issueLabel,
                per_page: 100,
              });
              const stale = staleIssues.find((i) => i.title === issueTitle);
              if (stale) {
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: stale.number,
                  state: 'closed',
                });
                core.info(`Closed stale coverage issue #${stale.number} because PR #${issueNumber} was merged.`);
              }
              return;
            }

            const lines = belowGoal
              .map((gap) => `- ${gap.category}: ${gap.actual.toFixed(2)}% / goal ${gap.goal.toFixed(2)}%`)
              .join('\n');

            const issueTitle = `Coverage gaps: PR #${issueNumber}`;
            const issueLabel = 'coverage-gap';

            const issueBody = [
              `PR #${issueNumber} has code coverage below the configured goals.`,
              '',
              `Coverage report: ${comment.html_url}`,
              '',
              'Below-goal categories:',
              lines,
              '',
              `Please add targeted, deterministic tests to address these gaps directly in PR #${issueNumber}.`,
            ].join('\n');

            // Ensure the tracking label exists (idempotent).
            try {
              await github.rest.issues.createLabel({
                owner, repo,
                name: issueLabel,
                color: 'fbbf24',
                description: 'PR has coverage metrics below goal thresholds',
              });
            } catch (_) {
              // Label already exists — ignore.
            }

            // Find any existing open coverage-gap issue for this PR.
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo,
              state: 'open',
              labels: issueLabel,
              per_page: 100,
            });
            const existing = existingIssues.find((i) => i.title === issueTitle);

            // Close old issue and create a fresh one so that the new assignment
            // re-triggers the Copilot coding agent (re-assigning an existing issue
            // may not fire the trigger a second time).
            if (existing) {
              await github.rest.issues.update({
                owner, repo,
                issue_number: existing.number,
                state: 'closed',
              });
              core.info(`Closed stale coverage issue #${existing.number}.`);
            }

            const created = await github.rest.issues.create({
              owner, repo,
              title: issueTitle,
              body: issueBody,
              labels: [issueLabel],
            });

            try {
              await github.rest.issues.addAssignees({
                owner, repo,
                issue_number: created.data.number,
                assignees: ['copilot'],
              });
            } catch (err) {
              core.warning(`Could not assign @copilot: ${err.message}`);
            }

            core.info(`Created coverage issue #${created.data.number} and assigned to Copilot.`);
