# Provisions a fully working environment for the Copilot coding agent
# (cloud/mobile sessions). The agent uses this environment to fix CI failures,
# address review comments, rebase branches, and perform general code changes.
name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Verify (typecheck src)
        # Run a fast typecheck of src/ only to confirm the environment is
        # correctly set up. The full suite (tests/ + scripts/) and all unit
        # tests are gated by CI jobs on every PR — re-running them here adds
        # ~30 s of latency to every new agent session for no incremental value.
        run: npm run typecheck:src
