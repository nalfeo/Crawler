name: Nightly Mutation Testing

on:
  schedule:
    # Nightly at 02:00 UTC — low-traffic window before the 06:00 UTC
    # security-review loop, giving the runner pool time to clear.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Job 1: Run Stryker mutation testing
  mutation-run:
    name: Stryker mutation run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Install Stryker dependencies
        run: npm ci

      - name: Run mutation tests
        run: npx stryker run
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 14

  # Job 2: Score comparison + issue filing (depends on mutation-run)
  mutation-score:
    name: Score comparison & report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [mutation-run]
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'nightly-mutation: mutation score report'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      - name: Download mutation report
        uses: actions/download-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
        continue-on-error: true

      - name: Compare mutation score against baseline
        id: score
        run: |
          set +e
          npx tsx scripts/agent/health/mutation-score.ts
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Detect baseline changes
        id: detect-changes
        run: |
          if [ -n "$(git status --porcelain docs/knowledge/metrics/mutation-baseline.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create baseline update issue for copilot
        if: steps.detect-changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CRAWLER_CI_PAT }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'nightly-mutation: baseline update needed';
            const body = [
              'Nightly mutation baseline changed and needs an automation PR.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Please do the following:',
              `1. Create a branch from \`main\` named \`automation/mutation-baseline-${context.runId}\`.`,
              "2. Commit only docs/knowledge/metrics/mutation-baseline.json with commit message chore: update mutation score baseline.",
              '3. Open a PR with title `chore: update mutation score baseline`.',
              '4. Mark the PR as ready for review (not draft).',
              '5. Enable auto-merge (squash).',
              '',
              '@copilot please create this PR now.'
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'test-health',
              per_page: 100
            });
            let issue = open.find(candidate => candidate.title === title);
            if (issue) {
              issue = (await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              })).data;
            } else {
              issue = (await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation', 'test-health']
              })).data;
            }

            const actors = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes {
                      login
                      __typename
                      ... on Bot { id }
                      ... on User { id }
                    }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo });
            const copilot = actors.repository.suggestedActors.nodes.find(
              actor => ['copilot', 'copilot-swe-agent'].includes((actor.login || '').toLowerCase())
            );
            if (!copilot?.id) {
              throw new Error('CRAWLER_CI_PAT cannot discover an assignable Copilot actor');
            }
            await github.graphql(`
              mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId,
                  actorIds: $actorIds
                }) {
                  assignable {
                    ... on Issue { assignees(first: 20) { nodes { login } } }
                  }
                }
              }
            `, {
              assignableId: issue.node_id,
              actorIds: [copilot.id]
            });
            core.info(`Upserted issue #${issue.number} and assigned Copilot`);

      - name: Aggregate report
        id: aggregate
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: steps.aggregate.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "nightly-mutation: $(date -u +%Y-%m-%d) regression" \
            --label automation,test-health \
            --body-file report.md
