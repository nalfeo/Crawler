name: Nightly Mutation Testing

on:
  schedule:
    # Nightly at 02:00 UTC — low-traffic window before the 06:00 UTC
    # security-review loop, giving the runner pool time to clear.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Job 1: Run Stryker mutation testing
  mutation-run:
    name: Stryker mutation run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Run mutation tests
        run: npx stryker run
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 14

  # Job 2: Score comparison + issue filing (depends on mutation-run)
  mutation-score:
    name: Score comparison & report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [mutation-run]
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'nightly-mutation: mutation score report'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      - name: Download mutation report
        uses: actions/download-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
        continue-on-error: true

      - name: Compare mutation score against baseline
        id: score
        run: |
          set +e
          npx tsx scripts/agent/health/mutation-score.ts
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Detect baseline changes
        id: detect-changes
        run: |
          if [ -n "$(git status --porcelain docs/knowledge/metrics/mutation-baseline.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open baseline update PR
        if: steps.detect-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/mutation-baseline-${{ github.run_id }}
          title: 'chore: update mutation score baseline'
          commit-message: 'chore: update mutation score baseline'
          body: |
            Automated mutation score baseline update. Generated by
            `.github/workflows/nightly-mutation.yml`.

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          labels: |
            automation
            test-health

      - name: Aggregate report
        id: aggregate
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: steps.aggregate.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "nightly-mutation: $(date -u +%Y-%m-%d) regression" \
            --label automation,test-health \
            --body-file report.md
