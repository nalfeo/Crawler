name: Test Health Loop

on:
  schedule:
    # Mondays at 09:30 UTC (30m after docs-update so they don't clash on a
    # shared runner pool).
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Job 1: Coverage analysis (critical path, generates metrics)
  coverage-suite:
    name: Coverage suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Run coverage suite
        run: npm run test:coverage -- --coverage.reporter=json-summary --coverage.reporter=text
        continue-on-error: true

  # Job 2: Coverage trend analysis (depends on coverage-suite)
  coverage-trend:
    name: Coverage trend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [coverage-suite]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Detect untested ECS systems
        run: npx tsx scripts/agent/health/untested-systems.ts
        continue-on-error: true

      - name: Coverage trend
        id: trend
        run: npx tsx scripts/agent/health/coverage-trend.ts
        continue-on-error: true

      - name: Detect coverage-trend changes
        id: detect-changes
        run: |
          if [ -n "$(git status --porcelain docs/knowledge/metrics/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open metrics PR
        if: steps.detect-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/metrics-${{ github.run_id }}
          title: 'chore: update health metrics'
          commit-message: 'chore: update health metrics'
          body: |
            Automated health metrics update. Generated by
            `.github/workflows/test-health.yml`.

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          labels: |
            automation
            test-health

  # Job 3: Extended property-based tests (can run in parallel)
  property-tests:
    name: Extended property tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Extended property-based tests (10x)
        run: npx tsx scripts/agent/health/extended-property.ts
        continue-on-error: true

  # Job 4: Governor playthroughs (can run in parallel)
  governor-playthroughs:
    name: Governor playthroughs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Governor playthroughs
        run: npx tsx scripts/agent/health/governor-playthroughs.ts
        continue-on-error: true

  # Job 5: Balance regression (can run in parallel)
  balance-regression:
    name: Balance regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Balance regression
        run: npx tsx scripts/agent/health/balance-regression.ts
        continue-on-error: true

  # Job 6: Benchmark regression (can run in parallel)
  bench-regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Run benchmarks
        run: npx vitest bench --reporter=json --outputFile=coverage/bench-results.json
        continue-on-error: true

      - name: Benchmark regression check
        run: npx tsx scripts/agent/health/bench-regression.ts
        continue-on-error: true

  # Job 7: Aggregation (depends on all tests)
  aggregate-results:
    name: Aggregate & file issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      [coverage-trend, property-tests, governor-playthroughs, balance-regression, bench-regression]
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'test-health: weekly report'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      - name: Aggregate report
        id: aggregate
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: steps.aggregate.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "test-health: $(date -u +%Y-%m-%d) findings" \
            --label automation,test-health \
            --body-file report.md
