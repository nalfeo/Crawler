name: Optional Purchases Sweep

# Run this workflow twice — once per arm of the A/B comparison:
#
#   # false arm (control)
#   gh workflow run optional-purchases-sweep.yml \
#     -f seed_count=100 -f optional_purchases=false -f max_frames=23760
#
#   # true arm (treatment)
#   gh workflow run optional-purchases-sweep.yml \
#     -f seed_count=100 -f optional_purchases=true -f max_frames=23760
#
# Then download and compare:
#   gh run download <run-id-false> -n optional-purchases-sweep-false
#   gh run download <run-id-true>  -n optional-purchases-sweep-true
#   npx tsx scripts/agent/health/fun-score.ts --input optional-purchases-sweep-false/optional-purchases-sweep-false.json
#   npx tsx scripts/agent/health/fun-score.ts --input optional-purchases-sweep-true/optional-purchases-sweep-true.json

on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: 'Number of sequential seeds to run (1..100)'
        type: string
        default: '100'
      optional_purchases:
        description: 'Enable optional AI purchases (merchant weapon + Spell Broker)'
        type: boolean
        default: false
      max_frames:
        description: 'Frame budget per run (positive integer ≤ 600000; default 23760 ≈ 396s at 60fps)'
        type: string
        default: '23760'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # setup — validate inputs and emit the 4-shard matrix
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - name: Validate inputs and build shard matrix
        id: shard
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
          MAX_FRAMES: ${{ inputs.max_frames }}
        run: |
          set -euo pipefail

          if ! [[ "$SEED_COUNT" =~ ^[0-9]+$ ]] || [ "$SEED_COUNT" -lt 1 ] || [ "$SEED_COUNT" -gt 100 ]; then
            echo "::error::seed_count must be an integer in [1,100]; got '${SEED_COUNT}'"
            exit 1
          fi

          if ! [[ "$MAX_FRAMES" =~ ^[0-9]+$ ]] || [ "$MAX_FRAMES" -lt 1 ] || [ "$MAX_FRAMES" -gt 600000 ]; then
            echo "::error::max_frames must be a positive integer in [1,600000]; got '${MAX_FRAMES}'"
            exit 1
          fi

          # Split seeds 1..SEED_COUNT into 4 round-robin shards
          matrix='[]'
          for shard in 0 1 2 3; do
            seeds=$(seq 1 "$SEED_COUNT" \
              | awk -v shard="$shard" '((NR - 1) % 4) == shard' \
              | paste -sd, -)
            if [ -n "$seeds" ]; then
              matrix=$(echo "$matrix" \
                | jq -c --argjson shard "$shard" --arg seeds "$seeds" \
                    '. + [{shard: $shard, seeds: $seeds}]')
            fi
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # sweep — one runner per shard; each produces a JSON file of RunStats
  # ---------------------------------------------------------------------------
  sweep:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.run_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run sweep shard ${{ matrix.shard }}
        env:
          SEEDS: ${{ matrix.seeds }}
          OPTIONAL_PURCHASES: ${{ inputs.optional_purchases }}
          MAX_FRAMES: ${{ inputs.max_frames }}
        run: |
          set -euo pipefail
          flag="--no-optional-purchases"
          if [ "$OPTIONAL_PURCHASES" = "true" ]; then
            flag="--optional-purchases"
          fi
          npx tsx scripts/agent/perf/optional-purchases-sweep.ts \
            --seeds "$SEEDS" \
            $flag \
            --max-frames "$MAX_FRAMES" \
            --out "optional-purchases-shard-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-purchases-shard-${{ matrix.shard }}
          path: optional-purchases-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # aggregate — merge shards, print summary, upload the final artifact
  # ---------------------------------------------------------------------------
  aggregate:
    needs: [setup, sweep]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@v4
        with:
          pattern: optional-purchases-shard-*
          path: shards
          merge-multiple: true

      - name: Merge shards and print summary
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
          OPTIONAL_PURCHASES: ${{ inputs.optional_purchases }}
        run: |
          set -euo pipefail
          flag="--no-optional-purchases"
          if [ "$OPTIONAL_PURCHASES" = "true" ]; then
            flag="--optional-purchases"
          fi
          npx tsx scripts/agent/perf/merge-optional-purchases-shards.ts \
            --inputs shards \
            --seed-count "$SEED_COUNT" \
            $flag \
            --out "optional-purchases-sweep-${OPTIONAL_PURCHASES}.json"

      - uses: actions/upload-artifact@v4
        with:
          # Stable name so both arms are easy to download by name:
          #   gh run download <id> -n optional-purchases-sweep-false
          #   gh run download <id> -n optional-purchases-sweep-true
          name: optional-purchases-sweep-${{ inputs.optional_purchases }}
          path: optional-purchases-sweep-${{ inputs.optional_purchases }}.json
          if-no-files-found: error
          retention-days: 90
