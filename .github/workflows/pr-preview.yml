name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Only run for PRs from the same repo (forks don't get write tokens)
concurrency:
  group: gh-pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR preview
        run: npm run build
        env:
          DEPLOY_ENV: dev
          BUILD_BASE_PATH: /Crawler/pr-${{ github.event.pull_request.number }}/
          BUILD_OUTDIR: pr-build

      - name: Guard — build must include index.html
        run: |
          if [ ! -f pr-build/index.html ]; then
            echo "::error::PR preview build missing index.html"
            exit 1
          fi

      - name: Deploy to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PAGES_BASE="https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/$(basename "$GITHUB_REPOSITORY")"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --depth=1 --branch=gh-pages "$REPO_URL" /tmp/gh-pages 2>/dev/null; then
            echo "Cloned existing gh-pages branch"
          else
            echo "Creating new gh-pages branch"
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
          fi

          cd /tmp/gh-pages
          touch .nojekyll
          rm -rf "pr-${PR_NUMBER}"
          mkdir -p "pr-${PR_NUMBER}"
          cp -r "$GITHUB_WORKSPACE/pr-build/." "pr-${PR_NUMBER}/"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore: PR #${PR_NUMBER} preview [${GITHUB_SHA:0:7}]"

            MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              if git push origin HEAD:gh-pages; then
                echo "Deployed PR #${PR_NUMBER} preview to ${PAGES_BASE}/pr-${PR_NUMBER}/"
                break
              fi
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "Push failed (attempt $attempt), rebasing..."
                git fetch origin gh-pages
                git rebase origin/gh-pages
              else
                echo "::error::Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
            done
          fi

          echo "PREVIEW_URL=${PAGES_BASE}/pr-${PR_NUMBER}/" >> "$GITHUB_ENV"

      - name: Post or update preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const MARKER = '<!-- pr-preview-bot -->';
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              MARKER,
              '## 🔍 PR Preview',
              '',
              `| Environment | URL |`,
              `|-------------|-----|`,
              `| Preview     | [${previewUrl}](${previewUrl}) |`,
              `| Labs        | [${previewUrl}lab.html](${previewUrl}lab.html) |`,
              '',
              `Last updated: \`${sha}\` — [workflow run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated preview comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created preview comment');
            }
