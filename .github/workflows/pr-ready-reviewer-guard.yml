name: PR Ready/Reviewer Guard

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-pr-state:
    name: Enforce ready + human reviewer requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # For pull_request_target events, scope the concurrency group to the specific
    # PR so events for different PRs never block one another and stale events for
    # the same PR are coalesced (cancel-in-progress: true). For scheduled/manual
    # sweep runs, use the global group with cancel-in-progress: false so the
    # single full-repo sweep is never interrupted.
    concurrency:
      group: 'pr-ready-reviewer-guard'
      cancel-in-progress: false
    steps:
      - name: Checkout trusted guard script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Pin Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish drafts, repair empty Copilot shells, and request human reviewers
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          REVIEWER_LOGIN: nalfeo
        run: node .github/scripts/pr-ready-reviewer-guard.mjs
