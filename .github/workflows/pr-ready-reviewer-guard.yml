name: PR Ready/Reviewer Guard

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-pr-state:
    name: Enforce ready + reviewer cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-ready-reviewer-guard
      cancel-in-progress: false
    steps:
      - name: Checkout trusted guard script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Pin Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish drafts, repair empty Copilot shells, and remove requested reviewer
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          REVIEWER_LOGIN: nalfeo
        run: node .github/scripts/pr-ready-reviewer-guard.mjs
