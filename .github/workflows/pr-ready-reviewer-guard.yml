name: PR Ready/Reviewer Guard

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-pr-state:
    name: Enforce ready + reviewer cleanup
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ready-reviewer-guard-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Publish drafts and remove requested reviewer
        uses: actions/github-script@v7
        env:
          REVIEWER_LOGIN: nalfeo
        with:
          github-token: ${{ secrets.CRAWLER_CI_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const reviewerLoginRaw = (process.env.REVIEWER_LOGIN ?? '').trim();
            const reviewerLogin = reviewerLoginRaw.toLowerCase();

            if (!reviewerLoginRaw) {
              throw new Error('REVIEWER_LOGIN is required');
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            if (openPrs.length === 0) {
              core.info('No open PRs found.');
              return;
            }

            let draftsPublished = 0;
            let reviewerRemovals = 0;
            const publishFailures = [];

            for (const pr of openPrs) {
              const prNumber = pr.number;

              if (pr.draft) {
                try {
                  await github.graphql(
                    `
                    mutation MarkPullRequestReadyForReview($pullRequestId: ID!) {
                      markPullRequestReadyForReview(input: { pullRequestId: $pullRequestId }) {
                        pullRequest {
                          number
                        }
                      }
                    }
                    `,
                    {
                      pullRequestId: pr.node_id,
                    },
                  );
                  draftsPublished += 1;
                  core.info(`Marked PR #${prNumber} as ready for review.`);
                } catch (error) {
                  publishFailures.push(`PR #${prNumber}: ${error.message}`);
                  core.error(`Could not mark PR #${prNumber} ready: ${error.message}`);
                }
              }

              try {
                const requestedReviewers = pr.requested_reviewers ?? [];
                const reviewerToRemove = requestedReviewers.find(
                  (reviewer) => reviewer.login?.toLowerCase() === reviewerLogin,
                );

                if (!reviewerToRemove?.login) {
                  continue;
                }

                await github.rest.pulls.removeRequestedReviewers({
                  owner,
                  repo,
                  pull_number: prNumber,
                  reviewers: [reviewerToRemove.login],
                  });
                reviewerRemovals += 1;
                core.info(
                  `Removed @${reviewerToRemove.login} from requested reviewers on PR #${prNumber}.`,
                );
              } catch (error) {
                core.warning(`Could not process reviewers for PR #${prNumber}: ${error.message}`);
              }
            }

            core.info(
              `Done. Drafts published: ${draftsPublished}. Reviewer removals: ${reviewerRemovals}.`,
            );

            if (publishFailures.length > 0) {
              core.setFailed(
                `Failed to publish ${publishFailures.length} draft PR(s):\n${publishFailures.join('\n')}`,
              );
            }
