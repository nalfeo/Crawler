name: Merge Train

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, edited, closed, ready_for_review]
  workflow_run:
    workflows: ['Merge Train Validation', 'CI']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: crawler-merge-train
  queue: max

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'workflow_run' ||
        github.event.workflow_run.name != 'CI' ||
        (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout trusted merge-train implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile six-PR build-expiry train
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
        run: node .github/scripts/merge-train/reconcile.mjs
