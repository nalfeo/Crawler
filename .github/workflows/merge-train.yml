name: Merge Train

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, edited, closed, ready_for_review]
  workflow_run:
    workflows: ['Merge Train Validation', 'CI']
    types: [completed]
    # Candidate validation is dispatched from main; reject PR and non-main CI
    # completions before they create a Merge Train workflow run.
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    concurrency:
      group: crawler-merge-train
      queue: single
    # Fail-closed job gate:
    #   - pull_request_target: only for PRs from this repo (not forks) that
    #     currently carry or are transitioning the merge-train queue label.
    #   - workflow_run named 'CI': allowed only for (a) a push-triggered CI
    #     completion on the default branch, or (b) a schedule-triggered CI
    #     completion while the train is enabled. (b) is the wakeup for the
    #     failure-attribution pause: when the maximal composite is red and
    #     `mainAttributionVerdict()` (reconcile-lib.mjs) reports 'red',
    #     reconcile pauses without ejecting anyone, and something must re-wake
    #     it once main's own full-CI evidence turns green. Without (b) nothing
    #     re-wakes reconcile in that window, falling back to the unreliable
    #     */5 cron (which arrives ~hourly in practice). Mirrors the identical
    #     carve-out already proven in ci-recovery-incidents.yml (only *reads*
    #     vars.MERGE_TRAIN_ENABLED; never sets it). Every other CI workflow_run
    #     (PR, or schedule while disabled) remains blocked -- no storm
    #     regression.
    #   - Every other event (push, schedule, workflow_dispatch, and the
    #     'Merge Train Validation' workflow_run) is unaffected.
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        (contains(github.event.pull_request.labels.*.name, 'merge-train') ||
        github.event.label.name == 'merge-train'))) &&
        (github.event_name != 'workflow_run' ||
        github.event.workflow_run.name != 'CI' ||
        (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
        github.event.workflow_run.event == 'schedule')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch local actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: '.github/actions'
          persist-credentials: false

      - name: Train gate
        id: train-gate
        uses: ./.github/actions/train-gate
        with:
          # Gate only applies to schedule-triggered CI workflow_run events;
          # all other events (push, pull_request_target, workflow_dispatch,
          # Merge Train Validation workflow_run, direct schedule) proceed
          # unconditionally. See job-level if: comment above.
          event-is-schedule: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'schedule' }}
          merge-train-enabled: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}

      - name: Generate repository app token
        id: app-token
        if: steps.train-gate.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout trusted merge-train implementation
        if: steps.train-gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Snapshot merge-train PRs for immutable decision capture
        if: vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED == 'true' && steps.train-gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: context.payload.repository.default_branch,
              per_page: 100,
            });
            const trainLabels = new Set([
              'merge-train',
              'merge-train-blocked',
              'merge-train-noop',
              'merge-train-recovery-pending',
            ]);
            const prNumbers = pulls
              .filter(pull => pull.labels.some(label => trainLabels.has(label.name)))
              .map(pull => pull.number);
            fs.mkdirSync('.legacy-lifecycle', { recursive: true });
            fs.writeFileSync(
              '.legacy-lifecycle/merge-train-input.json',
              `${JSON.stringify({ prNumbers }, null, 2)}\n`,
            );

      - name: Legacy mutation bridge disabled; skipping direct merge-train mutations
        if: vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED != 'true' && steps.train-gate.outputs.enabled == 'true'
        run: |
          echo "Legacy CI mutation bridge is disabled. Skipping legacy merge-train PR mutations; Goobers handles lifecycle orchestration in steady-state."

      - name: Reconcile six-PR build-expiry train
        id: legacy-reconcile
        if: vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED == 'true' && steps.train-gate.outputs.enabled == 'true'
        env:
          LEGACY_CI_MUTATION_BRIDGE_ENABLED: ${{ vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          MERGE_TRAIN_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
          CI_GLOBAL_TRAIN_DISPATCH_CAP: ${{ vars.CI_GLOBAL_TRAIN_DISPATCH_CAP || '5' }}
          # Must match the coordinator's setting: this gates whether promotion
          # re-derives coordinator slot ordering (which survives label removal).
          CI_CONFLICT_COORDINATION_ENFORCE: ${{ vars.CI_CONFLICT_COORDINATION_ENFORCE || '0' }}
        run: |
          set -o pipefail
          mkdir -p .legacy-lifecycle
          node .github/scripts/merge-train/reconcile.mjs | tee .legacy-lifecycle/reconcile.log

      - name: Repair merge-train-quarantined restricted-branch PRs
        id: quarantine-repair
        # Runs after reconcile so a PR quarantined earlier in THIS pass (a
        # fresh third strike) is repaired the same cycle, not one cycle late.
        if: vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED == 'true' && steps.train-gate.outputs.enabled == 'true'
        env:
          LEGACY_CI_MUTATION_BRIDGE_ENABLED: ${{ vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/merge-train/quarantine-repair.mjs

      - name: Capture immutable Merge Train decisions
        id: capture-legacy-decision
        if: always() && vars.LEGACY_CI_MUTATION_BRIDGE_ENABLED == 'true' && steps.train-gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          READ_TOKEN: ${{ steps.app-token.outputs.token }}
          RECONCILE_OUTCOME: ${{ steps.legacy-reconcile.outcome }}
          REPAIR_OUTCOME: ${{ steps.quarantine-repair.outcome }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const inputPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.legacy-lifecycle/merge-train-input.json',
            );
            if (!fs.existsSync(inputPath)) {
              core.setOutput('record-count', '0');
              return;
            }
            const { prNumbers } = JSON.parse(fs.readFileSync(inputPath, 'utf8'));
            const capture = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/capture-legacy-lifecycle.mjs',
            )));
            const count = await capture.captureMergeTrain({
              github,
              token: process.env.READ_TOKEN,
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumbers,
              runId: context.runId,
              trigger: context.eventName,
              outcome:
                process.env.RECONCILE_OUTCOME === 'success' &&
                process.env.REPAIR_OUTCOME === 'success'
                  ? 'success'
                  : 'failure',
              outputPath: path.join(process.env.GITHUB_WORKSPACE, '.legacy-lifecycle/records.json'),
            });
            core.setOutput('record-count', String(count));

      - name: Upload immutable Merge Train decisions
        if: always() && steps.capture-legacy-decision.outcome == 'success' && steps.capture-legacy-decision.outputs.record-count != '0'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: legacy-lifecycle-${{ github.run_id }}
          path: .legacy-lifecycle/records.json
          if-no-files-found: error
          retention-days: 14
