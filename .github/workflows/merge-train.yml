name: Merge Train

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, edited, closed, ready_for_review]
  # Two independent post-completion wake-ups feed reconcile, in addition to the
  # push/pull_request_target/schedule/workflow_dispatch triggers above:
  #   1. 'Merge Train Validation' completing (any event) -- the validate-publish
  #      job's `publish` step now ALSO explicitly workflow_dispatches this
  #      workflow, so this entry is defense-in-depth, not the primary signal.
  #   2. 'CI' completing -- covers the case where reconcile paused the train
  #      because "full-CI run for current main is still in_progress" (see
  #      reconcile.mjs); once that push's CI finishes we need a wake-up, since
  #      the push event itself already fired-and-passed before CI resolved.
  #      'CI' also runs on every PR and on an hourly schedule, so without a
  #      branch/event filter this would re-run reconcile on every PR-CI
  #      completion (storm) and on every scheduled CI run. `branches: [main]`
  #      narrows the workflow_run to runs whose (base, for PR-triggered runs)
  #      branch is main, but per GitHub's documented semantics that alone does
  #      NOT exclude a PR whose base branch is main -- so the job-level `if:`
  #      below additionally requires `event == 'push'` for 'CI' specifically.
  #      This mirrors the proven-safe pattern already shipped in
  #      `.github/workflows/deploy.yml` for the identical hourly-CI-storm class
  #      of bug -- EXCEPT that (unlike deploy.yml) a scheduled 'CI' completion
  #      is also allowed to wake reconcile when MERGE_TRAIN_ENABLED == 'true'.
  #      This is required because reconcile.mjs's own mainHealthAllowsPromotion()
  #      treats scheduled CI runs for the current main SHA as authoritative
  #      health evidence (mainHealthReason() picks the *newest* authoritative
  #      run for that SHA, push or schedule). If an hourly schedule run starts
  #      after the push run and is still the newest when reconcile wakes on the
  #      push completion, reconcile pauses on the schedule run instead; without
  #      also waking on that schedule run's completion, the train would fall
  #      back to the unreliable ~hourly cron trigger to notice it finished --
  #      reproducing the exact bug this PR fixes. This mirrors the identical
  #      `event == 'schedule' && vars.MERGE_TRAIN_ENABLED == 'true'` carve-out
  #      already shipped in `.github/workflows/ci-recovery-incidents.yml`.
  workflow_run:
    workflows: ['Merge Train Validation', 'CI']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: crawler-merge-train
  queue: max

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    # Fail-closed job gate:
    #   - pull_request_target: only for PRs from this repo (not forks), as before.
    #   - workflow_run named 'CI': only for a *push*-triggered CI completion (not
    #     a PR's CI completion) is unconditionally allowed; an *hourly-schedule*-
    #     triggered CI completion is ALSO allowed, but only while
    #     MERGE_TRAIN_ENABLED == 'true' (matching the ci-recovery-incidents.yml
    #     precedent) -- this closes the gap where reconcile.mjs's own
    #     mainHealthReason() may treat a same-SHA scheduled run as the newest
    #     authoritative evidence and pause on it even though this wake-up fired
    #     from the push run's completion; see the trigger-level comment above.
    #     `github.event.workflow_run.name` is checked (not just presence) so
    #     this clause does not accidentally restrict the 'Merge Train
    #     Validation' workflow_run, which must keep firing regardless of its
    #     `event` (it is always workflow_dispatch).
    #   - Every other event (push, schedule, workflow_dispatch, and the
    #     'Merge Train Validation' workflow_run) is unaffected.
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'CI' || github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'schedule' && vars.MERGE_TRAIN_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout trusted merge-train implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile six-PR build-expiry train
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
        run: node .github/scripts/merge-train/reconcile.mjs
