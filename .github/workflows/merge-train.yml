name: Merge Train

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, edited, closed, ready_for_review]
  workflow_run:
    workflows: ['Merge Train Validation', 'CI']
    types: [completed]
    # Candidate validation is dispatched from main; reject PR and non-main CI
    # completions before they create a Merge Train workflow run.
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: crawler-merge-train
  queue: max

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    # Fail-closed job gate:
    #   - pull_request_target: only for PRs from this repo (not forks), as before.
    #   - workflow_run named 'CI': allowed only for (a) a push-triggered CI
    #     completion on the default branch, or (b) a schedule-triggered CI
    #     completion while the train is enabled. (b) closes a gap:
    #     mainHealthReason() (reconcile-lib.mjs) treats whichever CI run for
    #     the current main SHA is newest by created_at as authoritative,
    #     regardless of push vs. schedule. If a scheduled CI run starts after
    #     the push run and is still in_progress when this wakes on the push
    #     completion, reconcile pauses citing the schedule run -- without (b),
    #     nothing would re-wake reconcile once that schedule run completes,
    #     falling back to the unreliable */5 cron (which arrives ~hourly in
    #     practice). Mirrors the identical carve-out already proven in
    #     ci-recovery-incidents.yml (only *reads* vars.MERGE_TRAIN_ENABLED;
    #     never sets it). Every other CI workflow_run (PR, or schedule while
    #     disabled) remains blocked -- no storm regression.
    #   - Every other event (push, schedule, workflow_dispatch, and the
    #     'Merge Train Validation' workflow_run) is unaffected.
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'workflow_run' ||
        github.event.workflow_run.name != 'CI' ||
        (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
        (github.event.workflow_run.event == 'schedule' &&
        vars.MERGE_TRAIN_ENABLED == 'true'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout trusted merge-train implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile six-PR build-expiry train
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
        run: node .github/scripts/merge-train/reconcile.mjs
