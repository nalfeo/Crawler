name: Merge Train

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, edited, closed, ready_for_review]
  workflow_run:
    workflows: ['Merge Train Validation', 'CI']
    types: [completed]
    # Candidate validation is dispatched from main; reject PR and non-main CI
    # completions before they create a Merge Train workflow run.
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    concurrency:
      group: crawler-merge-train
      queue: single
    # Fail-closed job gate:
    #   - pull_request_target: only for PRs from this repo (not forks) that
    #     currently carry or are transitioning the merge-train queue label.
    #   - workflow_run named 'CI': allowed only for (a) a push-triggered CI
    #     completion on the default branch, or (b) a schedule-triggered CI
    #     completion while the train is enabled. (b) is the wakeup for the
    #     failure-attribution pause: when the maximal composite is red and
    #     `mainAttributionVerdict()` (reconcile-lib.mjs) reports 'red',
    #     reconcile pauses without ejecting anyone, and something must re-wake
    #     it once main's own full-CI evidence turns green. Without (b) nothing
    #     re-wakes reconcile in that window, falling back to the unreliable
    #     */5 cron (which arrives ~hourly in practice). Mirrors the identical
    #     carve-out already proven in ci-recovery-incidents.yml (only *reads*
    #     vars.MERGE_TRAIN_ENABLED; never sets it). Every other CI workflow_run
    #     (PR, or schedule while disabled) remains blocked -- no storm
    #     regression.
    #   - Every other event (push, schedule, workflow_dispatch, and the
    #     'Merge Train Validation' workflow_run) is unaffected.
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        (contains(github.event.pull_request.labels.*.name, 'merge-train') ||
        github.event.label.name == 'merge-train'))) &&
        (github.event_name != 'workflow_run' ||
        github.event.workflow_run.name != 'CI' ||
        (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
        github.event.workflow_run.event == 'schedule')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch local actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: '.github/actions'
          persist-credentials: false

      - name: Train gate
        id: train-gate
        uses: ./.github/actions/train-gate
        with:
          # Gate only applies to schedule-triggered CI workflow_run events;
          # all other events (push, pull_request_target, workflow_dispatch,
          # Merge Train Validation workflow_run, direct schedule) proceed
          # unconditionally. See job-level if: comment above.
          event-is-schedule: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'schedule' }}
          merge-train-enabled: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}

      - name: Generate repository app token
        id: app-token
        if: steps.train-gate.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout trusted merge-train implementation
        if: steps.train-gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile six-PR build-expiry train
        if: steps.train-gate.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
          CI_GLOBAL_TRAIN_DISPATCH_CAP: ${{ vars.CI_GLOBAL_TRAIN_DISPATCH_CAP || '5' }}
          # Must match the coordinator's setting: this gates whether promotion
          # re-derives coordinator slot ordering (which survives label removal).
          CI_CONFLICT_COORDINATION_ENFORCE: ${{ vars.CI_CONFLICT_COORDINATION_ENFORCE || '0' }}
        run: node .github/scripts/merge-train/reconcile.mjs
