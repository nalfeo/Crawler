name: CI Recovery Incidents

on:
  workflow_run:
    workflows:
      - CI
      - Deploy to GitHub Pages
      - Promote to Production
      - Nightly Mutation Testing
      - Docs Update Loop
      - Security Review Loop
      - Test Health Loop
    types: [completed]

concurrency:
  group: crawler-ci-incident-${{ github.event.workflow_run.name }}
  queue: max

permissions:
  contents: read

jobs:
  route-incident:
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.name != 'CI' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted incident router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Deduplicate incident and assign Copilot
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
        run: node .github/scripts/ci-recovery/incident.mjs
