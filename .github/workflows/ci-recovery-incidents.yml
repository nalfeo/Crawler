name: CI Recovery Incidents

on:
  workflow_run:
    workflows:
      - CI
      - Deploy to GitHub Pages
      - Promote to Production
      - Nightly Mutation Testing
      - Docs Update Loop
      - Security Review Loop
      - Test Health Loop
    types: [completed]

concurrency:
  group: crawler-ci-incident-${{ github.event.workflow_run.name }}
  queue: max

permissions:
  contents: read

jobs:
  route-incident:
    # Only pull_request-triggered CI is out of scope here (it has its own
    # per-PR feedback). Every other workflow always routes. For the `CI`
    # workflow specifically: push-triggered runs always route, whether they
    # are a direct/administrative push or a train-promoted push, because a
    # failure either way is real. A train-promoted push can, however, succeed
    # trivially (the docs_only fast path skips the heavy suite), so its own
    # green conclusion is NOT evidence that an already-open incident's root
    # cause is fixed — incident.mjs itself must not auto-close on that kind
    # of success (it re-checks the head's attested merge-train provenance
    # before closing), so routing it here is safe either way.
    # Scheduled `CI` runs always route too. The daily scheduled run is the
    # unconditionally-full backstop (`ci.yml` forces every scope flag off for
    # schedule events, and its `changes` job is no longer gated on
    # MERGE_TRAIN_ENABLED), so a scheduled failure is real evidence of a broken
    # `main` whether the train is enabled or not — including during a rollback,
    # when it is the only full run left.
    if: >-
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted incident router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Deduplicate incident and assign Copilot
        env:
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          # Same exact rollout flag ci.yml/security-review.yml gate their
          # fast-path shortcuts on. Without it, incident.mjs's own fast-path
          # classifier would misclassify a genuine full-CI success as a
          # merge-train shortcut whenever the SHA still carries a stale
          # trusted `merge-train` check from before a flag-off rollback.
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED }}
        run: node .github/scripts/ci-recovery/incident.mjs
