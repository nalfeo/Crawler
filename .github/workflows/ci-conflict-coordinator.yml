name: CI Conflict Coordinator

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    concurrency:
      group: crawler-ci-conflict-coordinator
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout trusted coordinator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile overlapping CI pull requests
        env:
          CI_CONFLICT_COORDINATOR_TOKEN: ${{ steps.app-token.outputs.token }}
          CI_CONFLICT_COORDINATOR_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          MERGE_TRAIN_ADMISSION_CHECKS: ${{ vars.MERGE_TRAIN_ADMISSION_CHECKS || 'ci,Security checks' }}
          # Rollback switch: set repo variable CI_CONFLICT_COORDINATION_ENFORCE=1
          # to restore group serialization. Default is discovery-only.
          CI_CONFLICT_COORDINATION_ENFORCE: ${{ vars.CI_CONFLICT_COORDINATION_ENFORCE || '0' }}
        run: node .github/scripts/ci-conflict-coordinator/reconcile.mjs
