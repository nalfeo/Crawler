name: Auto-rebase open PRs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-rebase-prs
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  rebase-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase active PR branches onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "🔄 Fetching active PRs targeting main..."
          prs_json=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --json number,isDraft,headRefName,headRepository,headRepositoryOwner \
            --jq '[.[] | select(.isDraft == false)]')

          pr_count=$(echo "$prs_json" | jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "No active PRs targeting main."
            exit 0
          fi

          echo "Found $pr_count active PR(s). Rebasing branches..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune

          rebased=0
          conflicts=0
          skipped=0
          failed=0

          while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            head_ref=$(echo "$pr" | jq -r '.headRefName')
            head_owner=$(echo "$pr" | jq -r '.headRepositoryOwner.login // empty')
            head_repo=$(echo "$pr" | jq -r '.headRepository.name // empty')

            echo "Processing PR #$number ($head_owner/$head_repo:$head_ref)..."

            if [ "$head_owner/$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "  ⏭️ Skipping PR #$number (head branch is in a fork)."
              skipped=$((skipped + 1))
              continue
            fi

            if ! git fetch origin "$head_ref":"refs/remotes/origin/$head_ref"; then
              echo "  ⚠️ Failed to fetch branch for PR #$number; skipping."
              failed=$((failed + 1))
              continue
            fi

            if ! git checkout -B "auto-rebase-pr-$number" "origin/$head_ref"; then
              echo "  ⚠️ Failed to checkout branch for PR #$number; skipping."
              failed=$((failed + 1))
              continue
            fi

            if git rebase origin/main; then
              if git push --force-with-lease origin "HEAD:$head_ref"; then
                echo "  ✅ Rebasing complete for PR #$number."
                rebased=$((rebased + 1))
                # Close any open merge-conflict issue for this PR now that it's resolved.
                conflict_title="Merge conflict: PR #${number}"
                resolved_issue=$(gh issue list \
                  --repo "$GITHUB_REPOSITORY" \
                  --label "merge-conflict" \
                  --state open \
                  --json number,title \
                  --jq ".[] | select(.title == \"${conflict_title}\") | .number" | head -n 1)
                if [ -n "$resolved_issue" ]; then
                  gh issue close "$resolved_issue" \
                    --repo "$GITHUB_REPOSITORY" \
                    --comment "Conflict resolved — PR #${number} has been successfully rebased onto \`main\`."
                  echo "  ✅ Closed conflict issue #$resolved_issue."
                fi
              else
                echo "  ⚠️ Rebase succeeded but push failed for PR #$number; leaving branch unchanged."
                failed=$((failed + 1))
              fi
            else
              git rebase --abort || true
              echo "  ⚠️ Rebase conflict on PR #$number; filing issue for Copilot."

              # Ensure the tracking label exists (idempotent).
              gh label create "merge-conflict" \
                --color "e11d48" \
                --description "Branch has a merge conflict requiring resolution" \
                --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

              # File a GitHub issue and assign to copilot. Issue assignment triggers the
              # Copilot coding agent regardless of which identity makes the assignment —
              # unlike @mentions, which are ignored when posted by any bot account.
              conflict_title="Merge conflict: PR #${number}"
              pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${number}"
              conflict_body="PR #${number} (branch \`${head_ref}\`) has a merge conflict with \`main\` that the auto-rebase workflow could not resolve automatically."$'\n\n'"**PR:** ${pr_url}"$'\n\n'"Please resolve the conflict directly in PR #${number} by pushing the resolved changes to branch \`${head_ref}\` and ensuring CI passes. This issue will be closed automatically once the rebase succeeds."

              existing_conflict_issue=$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --label "merge-conflict" \
                --state open \
                --json number,title \
                --jq ".[] | select(.title == \"${conflict_title}\") | .number" | head -n 1)

              if [ -z "$existing_conflict_issue" ]; then
                gh issue create \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$conflict_title" \
                  --body "$conflict_body" \
                  --label "merge-conflict" \
                  --assignee "copilot-swe-agent"
                echo "  🤖 Filed conflict issue for PR #$number and assigned to Copilot."
              else
                echo "  ℹ️ Conflict issue #$existing_conflict_issue already open for PR #$number."
              fi
              conflicts=$((conflicts + 1))
            fi
          done < <(echo "$prs_json" | jq -c '.[]')

          echo "Checking for stale merge-conflict issues whose PRs are no longer open..."
          stale_issues=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "merge-conflict" \
            --state open \
            --json number,title \
            --jq '.[]')
          while IFS= read -r issue_entry; do
            [ -z "$issue_entry" ] && continue
            issue_num=$(echo "$issue_entry" | jq -r '.number')
            issue_title=$(echo "$issue_entry" | jq -r '.title')
            # Extract PR number from title "Merge conflict: PR #N"
            pr_num=$(echo "$issue_title" | grep -oP '(?<=PR #)\d+' | head -n 1)
            [ -z "$pr_num" ] && continue
            pr_state=$(gh pr view "$pr_num" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null || echo "")
            if [ "$pr_state" != "OPEN" ] && [ -n "$pr_state" ]; then
              gh issue close "$issue_num" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "PR #${pr_num} is no longer open (state: ${pr_state}). Closing stale conflict issue."
              echo "  ✅ Closed stale conflict issue #$issue_num (PR #$pr_num is $pr_state)."
            fi
          done < <(echo "$stale_issues" | jq -c '.')

          echo "Done. Rebasing summary: rebased=$rebased conflicts=$conflicts skipped=$skipped failed=$failed"
