name: Auto-rebase open PRs

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened]
    paths:
      - '**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for conflict-only rebase when the train is enabled
        required: false
        default: ''
        type: string
      expected_head_sha:
        description: Expected PR head SHA for conflict-only rebase
        required: false
        default: ''
        type: string
      expected_base_ref:
        description: Expected PR base ref for conflict-only recovery callbacks
        required: false
        default: ''
        type: string
      trigger:
        description: Rebase dispatch source
        required: false
        default: workflow_dispatch
        type: string

concurrency:
  group: auto-rebase-prs-${{ vars.MERGE_TRAIN_ENABLED == 'true' && inputs.pr_number || 'legacy' }}
  cancel-in-progress: ${{ vars.MERGE_TRAIN_ENABLED != 'true' }}

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  rebase-prs:
    if: >-
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (vars.MERGE_TRAIN_ENABLED == 'true' ||
       !contains(fromJSON('["true","1","yes","on","TRUE","YES","ON","True","Yes","On"]'),
                 vars.MERGE_QUEUE_ENABLED))
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Rebase active PR branches onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          TARGET_PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_INPUT: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_INPUT: ${{ inputs.expected_base_ref }}
          DISPATCH_TRIGGER_INPUT: ${{ inputs.trigger }}
        run: |
          set -euo pipefail

          train_enabled='${{ vars.MERGE_TRAIN_ENABLED || 'false' }}'
          case "$train_enabled" in
            true|false) ;;
            *)
              echo "::error::MERGE_TRAIN_ENABLED must be exactly true or false."
              exit 1
              ;;
          esac

          echo "🔄 Fetching active PRs targeting main..."
          if [ "$train_enabled" = "true" ]; then
            target_pr="$TARGET_PR"
            expected_head="$EXPECTED_HEAD_INPUT"
            expected_base="$EXPECTED_BASE_INPUT"
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ -z "$target_pr" ]; then
              echo "Merge train enabled; blanket rebase sweep disabled."
              exit 0
            fi
            if [ -z "$expected_head" ] || [ -z "$expected_base" ]; then
              echo "Merge train enabled; targeted rebase dispatch requires expected head/base metadata."
              exit 0
            fi
            prs_json=$(
              gh pr view "$target_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --json number,state,isDraft,baseRefName,headRefOid,headRefName,headRepository,headRepositoryOwner,labels |
                jq --arg expected "$expected_head" --arg base "$expected_base" --arg repo "$GITHUB_REPOSITORY" \
                  '[select(.state == "OPEN" and .isDraft == false and .baseRefName == $base and .headRefOid == $expected and ((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")) == $repo)]'
            )
            if [ "$(echo "$prs_json" | jq 'length')" -eq 0 ]; then
              echo "Target PR is no longer open, non-draft, same-repository, base-targeting, or at the expected head; skipping stale dispatch."
              exit 0
            fi
          else
            # D2 fix: include mergeStateStatus so the loop can route BEHIND vs DIRTY
            # without a git-rebase attempt (which would force-push with the App token
            # and trigger the D7 action_required parking trap).
            prs_json=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --json number,isDraft,headRefOid,headRefName,headRepository,headRepositoryOwner,labels,mergeStateStatus,mergeable \
              --jq '[.[] | select(.isDraft == false)]')
          fi

          pr_count=$(echo "$prs_json" | jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "No active PRs targeting main."
            exit 0
          fi

          echo "Found $pr_count active PR(s). Processing..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune

          rebased=0
          updated=0
          conflicts=0
          skipped=0
          failed=0

          while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            head_ref=$(echo "$pr" | jq -r '.headRefName')
            head_owner=$(echo "$pr" | jq -r '.headRepositoryOwner.login // empty')
            head_repo=$(echo "$pr" | jq -r '.headRepository.name // empty')
            expected_head=$(echo "$pr" | jq -r '.headRefOid // empty')

            echo "Processing PR #$number ($head_owner/$head_repo:$head_ref)..."

            if [ "$head_owner/$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "  ⏭️ Skipping PR #$number (head branch is in a fork)."
              skipped=$((skipped + 1))
              continue
            fi

            # D2 fix (always-rebase, not conflict-only): for the non-train blanket
            # sweep, use the GitHub update-branch API instead of git-rebase + force-push.
            # Use CRAWLER_CI_PAT when available so the branch update triggers required CI
            # (GITHUB_TOKEN is recursion-suppressed for push events, while CRAWLER_CI_PAT
            # is a user token that emits normal push events and re-triggers CI).
            # For conflicted PRs, dispatch ci-recovery directly without a git-rebase
            # attempt.  Only the train-mode targeted conflict-rebase path still uses
            # git operations (see below).
            if [ "$train_enabled" != "true" ]; then
              merge_state=$(echo "$pr" | jq -r '.mergeStateStatus // "UNKNOWN"')
              case "$merge_state" in
                BEHIND)
                  echo "  🔄 PR #$number is clean-BEHIND; calling update-branch (D2 fix)..."
                  update_branch_token="${CRAWLER_CI_PAT:-$GH_TOKEN}"
                  set +e
                  GH_TOKEN="$update_branch_token" gh api \
                    -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" \
                    -F expected_head_sha="$expected_head" \
                    > /tmp/update_branch_out.json 2>/tmp/update_branch_err.txt
                  api_exit=$?
                  set -e
                  if [ $api_exit -eq 0 ]; then
                    echo "  ✅ Branch update queued for PR #$number."
                    updated=$((updated + 1))
                  elif grep -qi '"status":422\|HTTP 422\|Unprocessable' /tmp/update_branch_err.txt 2>/dev/null; then
                    echo "  ⚠️ update-branch 422 for PR #$number (already up-to-date or stale head); skipping."
                    skipped=$((skipped + 1))
                  else
                    echo "  ❌ update-branch failed for PR #$number (non-422 error):"
                    cat /tmp/update_branch_err.txt || true
                    failed=$((failed + 1))
                  fi
                  continue
                  ;;
                DIRTY)
                  echo "  ⚠️ Conflict on PR #$number; dispatching trusted CI recovery."
                  gh workflow run ci-recovery.yml \
                    --repo "$GITHUB_REPOSITORY" \
                    --ref main \
                    -f operation=reconcile \
                    -f pr_number="$number" \
                    -f trigger=auto-rebase-conflict \
                    -f lease_id=
                  conflicts=$((conflicts + 1))
                  continue
                  ;;
                *)
                  echo "  ⏭️ Skipping PR #$number (mergeStateStatus=$merge_state; no update action needed)."
                  skipped=$((skipped + 1))
                  continue
                  ;;
              esac
            fi

            # Train mode: git rebase + force-push for targeted conflict recovery.
            if ! git fetch origin "$head_ref":"refs/remotes/origin/$head_ref"; then
              echo "  ⚠️ Failed to fetch branch for PR #$number; skipping."
              failed=$((failed + 1))
              continue
            fi

            if ! git checkout -B "auto-rebase-pr-$number" "origin/$head_ref"; then
              echo "  ⚠️ Failed to checkout branch for PR #$number; skipping."
              failed=$((failed + 1))
              continue
            fi

            if git rebase origin/main; then
              rebased_head=$(git rev-parse HEAD)
              if [ "$train_enabled" = "true" ] && [ "$DISPATCH_TRIGGER_INPUT" = "ci-recovery-validation" ] && [ "$rebased_head" = "$expected_head" ]; then
                echo "  ℹ️ Validation recovery rebase produced no head movement; creating an empty retrigger commit."
                git commit --allow-empty -m "chore(ci-recovery): retrigger validation recovery for PR #$number"
              fi
              if [ "$train_enabled" = "true" ]; then
                live_pr=$(
                  gh pr view "$number" \
                    --repo "$GITHUB_REPOSITORY" \
                    --json state,isDraft,baseRefName,headRefOid,headRepository,headRepositoryOwner
                )
                if ! echo "$live_pr" | jq -e --arg expected "$expected_head" --arg base "$expected_base" --arg repo "$GITHUB_REPOSITORY" \
                  '.state == "OPEN" and .isDraft == false and .baseRefName == $base and .headRefOid == $expected and ((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")) == $repo' >/dev/null; then
                  echo "  ⏭️ Skipping push for PR #$number (metadata drifted after rebase)."
                  skipped=$((skipped + 1))
                  continue
                fi
              fi
              if git push --force-with-lease="refs/heads/$head_ref:$expected_head" origin "HEAD:$head_ref"; then
                echo "  ✅ Rebasing complete for PR #$number."
                rebased=$((rebased + 1))
              else
                echo "  ⚠️ Rebase succeeded but push failed for PR #$number; leaving branch unchanged."
                failed=$((failed + 1))
              fi
            else
              git rebase --abort || true
              echo "  ⚠️ Rebase conflict on PR #$number; dispatching trusted CI recovery."
              if [ "$train_enabled" = "true" ]; then
                gh workflow run ci-recovery.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f operation=reconcile \
                  -f pr_number="$number" \
                  -f trigger=auto-rebase-conflict \
                  -f expected_head_sha="$expected_head" \
                  -f expected_base_ref="$expected_base" \
                  -f lease_id=
              else
                gh workflow run ci-recovery.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f operation=reconcile \
                  -f pr_number="$number" \
                  -f trigger=auto-rebase-conflict \
                  -f lease_id=
              fi
              conflicts=$((conflicts + 1))
            fi
          done < <(echo "$prs_json" | jq -c '.[]')

          echo "Done. Summary: updated=$updated rebased=$rebased conflicts=$conflicts skipped=$skipped failed=$failed"
          if [ "$train_enabled" = "true" ] && [ "$failed" -gt 0 ]; then
            gh workflow run ci-recovery.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f operation=reconcile \
              -f pr_number="$target_pr" \
              -f trigger=auto-rebase-failure \
              -f expected_head_sha="$expected_head" \
              -f expected_base_ref="$expected_base" \
              -f lease_id=
            exit 1
          fi
