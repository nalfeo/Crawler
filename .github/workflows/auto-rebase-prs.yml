name: Auto-rebase open PRs

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Update all open PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Fetching open PRs..."
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number')

          if [ -z "$prs" ]; then
            echo "No open PRs to update."
            exit 0
          fi

          for pr in $prs; do
            echo "Updating PR #$pr with latest main..."

            # Try to update the branch (merge main in)
            response=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/update-branch" \
              --method PUT \
              --field expected_head_sha="" 2>&1) && status=0 || status=$?

            if [ $status -eq 0 ]; then
              echo "  ✅ PR #$pr updated successfully"

              # Request Copilot code review
              echo "  🤖 Requesting Copilot code review..."
              gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/requested_reviewers" \
                --method POST \
                --field "reviewers[]=copilot-pull-request-reviewer" 2>/dev/null \
                && echo "  ✅ Copilot review requested" \
                || echo "  ⚠️  Could not request Copilot review"
            else
              echo "  ❌ PR #$pr has merge conflicts"

              # Ask Copilot to resolve the conflicts
              echo "  🤖 Asking Copilot to resolve conflicts..."
              gh pr comment "$pr" \
                --repo "$GITHUB_REPOSITORY" \
                --body "@copilot resolve the merge conflicts with main and keep the intent of this PR's changes." 2>/dev/null \
                && echo "  ✅ Copilot asked to resolve conflicts" \
                || echo "  ⚠️  Could not comment on PR"
            fi

            sleep 2
          done

          echo "✅ Done processing PR branches."
