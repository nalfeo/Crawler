name: Auto-rebase open PRs

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Update all open PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Fetching open PRs..."
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '.[].number')

          if [ -z "$prs" ]; then
            echo "No open PRs to update."
            exit 0
          fi

          for pr in $prs; do
            echo "Updating PR #$pr with latest main..."
            if gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/update-branch" \
              --method PUT \
              --field expected_head_sha="" 2>/dev/null; then
              echo "  ✅ PR #$pr updated"
            else
              echo "  ⚠️  PR #$pr skipped (conflict or already up to date)"
            fi
            # Small delay to avoid rate limits
            sleep 1
          done

          echo "✅ Done updating PR branches."
