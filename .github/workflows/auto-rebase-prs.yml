name: Auto-rebase open PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-rebase-prs
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase active PR branches onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "🔄 Fetching active PRs targeting main..."
          prs_json=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --json number,isDraft,headRefName,headRepository,headRepositoryOwner \
            --jq '[.[] | select(.isDraft == false)]')

          pr_count=$(echo "$prs_json" | jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "No active PRs targeting main."
            exit 0
          fi

          echo "Found $pr_count active PR(s). Rebasing branches..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune

          rebased=0
          conflicts=0
          skipped=0

          while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            head_ref=$(echo "$pr" | jq -r '.headRefName')
            head_owner=$(echo "$pr" | jq -r '.headRepositoryOwner.login // empty')
            head_repo=$(echo "$pr" | jq -r '.headRepository.name // empty')

            echo "Processing PR #$number ($head_owner/$head_repo:$head_ref)..."

            if [ "$head_owner/$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "  ⏭️ Skipping PR #$number (head branch is in a fork)."
              skipped=$((skipped + 1))
              continue
            fi

            git fetch origin "$head_ref":"refs/remotes/origin/$head_ref"
            git checkout -B "auto-rebase-pr-$number" "origin/$head_ref"

            if git rebase origin/main; then
              git push --force-with-lease origin "HEAD:$head_ref"
              echo "  ✅ Rebasing complete for PR #$number."
              rebased=$((rebased + 1))
            else
              git rebase --abort
              echo "  ⚠️ Rebase conflict on PR #$number; leaving branch unchanged."
              conflicts=$((conflicts + 1))
            fi
          done < <(echo "$prs_json" | jq -c '.[]')

          echo "Done. Rebasing summary: rebased=$rebased conflicts=$conflicts skipped=$skipped"
