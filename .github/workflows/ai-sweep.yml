# AI combo × hill-climb evaluation pipeline (cloud-parallel, dispatch-only).
#
# WHAT IT DOES
#   For each selected pathing×decision COMBO it runs a bounded, CHECKPOINTED
#   round-DAG knob search on the TRAIN seed panel, then VALIDATES each combo's
#   tuned finalist — plus the untuned LEGACY/LEGACY incumbent control — on a
#   full seed panel, then fans the shard artifacts into ONE leaderboard (Σ
#   composite score, win count, flips-vs-incumbent, clear time, xp, gold,
#   min-HP) AND a safety-gated qualified-winner recommendation (>=90% wins AND
#   strictly MORE total wins than the incumbent — win→loss flips are allowed
#   as long as total wins still strictly increase, per the human-approved
#   net-win promotion rule — see `selectQualifiedWinner` in
#   aggregate-shards.ts), rendered to the run summary + a JSON artifact.
#
#   It only MEASURES. It never flips the shipped default (that is the separate,
#   human-gated Stage-5 PR). Main stays LEGACY/LEGACY byte-identical.
#
# WHY THE ROUND-DAG REDESIGN (2026-07 timing fix)
#   The prior design flattened an ENTIRE round's candidates × weapons × seeds
#   into ONE 4-worker job per combo, so wall time scaled as
#   (candidates × weapons × seeds / workers) — one round of 13 configs × 3
#   weapons × 80 seeds = 3,120 runs took a projected ~5h25m (observed baseline:
#   240 runs / 4 workers ≈ 25 min ⇒ ~100s/run serialized-equivalent), well
#   beyond this workflow's timeout. Run 29606086471 was cancelled after ~3h40
#   with ZERO artifacts, because the old `search` job only emitted its shard at
#   the very end.
#
#   The fix fans each round's candidates into INDEPENDENT matrix jobs (one
#   config per job, self-parallelised over weapon×seed by the existing
#   4-worker pool) and checkpoints every round to an IMMUTABLE per-round
#   artifact (`search-checkpoint-init-<combo>`, `search-checkpoint-r1-<combo>`,
#   etc.) so that a timeout or cancelled upload never destroys a prior round's
#   progress. The `validate` job downloads all checkpoint tiers and selects
#   the latest available (r3 → r2 → r1 → init), so:
#     - one combo's one-round search is bounded by (candidates / concurrency),
#       not (candidates × weapons × seeds / workers) — ~25-40 min per
#       candidate job, running in parallel, comfortably under 90 minutes for
#       one combo's one round even with modest concurrency;
#     - a timeout or a partial matrix failure NEVER discards earlier rounds'
#       progress — the last successfully-uploaded checkpoint is always a valid
#       input to `validate` (see `applyRoundResult` in round-plan.ts, which is
#       explicitly designed to advance-or-degrade gracefully on zero/partial
#       candidate shards rather than throw).
#   GitHub Actions matrices can't express a fully generic "repeat until
#   converged" loop with dynamic job counts across rounds, so this is an
#   EXPLICIT bounded 1–3 round DAG (round1-*/round2-*/round3-* job triples)
#   rather than a generic loop — see the plan's adversarial review for why a
#   fully generic design was rejected as impractical on this platform.
#
#   RESIDUAL LIMITATION (documented, not hidden): the <=90-minute bound is
#   proven at the PER-COMBO PER-ROUND grain (the grain this task's hard gate
#   asks for) — one combo's ~12 primary-knob candidates. round-eval's matrix
#   is capped at `max-parallel: 8` (same cap as baseline/checkpoint-init/
#   round-select/validate) so a FULL 8-combo × 3-round graduation run cannot
#   saturate the account's entire GitHub-hosted concurrent-runner pool and
#   starve unrelated repo-wide work (e.g. the shared merge-train queue's own
#   validation jobs) — see run 29786216369, which fanned out 20 concurrent
#   Round 3 eval jobs with 44 more queued behind them before it was manually
#   cancelled. A FULL 8-combo × 3-round graduation run's aggregate wall-clock
#   now additionally depends on this repo-level concurrency cap (8 candidates
#   in flight at a time per round, per combo-fan), since all combos' round-eval
#   candidates share one flat matrix per round. This is a materially better
#   bound than the old design (which had NO per-round parallelism at all) but
#   is not independently proven to keep the FULL 8-combo scope under 90
#   minutes when the cap is the binding constraint.
#
# HOW TO RUN (staged, per the plan)
#   - Cheap screen / calibration (DEFAULTS): rounds=2, train 1-24, validate 1-40.
#     Proves the pipeline + gives a real-ubuntu per-run wall time. Never touches
#     holdout seeds 81-100.
#   - Full graduation run: set train_seeds=1-80, validate_seeds=1-100, rounds=3.
#     TRAIN=1-80 is the only panel the search/tuning ever sees; HOLDOUT=81-100 is
#     touched exactly once here, at validate, so an overfit finalist is caught.
#
#   gh workflow run ai-sweep.yml --ref <branch> \
#     -f combos=all -f train_seeds=1-80 -f validate_seeds=1-100 -f rounds=3
#
# WHY DISPATCH-ONLY: a push/token trigger is a permanent compute foot-gun (any
# tokenized commit burns a full matrix). Dispatch is deliberate. `workflow_dispatch`
# must live on the default branch to be dispatchable, but `gh workflow run --ref
# <branch>` then executes THAT branch's YAML + code, so experiment branches work.

name: AI Sweep Eval

on:
  workflow_dispatch:
    inputs:
      combos:
        description: 'Combos to evaluate: "all" or a CSV of ids (e.g. legacy+legacy,navmeshFused+legacy)'
        type: string
        default: 'all'
      train_seeds:
        description: 'TRAIN seed panel for the knob search (never includes holdout). Full run: 1-80'
        type: string
        default: '1-24'
      validate_seeds:
        description: 'Seed panel for finalist validation. Full graduation run: 1-100 (touches holdout once)'
        type: string
        default: '1-40'
      weapons:
        description: 'Comma-separated Floor-1 weapons'
        type: string
        default: 'sword,bow,baseball-bat'
      workers:
        description: 'Intra-job worker-pool size (match runner vCPUs)'
        type: string
        default: '4'
      rounds:
        description: 'Round-DAG stages to run, bounded 0-3 (each round fans candidates into parallel matrix jobs — see header). 0 = baseline/screen only, no tuning. Full run: 3'
        type: string
        default: '2'
      secondary:
        description: 'Also tune the secondary knobs (retreatDangerRadius, scanRadius, opportunisticGrabRadius)'
        type: boolean
        default: false

# Read-only: checkout + artifact up/download need nothing more. No default flip here.
permissions:
  contents: read

jobs:
  # Derive the combo matrix from the SSOT generator (not hard-coded here), validate
  # any user-supplied subset against the real enum, hard-fail on an oversized
  # matrix (adversarial-review cardinality guard), and cap `rounds` to the
  # explicit bounded 1-3 round DAG this workflow implements.
  preflight:
    name: Preflight (derive + cap combo matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      combos: ${{ steps.matrix.outputs.combos }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Resolve + validate combo matrix
        id: matrix
        env:
          COMBOS_INPUT: ${{ inputs.combos }}
        run: |
          set -euo pipefail
          ALL=$(npx tsx scripts/agent/perf/gen-configs.ts | jq -c '[.combos[].id]')
          echo "All combos: $ALL"
          if [ -z "${COMBOS_INPUT:-}" ] || [ "$COMBOS_INPUT" = "all" ]; then
            SELECTED="$ALL"
          else
            SELECTED=$(printf '%s' "$COMBOS_INPUT" \
              | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')
            UNKNOWN=$(jq -c -n --argjson all "$ALL" --argjson sel "$SELECTED" '$sel - $all')
            if [ "$(printf '%s' "$UNKNOWN" | jq 'length')" -ne 0 ]; then
              echo "::error::Unknown combo id(s): $UNKNOWN. Valid: $ALL"
              exit 1
            fi
          fi
          COUNT=$(printf '%s' "$SELECTED" | jq 'length')
          echo "Selected $COUNT combo(s): $SELECTED"
          if [ "$COUNT" -lt 1 ] || [ "$COUNT" -gt 200 ]; then
            echo "::error::combo matrix cardinality $COUNT out of bounds (1..200)"
            exit 1
          fi
          echo "combos=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Validate rounds is within the explicit bounded round-DAG (0-3)
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          case "$ROUNDS" in
            ''|*[!0-9]*)
              echo "::error::rounds='$ROUNDS' is not a non-negative integer."
              exit 1
              ;;
          esac
          if [ "$ROUNDS" -gt 3 ]; then
            echo "::error::rounds=$ROUNDS out of bounds — this workflow implements an explicit bounded 0-3 round-DAG (round1-*/round2-*/round3-* job triples), not a generic loop."
            exit 1
          fi

  # One job per combo: evaluate ONLY the SSOT base config on TRAIN seeds. This
  # replaces the old flat `search` job's implicit round-0 evaluation with an
  # explicit, independently-timed stage (see header for the timing rationale).
  baseline:
    name: Baseline ${{ matrix.combo }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        combo: ${{ fromJSON(needs.preflight.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Evaluate SSOT base config (TRAIN panel)
        env:
          COMBO: ${{ matrix.combo }}
          TRAIN_SEEDS: ${{ inputs.train_seeds }}
          WEAPONS: ${{ inputs.weapons }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          npx tsx scripts/agent/perf/sweep-eval.ts \
            --stage search-baseline --combo "$COMBO" \
            --train-seeds "$TRAIN_SEEDS" --weapons "$WEAPONS" \
            --workers "$WORKERS" \
            --out "baseline-$COMBO.json"

      - uses: actions/upload-artifact@v4
        with:
          name: search-baseline-${{ matrix.combo }}
          path: baseline-*.json
          if-no-files-found: error
          retention-days: 7

  # One job per combo: wrap the baseline shard into a round-0 checkpoint. Per-round
  # select jobs upload immutable per-round checkpoint artifacts (search-checkpoint-r1-*,
  # etc.) rather than overwriting a single artifact, so `validate` can always find
  # the last successfully-uploaded round even if a later upload failed.
  checkpoint-init:
    name: Checkpoint init ${{ matrix.combo }}
    needs: [preflight, baseline]
    # if: !cancelled() — `baseline` is a fail-fast:false MATRIX job, so the
    # job-level `needs.baseline` conclusion is 'failure' if even ONE combo's
    # leg failed, even though every other combo's baseline artifact uploaded
    # fine. Without this the implicit `if: success()` would SKIP this entire
    # job (all combos) on any single combo's flakiness, discarding every other
    # combo's progress — exactly what the checkpoint redesign exists to
    # prevent. Each combo's OWN download-artifact step below is what actually
    # gates that one combo (it fails in isolation, thanks to this job's own
    # fail-fast:false). `!cancelled()` (not `always()`) so a MANUAL workflow
    # cancellation still stops this job — `always()` runs even through a
    # user-initiated cancellation, which would keep burning runner minutes on
    # every downstream round-select/validate/aggregate job the user just
    # asked to stop (found in multi-model review, gemini-3.1-pro-preview).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        combo: ${{ fromJSON(needs.preflight.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download this combo's baseline shard
        uses: actions/download-artifact@v4
        with:
          name: search-baseline-${{ matrix.combo }}

      - name: Download legacy+legacy baseline shard (optional — provides the LEGACY incumbent for the non-LEGACY combo net-win comparison)
        uses: actions/download-artifact@v4
        with:
          pattern: search-baseline-legacy+legacy
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Build round-0 checkpoint
        env:
          COMBO: ${{ matrix.combo }}
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          # For non-LEGACY combos, seed the net-win gate with the LEGACY incumbent
          # so the in-search comparison mirrors the final graduation gate.
          # The LEGACY baseline is REQUIRED for non-LEGACY combos — without it,
          # initCheckpoint falls back to the combo's own base as incumbent, which
          # can promote a candidate that has more wins than its combo baseline yet
          # fewer total wins than LEGACY (passes in-search gate but gets rejected
          # at final graduation). Fail fast here instead.
          LEGACY_BASELINE_FLAG=""
          if [ "$COMBO" != "legacy+legacy" ]; then
            if [ ! -f "baseline-legacy+legacy.json" ]; then
              echo "❌ LEGACY baseline shard 'baseline-legacy+legacy.json' is required for non-LEGACY combo '$COMBO' but was not found." >&2
              echo "   Ensure legacy+legacy is included in the 'combos' input and its checkpoint-init leg succeeded." >&2
              exit 1
            fi
            LEGACY_BASELINE_FLAG="--legacy-baseline baseline-legacy+legacy.json"
          fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode init --combo "$COMBO" --baseline "baseline-$COMBO.json" $SECONDARY_FLAG $LEGACY_BASELINE_FLAG \
            --out "search-checkpoint-init-$COMBO.json"

      - uses: actions/upload-artifact@v4
        with:
          name: search-checkpoint-init-${{ matrix.combo }}
          path: search-checkpoint-init-*.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ROUND 1 — one job triple: candidates (fan-in all combos' checkpoints → one
  # flattened, cap-guarded candidate list) → eval (one independent matrix job
  # PER CANDIDATE, across all open combos) → select (fan-in each combo's shards
  # of this round back into its checkpoint, adopt-or-halve).
  # ---------------------------------------------------------------------------
  round1-candidates:
    name: Round 1 — plan candidates
    needs: checkpoint-init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # if: !cancelled() — `checkpoint-init` is a fail-fast:false MATRIX job; one
    # combo's leg failing (e.g. its baseline never uploaded) makes the
    # job-level `needs.checkpoint-init` conclusion 'failure' even though most
    # combos succeeded. Without this, this single (non-matrixed) planning
    # job would be skipped OUTRIGHT — losing every combo's round-1 candidates,
    # not just the failed one. The download step below (pattern-based,
    # `merge-multiple`) simply won't find the failed combo's checkpoint, so
    # that combo is naturally excluded from this round's plan without
    # crashing the others. `!cancelled()` rather than `always()` so a manual
    # workflow cancellation still stops the round DAG instead of continuing to
    # burn runner minutes (same rationale as `checkpoint-init` above).
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 1 }}
    outputs:
      hasCandidates: ${{ steps.plan.outputs.hasCandidates }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download every combo's init checkpoint
        uses: actions/download-artifact@v4
        with:
          pattern: search-checkpoint-init-*
          merge-multiple: true
          path: checkpoints

      - name: Plan round 1 candidates
        id: plan
        env:
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode plan --round 1 $SECONDARY_FLAG --cap 200 \
            --out candidates.json checkpoints/*.json
          HAS=$(jq -r '.hasCandidates' candidates.json)
          echo "hasCandidates=$HAS" >> "$GITHUB_OUTPUT"
          {
            echo 'matrix<<MTRX_EOF'
            jq -c '.candidates' candidates.json
            echo 'MTRX_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: round1-candidates
          path: candidates.json
          if-no-files-found: error
          retention-days: 7

  round1-eval:
    name: Round 1 eval ${{ matrix.candidate.combo }}
    needs: round1-candidates
    if: needs.round1-candidates.outputs.hasCandidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Capped at the same max-parallel:8 used by baseline/checkpoint-init/
      # round-select/validate, so a full 8-combo round can't saturate the
      # account's entire concurrent-runner pool and starve unrelated
      # repo-wide work (e.g. the shared merge-train queue) — see run
      # 29786216369, which fanned out 20 concurrent Round 3 eval jobs with
      # 44 more queued before it was manually cancelled.
      max-parallel: 8
      matrix:
        candidate: ${{ fromJSON(needs.round1-candidates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Hash candidate id (artifact-safe name)
        id: hash
        env:
          CONFIG_ID: ${{ matrix.candidate.configId }}
        run: |
          set -euo pipefail
          HASH=$(printf '%s' "$CONFIG_ID" | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Evaluate candidate (TRAIN panel)
        env:
          COMBO: ${{ matrix.candidate.combo }}
          CONFIG_ID: ${{ matrix.candidate.configId }}
          CONFIG_JSON: ${{ toJSON(matrix.candidate.config) }}
          TRAIN_SEEDS: ${{ inputs.train_seeds }}
          WEAPONS: ${{ inputs.weapons }}
          WORKERS: ${{ inputs.workers }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          npx tsx scripts/agent/perf/sweep-eval.ts \
            --stage search-eval --combo "$COMBO" \
            --config-id "$CONFIG_ID" --config-json "$CONFIG_JSON" \
            --train-seeds "$TRAIN_SEEDS" --weapons "$WEAPONS" \
            --workers "$WORKERS" \
            --out "shard-$HASH.json"

      - uses: actions/upload-artifact@v4
        with:
          name: round1-shard-${{ matrix.candidate.combo }}-${{ steps.hash.outputs.hash }}
          # Filename MUST be unique per candidate, not the fixed "shard.json"
          # used before this fix: round1-select downloads every candidate's
          # artifact for a combo with merge-multiple:true into ONE shared
          # "shards/" directory, and download-artifact silently OVERWRITES
          # same-named files across merged artifacts -- with a fixed
          # "shard.json" name, only the LAST-downloaded candidate's shard
          # would survive and every other candidate's result would be
          # silently discarded every round (found in multi-model review,
          # gemini-3.1-pro-preview).
          path: shard-${{ steps.hash.outputs.hash }}.json
          if-no-files-found: error
          retention-days: 7

  round1-select:
    name: Round 1 select ${{ matrix.combo }}
    needs: [preflight, checkpoint-init, round1-candidates, round1-eval]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        combo: ${{ fromJSON(needs.preflight.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download this combo's init checkpoint
        uses: actions/download-artifact@v4
        with:
          name: search-checkpoint-init-${{ matrix.combo }}

      - name: Download round 1's candidate plan (to know this combo's PLANNED count)
        uses: actions/download-artifact@v4
        with:
          pattern: round1-candidates
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Download this combo's round-1 shards (if any)
        uses: actions/download-artifact@v4
        with:
          pattern: round1-shard-${{ matrix.combo }}-*
          merge-multiple: true
          path: shards
          if-no-artifact-found: warn

      - name: Fold round 1 into checkpoint
        env:
          COMBO: ${{ matrix.combo }}
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          SHARDS=(shards/*.json)
          # PLANNED = how many candidates this round actually planned for THIS
          # combo. "unknown" (distinct from the legitimate 0) means
          # candidates.json itself is missing -- round1-candidates crashed
          # before uploading its artifact, so we cannot tell "0 planned" from
          # "N planned, all lost" and must not infer convergence. See
          # applyRoundResult's plannedCount doc comment.
          PLANNED=unknown
          if [ -f candidates.json ]; then
            PLANNED=$(jq --arg combo "$COMBO" '[.candidates[] | select(.combo==$combo)] | length' candidates.json)
          fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode select --round 1 --checkpoint "search-checkpoint-init-$COMBO.json" \
            --planned-count "$PLANNED" $SECONDARY_FLAG \
            --out "search-checkpoint-r1-$COMBO.json" "${SHARDS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: search-checkpoint-r1-${{ matrix.combo }}
          path: search-checkpoint-r1-*.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ROUND 2 — identical shape to round 1, gated one level deeper.
  # ---------------------------------------------------------------------------
  round2-candidates:
    name: Round 2 — plan candidates
    needs: round1-select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 2 }}
    outputs:
      hasCandidates: ${{ steps.plan.outputs.hasCandidates }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download every combo's round-1 checkpoint
        uses: actions/download-artifact@v4
        with:
          pattern: search-checkpoint-r1-*
          merge-multiple: true
          path: checkpoints

      - name: Plan round 2 candidates
        id: plan
        env:
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode plan --round 2 $SECONDARY_FLAG --cap 200 \
            --out candidates.json checkpoints/*.json
          HAS=$(jq -r '.hasCandidates' candidates.json)
          echo "hasCandidates=$HAS" >> "$GITHUB_OUTPUT"
          {
            echo 'matrix<<MTRX_EOF'
            jq -c '.candidates' candidates.json
            echo 'MTRX_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: round2-candidates
          path: candidates.json
          if-no-files-found: error
          retention-days: 7

  round2-eval:
    name: Round 2 eval ${{ matrix.candidate.combo }}
    needs: round2-candidates
    if: needs.round2-candidates.outputs.hasCandidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Capped at the same max-parallel:8 used by baseline/checkpoint-init/
      # round-select/validate — see round1-eval's identical comment for why
      # (run 29786216369 saturated the account's concurrent-runner pool).
      max-parallel: 8
      matrix:
        candidate: ${{ fromJSON(needs.round2-candidates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Hash candidate id (artifact-safe name)
        id: hash
        env:
          CONFIG_ID: ${{ matrix.candidate.configId }}
        run: |
          set -euo pipefail
          HASH=$(printf '%s' "$CONFIG_ID" | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Evaluate candidate (TRAIN panel)
        env:
          COMBO: ${{ matrix.candidate.combo }}
          CONFIG_ID: ${{ matrix.candidate.configId }}
          CONFIG_JSON: ${{ toJSON(matrix.candidate.config) }}
          TRAIN_SEEDS: ${{ inputs.train_seeds }}
          WEAPONS: ${{ inputs.weapons }}
          WORKERS: ${{ inputs.workers }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          npx tsx scripts/agent/perf/sweep-eval.ts \
            --stage search-eval --combo "$COMBO" \
            --config-id "$CONFIG_ID" --config-json "$CONFIG_JSON" \
            --train-seeds "$TRAIN_SEEDS" --weapons "$WEAPONS" \
            --workers "$WORKERS" \
            --out "shard-$HASH.json"

      - uses: actions/upload-artifact@v4
        with:
          name: round2-shard-${{ matrix.candidate.combo }}-${{ steps.hash.outputs.hash }}
          # Unique per-candidate filename -- see round1-eval's identical
          # upload step comment for why a fixed "shard.json" name silently
          # loses every candidate but the last under merge-multiple:true.
          path: shard-${{ steps.hash.outputs.hash }}.json
          if-no-files-found: error
          retention-days: 7

  round2-select:
    name: Round 2 select ${{ matrix.combo }}
    needs: [preflight, round1-select, round2-candidates, round2-eval]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        combo: ${{ fromJSON(needs.preflight.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download this combo's round-1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: search-checkpoint-r1-${{ matrix.combo }}

      - name: Download round 2's candidate plan (to know this combo's PLANNED count)
        uses: actions/download-artifact@v4
        with:
          pattern: round2-candidates
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Download this combo's round-2 shards (if any)
        uses: actions/download-artifact@v4
        with:
          pattern: round2-shard-${{ matrix.combo }}-*
          merge-multiple: true
          path: shards
          if-no-artifact-found: warn

      - name: Fold round 2 into checkpoint
        env:
          COMBO: ${{ matrix.combo }}
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          SHARDS=(shards/*.json)
          PLANNED=unknown
          if [ -f candidates.json ]; then
            PLANNED=$(jq --arg combo "$COMBO" '[.candidates[] | select(.combo==$combo)] | length' candidates.json)
          fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode select --round 2 --checkpoint "search-checkpoint-r1-$COMBO.json" \
            --planned-count "$PLANNED" $SECONDARY_FLAG \
            --out "search-checkpoint-r2-$COMBO.json" "${SHARDS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: search-checkpoint-r2-${{ matrix.combo }}
          path: search-checkpoint-r2-*.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ROUND 3 — identical shape, gated one level deeper still. This is the last
  # round the explicit bounded DAG supports (preflight hard-fails rounds > 3).
  # ---------------------------------------------------------------------------
  round3-candidates:
    name: Round 3 — plan candidates
    needs: round2-select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 3 }}
    outputs:
      hasCandidates: ${{ steps.plan.outputs.hasCandidates }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download every combo's round-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          pattern: search-checkpoint-r2-*
          merge-multiple: true
          path: checkpoints

      - name: Plan round 3 candidates
        id: plan
        env:
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode plan --round 3 $SECONDARY_FLAG --cap 200 \
            --out candidates.json checkpoints/*.json
          HAS=$(jq -r '.hasCandidates' candidates.json)
          echo "hasCandidates=$HAS" >> "$GITHUB_OUTPUT"
          {
            echo 'matrix<<MTRX_EOF'
            jq -c '.candidates' candidates.json
            echo 'MTRX_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: round3-candidates
          path: candidates.json
          if-no-files-found: error
          retention-days: 7

  round3-eval:
    name: Round 3 eval ${{ matrix.candidate.combo }}
    needs: round3-candidates
    if: needs.round3-candidates.outputs.hasCandidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Capped at the same max-parallel:8 used by baseline/checkpoint-init/
      # round-select/validate — see round1-eval's identical comment for why
      # (run 29786216369 saturated the account's concurrent-runner pool).
      max-parallel: 8
      matrix:
        candidate: ${{ fromJSON(needs.round3-candidates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Hash candidate id (artifact-safe name)
        id: hash
        env:
          CONFIG_ID: ${{ matrix.candidate.configId }}
        run: |
          set -euo pipefail
          HASH=$(printf '%s' "$CONFIG_ID" | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Evaluate candidate (TRAIN panel)
        env:
          COMBO: ${{ matrix.candidate.combo }}
          CONFIG_ID: ${{ matrix.candidate.configId }}
          CONFIG_JSON: ${{ toJSON(matrix.candidate.config) }}
          TRAIN_SEEDS: ${{ inputs.train_seeds }}
          WEAPONS: ${{ inputs.weapons }}
          WORKERS: ${{ inputs.workers }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          npx tsx scripts/agent/perf/sweep-eval.ts \
            --stage search-eval --combo "$COMBO" \
            --config-id "$CONFIG_ID" --config-json "$CONFIG_JSON" \
            --train-seeds "$TRAIN_SEEDS" --weapons "$WEAPONS" \
            --workers "$WORKERS" \
            --out "shard-$HASH.json"

      - uses: actions/upload-artifact@v4
        with:
          name: round3-shard-${{ matrix.candidate.combo }}-${{ steps.hash.outputs.hash }}
          # Unique per-candidate filename -- see round1-eval's identical
          # upload step comment for why a fixed "shard.json" name silently
          # loses every candidate but the last under merge-multiple:true.
          path: shard-${{ steps.hash.outputs.hash }}.json
          if-no-files-found: error
          retention-days: 7

  round3-select:
    name: Round 3 select ${{ matrix.combo }}
    needs: [preflight, round2-select, round3-candidates, round3-eval]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        combo: ${{ fromJSON(needs.preflight.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download this combo's round-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: search-checkpoint-r2-${{ matrix.combo }}

      - name: Download round 3's candidate plan (to know this combo's PLANNED count)
        uses: actions/download-artifact@v4
        with:
          pattern: round3-candidates
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Download this combo's round-3 shards (if any)
        uses: actions/download-artifact@v4
        with:
          pattern: round3-shard-${{ matrix.combo }}-*
          merge-multiple: true
          path: shards
          if-no-artifact-found: warn

      - name: Fold round 3 into checkpoint
        env:
          COMBO: ${{ matrix.combo }}
          SECONDARY: ${{ inputs.secondary }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          SECONDARY_FLAG=""
          if [ "$SECONDARY" = "true" ]; then SECONDARY_FLAG="--secondary"; fi
          SHARDS=(shards/*.json)
          PLANNED=unknown
          if [ -f candidates.json ]; then
            PLANNED=$(jq --arg combo "$COMBO" '[.candidates[] | select(.combo==$combo)] | length' candidates.json)
          fi
          npx tsx scripts/agent/perf/round-plan.ts \
            --mode select --round 3 --checkpoint "search-checkpoint-r2-$COMBO.json" \
            --planned-count "$PLANNED" $SECONDARY_FLAG \
            --out "search-checkpoint-r3-$COMBO.json" "${SHARDS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: search-checkpoint-r3-${{ matrix.combo }}
          path: search-checkpoint-r3-*.json
          if-no-files-found: error
          retention-days: 7

  # One job per combo: validate that combo's tuned finalist + the untuned incumbent
  # control on the validation panel (full graduation run touches holdout here once).
  # Downloads all per-round checkpoint artifacts for this combo (immutable uploads
  # from checkpoint-init and every round-select that ran) and selects the latest
  # available round (r3 > r2 > r1 > init) so a later round's upload failure never
  # discards an already-computed earlier round's progress. `RoundCheckpoint` is a
  # strict superset of the legacy `SearchArtifact` shape `sweep-eval --stage
  # validate` consumes, so no reshape step is needed. `if: !cancelled()` so a
  # skipped or partially-failed round-select job upstream never silently skips
  # validation of whatever the search DID manage to produce, while a manual
  # workflow cancellation still stops validation (unlike `always()`).
  validate:
    name: Validate ${{ matrix.combo }}
    needs: [preflight, checkpoint-init, round1-select, round2-select, round3-select]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        combo: ${{ fromJSON(needs.preflight.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download all available checkpoints for this combo (immutable per-round artifacts)
        uses: actions/download-artifact@v4
        with:
          pattern: search-checkpoint-*-${{ matrix.combo }}
          merge-multiple: true

      - name: Validate finalist + incumbent
        env:
          COMBO: ${{ matrix.combo }}
          VALIDATE_SEEDS: ${{ inputs.validate_seeds }}
          WEAPONS: ${{ inputs.weapons }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          # Select the latest successfully-uploaded round checkpoint (r3 > r2 > r1 > init).
          CHECKPOINT=""
          for r in r3 r2 r1 init; do
            f="search-checkpoint-${r}-$COMBO.json"
            if [ -f "$f" ]; then
              CHECKPOINT="$f"
              break
            fi
          done
          if [ -z "$CHECKPOINT" ]; then
            echo "::error::No checkpoint found for combo $COMBO"
            exit 1
          fi
          echo "Using checkpoint: $CHECKPOINT"
          npx tsx scripts/agent/perf/sweep-eval.ts \
            --stage validate --combo "$COMBO" \
            --search-artifact "$CHECKPOINT" \
            --seeds "$VALIDATE_SEEDS" --weapons "$WEAPONS" \
            --workers "$WORKERS" \
            --out "validate-$COMBO.json"

      - uses: actions/upload-artifact@v4
        with:
          name: validate-${{ matrix.combo }}
          path: validate-*.json
          if-no-files-found: error
          retention-days: 7

  # Fan-in: merge every validate shard → recompute totals from rows → leaderboard
  # + safety-gated qualified winner. `if: !cancelled()` so a `fail-fast:false`
  # partial validate failure (some combos' legs failed, marking the aggregate
  # `validate` job conclusion `failure` even though other combos succeeded)
  # still aggregates whatever DID succeed instead of silently skipping — same
  # timeout/partial-progress principle as the round-select and validate jobs
  # above. (The original pre-redesign workflow had no `if:` here at all, so
  # ANY single validate leg failing anywhere silently skipped the entire
  # leaderboard — fixed as part of this change.) `!cancelled()` rather than
  # `always()` so a manual workflow cancellation still stops aggregation
  # instead of continuing to burn runner minutes (found in multi-model
  # review, gemini-3.1-pro-preview).
  aggregate:
    name: Aggregate → leaderboard
    needs: validate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download all validate shards
        uses: actions/download-artifact@v4
        with:
          pattern: validate-*
          merge-multiple: true
          path: shards

      - name: Build leaderboard
        run: |
          set -euo pipefail
          ls -la shards
          BASE_ID=$(npx tsx scripts/agent/perf/gen-configs.ts --combo legacy+legacy | jq -r .baseId)
          echo "Incumbent (untuned LEGACY/LEGACY) config id: $BASE_ID"
          npx tsx scripts/agent/perf/aggregate-shards.ts shards/*.json \
            --incumbent-combo legacy+legacy --incumbent-config "$BASE_ID" \
            --out leaderboard.json

      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard
          path: leaderboard.json
          if-no-files-found: error
          retention-days: 30
