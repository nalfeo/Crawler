name: CI Recovery Router

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  route:
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'issue_comment' ||
         !startsWith(github.event.comment.body, '<!-- crawler-'))
      }}
    # Backpressure: EVERY router invocation -- direct PR events, sweeps, and
    # workflow_run alike, regardless of MERGE_TRAIN_ENABLED -- shares one
    # unconditional global concurrency group. Per-PR/per-sweep groups
    # previously let N independently-triggered PR events spawn N concurrent
    # router runs, each applying CI_RECOVERY_MAX_DISPATCH_PER_RUN in
    # isolation with no shared view of total outstanding CI Recovery runs --
    # a thundering herd that starved Merge Train Validation runners
    # (2026-07-21 incident). An earlier revision of this fix only unified
    # the group while MERGE_TRAIN_ENABLED == 'true', leaving the legacy
    # flag-off path (train disabled/paused -- precisely the maintenance
    # window where protection must not lapse) on per-PR groups, which meant
    # truly concurrent different-PR invocations could each read a stale
    # outstanding-run count before either dispatch became visible. Making
    # the group unconditional closes that race entirely: it is now
    # architecturally impossible for two router invocations to run at the
    # same time, in any mode.
    #
    # cancel-in-progress is unconditionally false and queue is
    # unconditionally max so every queued event eventually runs instead of
    # being dropped or a stale one cancelled -- GitHub's default behavior
    # keeps only one run pending per group and replaces it with the next
    # arrival, which would silently drop router invocations under a
    # 25-event burst instead of queueing them (see ci-recovery.yml for the
    # same pattern). This intentionally gives up the legacy flag-off path's
    # previous behavior of cancelling a stale pending schedule/
    # workflow_dispatch sweep in favor of the newest one: safety (no dropped
    # events, a hard global cap on outstanding runs) takes priority over
    # that cancellation optimization. GitHub forbids combining queue: max
    # with cancel-in-progress: true, so cancel-in-progress must stay a
    # static false, not a conditional expression, for queue: max to be
    # valid in every mode. The 10-minute scheduled sweep remains the
    # eventual-consistency backstop: a queued/coalesced event that arrives
    # while another is still running will simply observe an up-to-date
    # outstanding count and re-derive dispatchable PRs when its turn comes,
    # so deduplication happens naturally via the live capacity check in
    # router.mjs rather than via cancellation.
    concurrency:
      group: crawler-ci-recovery-router
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch per-PR reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLER_CI_PAT: ${{ secrets.CRAWLER_CI_PAT }}
          RECOVERY_TRIGGER: ${{ github.event_name }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          CI_RECOVERY_MAX_DISPATCH_BUDGET_TRAIN_BUSY: ${{ vars.CI_RECOVERY_MAX_DISPATCH_BUDGET_TRAIN_BUSY || '5' }}
          CI_RECOVERY_MAX_DISPATCH_BUDGET_TRAIN_IDLE: ${{ vars.CI_RECOVERY_MAX_DISPATCH_BUDGET_TRAIN_IDLE || '8' }}
          CI_RECOVERY_GLOBAL_TRAIN_DISPATCH_CAP: ${{ vars.CI_RECOVERY_GLOBAL_TRAIN_DISPATCH_CAP || '5' }}
          CI_RECOVERY_MAX_DISPATCH_PER_RUN: ${{ vars.CI_RECOVERY_MAX_DISPATCH_PER_RUN || '8' }}
          CI_GLOBAL_TRAIN_DISPATCH_CAP: ${{ vars.CI_GLOBAL_TRAIN_DISPATCH_CAP || '5' }}
          CI_GLOBAL_IDLE_TRAIN_DISPATCH_CAP: ${{ vars.CI_GLOBAL_IDLE_TRAIN_DISPATCH_CAP || '8' }}
        run: node .github/scripts/ci-recovery/router.mjs
