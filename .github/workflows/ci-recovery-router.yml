name: CI Recovery Router

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: ['CI']
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  route:
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'issue_comment' ||
         (!startsWith(github.event.comment.body, '<!-- crawler-ci-state:v1 -->') &&
          !startsWith(github.event.comment.body, '<!-- crawler-ci-task:v1') &&
          !startsWith(github.event.comment.body, '<!-- crawler-merge-train:v1 -->')))
      }}
    # Backpressure: when the merge train is enabled, EVERY router invocation
    # (direct PR events and sweeps alike) shares one global concurrency
    # group. Per-PR groups previously let N independently-triggered PR
    # events spawn N concurrent router runs, each applying
    # CI_RECOVERY_MAX_DISPATCH_PER_RUN in isolation with no shared view of
    # total outstanding CI Recovery runs -- a thundering herd that starved
    # Merge Train Validation runners (2026-07-21 incident). Serializing
    # router execution here, combined with the capacity-aware dispatch cap
    # in router.mjs (see computeDispatchBudget/countOutstandingRecoveryRuns),
    # keeps at most one CI Recovery run outstanding while the train queue is
    # non-empty, and at most GLOBAL_IDLE_TRAIN_DISPATCH_CAP otherwise --
    # including while the train feature itself is disabled/paused, since
    # that is precisely when runner-capacity protection must not lapse. The
    # legacy flag-off concurrency groups below remain per-PR/per-sweep (see
    # the router.mjs comment on computeDispatchBudget for the accepted
    # best-effort limitation this creates: the JS-side cap still applies in
    # that mode, but without a shared concurrency group it cannot close the
    # race window between truly concurrent different-PR invocations).
    # cancel-in-progress stays false while the train is enabled so no queued
    # event is ever dropped -- they run one at a time instead of
    # concurrently. queue: max is required alongside that: GitHub's default
    # concurrency behavior keeps only one run pending per group and replaces
    # it with the next arrival, which would silently drop router invocations
    # under a 25-event burst instead of queueing them. See ci-recovery.yml
    # for the same pattern. queue: max is scoped to the train group only
    # (not the legacy flag-off sweep/per-PR groups): GitHub forbids
    # combining queue: max with cancel-in-progress: true, and the flag-off
    # schedule/workflow_dispatch path below intentionally cancels a stale
    # pending sweep in favor of the newest one -- applying queue: max there
    # unconditionally would make that legacy path fail workflow validation
    # whenever MERGE_TRAIN_ENABLED is unset/false.
    concurrency:
      group: >-
        ${{ vars.MERGE_TRAIN_ENABLED == 'true' && 'crawler-ci-recovery-router-train'
          || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && 'crawler-ci-recovery-router-sweep'
          || format('crawler-ci-recovery-router-pr-{0}',
               github.event.pull_request.number
               || github.event.issue.number
               || (github.event.workflow_run.pull_requests[0].number
                   && !github.event.workflow_run.pull_requests[1].number
                   && github.event.workflow_run.pull_requests[0].number)
               || github.event.workflow_run.id
               || github.run_id) }}
      cancel-in-progress: >-
        ${{ vars.MERGE_TRAIN_ENABLED != 'true' &&
            (github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') }}
      queue: ${{ vars.MERGE_TRAIN_ENABLED == 'true' && 'max' || 'single' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch per-PR reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TRIGGER: ${{ github.event_name }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          CI_RECOVERY_MAX_DISPATCH_PER_RUN: ${{ vars.CI_RECOVERY_MAX_DISPATCH_PER_RUN || '8' }}
        run: node .github/scripts/ci-recovery/router.mjs
