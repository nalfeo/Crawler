name: CI Recovery Router

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: ['CI']
    types: [completed, requested]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  route:
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: >-
        ${{ vars.MERGE_TRAIN_ENABLED == 'true'
          && 'crawler-ci-recovery-router-train'
          || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && 'crawler-ci-recovery-router-sweep'
          || format('crawler-ci-recovery-router-pr-{0}',
               github.event.pull_request.number
               || github.event.issue.number
               || github.event.workflow_run.id
               || github.run_id) }}
      cancel-in-progress: >-
        ${{ vars.MERGE_TRAIN_ENABLED != 'true' &&
            (github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch per-PR reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TRIGGER: ${{ github.event_name }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          CI_RECOVERY_MAX_DISPATCH_PER_RUN: ${{ vars.CI_RECOVERY_MAX_DISPATCH_PER_RUN || '8' }}
        run: node .github/scripts/ci-recovery/router.mjs
