name: CI Recovery Router

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: ['CI']
    types: [completed, requested]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  route:
    if: >-
      ${{
        (github.event_name != 'pull_request_target' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'issue_comment' ||
         (!startsWith(github.event.comment.body, '<!-- crawler-ci-state:v1 -->') &&
          !startsWith(github.event.comment.body, '<!-- crawler-ci-task:v1') &&
          !startsWith(github.event.comment.body, '<!-- crawler-merge-train:v1 -->')))
      }}
    concurrency:
      group: >-
        ${{ vars.MERGE_TRAIN_ENABLED == 'true' &&
            (github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch' ||
             (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
             (github.event_name == 'workflow_run' &&
              !github.event.workflow_run.pull_requests[0].number &&
              github.event.workflow_run.name == 'CI' &&
              github.event.workflow_run.head_branch == github.event.repository.default_branch))
          && 'crawler-ci-recovery-router-train'
          || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && 'crawler-ci-recovery-router-sweep'
          || format('crawler-ci-recovery-router-pr-{0}',
               github.event.pull_request.number
               || github.event.issue.number
               || (github.event.workflow_run.pull_requests[0].number
                   && !github.event.workflow_run.pull_requests[1].number
                   && github.event.workflow_run.pull_requests[0].number)
               || github.event.workflow_run.id
               || github.run_id) }}
      cancel-in-progress: >-
        ${{ vars.MERGE_TRAIN_ENABLED != 'true' &&
            (github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch per-PR reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TRIGGER: ${{ github.event_name }}
          MERGE_TRAIN_ENABLED: ${{ vars.MERGE_TRAIN_ENABLED || 'false' }}
          CI_RECOVERY_MAX_DISPATCH_PER_RUN: ${{ vars.CI_RECOVERY_MAX_DISPATCH_PER_RUN || '8' }}
        run: node .github/scripts/ci-recovery/router.mjs
