name: CI

on:
  push:
    branches: [main]
  schedule:
    # Daily full-CI backstop. This is the only unconditionally-full CI run in
    # the system: the `changes` job below forces every scope flag off for
    # schedule events, so it re-runs gates that a `detect-art-only.sh`
    # misclassification could have skipped on a PR or push. It is NOT a
    # main-health probe for the merge train -- promotion is gated solely on the
    # validated composite candidate (ADR 0077) -- so hourly cadence is no
    # longer needed for the train to make progress.
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
    paths:
      - '**'

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: >-
    crawler-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 0: Detect the change scope.
  # art_only=true         → heavy gameplay gates skipped; typecheck/lint/format/unit run.
  # docs_only=true        → ALL heavy gates skipped; only commit-lint / lightweight
  #                         review workflows run. Documentation/governance surfaces
  #                         cannot change shipped game logic.
  # gameplay_safe=true    → (legacy compatibility signal) the diff provably can't change
  #                         the deterministic Floor-1 sim (engine/labs/e2e/docs/assets only).
  #                         No longer used to gate jobs; see sim_touched for current headless
  #                         gating logic.
  # visual_touched=true   → change may affect rendered output; E2E visual regression runs.
  # sim_touched=true      → change may affect the deterministic sim; headless gate runs.
  # coverage_touched=true → change may affect unit coverage; coverage advisory runs.
  # dependencies_touched=true → package.json or lock file changed; npm audit runs.
  # The merge-gate treats skipped jobs as PASS for all scope flags.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      art_only: ${{ steps.scope.outputs.art_only }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      gameplay_safe: ${{ steps.scope.outputs.gameplay_safe }}
      sprites_only: ${{ steps.scope.outputs.sprites_only }}
      sprites_touched: ${{ steps.scope.outputs.sprites_touched }}
      train_promoted: ${{ steps.scope.outputs.train_promoted }}
      visual_touched: ${{ steps.scope.outputs.visual_touched }}
      sim_touched: ${{ steps.scope.outputs.sim_touched }}
      coverage_touched: ${{ steps.scope.outputs.coverage_touched }}
      sprite_pipeline_touched: ${{ steps.scope.outputs.sprite_pipeline_touched }}
      dependencies_touched: ${{ steps.scope.outputs.dependencies_touched }}
      # Visual surface outputs (#1688/#1698): route E2E to the affected surface only.
      game_visual_touched: ${{ steps.scope.outputs.game_visual_touched }}
      asset_visual_touched: ${{ steps.scope.outputs.asset_visual_touched }}
      devtool_visual_touched: ${{ steps.scope.outputs.devtool_visual_touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect art-only change set
        id: detect
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/agent/ci/detect-art-only.sh

      - name: Preserve train-promoted head evidence
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TRAIN_APP_ID: ${{ secrets.APP_ID }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          art_only='${{ steps.detect.outputs.art_only }}'
          docs_only='${{ steps.detect.outputs.docs_only }}'
          gameplay_safe='${{ steps.detect.outputs.gameplay_safe }}'
          sprites_only='${{ steps.detect.outputs.sprites_only }}'
          sprites_touched='${{ steps.detect.outputs.sprites_touched }}'
          visual_touched='${{ steps.detect.outputs.visual_touched }}'
          sim_touched='${{ steps.detect.outputs.sim_touched }}'
          coverage_touched='${{ steps.detect.outputs.coverage_touched }}'
          sprite_pipeline_touched='${{ steps.detect.outputs.sprite_pipeline_touched }}'
          dependencies_touched='${{ steps.detect.outputs.dependencies_touched }}'
          game_visual_touched='${{ steps.detect.outputs.game_visual_touched }}'
          asset_visual_touched='${{ steps.detect.outputs.asset_visual_touched }}'
          devtool_visual_touched='${{ steps.detect.outputs.devtool_visual_touched }}'
          train_promoted=false

          if [ "${{ github.event_name }}" = "schedule" ]; then
            art_only=false
            docs_only=false
            gameplay_safe=false
            sprites_only=false
            sprites_touched=true
            visual_touched=true
            sim_touched=true
            coverage_touched=true
            sprite_pipeline_touched=true
            dependencies_touched=true
            # Schedule runs always execute the full visual suite.
            game_visual_touched=true
            asset_visual_touched=true
            devtool_visual_touched=true
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            # Only trust promotion provenance while the merge train is
            # actually enabled. If MERGE_TRAIN_ENABLED is rolled back to
            # false, a leftover (or forged) "merge-train" check-run on the
            # head must not keep shortcutting full CI — rollback must
            # restore full CI unconditionally.
            if [ "${{ vars.MERGE_TRAIN_ENABLED }}" = "true" ]; then
              check_runs_stderr="$(mktemp)"
              if ! check_runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" 2>"$check_runs_stderr")"; then
                check_runs_error="$(cat "$check_runs_stderr")"
                echo "Could not fetch check-runs for ${TARGET_SHA}: ${check_runs_error}" >&2
                check_runs_json=''
              fi
              rm -f "$check_runs_stderr"
              if [ -n "$check_runs_json" ]; then
                promotion_checks="$(
                  printf '%s' "$check_runs_json" |
                    jq --arg app_id "$MERGE_TRAIN_APP_ID" \
                      '($app_id | tonumber?) as $trusted_id |
                        ([.check_runs[] | select(.name == "merge-train")] | sort_by(.id) | last) as $check |
                        if ($check != null and
                            $check.status == "completed" and
                            $check.conclusion == "success" and
                            $trusted_id != null and
                            $check.app.id == $trusted_id and
                            ($check.external_id | type == "string" and test("^[0-9a-f]{64}$")))
                        then 1 else 0 end' \
                      2>/dev/null || true
                )"
                if [[ "$promotion_checks" =~ ^[0-9]+$ ]] && [ "$promotion_checks" -gt 0 ]; then
                  docs_only=true
                  train_promoted=true
                  echo "Train-promoted head has an attested successful merge-train check."
                elif [ -z "$promotion_checks" ]; then
                  echo "Could not parse check-runs JSON for ${TARGET_SHA}; leaving train_promoted=false." >&2
                fi
              else
                echo "Could not fetch check-runs for ${TARGET_SHA}; leaving train_promoted=false." >&2
              fi
            fi
          fi

          echo "art_only=$art_only" >>"$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >>"$GITHUB_OUTPUT"
          echo "gameplay_safe=$gameplay_safe" >>"$GITHUB_OUTPUT"
          echo "sprites_only=$sprites_only" >>"$GITHUB_OUTPUT"
          echo "sprites_touched=$sprites_touched" >>"$GITHUB_OUTPUT"
          echo "train_promoted=$train_promoted" >>"$GITHUB_OUTPUT"
          echo "visual_touched=$visual_touched" >>"$GITHUB_OUTPUT"
          echo "sim_touched=$sim_touched" >>"$GITHUB_OUTPUT"
          echo "coverage_touched=$coverage_touched" >>"$GITHUB_OUTPUT"
          echo "sprite_pipeline_touched=$sprite_pipeline_touched" >>"$GITHUB_OUTPUT"
          echo "dependencies_touched=$dependencies_touched" >>"$GITHUB_OUTPUT"
          echo "game_visual_touched=$game_visual_touched" >>"$GITHUB_OUTPUT"
          echo "asset_visual_touched=$asset_visual_touched" >>"$GITHUB_OUTPUT"
          echo "devtool_visual_touched=$devtool_visual_touched" >>"$GITHUB_OUTPUT"

  deps-install:
    name: Cold dependency install
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.dependencies_touched == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install from the registry without caches
        run: |
          npm cache clean --force
          npm ci --ignore-scripts --no-audit --no-fund

  # Job 1: Lightweight checks — consolidates Types & Lint, Format & Labs,
  # advisory dead-code/typecheck, and human-approval into a single runner to
  # eliminate three repeated setup/checkout sequences on a full CI run.
  #
  # Blocking steps (format, lab gate, wiring guard, guard tests, typecheck+lint,
  # human approval) use GitHub Actions' default fail-fast behaviour. Each step is
  # named independently so failures remain clearly attributable in logs and
  # summaries.
  #
  # Advisory steps (dead code, security audit, full typecheck) run after the
  # blocking steps with continue-on-error: true so failures surface without
  # blocking the merge. They are additionally gated on GAMEPLAY_SAFE != 'true'
  # so they are skipped for scope-limited PRs (gameplay_safe / sprites_only /
  # art_only all set gameplay_safe=true) where the headless gate is already
  # skipped and advisory runtime would otherwise become the new bottleneck.
  # On full code PRs the headless gate (~306 s) remains the critical-path
  # bottleneck; check-lightweight is expected to complete in ~235 s or less.
  check-lightweight:
    name: Lightweight Checks
    runs-on: ubuntu-latest
    needs: [changes]
    # No docs_only skip here: the human-approval step must run unconditionally
    # so a docs-only PR that carries (or closes an issue with) the
    # human-approval-required label is not silently bypassed. The non-approval
    # steps below carry their own `if: env.DOCS_ONLY != 'true'` guards so the
    # build/lint/test work is still skipped on pure documentation changes.
    env:
      GAMEPLAY_SAFE: ${{ needs.changes.outputs.gameplay_safe }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the AUDIT_EXCEPTIONS comparison guard resolves the PR
          # merge-base via GITHUB_BASE_SHA and reads the base file with git show.
          # A depth-1 shallow clone cannot reach the base commit — the guard
          # would fail closed rather than passing vacuously.
          fetch-depth: 0

      # Playwright is required by the guard tests: sprite-editor and set-piece-editor
      # extension tests import chromium directly (see .github/extensions/*/tests/).
      # On docs-only PRs we skip the guard tests, so Playwright is not installed
      # to avoid the ~30 s download overhead on documentation-only changes.
      - uses: ./.github/actions/setup-node
        with:
          install-playwright: ${{ needs.changes.outputs.docs_only != 'true' && 'true' || 'false' }}
          install-dependencies: ${{ needs.changes.outputs.docs_only != 'true' && 'true' || 'false' }}

      # Persist ESLint's incremental cache across runs. The unique run_id suffix
      # forces a fresh (immutable) cache entry each run; restore-keys warm-start
      # from the most recent prior cache. ESLint re-lints any file whose content
      # changed, so a stale restore is always safe.
      - name: Restore ESLint cache
        if: env.DOCS_ONLY != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
            eslint-${{ runner.os }}-

      # --- Blocking checks (fail-fast; each failure is clearly attributable) ---

      # Conflict-marker guard: fail immediately if any tracked source file
      # contains unresolved Git conflict markers (<<<<<<< / ======= / >>>>>>>).
      # Runs on ALL PRs (including docs-only) because conflict markers in docs
      # are just as broken. Does not need Node — pure shell.
      - name: Conflict-marker guard
        run: |
          # Search tracked text files; exclude binary extensions and generated dirs.
          bad=$(git grep -l $'^<<<<<<< \|^=======$\|^>>>>>>> ' -- \
            ':(exclude)node_modules' \
            ':(exclude)dist' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.ico' \
            ':(exclude)*.woff' \
            ':(exclude)*.woff2' \
            ':(exclude)*.ttf' \
            ':(exclude)*.eot' \
            ':(exclude)*.mp3' \
            ':(exclude)*.ogg' \
            ':(exclude)*.wav' \
            ':(exclude)*.bin' \
            ':(exclude)*.zip' \
            2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::Unresolved Git conflict markers found in the following files:"
            echo "$bad" | while IFS= read -r f; do echo "  $f"; done
            echo ""
            echo "Resolve the conflicts and re-push. The merge-conflict areas most"
            echo "prone to conflicts are listed in docs/knowledge/handoffs/TEMPLATE.md."
            exit 1
          fi
          echo "✅ No conflict markers found."

      # Run synchronously so a failing format check actually fails CI. These
      # were previously `npm run format:check &` plus a trailing `run: wait`
      # step; because each `run:` is a fresh shell, that `wait` reaped nothing
      # and the format:check exit code was silently discarded.
      - name: Format check
        if: env.DOCS_ONLY != 'true'
        run: npm run format:check

      # Asset sort guard: manifest.json and sprite-catalog.json must have
      # entries in canonical sorted order so concurrent sprite PRs that add
      # different entries do not produce line-based merge conflicts.
      - name: Asset sort check
        if: env.DOCS_ONLY != 'true'
        run: npm run check:sort-assets

      # Sharded-manifest invariants (deterministic, exit-coded): every per-asset
      # shard parses against the schema, composing the aggregate from shards is
      # deterministic, the committed sprite-catalog.json carries NO generated:
      # rows (they must be derived), and the composed full catalog has unique
      # ids. Guards the sharding contract that keeps parallel art PRs conflict-free.
      - name: Generated-manifest invariants
        if: env.DOCS_ONLY != 'true'
        run: npm run sprites:check-manifest
      # Manifest hard-block invariant: no approved shard entry may carry
      # judgeScorecard.hardBlocked=true. The judge hard-block is a veto, not a
      # score to be weighed. approve.ts gates this at approval-time; this
      # check catches any entries that pre-dated the gate.
      - name: Manifest hard-block check
        if: env.DOCS_ONLY != 'true'
        run: npm run check:manifest-hard-blocked

      - name: Lab gate check
        if: env.DOCS_ONLY != 'true'
        run: bash scripts/agent/lab-gate-check.sh

      # Deterministic architecture guard (ADR 0039): every *System exported from
      # src/core|src/game must be referenced by a real runtime pipeline (visual
      # bootstrap, engine/AI sim steps, headless runner, MainGameScene) or be on
      # the documented allowlist. Blocks the class of bug where spawnerSystem
      # shipped inert because only its lab force-called it.
      - name: Orphaned-system wiring guard
        if: env.DOCS_ONLY != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:wired-systems

      # Test-only exports guard: flags src/ exports whose only consumers are in
      # tests/**. Closes the blind spot where test-only usage masked production
      # deadness in knip (knip includes tests/** in its project scope). The
      # textbook case: listInventoryEntries in src/shared/inventory.ts was
      # unit- and property-tested yet never called from production code.
      - name: Test-only exports guard
        if: env.DOCS_ONLY != 'true'
        run: npm run check:test-only-exports

      # Knip suppressions guard: validates that every ignoreIssues entry in
      # knip.config.ts has a non-expired reason+expiresOn. An expired entry means
      # the deadness must be fixed — not the date extended.
      - name: Knip suppressions expiry guard
        if: env.DOCS_ONLY != 'true'
        run: npm run check:knip-suppressions

      # Allowlist governance guard: generalizes the knip/npm-audit expiry rule to
      # EVERY allowlist, suppression, and exception list in the repo. Each entry
      # must carry a specific reason plus either an unexpired `expiresOn`
      # (time-bounded) or a tracking ref + removal condition (tracked-permanent).
      # Fail-closed: an allowlist-shaped export that is not registered is itself
      # a finding, so a new allowlist cannot silently escape governance.
      # Receipt: `npm audit` went red in CI because an exception list quietly
      # expired on a date nobody was watching.
      - name: Allowlist governance + expiry guard
        if: env.DOCS_ONLY != 'true'
        run: npm run check:allowlist-expiry

      # Registry integrity guard: duplicate/blank ids within a registry file and,
      # critically, ACROSS sibling files that share one logical id namespace
      # (achievements.floor1.json + achievements.floor2.json). Per-file Zod
      # loaders structurally cannot see the cross-file case, which is how a
      # Floor-2 tier4 achievement collided with a sibling PR's rows and needed a
      # human escalation to untangle.
      - name: Registry ID integrity guard
        if: env.DOCS_ONLY != 'true'
        run: npm run check:registry-integrity

      # Asset identity guard: verifies the shard ↔ PNG ↔ contentHash triple over
      # the ENTIRE committed corpus, not just newly added entries, so latent
      # defects surface once instead of being discovered by eye in-game.
      # Receipts: 55 welcome-room shards kept stale contentHashes after their
      # PNGs were restored (red unit tests, CI-recovery intervention), a sprite
      # shipped whose filename and pixels disagreed, and an orphaned walk shard
      # was resurrected by a chore commit after its PNG was intentionally deleted.
      - name: Asset manifest identity guard
        if: env.DOCS_ONLY != 'true'
        run: npm run check:asset-integrity

      # Equipment art coverage ratchet: every wired equipment piece (legacy
      # catalog equippables + the Floor 2 generated-equipment reward pool) must
      # resolve to real approved art through the SAME resolver the equipment and
      # inventory panels call. Gaps already recorded in the shrink-only baseline
      # pass; a NEW gap fails. Closes the loop where gear shipped wired but
      # un-arted, stayed green in CI, and was only ever discovered by a human
      # noticing a placeholder in game — one ad-hoc PR at a time.
      - name: Equipment art coverage ratchet
        if: env.DOCS_ONLY != 'true'
        run: npm run check:equipment-art-coverage

      # Exact-version guard: block any PR that introduces a semver range into
      # direct deps, devDeps, optionalDeps, or overrides. Ranges allow unrelated
      # lockfile regeneration to silently advance a package version before
      # Microsoft's 7-day npm proxy quarantine completes, causing false-404
      # failures on npm ci. Runs on all non-docs PRs; no false-positive risk.
      - name: Exact dependency versions
        if: env.DOCS_ONLY != 'true'
        run: npm run security:exact-deps

      - name: Lockfile integrity
        if: env.DOCS_ONLY != 'true' && needs.changes.outputs.dependencies_touched == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          npm_config_registry: https://registry.npmjs.org/
        run: npm run security:lock-integrity

      # copilot-guards + review-ledger validator tests (node:test). These run
      # nowhere else in CI; this is their merge-gate home.
      - name: Guard + review-ledger tests
        if: env.DOCS_ONLY != 'true'
        run: npm run test:guards

      # Run typecheck:src and lint in parallel, but FAIL the step if either fails.
      # typecheck:src covers src/ only (~340 files, strict). The full typecheck
      # (tests/ + scripts/, ~860 files) runs in the advisory steps below so a
      # breakage in test helpers or scripts surfaces without blocking the merge.
      - name: Typecheck & Lint
        if: env.DOCS_ONLY != 'true'
        run: |
          npm run typecheck:src & tc=$!
          npm run lint:cache & lint=$!
          rc=0
          wait "$tc" || rc=1
          wait "$lint" || rc=1
          exit "$rc"

      # Human approval gate: runs on ALL PRs (including docs-only) so that a
      # documentation PR carrying the human-approval-required label (or closing
      # an issue with that label) is not silently bypassed.
      # Exits cleanly for non-PR events (push, schedule) where PR_NUMBER is
      # undefined. The human-approval-rerun.yml automation watches this step's
      # conclusion within the Lightweight Checks job to detect approval-state
      # divergence after CI runs.
      - name: Human approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/merge-train/human-approval-check.mjs

      # --- Advisory checks (non-blocking; run even if blocking steps failed) ---
      # Gated on GAMEPLAY_SAFE != 'true': sprites_only / art_only changes also
      # have gameplay_safe=true so this single gate covers all scope-limited
      # PR classes. Skipping advisory checks for these PR classes prevents a
      # ~70 s advisory budget from shifting the merge-gate critical path on runs
      # where the headless gate is already skipped.

      - name: Dead code detection
        if: always() && env.GAMEPLAY_SAFE != 'true'
        continue-on-error: true
        run: npm run lint:dead-code

      - name: Security audit
        if: always() && env.GAMEPLAY_SAFE != 'true'
        continue-on-error: true
        env:
          # Provide the PR base SHA so the AUDIT_EXCEPTIONS comparison guard can
          # compare the branch against its merge base. Empty on direct pushes
          # (not a PR) — the guard skips gracefully when this is unset.
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run security:audit

      # Full typecheck (src/ + tests/ + scripts/). Separated from the blocking
      # gate so a broken script or test helper surfaces without stalling the merge.
      - name: Typecheck (full — tests + scripts)
        if: always() && env.GAMEPLAY_SAFE != 'true'
        continue-on-error: true
        run: npm run typecheck

  # Job 2b: Silent merge-revert guard (issue #2282).
  #
  # Its own job rather than a step in check-lightweight, because it needs the
  # FULL history (`fetch-depth: 0`) to resolve merge bases, and that fetch cost
  # should not land on the fast lightweight job.
  #
  # Deliberately NOT gated on DOCS_ONLY: a merge can silently revert a policy
  # doc or an ADR just as easily as a source file, and those reverts are just
  # as invisible in review.
  check-silent-reverts:
    name: Silent Merge-Revert Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the guard resolves merge bases and walks every merge
          # commit on the branch. A shallow clone cannot do that — the guard
          # detects this and FAILS CLOSED rather than passing vacuously.
          fetch-depth: 0
          # The default `pull_request` checkout is GitHub's synthetic merge
          # commit, which would itself be walked as a merge and can never carry
          # an ack trailer. Check out the real PR head instead.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-node
        with:
          install-playwright: 'false'

      - name: Silent merge-revert guard
        env:
          SILENT_REVERT_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:silent-reverts

  # Job 3: Unit tests (critical path, must pass)
  # Runs WITHOUT coverage instrumentation so the gate stays fast (~27 s).
  # v8 coverage adds ~5× overhead (~140 s); it runs separately in the advisory
  # test-unit-coverage job which posts the PR comment but does not block merge.
  # Skipped for sprites_only changes — only the sprites test project is relevant.
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.sprites_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Unit tests
        run: npx vitest run --project unit --reporter=verbose

  # Coverage advisory job: kept independent so the ~140-second v8 coverage suite
  # does not block or serialize other checks. Scoped: on PRs, skipped when
  # coverage_touched=false (labs/e2e/docs/scripts-only diffs cannot change unit
  # coverage numbers). Fail-closed: only an explicit 'false' skips — a missing/blank
  # value keeps it running. Push/schedule always run.
  ci-coverage:
    name: Advisory coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.sprites_only != 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.coverage_touched != 'false')
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Unit tests with coverage
        run: npx vitest run --project unit --reporter=verbose --coverage --coverage.reporter=json --coverage.reporter=json-summary --coverage.reporter=text

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

      - name: Coverage report comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json

  # Job 4: Integration tests (critical path, must pass)
  # Promoted from advisory to a blocking gate: the sprite/judge integration
  # tests (generate-one, judge-pipeline, judge-budget-cache) are fully
  # deterministic — they use mock image/vision providers and temp fixtures, with
  # no external VLM/image services — so they must stay green for `npm run verify`
  # to be honestly green (AGENTS.md rule #8).
  # NOTE: sprite pipeline integration tests have been moved to the sprites project
  # (test-sprites job below). This job covers game integration tests only.
  # Skipped for sprites_only changes.
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.art_only != 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.sprites_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Integration tests
        run: npx vitest run --project integration --reporter=verbose

  # Job 4b: Sprite pipeline tests (critical path, must pass)
  # Covers the sprite generation/editing pipeline (scripts/sprites/**) in isolation
  # from game tests. Runs the sprites vitest project which includes all of
  # tests/unit/sprites/**, tests/integration/sprites/**, and the pipeline
  # integration tests that were previously in the integration project.
  # Skipped when no sprite pipeline file changed (sprites_touched=false) — a pure
  # game code change cannot break pipeline tests since game code never imports
  # scripts/sprites/**. Also skipped for art_only and docs_only (no code changed).
  # For sprites_only changes this is the only test job that runs.
  test-sprites:
    name: Sprite Pipeline Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.art_only != 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.sprites_touched == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Sprite pipeline tests
        run: npx vitest run --project sprites --reporter=verbose

  # Job 5: Headless Floor 1 completion gate (critical path, must pass)
  # Deterministically proves the behavior-tree AI can still clear Floor 1
  # (victory + all quests, under the 6-minute active-time budget). Runs the same
  # pure-ECS pipeline as the CLI/lab, so no browser is needed.
  # Scoped: skipped on art_only/docs_only, and on PRs where sim_touched=false.
  # Main-push and schedule always run it as a backstop in case the allowlist is wrong.
  #
  # This is the BLOCKING leg of the PR sweep tier (see scripts/agent/perf/sweep-legs.ts).
  # The report-only multi-floor legs run in test-headless-multifloor below.
  test-headless:
    name: Headless Floor 1 Gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.art_only != 'true' &&
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.sim_touched == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      # Includes progression-chain.test.ts: it asserts the multi-floor CHAINING
      # MECHANISM (chain order, carryover handoff, aggregate accounting), not a
      # win rate, so it is a legitimate blocking wiring guard. The win-rate legs
      # that genuinely lack measured thresholds are report-only below.
      - name: Headless Floor 1 completion
        run: npx vitest run --project headless --reporter=verbose

  # Job 5a: Report-only multi-floor sweep legs (NEVER blocking).
  #
  # Floor 1 alone can no longer answer "is the game completable end-to-end?" now
  # that Floor 2 is implemented E2E with an attainable victory. These legs run
  # the two coverage gaps the blocking Floor-1 gate cannot see:
  #
  #   * floor1-chain — Floor 1 → Floor 2 with a carried-over player, the ONLY
  #     leg that exercises the floor transition at all.
  #   * floor2       — Floor 2 standalone.
  #
  # Deliberately `continue-on-error` and excluded from merge-gate: neither leg
  # has a measured, trustworthy win-rate threshold yet, and inventing one would
  # either be meaningless or would pressure someone into tuning Floor 1 to
  # satisfy it (AGENTS.md r12). They publish numbers now; promoting a leg to
  # blocking is a separate, evidence-backed decision.
  #
  # Shards in parallel with the blocking gate so the PR tier's wall time stays
  # inside the previous single-job envelope.
  test-headless-multifloor:
    name: Headless Multi-Floor Legs (report-only)
    runs-on: ubuntu-latest
    needs: [changes]
    continue-on-error: true
    if: >-
      needs.changes.outputs.art_only != 'true' &&
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.sim_touched == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: floor1-chain
            args: --floor floor1 --seeds 1-10 --no-force-weapon --chain
          - leg: floor2
            args: --floor floor2 --seeds 1-15 --no-force-weapon
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Sweep leg ${{ matrix.leg }}
        run: >-
          npx tsx scripts/agent/perf/winrate-sweep.ts ${{ matrix.args }}
          --workers 4 --skip-events --out "files/sweep-${{ matrix.leg }}.json"

      - name: Publish leg summary
        if: always()
        run: |
          set -euo pipefail
          out="files/sweep-${{ matrix.leg }}.json"
          {
            echo "### Sweep leg \`${{ matrix.leg }}\` (report-only)"
            echo ""
            if [ -f "$out" ]; then
              node -e '
                const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                console.log(`- Win rate: **${(j.winRate * 100).toFixed(1)}%** (${j.totalWins}/${j.totalRuns})`);
                console.log(`- Slow victories: ${j.totalSlowVictories}`);
                console.log(`- True losses: ${j.totalTrueLosses}`);
              ' "$out"
            else
              echo "- ⚠️ leg produced no artifact (see job log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-leg-${{ matrix.leg }}
          path: files/sweep-${{ matrix.leg }}.json
          if-no-files-found: warn

  # Job 5b: Set-piece reachability hard gate (scoped)
  # Runs the 200-seed Floor 1 welcome-room prefab reachability sweep whenever the
  # carve/gate surface changes on a PR. Wired into merge-gate through this same
  # workflow so failures block the required `ci` status.
  set-piece-reachability:
    name: Set-piece reachability
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.art_only != 'true' &&
      needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Scope set-piece reachability sweep
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/core/map/|src/game/floorScenario\.ts$|src/game/set-piece-reachability\.ts$|src/shared/set-piece-types\.ts$|src/shared/data/set-pieces\.json$|scripts/agent/set-piece/reachability-sweep\.ts$|\.github/workflows/(set-piece-reachability|ci)\.yml$)'; then
            echo "run_sweep=true" >> "$GITHUB_OUTPUT"
            echo "Set-piece reachability sweep enabled for this diff."
          else
            echo "run_sweep=false" >> "$GITHUB_OUTPUT"
            echo "Set-piece reachability sweep skipped (no matching files changed)."
          fi

      - name: Run set-piece reachability sweep
        if: steps.scope.outputs.run_sweep == 'true'
        run: |
          set -euo pipefail
          npx tsx scripts/agent/set-piece/reachability-sweep.ts \
            --count 200 \
            --out set-piece-reachability.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run_sweep == 'true'
        with:
          name: set-piece-reachability
          path: set-piece-reachability.json
          if-no-files-found: warn
          retention-days: 30

  # Aggregate row ownership guard — detects silent data-loss when a PR
  # regenerates an aggregate file (manifest.json, boss-abilities status) from a
  # stale snapshot, silently reverting rows that concurrent PRs updated.
  # Runs only on pull_request events; skipped for docs-only changes.
  # Requires fetch-depth: 0 so git merge-base can find the true common ancestor.
  check-aggregate-rows:
    name: Aggregate row ownership guard
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Aggregate row ownership guard
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:aggregate-row-ownership

  # Job 6: Build (moved to advisory, not blocking)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, test-unit]
    if: >-
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      needs.changes.outputs.art_only != 'true' &&
      needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        deps-install,
        check-lightweight,
        check-aggregate-rows,
        check-silent-reverts,
        test-unit,
        test-integration,
        test-sprites,
        test-headless,
        set-piece-reachability,
        test-e2e-game,
        test-e2e-assets,
        test-e2e-devtools,
      ]
    if: ${{ !cancelled() }}
    steps:
      - name: Check required jobs
        run: |
          train_enabled='${{ vars.MERGE_TRAIN_ENABLED || 'false' }}'
          case "$train_enabled" in
            true|false) ;;
            *)
              echo "❌ MERGE_TRAIN_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          if [ "${{ github.event_name }}" = "push" ] &&
             [ "$train_enabled" = "true" ] &&
             [ "${{ needs.changes.outputs.train_promoted }}" = "true" ]; then
            # Not a deferral: the merge train proves (landedCommitProofError,
            # merge-train/reconcile-lib.mjs) that this landed commit's tree is
            # byte-identical to the validated candidate prefix tree, and that
            # candidate already passed the merge-train validation gate
            # (static, unit, sprite, health, security). Re-running the heavy
            # suite here would re-test an identical tree. Integration, headless,
            # and E2E gates are covered unconditionally by the daily backstop
            # schedule run (ci.yml schedule trigger), which forces all scope
            # flags off regardless of change content.
            echo "✅ Main-push heavy CI skipped: landed tree is byte-identical to the validated candidate tree"
            exit 0
          fi

          docs_only="${{ needs.changes.outputs.docs_only }}"

          check() {
            local name="$1" result="$2" allow_skipped="${3:-false}"
            if [ "$result" = "success" ]; then
              echo "✅ $name: $result"
              return
            fi
            if [ "$allow_skipped" = "true" ] && [ "$result" = "skipped" ]; then
              echo "✅ $name: $result (skipped — scope-gated change)"
              return
            fi
            # docs-only PRs skip all heavy jobs; treat any skip as PASS.
            if [ "$docs_only" = "true" ] && [ "$result" = "skipped" ]; then
              echo "✅ $name: $result (skipped — docs-only change)"
              return
            fi
            echo "❌ $name failed (result: $result)"
            exit 1
          }
          # The `changes` job MUST succeed. Heavy gates are skipped both when
          # art_only/docs_only == 'true' AND when `changes` fails (a failed `needs`
          # dependency skips downstream jobs). Without this explicit, non-
          # skippable check, a `changes`/detect-art-only failure on a code PR
          # would skip every heavy gate and be silently counted as PASS.
          check "Change scope detection"        "${{ needs.changes.result }}"
          check "Cold dependency install"        "${{ needs.deps-install.result }}" "true"
          # Lightweight Checks consolidates Types & Lint, Format & Labs,
          # advisory dead-code/typecheck, and human-approval. On docs-only
          # changes the non-approval steps are skipped at the step level; the
          # job still runs (and succeeds) so the human-approval gate is
          # unconditionally enforced for labeled docs-only PRs.
          check "Lightweight Checks"            "${{ needs.check-lightweight.result }}"
          # Silent merge-revert guard (#2282). PR-only by construction, so a
          # skip is legitimate ONLY on non-pull_request events. Any other skip
          # fails closed rather than being counted as a pass.
          silent_revert_result="${{ needs.check-silent-reverts.result }}"
          if [ "$silent_revert_result" = "success" ]; then
            echo "✅ Silent merge-revert guard: success"
          elif [ "$silent_revert_result" = "skipped" ] && \
               [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "✅ Silent merge-revert guard: skipped (not a pull_request event)"
          else
            echo "❌ Silent merge-revert guard: $silent_revert_result"
            exit 1
          fi
          # Unit tests: skipped for sprites_only (allow_skipped=true).
          check "Unit tests"                    "${{ needs.test-unit.result }}"        "true"
          # Integration tests: skipped for art_only or sprites_only (allow_skipped=true).
          check "Integration tests"             "${{ needs.test-integration.result }}" "true"
          # Sprite pipeline tests: skipped for art_only or docs_only (allow_skipped=true).
          check "Sprite pipeline tests"         "${{ needs.test-sprites.result }}"    "true"
          # A headless skip is intentional only for docs or an explicit
          # sim_touched=false classification. Missing classifier output fails closed.
          sim_touched="${{ needs.changes.outputs.sim_touched }}"
          headless_result="${{ needs.test-headless.result }}"
          if [ "$headless_result" = "success" ]; then
            echo "✅ Headless Floor 1 completion: success"
          elif [ "$headless_result" = "skipped" ] && \
               { [ "$docs_only" = "true" ] || [ "$sim_touched" = "false" ]; }; then
            skip_reason="$([ "$docs_only" = "true" ] && echo "docs-only" || echo "sim not touched")"
            echo "✅ Headless Floor 1 completion: skipped ($skip_reason)"
          else
            echo "❌ Headless Floor 1 completion: $headless_result (sim_touched=${sim_touched:-MISSING})"
            exit 1
          fi
          # Set-piece reachability sweep: scoped to carve/gate files. A skipped job
          # is an intentional scope skip (or non-PR event) and counts as pass.
          check "Set-piece reachability"      "${{ needs.set-piece-reachability.result }}" "true"
          # Aggregate row ownership guard: only runs on pull_request events; skipped
          # for docs-only and push-to-main (allow_skipped=true).
          check "Aggregate row ownership"     "${{ needs.check-aggregate-rows.result }}"   "true"
          # E2E visual jobs: each runs only when its surface was touched (allow_skipped=true).
          # visual_touched=false (CI/tooling-only) skips all three → no Playwright runner launched.
          # art_only=true → only e2e-assets runs (targeted asset smoke, not the full game suite).
          # See detect-art-only.sh and the test-e2e-* job conditions for routing details.
          check "E2E Visual — Game/UI"          "${{ needs.test-e2e-game.result }}"    "true"
          check "E2E Visual — Asset Smoke"      "${{ needs.test-e2e-assets.result }}"  "true"
          check "E2E Visual — Devtools"         "${{ needs.test-e2e-devtools.result }}" "true"
          echo "✅ All required checks passed"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [merge-gate]
    if: ${{ !cancelled() }}
    steps:
      - name: Verify CI passed
        run: |
          if [ "${{ needs.merge-gate.result }}" != "success" ]; then
            exit 1
          fi

  # Jobs: E2E visual regression — surface-targeted (#1698).
  #
  # Visual tests are now routed to the affected surface instead of always running
  # the full Playwright suite. The routing key is the visual_touched / *_touched
  # flags from the `changes` job (detect-art-only.sh):
  #
  #   visual_touched=false         → all three jobs skip — no Playwright runner launched
  #   art_only=true                → only test-e2e-assets runs (targeted sprite smoke)
  #   devtools-only change         → only test-e2e-devtools runs
  #   game/engine/UI change        → test-e2e-game runs (all non-devtool E2E tests)
  #   mixed / unknown visual       → the relevant surface jobs each run independently
  #
  # All three jobs are wired into the merge-gate with allow_skipped=true, so an
  # intentionally-skipped run counts as PASS. This preserves merge-gate correctness
  # across all skip combinations. No existing visual assertion is removed; tests are
  # merely partitioned into separate Vitest projects (e2e-game / e2e-assets /
  # e2e-devtools) defined in vitest.config.ts.

  # Game/engine/UI visual suite. Runs on any game, engine, core, shared, labs, or
  # non-devtool E2E source change (game_visual_touched=true). NOT run for art_only
  # changes (those use e2e-assets) or for purely devtool changes.
  test-e2e-game:
    name: E2E Visual — Game/UI
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.game_visual_touched == 'true' && needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          install-playwright: 'true'

      - name: E2E visual regression — game/UI surface
        run: npx vitest run --project e2e-game --reporter=verbose

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-game-screenshots
          path: tmp/e2e-screenshots/
          retention-days: 7

  # Asset visual smoke suite. Runs when generated art or sprite-catalog changes
  # (asset_visual_touched=true, including art_only=true). Validates that approved
  # sprites render correctly in the real scene without running the full UI suite.
  test-e2e-assets:
    name: E2E Visual — Asset Smoke
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.asset_visual_touched == 'true' && needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          install-playwright: 'true'

      - name: E2E visual regression — asset smoke
        run: npx vitest run --project e2e-assets --reporter=verbose

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-assets-screenshots
          path: tmp/e2e-screenshots/
          retention-days: 7

  # Devtools browser visual suite. Runs when devtools source or its E2E test
  # changes (devtool_visual_touched=true). Isolated so a pure devtools change
  # never triggers the full game visual suite.
  test-e2e-devtools:
    name: E2E Visual — Devtools
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.devtool_visual_touched == 'true' && needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          install-playwright: 'true'

      - name: E2E visual regression — devtools surface
        run: npx vitest run --project e2e-devtools --reporter=verbose

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-devtools-screenshots
          path: tmp/e2e-screenshots/
          retention-days: 7
