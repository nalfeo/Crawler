name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lab gate check
        if: ${{ !cancelled() }}
        run: bash scripts/agent/lab-gate-check.sh

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run --project unit --reporter=verbose

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  ci-advisory:
    name: Advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dead code detection
        if: ${{ !cancelled() }}
        run: npm run lint:dead-code

      - name: Integration tests
        if: ${{ !cancelled() }}
        run: npx vitest run --project integration --reporter=verbose

      - name: Security audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "❌ Required CI checks failed"
            exit 1
          fi
          echo "✅ All required checks passed"

