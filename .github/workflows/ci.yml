name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Type & Lint checks (can run in parallel)
  check-types-and-lint:
    name: Types & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      # Persist ESLint's incremental cache across runs. The unique run_id suffix
      # forces a fresh (immutable) cache entry each run; restore-keys warm-start
      # from the most recent prior cache. ESLint re-lints any file whose content
      # changed, so a stale restore is always safe.
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
            eslint-${{ runner.os }}-

      - name: Typecheck
        run: npm run typecheck &

      - name: Lint
        run: npm run lint:cache

      - name: Wait for typecheck
        run: wait

  # Job 2: Format & Lab gate (fast, independent checks)
  check-format-and-labs:
    name: Format & Labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Format check
        run: npm run format:check &

      - name: Lab gate check
        run: bash scripts/agent/lab-gate-check.sh

      - name: Wait for format check
        run: wait

  # Job 3: Unit tests (critical path, must pass)
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Unit tests with coverage
        run: npx vitest run --project unit --reporter=verbose --coverage --coverage.reporter=json-summary --coverage.reporter=text

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

      - name: Coverage report comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json

  # Job 4: Integration tests (critical path, must pass)
  # Promoted from advisory to a blocking gate: the sprite/judge integration
  # tests (generate-one, judge-pipeline, judge-budget-cache) are fully
  # deterministic — they use mock image/vision providers and temp fixtures, with
  # no external VLM/image services — so they must stay green for `npm run verify`
  # to be honestly green (AGENTS.md rule #8).
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Integration tests
        run: npx vitest run --project integration --reporter=verbose

  # Job 5: Headless Floor 1 completion gate (critical path, must pass)
  # Deterministically proves the behavior-tree AI can still clear Floor 1
  # (victory + all quests, under the 5-minute game-time budget). Runs the same
  # pure-ECS pipeline as the CLI/lab, so no browser is needed.
  test-headless:
    name: Headless Floor 1 Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Headless Floor 1 completion
        run: npx vitest run --project headless --reporter=verbose

  # Job 6: Build (moved to advisory, not blocking)
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

  ci-advisory:
    name: Advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Dead code detection
        if: ${{ !cancelled() }}
        run: npm run lint:dead-code

      - name: Security audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [check-types-and-lint, check-format-and-labs, test-unit, test-integration, test-headless, test-e2e]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          check() {
            local name="$1" result="$2" allow_skipped="${3:-false}"
            if [ "$result" = "success" ]; then
              echo "✅ $name: $result"
              return
            fi
            if [ "$allow_skipped" = "true" ] && [ "$result" = "skipped" ]; then
              echo "✅ $name: $result"
              return
            fi
            if [ "$result" != "success" ]; then
              echo "❌ $name failed (result: $result)"
              exit 1
            fi
          }
          check "Types & Lint"                  "${{ needs.check-types-and-lint.result }}"
          check "Format & Labs"                 "${{ needs.check-format-and-labs.result }}"
          check "Unit tests"                    "${{ needs.test-unit.result }}"
          check "Integration tests"             "${{ needs.test-integration.result }}"
          check "Headless Floor 1 completion"   "${{ needs.test-headless.result }}"
          check "E2E Visual Regression"         "${{ needs.test-e2e.result }}"
          echo "✅ All required checks passed"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [merge-gate]
    if: always()
    steps:
      - name: Verify CI passed
        run: |
          if [ "${{ needs.merge-gate.result }}" != "success" ]; then
            exit 1
          fi

  # Job: E2E visual regression (blocking — wired into merge-gate below).
  # continue-on-error was removed after 40+ consecutive green runs across all
  # branches proved the Playwright/Vite startup path is stable in CI.
  test-e2e:
    name: E2E Visual Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: E2E visual regression tests
        run: npx vitest run --project e2e --reporter=verbose

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tmp/e2e-screenshots/
          retention-days: 7
