name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Type & Lint checks (can run in parallel)
  check-types-and-lint:
    name: Types & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Typecheck
        run: npm run typecheck &

      - name: Lint
        run: npm run lint

      - name: Wait for typecheck
        run: wait

  # Job 2: Format & Lab gate (fast, independent checks)
  check-format-and-labs:
    name: Format & Labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Format check
        run: npm run format:check &

      - name: Lab gate check
        run: bash scripts/agent/lab-gate-check.sh

      - name: Wait for format check
        run: wait

  # Job 3: Unit tests (critical path, must pass)
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Unit tests with coverage
        run: npx vitest run --project unit --reporter=verbose --coverage --coverage.reporter=json-summary --coverage.reporter=text

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

      - name: Coverage report comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json

  # Job 4: Build (moved to advisory, not blocking)
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

  ci-advisory:
    name: Advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Dead code detection
        if: ${{ !cancelled() }}
        run: npm run lint:dead-code

      - name: Integration tests
        if: ${{ !cancelled() }}
        run: npx vitest run --project integration --reporter=verbose

      - name: Security audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [check-types-and-lint, check-format-and-labs, test-unit]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.check-types-and-lint.result }}" != "success" ]; then
            echo "❌ Types & Lint checks failed"
            exit 1
          fi
          if [ "${{ needs.check-format-and-labs.result }}" != "success" ]; then
            echo "❌ Format & Labs checks failed"
            exit 1
          fi
          if [ "${{ needs.test-unit.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          echo "✅ All required checks passed"

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [merge-gate]
    if: always()
    steps:
      - name: Verify CI passed
        run: |
          if [ "${{ needs.merge-gate.result }}" != "success" ]; then
            exit 1
          fi

  # Job: E2E visual regression (advisory — non-blocking merge gate)
  test-e2e:
    name: E2E Visual Regression
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: E2E visual regression tests
        run: npx vitest run --project e2e --reporter=verbose

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tmp/e2e-screenshots/
          retention-days: 7
