name: Nightly Code Review Process

on:
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-code-review-process
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  evaluate:
    name: Evaluate code review process
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_REPORT_DIR: ${{ github.workspace }}/.automation-reports
      AUTOMATION_TITLE: 'code-review-process: nightly findings'
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p "$AUTOMATION_REPORT_DIR"

      - name: Evaluate Copilot review instructions
        run: npx tsx scripts/agent/docs/review-process-check.ts
        continue-on-error: true

      - name: Aggregate report
        id: aggregate
        run: |
          set +e
          npx tsx scripts/agent/shared/aggregate-report.ts > report.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: File tracking issue
        if: steps.aggregate.outputs.exitcode != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const helperUrl = pathToFileURL(
              path.resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/tracking-issues/supersede.mjs')
            );
            const { supersedeTrackingIssues } = await import(helperUrl.href);
            const freshnessHelperUrl = pathToFileURL(
              path.resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/tracking-issues/freshness.mjs')
            );
            const { withTrackingIssueRunMetadata } = await import(freshnessHelperUrl.href);
            const date = new Date().toISOString().slice(0, 10);
            const title = `code-review-process: ${date} findings`;
            const issue = (await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: withTrackingIssueRunMetadata(fs.readFileSync('report.md', 'utf8'), { context }),
              labels: ['automation', 'docs']
            })).data;

            await supersedeTrackingIssues({
              github,
              context,
              keepIssueNumber: issue.number,
              titlePatterns: [/^code-review-process: \d{4}-\d{2}-\d{2} findings$/]
            });
