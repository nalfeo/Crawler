name: Codex PR Repair Runner

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      trigger:
        description: Trigger source label
        required: false
        default: workflow_dispatch
        type: string
      mode:
        description: Repair mode
        required: false
        default: auto
        type: string
      command:
        description: Explicit command text
        required: false
        default: ''
        type: string
      explicit:
        description: Whether command was explicit
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: codex-repair-runner-${{ github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || '' }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '' }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || '' }}
      CODEX_PROVIDER: ${{ vars.CODEX_PROVIDER || 'codex' }}
      CODEX_BIN: ${{ vars.CODEX_BIN || '' }}
      CODEX_BOUNCE_ENABLED: ${{ vars.CODEX_BOUNCE_ENABLED || 'true' }}
      CODEX_BOUNCE_MAX_CHANGED_FILES: ${{ vars.CODEX_BOUNCE_MAX_CHANGED_FILES || '20' }}
      CODEX_BOUNCE_MAX_DIFF_LINES: ${{ vars.CODEX_BOUNCE_MAX_DIFF_LINES || '1500' }}
      CODEX_BOUNCE_MAX_FAILING_CHECKS: ${{ vars.CODEX_BOUNCE_MAX_FAILING_CHECKS || '6' }}
      CODEX_BOUNCE_LABEL: ${{ vars.CODEX_BOUNCE_LABEL || 'auto-heal-bounced' }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
      REPAIR_TRIGGER: ${{ github.event.inputs.trigger }}
      REPAIR_MODE: ${{ github.event.inputs.mode }}
      REPAIR_COMMAND: ${{ github.event.inputs.command }}
      IS_EXPLICIT_COMMAND: ${{ github.event.inputs.explicit }}
    steps:
      - name: Checkout workflow repo files
        uses: actions/checkout@v4

      - name: Resolve PR metadata
        id: parse
        run: node .github/scripts/codex/event-parse.mjs

      - name: Generate app token for Copilot assignment
        id: assign-token
        # Mint a user-acting GitHub App installation token so the bounce can
        # actually assign the Copilot coding agent. The default Actions
        # GITHUB_TOKEN cannot (GitHub ignores bot-identity assignment for the
        # Copilot trigger). Only runs on the bounce path and only when the App
        # is configured; otherwise the bounce falls back to a manual-assign note.
        if: steps.parse.outputs.bounced == 'true' && env.APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Bounce oversized repair to a human
        if: steps.parse.outputs.bounced == 'true'
        env:
          BOUNCE_REASON: ${{ steps.parse.outputs.bounce_reason }}
          CODEX_ASSIGN_TOKEN: ${{ steps.assign-token.outputs.token || secrets.CODEX_ASSIGN_TOKEN }}
        run: |
          echo "Bouncing repair: ${{ steps.parse.outputs.bounce_reason }}"
          node .github/scripts/codex/bounce.mjs

      - name: Enforce repair eligibility
        if: steps.parse.outputs.should_run != 'true' && steps.parse.outputs.bounced != 'true'
        run: |
          echo "Repair not eligible: ${{ steps.parse.outputs.skip_reason }}"
          echo "Refusing to run before checkout/install/provider (keeps secrets and the PR branch out of ineligible runs)."
          exit 1

      - name: Checkout PR branch
        if: steps.parse.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.pr_branch }}
          fetch-depth: 0

      - name: Setup Node
        if: steps.parse.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repo dependencies
        if: steps.parse.outputs.should_run == 'true'
        run: npm ci

      - name: Install Codex CLI
        if: steps.parse.outputs.should_run == 'true' && (env.CODEX_PROVIDER == 'codex' || env.CODEX_PROVIDER == 'azure')
        run: npm install -g @openai/codex@latest

      - name: Install Gemini CLI
        if: steps.parse.outputs.should_run == 'true' && env.CODEX_PROVIDER == 'gemini'
        run: npm install -g @google/gemini-cli@latest

      - name: Gather PR context
        if: steps.parse.outputs.should_run == 'true'
        run: node .github/scripts/codex/gather-context.mjs

      - name: Run Codex provider
        id: codex
        if: steps.parse.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          CODEX_PROMPT_PATH: ${{ github.workspace }}/.github/scripts/codex/runtime/prompt.md
          CODEX_RESULT_PATH: ${{ github.workspace }}/.github/scripts/codex/runtime/codex-result.json
        run: bash .github/scripts/codex/run-provider.sh

      - name: Validate changes
        id: validate
        if: steps.parse.outputs.should_run == 'true'
        continue-on-error: true
        env:
          CODEX_RESULT_PATH: ${{ github.workspace }}/.github/scripts/codex/runtime/codex-result.json
          CODEX_VALIDATION_REPORT_PATH: ${{ github.workspace }}/.github/scripts/codex/runtime/validation-report.json
          CODEX_VALIDATION_COMMANDS: ${{ vars.CODEX_VALIDATION_COMMANDS }}
        run: bash .github/scripts/codex/validate.sh

      - name: Commit and push changes
        id: push
        if: steps.validate.outcome == 'success'
        env:
          PR_BRANCH: ${{ steps.parse.outputs.pr_branch }}
        run: bash .github/scripts/codex/commit-and-push.sh

      - name: Report status and thread updates
        if: always() && steps.parse.outputs.bounced != 'true'
        env:
          VALIDATION_SUCCEEDED: ${{ steps.validate.outcome == 'success' }}
          CODEX_SUCCEEDED: ${{ steps.codex.outcome == 'success' }}
          CHANGED_FILES: ${{ steps.push.outputs.files }}
        run: node .github/scripts/codex/report.mjs

      - name: Fail job when repair did not pass validation
        if: steps.parse.outputs.bounced != 'true' && (steps.codex.outcome != 'success' || steps.validate.outcome != 'success')
        run: |
          echo "Codex repair did not complete successfully"
          exit 1
