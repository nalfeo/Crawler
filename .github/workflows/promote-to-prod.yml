name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to promote (defaults to latest beta = current main HEAD)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Admin check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          if [ "$PERM" != "admin" ]; then
            echo "::error::Only admins may promote to production (you have: $PERM)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine promotion target
        id: target
        run: |
          TARGET="${{ inputs.commit_sha }}"
          if [ -z "$TARGET" ]; then
            TARGET=$(git rev-parse HEAD)
            echo "No SHA provided, using current main HEAD: $TARGET"
          fi
          # Verify the commit exists
          if ! git cat-file -e "$TARGET" 2>/dev/null; then
            echo "::error::Commit $TARGET does not exist"
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Move production tag
        run: |
          git tag -f production ${{ steps.target.outputs.sha }}
          git push -f origin production

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Build Dev from main HEAD ---
      - name: Build dev
        run: npm run build
        env:
          DEPLOY_ENV: dev
          BUILD_OUTDIR: staging/dev

      - name: Guard - dev must NOT include devtools.html
        run: |
          if [ -f staging/dev/devtools.html ]; then
            echo "::error::Dev build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Beta from main HEAD ---
      - name: Build beta
        run: npm run build
        env:
          DEPLOY_ENV: beta
          BUILD_OUTDIR: staging/beta

      - name: Guard - beta must NOT include devtools.html
        run: |
          if [ -f staging/beta/devtools.html ]; then
            echo "::error::Beta build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Build Prod from promoted SHA ---
      - name: Checkout promoted commit
        run: git checkout ${{ steps.target.outputs.sha }} -- .

      - name: Reinstall dependencies for promoted commit
        run: npm ci

      - name: Build prod
        run: npm run build
        env:
          DEPLOY_ENV: prod
          BUILD_OUTDIR: staging/prod

      - name: Guard - prod must NOT include lab.html or devtools.html
        run: |
          if [ -f staging/prod/lab.html ]; then
            echo "::error::Prod build contains lab.html - lab leakage!"
            exit 1
          fi
          if [ -f staging/prod/devtools.html ]; then
            echo "::error::Prod build contains devtools.html - local-only leakage!"
            exit 1
          fi

      # --- Assemble final site ---
      - name: Assemble site
        run: |
          mkdir -p site/dev site/beta
          cp -r staging/dev/* site/dev/
          cp -r staging/beta/* site/beta/
          cp -r staging/prod/* site/

      - name: Write version.json files
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HEAD_SHA=$(git rev-parse main)
          PROD_SHA=${{ steps.target.outputs.sha }}

          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"dev\",\"builtAt\":\"$NOW\"}" > site/dev/version.json
          echo "{\"commit\":\"$HEAD_SHA\",\"env\":\"beta\",\"builtAt\":\"$NOW\"}" > site/beta/version.json
          echo "{\"commit\":\"$PROD_SHA\",\"env\":\"prod\",\"builtAt\":\"$NOW\",\"promotedAt\":\"$NOW\"}" > site/version.json

      - name: Deploy to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PAGES_BASE="https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/$(basename "$GITHUB_REPOSITORY")"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --depth=1 --branch=gh-pages "$REPO_URL" /tmp/gh-pages 2>/dev/null; then
            echo "Cloned existing gh-pages branch"
          else
            echo "Creating new gh-pages branch"
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
          fi

          cd /tmp/gh-pages

          # Remove everything except .git and pr-* subdirectories (preserves active PR previews)
          for item in * .[^.]*; do
            case "$item" in
              pr-*|.git|.nojekyll) continue ;;
              *) [ -e "$item" ] && rm -rf "$item" ;;
            esac
          done

          # Copy new site content
          cp -r "$GITHUB_WORKSPACE/site/." .
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore: promote to production [${GITHUB_SHA:0:7}]"

            MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              if git push origin HEAD:gh-pages; then
                echo "Deployed to ${PAGES_BASE}/"
                break
              fi
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "Push failed (attempt $attempt), rebasing..."
                git fetch origin gh-pages
                git rebase origin/gh-pages
              else
                echo "::error::Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
            done
          fi

      - name: Ensure GitHub Pages source is set to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"source":{"branch":"gh-pages","path":"/"}}' | \
            gh api repos/${{ github.repository }}/pages \
              --method PUT \
              --input - \
            2>/dev/null && echo "Pages source: branch=gh-pages path=/" || \
            echo "::notice::Pages source could not be updated automatically (may already be correct)"

      - name: Summary
        run: |
          echo "## 🚀 Production Promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Promoted commit:** \`${{ steps.target.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dev/Beta:** built from \`main\` HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URLs:**" >> "$GITHUB_STEP_SUMMARY"
          echo "  - Prod: https://nalfeo.github.io/Crawler/" >> "$GITHUB_STEP_SUMMARY"
          echo "  - Beta: https://nalfeo.github.io/Crawler/beta/" >> "$GITHUB_STEP_SUMMARY"
          echo "  - Dev: https://nalfeo.github.io/Crawler/dev/" >> "$GITHUB_STEP_SUMMARY"

      - name: Create failure issue for copilot
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release failure: promote workflow run #${context.runNumber}`;
            const body = [
              'A release workflow failed and needs investigation.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Triggered by: @${context.actor}`,
              '',
              '@copilot please investigate and resolve this release failure.'
            ].join('\n');

            // Ensure the "release" label exists before using it
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'release',
                color: '5319E7',
                description: 'Release-related'
              });
            } catch (e) {
              if (e.status !== 422) {
                core.warning(`Could not create 'release' label: ${e.message}`);
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'release']
            });

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.data.number,
                assignees: ['copilot']
              });
            } catch (error) {
              core.warning(`Could not assign @copilot automatically: ${error.message}`);
            }

            core.info(`Created issue #${issue.data.number}`);
